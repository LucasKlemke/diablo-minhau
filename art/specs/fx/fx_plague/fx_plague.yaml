      - ellipsoid: {c: [-1.166, "0.103 + 0.05*sin(fp + 6.5)", 1.686], r: "v(0.429*(1 + 0.14*sin(fp + 5.7)), 0.275*(1 + 0.14*sin(fp + 5.7)), 0.378*(1 + 0.14*sin(fp + 5.7)))"}
      - ellipsoid: {c: [-0.296, "0.086 + 0.05*sin(fp + 8.2)", 1.800], r: "v(0.358*(1 + 0.14*sin(fp + 7.4)), 0.229*(1 + 0.14*sin(fp + 7.4)), 0.315*(1 + 0.14*sin(fp + 7.4)))"}
      - ellipsoid: {c: [-1.879, "0.144 + 0.05*sin(fp + 2.0)", 0.684], r: "v(0.600*(1 + 0.14*sin(fp + 1.2)), 0.384*(1 + 0.14*sin(fp + 1.2)), 0.528*(1 + 0.14*sin(fp + 1.2)))"}
      - ellipsoid: {c: [-2.127, "0.095 + 0.05*sin(fp + 3.7)", 0.295], r: "v(0.396*(1 + 0.14*sin(fp + 2.9)), 0.253*(1 + 0.14*sin(fp + 2.9)), 0.348*(1 + 0.14*sin(fp + 2.9)))"}
      - ellipsoid: {c: [-1.630, "0.079 + 0.05*sin(fp + 5.4)", 1.019], r: "v(0.330*(1 + 0.14*sin(fp + 4.6)), 0.211*(1 + 0.14*sin(fp + 4.6)), 0.290*(1 + 0.14*sin(fp + 4.6)))"}
      - ellipsoid: {c: [-1.628, "0.132 + 0.05*sin(fp + 4.1)", -1.017], r: "v(0.550*(1 + 0.14*sin(fp + 3.3)), 0.352*(1 + 0.14*sin(fp + 3.3)), 0.484*(1 + 0.14*sin(fp + 3.3)))"}
      - ellipsoid: {c: [-1.475, "0.087 + 0.05*sin(fp + 5.8)", -1.452], r: "v(0.363*(1 + 0.14*sin(fp + 5.0)), 0.232*(1 + 0.14*sin(fp + 5.0)), 0.319*(1 + 0.14*sin(fp + 5.0)))"}
      - ellipsoid: {c: [-1.738, "0.073 + 0.05*sin(fp + 7.5)", -0.615], r: "v(0.303*(1 + 0.14*sin(fp + 6.7)), 0.194*(1 + 0.14*sin(fp + 6.7)), 0.266*(1 + 0.14*sin(fp + 6.7)))"}
      - ellipsoid: {c: [-0.273, "0.144 + 0.05*sin(fp + 5.9)", -1.941], r: "v(0.600*(1 + 0.14*sin(fp + 5.1)), 0.384*(1 + 0.14*sin(fp + 5.1)), 0.528*(1 + 0.14*sin(fp + 5.1)))"}
      - ellipsoid: {c: [0.159, "0.095 + 0.05*sin(fp + 7.6)", -2.103], r: "v(0.396*(1 + 0.14*sin(fp + 6.8)), 0.253*(1 + 0.14*sin(fp + 6.8)), 0.348*(1 + 0.14*sin(fp + 6.8)))"}
      - ellipsoid: {c: [-0.652, "0.079 + 0.05*sin(fp + 9.3)", -1.766], r: "v(0.330*(1 + 0.14*sin(fp + 8.5)), 0.211*(1 + 0.14*sin(fp + 8.5)), 0.290*(1 + 0.14*sin(fp + 8.5)))"}
      - ellipsoid: {c: [1.285, "0.138 + 0.05*sin(fp + 1.5)", -1.427], r: "v(0.575*(1 + 0.14*sin(fp + 0.7)), 0.368*(1 + 0.14*sin(fp + 0.7)), 0.506*(1 + 0.14*sin(fp + 0.7)))"}
      - ellipsoid: {c: [1.686, "0.091 + 0.05*sin(fp + 3.2)", -1.200], r: "v(0.380*(1 + 0.14*sin(fp + 2.4)), 0.243*(1 + 0.14*sin(fp + 2.4)), 0.334*(1 + 0.14*sin(fp + 2.4)))"}
      - ellipsoid: {c: [0.907, "0.076 + 0.05*sin(fp + 4.9)", -1.605], r: "v(0.316*(1 + 0.14*sin(fp + 4.1)), 0.202*(1 + 0.14*sin(fp + 4.1)), 0.278*(1 + 0.14*sin(fp + 4.1)))"}
      - ellipsoid: {c: [0.550, "0.108 + 0.05*sin(fp + 3.5)", -0.450], r: "v(0.450*(1 + 0.14*sin(fp + 2.7)), 0.288*(1 + 0.14*sin(fp + 2.7)), 0.396*(1 + 0.14*sin(fp + 2.7)))"}
      - ellipsoid: {c: [-0.700, "0.096 + 0.05*sin(fp + 5.4)", 0.550], r: "v(0.400*(1 + 0.14*sin(fp + 4.6)), 0.256*(1 + 0.14*sin(fp + 4.6)), 0.352*(1 + 0.14*sin(fp + 4.6)))"}
