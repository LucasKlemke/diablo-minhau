    when: "cs > 0.05"
    material: fog
    space: l1
    blend: 0.05
    prims:
      - ellipsoid: {c: [1.850, "0.240 + 0.05*sin(fp + 0.8)", 0.329], r: "v(0.500*(1 + 0.14*sin(fp + 0.0)), 0.320*(1 + 0.14*sin(fp + 0.0)), 0.440*(1 + 0.14*sin(fp + 0.0)))"}
