      - ellipsoid: {c: [-2.043, "0.374 + 0.05*sin(fp + 2.0)", 0.684], r: "v(0.240*(1 + 0.14*sin(fp + 1.2)), 0.154*(1 + 0.14*sin(fp + 1.2)), 0.211*(1 + 0.14*sin(fp + 1.2)))"}
      - ellipsoid: {c: [-2.235, "0.247 + 0.05*sin(fp + 3.7)", 0.295], r: "v(0.158*(1 + 0.14*sin(fp + 2.9)), 0.101*(1 + 0.14*sin(fp + 2.9)), 0.139*(1 + 0.14*sin(fp + 2.9)))"}
      - ellipsoid: {c: [-1.720, "0.206 + 0.05*sin(fp + 5.4)", 1.019], r: "v(0.132*(1 + 0.14*sin(fp + 4.6)), 0.084*(1 + 0.14*sin(fp + 4.6)), 0.116*(1 + 0.14*sin(fp + 4.6)))"}
      - ellipsoid: {c: [-1.778, "0.343 + 0.05*sin(fp + 4.1)", -1.017], r: "v(0.220*(1 + 0.14*sin(fp + 3.3)), 0.141*(1 + 0.14*sin(fp + 3.3)), 0.194*(1 + 0.14*sin(fp + 3.3)))"}
      - ellipsoid: {c: [-1.573, "0.227 + 0.05*sin(fp + 5.8)", -1.452], r: "v(0.145*(1 + 0.14*sin(fp + 5.0)), 0.093*(1 + 0.14*sin(fp + 5.0)), 0.128*(1 + 0.14*sin(fp + 5.0)))"}
      - ellipsoid: {c: [-1.821, "0.189 + 0.05*sin(fp + 7.5)", -0.615], r: "v(0.121*(1 + 0.14*sin(fp + 6.7)), 0.077*(1 + 0.14*sin(fp + 6.7)), 0.106*(1 + 0.14*sin(fp + 6.7)))"}
      - ellipsoid: {c: [-0.436, "0.374 + 0.05*sin(fp + 5.9)", -1.941], r: "v(0.240*(1 + 0.14*sin(fp + 5.1)), 0.154*(1 + 0.14*sin(fp + 5.1)), 0.211*(1 + 0.14*sin(fp + 5.1)))"}
      - ellipsoid: {c: [0.051, "0.247 + 0.05*sin(fp + 7.6)", -2.103], r: "v(0.158*(1 + 0.14*sin(fp + 6.8)), 0.101*(1 + 0.14*sin(fp + 6.8)), 0.139*(1 + 0.14*sin(fp + 6.8)))"}
      - ellipsoid: {c: [-0.742, "0.206 + 0.05*sin(fp + 9.3)", -1.766], r: "v(0.132*(1 + 0.14*sin(fp + 8.5)), 0.084*(1 + 0.14*sin(fp + 8.5)), 0.116*(1 + 0.14*sin(fp + 8.5)))"}
      - ellipsoid: {c: [1.128, "0.359 + 0.05*sin(fp + 1.5)", -1.427], r: "v(0.230*(1 + 0.14*sin(fp + 0.7)), 0.147*(1 + 0.14*sin(fp + 0.7)), 0.202*(1 + 0.14*sin(fp + 0.7)))"}
      - ellipsoid: {c: [1.583, "0.237 + 0.05*sin(fp + 3.2)", -1.200], r: "v(0.152*(1 + 0.14*sin(fp + 2.4)), 0.097*(1 + 0.14*sin(fp + 2.4)), 0.134*(1 + 0.14*sin(fp + 2.4)))"}
      - ellipsoid: {c: [0.821, "0.197 + 0.05*sin(fp + 4.9)", -1.605], r: "v(0.127*(1 + 0.14*sin(fp + 4.1)), 0.081*(1 + 0.14*sin(fp + 4.1)), 0.111*(1 + 0.14*sin(fp + 4.1)))"}
      - ellipsoid: {c: [0.428, "0.281 + 0.05*sin(fp + 3.5)", -0.450], r: "v(0.180*(1 + 0.14*sin(fp + 2.7)), 0.115*(1 + 0.14*sin(fp + 2.7)), 0.158*(1 + 0.14*sin(fp + 2.7)))"}
      - ellipsoid: {c: [-0.809, "0.250 + 0.05*sin(fp + 5.4)", 0.550], r: "v(0.160*(1 + 0.14*sin(fp + 4.6)), 0.102*(1 + 0.14*sin(fp + 4.6)), 0.141*(1 + 0.14*sin(fp + 4.6)))"}
  fog_wisp:        # low fog trails linking the clumps along the ground (gaps stay between them)
    when: "cs > 0.05"
    material: fog_rim
    space: cloud
    blend: 0.04
    prims:
      - chain: {pts: [["1.842 + 0.08*sin(fp + 0.0)", "0.10 + 0.03*sin(fp + 0.0)", 0.782], ["1.578 + 0.08*sin(fp + 1.0)", "0.14 + 0.03*sin(fp + 0.0)", 1.146], ["1.313 + 0.08*sin(fp + 2.0)", "0.18 + 0.03*sin(fp + 0.0)", 1.510]], r: [0.07, 0.13, 0.06]}
      - chain: {pts: [["-1.090 + 0.08*sin(fp + 2.0)", "0.10 + 0.03*sin(fp + 1.8)", 1.678], ["-1.403 + 0.08*sin(fp + 3.0)", "0.14 + 0.03*sin(fp + 1.8)", 1.355], ["-1.715 + 0.08*sin(fp + 4.0)", "0.18 + 0.03*sin(fp + 1.8)", 1.031]], r: [0.07, 0.13, 0.06]}
      - chain: {pts: [["-1.439 + 0.08*sin(fp + 4.0)", "0.10 + 0.03*sin(fp + 3.6)", -1.390], ["-1.062 + 0.08*sin(fp + 5.0)", "0.14 + 0.03*sin(fp + 3.6)", -1.635], ["-0.685 + 0.08*sin(fp + 6.0)", "0.18 + 0.03*sin(fp + 3.6)", -1.880]], r: [0.07, 0.13, 0.06]}
      - chain: {pts: [["1.639 + 0.08*sin(fp + 6.0)", "0.10 + 0.03*sin(fp + 5.4)", -1.148], ["1.808 + 0.08*sin(fp + 7.0)", "0.14 + 0.03*sin(fp + 5.4)", -0.730], ["1.977 + 0.08*sin(fp + 8.0)", "0.18 + 0.03*sin(fp + 5.4)", -0.313]], r: [0.07, 0.13, 0.06]}
    cut:
      - box: {c: [0, -1.0, 0], half: [4, 1.0, 4]}
  fog_wisp_hi:
    when: "cs > 0.05"
    material: fog
    space: l1
    prims:
      - chain: {pts: [["1.842 + 0.08*sin(fp + 0.0)", "0.10 + 0.03*sin(fp + 0.0)", 0.782], ["1.578 + 0.08*sin(fp + 1.0)", "0.14 + 0.03*sin(fp + 0.0)", 1.146], ["1.313 + 0.08*sin(fp + 2.0)", "0.18 + 0.03*sin(fp + 0.0)", 1.510]], r: [0.03, 0.07, 0.03]}
      - chain: {pts: [["-1.090 + 0.08*sin(fp + 2.0)", "0.10 + 0.03*sin(fp + 1.8)", 1.678], ["-1.403 + 0.08*sin(fp + 3.0)", "0.14 + 0.03*sin(fp + 1.8)", 1.355], ["-1.715 + 0.08*sin(fp + 4.0)", "0.18 + 0.03*sin(fp + 1.8)", 1.031]], r: [0.03, 0.07, 0.03]}
      - chain: {pts: [["-1.439 + 0.08*sin(fp + 4.0)", "0.10 + 0.03*sin(fp + 3.6)", -1.390], ["-1.062 + 0.08*sin(fp + 5.0)", "0.14 + 0.03*sin(fp + 3.6)", -1.635], ["-0.685 + 0.08*sin(fp + 6.0)", "0.18 + 0.03*sin(fp + 3.6)", -1.880]], r: [0.03, 0.07, 0.03]}
      - chain: {pts: [["1.639 + 0.08*sin(fp + 6.0)", "0.10 + 0.03*sin(fp + 5.4)", -1.148], ["1.808 + 0.08*sin(fp + 7.0)", "0.14 + 0.03*sin(fp + 5.4)", -0.730], ["1.977 + 0.08*sin(fp + 8.0)", "0.18 + 0.03*sin(fp + 5.4)", -0.313]], r: [0.03, 0.07, 0.03]}
  # puffs breaking off the clumps and rising (life phase u*)
  rise_rim:
    when: "cs > 0.05"
    material: fog_rim
    space: cloud
    prims:
      - sphere: {c: ["1.80 - 0.4*u0", "0.45 + 0.85*u0", 0.30], r: "0.01 + 0.24*sin(pi*u0)"}
      - sphere: {c: ["-0.65 + 0.3*u1", "0.45 + 0.85*u1", 1.60], r: "0.01 + 0.22*sin(pi*u1)"}
      - sphere: {c: ["-1.55 + 0.4*u2", "0.45 + 0.85*u2", -0.95], r: "0.01 + 0.22*sin(pi*u2)"}
      - sphere: {c: ["1.20 - 0.3*u3", "0.45 + 0.85*u3", -1.35], r: "0.01 + 0.22*sin(pi*u3)"}
  rise:
    when: "cs > 0.05"
    material: fog
    space: l1
    prims:
      - sphere: {c: ["1.78 - 0.4*u0", "0.47 + 0.85*u0", 0.31], r: "0.005 + 0.17*sin(pi*u0)"}
      - sphere: {c: ["-0.67 + 0.3*u1", "0.47 + 0.85*u1", 1.61], r: "0.005 + 0.155*sin(pi*u1)"}
      - sphere: {c: ["-1.57 + 0.4*u2", "0.47 + 0.85*u2", -0.94], r: "0.005 + 0.155*sin(pi*u2)"}
      - sphere: {c: ["1.18 - 0.3*u3", "0.47 + 0.85*u3", -1.34], r: "0.005 + 0.155*sin(pi*u3)"}

  # ================= skull wisps (life phase s*) =================
  skull0:
    when: "cs > 0.5 and sin(pi*s0) > 0.3"
    material: skull
    space: l3
    blend: 0.03
    prims:
      - sphere: {c: ["-0.45 + 0.08*sin(2*pi*s0)", "0.55 + 0.6*s0", -0.30], r: "0.21*sin(pi*s0)"}
      - ellipsoid: {c: ["-0.45 + 0.08*sin(2*pi*s0)", "0.55 + 0.6*s0 - 0.16*sin(pi*s0)", -0.27], r: "v(0.13*sin(pi*s0), 0.09*sin(pi*s0), 0.12*sin(pi*s0))"}
      - chain: {pts: ["v(-0.45 + 0.08*sin(2*pi*s0), 0.55 + 0.6*s0 - 0.12, -0.32)", "v(-0.45 - 0.06*cos(2*pi*s0), 0.55 + 0.6*s0 - 0.30, -0.34)", "v(-0.45 + 0.08*sin(2*pi*s0 + 2), 0.55 + 0.6*s0 - 0.48, -0.36)"], r: ["0.07*sin(pi*s0)", "0.04*sin(pi*s0)", 0.01]}
  skull0_eyes:
    when: "cs > 0.5 and sin(pi*s0) > 0.3"
    material: skull_eye
    space: l4
    prims:
      - sphere: {c: ["-0.45 + 0.08*sin(2*pi*s0) - 0.095*sin(pi*s0)", "0.55 + 0.6*s0 - 0.01", -0.30], r: "0.055*sin(pi*s0)"}
      - sphere: {c: ["-0.45 + 0.08*sin(2*pi*s0) + 0.095*sin(pi*s0)", "0.55 + 0.6*s0 - 0.01", -0.30], r: "0.055*sin(pi*s0)"}
  skull1:
    when: "cs > 0.5 and sin(pi*s1) > 0.3"
    material: skull
    space: l3
    blend: 0.03
    prims:
      - sphere: {c: ["1.00 + 0.08*sin(2*pi*s1)", "0.55 + 0.6*s1", 0.55], r: "0.21*sin(pi*s1)"}
      - ellipsoid: {c: ["1.00 + 0.08*sin(2*pi*s1)", "0.55 + 0.6*s1 - 0.16*sin(pi*s1)", 0.58], r: "v(0.13*sin(pi*s1), 0.09*sin(pi*s1), 0.12*sin(pi*s1))"}
      - chain: {pts: ["v(1.00 + 0.08*sin(2*pi*s1), 0.55 + 0.6*s1 - 0.12, 0.53)", "v(1.00 - 0.06*cos(2*pi*s1), 0.55 + 0.6*s1 - 0.30, 0.51)", "v(1.00 + 0.08*sin(2*pi*s1 + 2), 0.55 + 0.6*s1 - 0.48, 0.49)"], r: ["0.07*sin(pi*s1)", "0.04*sin(pi*s1)", 0.01]}
  skull1_eyes:
    when: "cs > 0.5 and sin(pi*s1) > 0.3"
    material: skull_eye
    space: l4
    prims:
      - sphere: {c: ["1.00 + 0.08*sin(2*pi*s1) - 0.095*sin(pi*s1)", "0.55 + 0.6*s1 - 0.01", 0.55], r: "0.055*sin(pi*s1)"}
      - sphere: {c: ["1.00 + 0.08*sin(2*pi*s1) + 0.095*sin(pi*s1)", "0.55 + 0.6*s1 - 0.01", 0.55], r: "0.055*sin(pi*s1)"}
  skull2:
    when: "cs > 0.5 and sin(pi*s2) > 0.3"
    material: skull
    space: l3
    blend: 0.03
    prims:
      - sphere: {c: ["-1.15 + 0.08*sin(2*pi*s2)", "0.55 + 0.6*s2", 0.85], r: "0.21*sin(pi*s2)"}
      - ellipsoid: {c: ["-1.15 + 0.08*sin(2*pi*s2)", "0.55 + 0.6*s2 - 0.16*sin(pi*s2)", 0.88], r: "v(0.13*sin(pi*s2), 0.09*sin(pi*s2), 0.12*sin(pi*s2))"}
      - chain: {pts: ["v(-1.15 + 0.08*sin(2*pi*s2), 0.55 + 0.6*s2 - 0.12, 0.83)", "v(-1.15 - 0.06*cos(2*pi*s2), 0.55 + 0.6*s2 - 0.30, 0.81)", "v(-1.15 + 0.08*sin(2*pi*s2 + 2), 0.55 + 0.6*s2 - 0.48, 0.79)"], r: ["0.07*sin(pi*s2)", "0.04*sin(pi*s2)", 0.01]}
  skull2_eyes:
    when: "cs > 0.5 and sin(pi*s2) > 0.3"
    material: skull_eye
    space: l4
    prims:
      - sphere: {c: ["-1.15 + 0.08*sin(2*pi*s2) - 0.095*sin(pi*s2)", "0.55 + 0.6*s2 - 0.01", 0.85], r: "0.055*sin(pi*s2)"}
      - sphere: {c: ["-1.15 + 0.08*sin(2*pi*s2) + 0.095*sin(pi*s2)", "0.55 + 0.6*s2 - 0.01", 0.85], r: "0.055*sin(pi*s2)"}

  # ================= spores rising and flies circling =================
  spores:
    when: "cs > 0.5"
    material: spore
    space: l3
    prims:
      - sphere: {c: ["0.60 + 0.10*sin(2*pi*u0)", "0.35 + 1.0*u0", 0.20], r: "0.045*sin(pi*u0) + 0.005"}
      - sphere: {c: ["-0.95 + 0.10*sin(2*pi*u1)", "0.35 + 1.0*u1", -0.20], r: "0.045*sin(pi*u1) + 0.005"}
      - sphere: {c: ["0.20 + 0.10*sin(2*pi*u2)", "0.35 + 1.0*u2", -1.30], r: "0.045*sin(pi*u2) + 0.005"}
      - sphere: {c: ["-0.20 + 0.10*sin(2*pi*u3)", "0.35 + 1.0*u3", 1.20], r: "0.045*sin(pi*u3) + 0.005"}
      - sphere: {c: ["1.50 + 0.10*sin(2*pi*u2)", "0.45 + 0.9*u2", -0.40], r: "0.04*sin(pi*u2) + 0.005"}
      - sphere: {c: ["-1.45 + 0.10*sin(2*pi*u0)", "0.45 + 0.9*u0", 0.20], r: "0.04*sin(pi*u0) + 0.005"}
  flies:
    when: "cs > 0.5"
    material: fly
    space: l4
    prims:
      - sphere: {c: ["0.30 + 0.40*cos(fp)", "0.95 + 0.10*sin(2*fp)", "-0.40 + 0.40*sin(fp)"], r: 0.05}
      - sphere: {c: ["0.30 + 0.40*cos(fp + 3.1)", "1.05 + 0.10*sin(2*fp + 1)", "-0.40 + 0.40*sin(fp + 3.1)"], r: 0.05}
      - sphere: {c: ["-1.20 + 0.35*cos(-fp + 1)", "0.85 + 0.10*sin(2*fp + 2)", "0.20 + 0.35*sin(-fp + 1)"], r: 0.05}
      - sphere: {c: ["1.40 + 0.35*cos(2*fp + 2)", "0.80 + 0.08*sin(2*fp + 3)", "0.90 + 0.30*sin(2*fp + 2)"], r: 0.05}
      - sphere: {c: ["-0.40 + 0.45*cos(-fp + 4)", "1.15 + 0.10*sin(2*fp + 4)", "1.20 + 0.30*sin(-fp + 4)"], r: 0.05}

  # ================= spawn: vial, glass shards, splash crown, billow =================
  vial:
    when: "vial > 0.5"
    material: glass
    space: body
    blend: 0.04
    prims:
      - sphere: {c: "v(0, vy + 0.22, 0)", r: 0.23}
      - cylinder: {a: "v(0, vy + 0.38, 0)", b: "v(0, vy + 0.62, 0)", r: 0.085}
  vial_liquid:
    when: "vial > 0.5"
    material: splash
    space: sp1
    prims:
      - ellipsoid: {c: "v(0.02, vy + 0.16, 0)", r: [0.17, 0.11, 0.17]}
  glass_shards:
    when: "gs > 0.05"
    material: glass
    space: body
    prims:
      - box: {c: "v(0.95*gs, 0.10 + 0.9*gs - 0.6*gs*gs, 0.30*gs)", half: [0.07, 0.05, 0.04], rot: "[gs*3, gs*2, 0.4]"}
      - box: {c: "v(-0.80*gs, 0.10 + 1.0*gs - 0.6*gs*gs, 0.55*gs)", half: [0.06, 0.05, 0.04], rot: "[0.3, gs*3, gs*2]"}
      - box: {c: "v(-0.55*gs, 0.10 + 0.8*gs - 0.6*gs*gs, -0.85*gs)", half: [0.07, 0.04, 0.04], rot: "[gs*2, 0.5, gs*3]"}
      - box: {c: "v(0.50*gs, 0.10 + 1.1*gs - 0.6*gs*gs, -0.80*gs)", half: [0.06, 0.05, 0.04], rot: "[gs, gs*3, 0.2]"}
      - box: {c: "v(0.10*gs, 0.10 + 0.9*gs - 0.6*gs*gs, 1.00*gs)", half: [0.06, 0.04, 0.05], rot: "[gs*3, 0.2, gs]"}
  crown:
    when: "cr > 0.05"
    material: splash
    space: body
    prims:
      - torus: {c: [0, 0.02, 0], R: "0.8*cr", r: "0.10*cr"}
      - cone: {a: "v(0.80*cr, 0, 0)", b: "v(1.05*cr, ch, 0)", r: ["0.10*cr", 0.02]}
      - cone: {a: "v(0.57*cr, 0, 0.57*cr)", b: "v(0.74*cr, ch*1.1, 0.74*cr)", r: ["0.10*cr", 0.02]}
      - cone: {a: "v(0, 0, 0.80*cr)", b: "v(0, ch*0.9, 1.05*cr)", r: ["0.10*cr", 0.02]}
      - cone: {a: "v(-0.57*cr, 0, 0.57*cr)", b: "v(-0.74*cr, ch*1.2, 0.74*cr)", r: ["0.10*cr", 0.02]}
      - cone: {a: "v(-0.80*cr, 0, 0)", b: "v(-1.05*cr, ch, 0)", r: ["0.10*cr", 0.02]}
      - cone: {a: "v(-0.57*cr, 0, -0.57*cr)", b: "v(-0.74*cr, ch*0.9, -0.74*cr)", r: ["0.10*cr", 0.02]}
      - cone: {a: "v(0, 0, -0.80*cr)", b: "v(0, ch*1.1, -1.05*cr)", r: ["0.10*cr", 0.02]}
      - cone: {a: "v(0.57*cr, 0, -0.57*cr)", b: "v(0.74*cr, ch, -0.74*cr)", r: ["0.10*cr", 0.02]}
      - sphere: {c: "v(1.30*cr, ch*1.3, 0.20*cr)", r: "0.06*cr"}
      - sphere: {c: "v(-0.30*cr, ch*1.4, 1.25*cr)", r: "0.06*cr"}
      - sphere: {c: "v(-1.25*cr, ch*1.2, -0.40*cr)", r: "0.06*cr"}
      - sphere: {c: "v(0.50*cr, ch*1.5, -1.20*cr)", r: "0.06*cr"}
    cut:
      - box: {c: [0, -1.0, 0], half: [4, 1.0, 4]}
  crown_hi:
    when: "cr > 0.05"
    material: splash_hi
    space: sp1
    prims:
      - torus: {c: [0, 0.02, 0], R: "0.8*cr", r: "0.05*cr"}
  billow_rim:
    when: "bl > 0.05"
    material: fog_rim
    space: body
    blend: 0.10
    prims:
      - ellipsoid: {c: "v(0, 0.30*bl + 0.5*bu, 0)", r: "v(0.80*bl, 0.50*bl, 0.70*bl)"}
      - sphere: {c: "v(0.62*bl, 0.22*bl + 0.3*bu, 0.20*bl)", r: "0.40*bl"}
      - sphere: {c: "v(-0.62*bl, 0.22*bl + 0.4*bu, -0.05*bl)", r: "0.42*bl"}
      - sphere: {c: "v(-0.22*bl, 0.62*bl + 0.8*bu, -0.05)", r: "0.36*bl"}
      - sphere: {c: "v(0.30*bl, 0.58*bl + 0.9*bu, -0.10)", r: "0.32*bl"}
    cut:
      - box: {c: [0, -1.0, 0], half: [4, 1.0, 4]}
  billow:
    when: "bl > 0.05"
    material: fog
    space: sp1
    blend: 0.08
    prims:
      - ellipsoid: {c: "v(-0.10*bl, 0.38*bl + 0.5*bu, 0)", r: "v(0.62*bl, 0.38*bl, 0.55*bl)"}
      - sphere: {c: "v(0.56*bl, 0.30*bl + 0.3*bu, 0.20*bl)", r: "0.28*bl"}
      - sphere: {c: "v(-0.68*bl, 0.30*bl + 0.4*bu, -0.05*bl)", r: "0.30*bl"}
      - sphere: {c: "v(-0.26*bl, 0.70*bl + 0.8*bu, -0.05)", r: "0.26*bl"}
      - sphere: {c: "v(0.26*bl, 0.66*bl + 0.9*bu, -0.10)", r: "0.22*bl"}
    cut:
      - box: {c: [0, -1.0, 0], half: [4, 1.0, 4]}
  billow_hi:
    when: "bl > 0.05"
    material: fog_hi
    space: sp2
    prims:
      - ellipsoid: {c: "v(-0.25*bl, 0.50*bl + 0.5*bu, 0)", r: "v(0.30*bl, 0.16*bl, 0.25*bl)"}
      - sphere: {c: "v(-0.34*bl, 0.80*bl + 0.8*bu, -0.05)", r: "0.12*bl"}
      - sphere: {c: "v(-0.80*bl, 0.40*bl + 0.4*bu, -0.05*bl)", r: "0.12*bl"}

animations:
  spawn:
    loop: false
    keys:
      - {ms: 60, event: start, set: {vial: 1, vy: 0.35, cs: 0}}
      - {ms: 60, event: hit, set: {gs: 0.35, cr: 0.55, ch: 0.55, bl: 0.45, cs: 0.15}}
      - {ms: 70, set: {gs: 0.80, cr: 0.95, ch: 0.50, bl: 0.80, bu: 0.15, cs: 0.40}}
      - {ms: 70, set: {gs: 1.15, cr: 1.25, ch: 0.25, bl: 1.00, bu: 0.40, cs: 0.70}}
      - {ms: 70, set: {bl: 0.60, bu: 0.85, cs: 0.90}}
      - {ms: 70, set: {bl: 0.25, bu: 1.30, cs: 1.0}}
  cloud:
    frames: 8
    ms: 100
    channels:
      fp: p
      u0: "p/tau - floor(p/tau)"
      u1: "p/tau + 0.25 - floor(p/tau + 0.25)"
      u2: "p/tau + 0.5 - floor(p/tau + 0.5)"
      u3: "p/tau + 0.75 - floor(p/tau + 0.75)"
      s0: "p/tau - floor(p/tau)"
      s1: "p/tau + 0.33333 - floor(p/tau + 0.33333)"
      s2: "p/tau + 0.66667 - floor(p/tau + 0.66667)"
