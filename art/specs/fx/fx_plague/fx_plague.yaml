# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: fx_plague
kind: prop
view: topdown
size: 128
directions: [s]
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.34898, 0]}   # 5 px above the pivot -> pivot (64, 69)
shadow: null             # a spell effect: no ground shadow

# The sorcerer's Plague: a vial of plague shatters at the cursor and a toxic cloud lingers 4 s.
brief:
  summary: |
    `spawn` a purple vial hits the ground and shatters, a fel-green splash crown and a billowing puff grow
    into the cloud; `cloud` a low ring of churning sickly yellow-green fog puffs (radius ~48 px, ellipse
    0.62 as tall as wide) over a bubbling fel sludge pool, small skull wisps rising, flies and spores.
  must_keep: [radius ~48 px, gaps between the fog clumps (no transparency in the engine), skull wisps, fel bubbles]
  simplify: [fog puffs are three flat emissive layers (rim / body / highlight), the sludge is a flat ground decal]
  exceptions: |
    kind prop, size 128, directions [s] only, mirror false, shadow null, camera.center [0, 0.34898, 0]
    (integer pivot). Fog, bubbles, spores and skulls are emissive without outline (the darkest fog band is
    the rim); own ramps `plague` (sickly yellow-green) and `sludge`; fel ramp for the bubbles and splash,
    void purple (arcane ramp) for the vial and the skull eyes. camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (64, 69) = the ground point at the centre of the cloud (the cursor).
    Fog layers sit on bones pushed toward the camera along the view ray (l1..l4) so the inner tones always
    draw over the rim without changing the silhouette. Seven fog clumps on a ring of radius ~2 units
    (36 px) plus two small inner clumps; their sizes reach ~48 px. `cloud` loops on p: every motion is
    periodic (puffs breathe, rising puffs / bubbles / skulls use phase channels u*, s* that wrap from 1 to 0
    while their size is 0). `spawn` ends on the pose of cloud frame 0 so the game can chain spawn -> cloud.

ramps:
  plague: ["#2e3010", "#7d8a1c", "#bcc42e", "#e6ea5c", "#fafac0"]
  sludge: ["#1c0f1a", "#2f4211", "#4a6418", "#6e8f1c"]
  fly:    ["#1c0f1a"]

materials:
  fog_rim:  {ramp: plague, emissive: true, band: 0, outline: false, line: false, glow: {color: "#bcc42e", mix: 0.25, radius: 1}}
  fog:      {ramp: plague, emissive: true, band: 2, outline: false, line: false}
  fog_hi:   {ramp: plague, emissive: true, band: 3, outline: false, line: false}
  sludge:   {ramp: sludge, bands: [2, 2], outline: false, line: false}
  sludge_hi: {ramp: sludge, bands: [3, 3], outline: false, line: false}
  bubble:   {ramp: fel, emissive: true, band: 1, outline: false, line: false, glow: {color: "#5dff3d", mix: 0.4, radius: 1}}
  bubble_hi: {ramp: fel, emissive: true, band: 3, outline: false, line: false}
  spore:    {ramp: fel, emissive: true, band: 2, outline: false, line: false}
  skull:    {ramp: plague, emissive: true, band: 4, outline: false, line: false}
  skull_eye: {ramp: arcane, emissive: true, band: 0, outline: false, line: false}
  fly:      {ramp: fly, emissive: true, band: 0, outline: false, line: false}
  splash:   {ramp: fel, emissive: true, band: 1, outline: false, line: false, glow: {color: "#5dff3d", mix: 0.4, radius: 1}}
  splash_hi: {ramp: fel, emissive: true, band: 2, outline: false, line: false}
  glass:    {ramp: arcane, bands: [1, 3]}

channels:
  root: [0, 0, 0]
  cs: 1.0          # cloud size (spawn grows it 0 -> 1)
  fp: 0.0          # churn phase (cloud sets it to p)
  u0: 0.0          # life phases 0..1 of rising puffs and bubbles (cloud: p/tau + k/4, wrapped)
  u1: 0.25
  u2: 0.5
  u3: 0.75
  s0: 0.0          # life phases of the three skull wisps (p/tau + k/3, wrapped)
  s1: 0.33333
  s2: 0.66667
  vial: 0          # 1 = the intact vial dropping in (spawn frame 0)
  vy: 0.4          # vial height
  gs: 0.0          # glass shards: distance flown
  cr: 0.0          # splash crown radius
  ch: 0.0          # splash crown height
  bl: 0.0          # spawn billow size
  bu: 0.0          # spawn billow rise

bones:
  body: {parent: root}
  cloud: {parent: body, scale: "max(cs, 0.01)"}
  # layers along the view ray (camera direction (0, 0.616, 0.788)): same pixels, nearer = drawn on top
  l1: {parent: cloud, pos: [0, 0.216, 0.276]}    # 0.35 front
  l2: {parent: cloud, pos: [0, 0.431, 0.552]}    # 0.7 front
  l3: {parent: cloud, pos: [0, 0.678, 0.867]}    # 1.1 front
  l4: {parent: cloud, pos: [0, 0.924, 1.182]}    # 1.5 front
  sp1: {parent: body, pos: [0, 0.431, 0.552]}     # spawn layers (not scaled by cs)
  sp2: {parent: body, pos: [0, 0.862, 1.103]}

parts:
  # ================= ground: sludge pool and bubbles =================
  sludge:
    when: "cs > 0.05"
    material: sludge
    space: cloud
    prims:
      - ellipsoid: {c: [0.30, 0.004, 0.10], r: [0.62, 0.004, 0.48], rot: [0, 0.4, 0]}
      - ellipsoid: {c: [-0.35, 0.004, -0.25], r: [0.42, 0.004, 0.30], rot: [0, -0.3, 0]}
      - ellipsoid: {c: [-0.95, 0.004, 0.55], r: [0.45, 0.004, 0.30], rot: [0, -0.5, 0]}
      - ellipsoid: {c: [1.00, 0.004, -0.55], r: [0.42, 0.004, 0.28], rot: [0, 0.6, 0]}
      - ellipsoid: {c: [0.20, 0.004, 0.98], r: [0.32, 0.004, 0.22], rot: [0, 1.2, 0]}
      - ellipsoid: {c: [-0.15, 0.004, -0.98], r: [0.30, 0.004, 0.20], rot: [0, -1.0, 0]}
  sludge_hi:
    when: "cs > 0.05"
    material: sludge_hi
    space: cloud
    prims:
      - ellipsoid: {c: [0.15, 0.008, 0.00], r: [0.30, 0.004, 0.15], rot: [0, 0.5, 0]}
      - ellipsoid: {c: [0.95, 0.008, -0.62], r: [0.20, 0.004, 0.10], rot: [0, 0.2, 0]}
      - ellipsoid: {c: [-1.05, 0.008, 0.50], r: [0.25, 0.004, 0.12], rot: [0, -0.3, 0]}
  bubbles:
    when: "cs > 0.05"
    material: bubble
    space: cloud
    prims:
      - sphere: {c: [0.25, 0.0, 0.15], r: "0.01 + 0.15*sin(pi*u0)"}
      - sphere: {c: [-0.55, 0.0, -0.30], r: "0.01 + 0.13*sin(pi*u1)"}
      - sphere: {c: [0.95, 0.0, -0.55], r: "0.01 + 0.12*sin(pi*u2)"}
      - sphere: {c: [-0.95, 0.0, 0.55], r: "0.01 + 0.13*sin(pi*u3)"}
      - sphere: {c: [0.20, 0.0, 0.95], r: "0.01 + 0.11*sin(pi*u2)"}
      - sphere: {c: [-0.15, 0.0, -0.95], r: "0.01 + 0.11*sin(pi*u0)"}
  bubbles_hi:
    when: "cs > 0.05"
    material: bubble_hi
    space: l1
    prims:
      - sphere: {c: [0.20, "0.07*sin(pi*u0)", 0.15], r: "0.005 + 0.05*sin(pi*u0)"}
      - sphere: {c: [-0.59, "0.06*sin(pi*u1)", -0.30], r: "0.005 + 0.045*sin(pi*u1)"}
      - sphere: {c: [0.91, "0.06*sin(pi*u2)", -0.55], r: "0.005 + 0.04*sin(pi*u2)"}
      - sphere: {c: [-0.99, "0.06*sin(pi*u3)", 0.55], r: "0.005 + 0.045*sin(pi*u3)"}

  # ================= fog clumps: rim (back) -> body -> highlight (front) =================
  fog_rim:
    when: "cs > 0.05"
    material: fog_rim
    space: cloud
    blend: 0.06
    prims:
      - ellipsoid: {c: [1.920, "0.150 + 0.05*sin(fp + 0.8)", 0.339], r: "v(0.625*(1 + 0.14*sin(fp + 0.0)), 0.400*(1 + 0.14*sin(fp + 0.0)), 0.550*(1 + 0.14*sin(fp + 0.0)))"}
      - ellipsoid: {c: [1.941, "0.099 + 0.05*sin(fp + 2.5)", 0.799], r: "v(0.413*(1 + 0.14*sin(fp + 1.7)), 0.264*(1 + 0.14*sin(fp + 1.7)), 0.363*(1 + 0.14*sin(fp + 1.7)))"}
      - ellipsoid: {c: [1.872, "0.083 + 0.05*sin(fp + 4.2)", -0.076], r: "v(0.344*(1 + 0.14*sin(fp + 3.4)), 0.220*(1 + 0.14*sin(fp + 3.4)), 0.303*(1 + 0.14*sin(fp + 3.4)))"}
      - ellipsoid: {c: [0.930, "0.138 + 0.05*sin(fp + 2.9)", 1.748], r: "v(0.575*(1 + 0.14*sin(fp + 2.1)), 0.368*(1 + 0.14*sin(fp + 2.1)), 0.506*(1 + 0.14*sin(fp + 2.1)))"}
      - ellipsoid: {c: [0.579, "0.091 + 0.05*sin(fp + 4.6)", 2.048], r: "v(0.380*(1 + 0.14*sin(fp + 3.8)), 0.243*(1 + 0.14*sin(fp + 3.8)), 0.334*(1 + 0.14*sin(fp + 3.8)))"}
      - ellipsoid: {c: [1.226, "0.076 + 0.05*sin(fp + 6.3)", 1.454], r: "v(0.316*(1 + 0.14*sin(fp + 5.5)), 0.202*(1 + 0.14*sin(fp + 5.5)), 0.278*(1 + 0.14*sin(fp + 5.5)))"}
