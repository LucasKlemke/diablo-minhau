      - ellipsoid: {c: [-1.690, "0.211 + 0.05*sin(fp + 4.1)", -1.026], r: "v(0.440*(1 + 0.14*sin(fp + 3.3)), 0.282*(1 + 0.14*sin(fp + 3.3)), 0.387*(1 + 0.14*sin(fp + 3.3)))"}
      - ellipsoid: {c: [-1.515, "0.139 + 0.05*sin(fp + 5.8)", -1.458], r: "v(0.290*(1 + 0.14*sin(fp + 5.0)), 0.186*(1 + 0.14*sin(fp + 5.0)), 0.256*(1 + 0.14*sin(fp + 5.0)))"}
      - ellipsoid: {c: [-1.772, "0.116 + 0.05*sin(fp + 7.5)", -0.619], r: "v(0.242*(1 + 0.14*sin(fp + 6.7)), 0.155*(1 + 0.14*sin(fp + 6.7)), 0.213*(1 + 0.14*sin(fp + 6.7)))"}
      - ellipsoid: {c: [-0.340, "0.230 + 0.05*sin(fp + 5.9)", -1.951], r: "v(0.480*(1 + 0.14*sin(fp + 5.1)), 0.307*(1 + 0.14*sin(fp + 5.1)), 0.422*(1 + 0.14*sin(fp + 5.1)))"}
      - ellipsoid: {c: [0.115, "0.152 + 0.05*sin(fp + 7.6)", -2.109], r: "v(0.317*(1 + 0.14*sin(fp + 6.8)), 0.203*(1 + 0.14*sin(fp + 6.8)), 0.279*(1 + 0.14*sin(fp + 6.8)))"}
      - ellipsoid: {c: [-0.689, "0.127 + 0.05*sin(fp + 9.3)", -1.772], r: "v(0.264*(1 + 0.14*sin(fp + 8.5)), 0.169*(1 + 0.14*sin(fp + 8.5)), 0.232*(1 + 0.14*sin(fp + 8.5)))"}
      - ellipsoid: {c: [1.220, "0.221 + 0.05*sin(fp + 1.5)", -1.436], r: "v(0.460*(1 + 0.14*sin(fp + 0.7)), 0.294*(1 + 0.14*sin(fp + 0.7)), 0.405*(1 + 0.14*sin(fp + 0.7)))"}
      - ellipsoid: {c: [1.644, "0.146 + 0.05*sin(fp + 3.2)", -1.206], r: "v(0.304*(1 + 0.14*sin(fp + 2.4)), 0.194*(1 + 0.14*sin(fp + 2.4)), 0.267*(1 + 0.14*sin(fp + 2.4)))"}
      - ellipsoid: {c: [0.872, "0.121 + 0.05*sin(fp + 4.9)", -1.610], r: "v(0.253*(1 + 0.14*sin(fp + 4.1)), 0.162*(1 + 0.14*sin(fp + 4.1)), 0.223*(1 + 0.14*sin(fp + 4.1)))"}
      - ellipsoid: {c: [0.500, "0.173 + 0.05*sin(fp + 3.5)", -0.457], r: "v(0.360*(1 + 0.14*sin(fp + 2.7)), 0.230*(1 + 0.14*sin(fp + 2.7)), 0.317*(1 + 0.14*sin(fp + 2.7)))"}
      - ellipsoid: {c: [-0.745, "0.154 + 0.05*sin(fp + 5.4)", 0.544], r: "v(0.320*(1 + 0.14*sin(fp + 4.6)), 0.205*(1 + 0.14*sin(fp + 4.6)), 0.282*(1 + 0.14*sin(fp + 4.6)))"}
