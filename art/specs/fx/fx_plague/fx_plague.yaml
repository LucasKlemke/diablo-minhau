    when: "cs > 0.05"
    material: fog_hi
    space: l2
    prims:
      - ellipsoid: {c: [1.750, "0.390 + 0.05*sin(fp + 0.8)", 0.339], r: "v(0.250*(1 + 0.14*sin(fp + 0.0)), 0.160*(1 + 0.14*sin(fp + 0.0)), 0.220*(1 + 0.14*sin(fp + 0.0)))"}
      - ellipsoid: {c: [1.829, "0.257 + 0.05*sin(fp + 2.5)", 0.799], r: "v(0.165*(1 + 0.14*sin(fp + 1.7)), 0.106*(1 + 0.14*sin(fp + 1.7)), 0.145*(1 + 0.14*sin(fp + 1.7)))"}
      - ellipsoid: {c: [1.778, "0.215 + 0.05*sin(fp + 4.2)", -0.076], r: "v(0.138*(1 + 0.14*sin(fp + 3.4)), 0.088*(1 + 0.14*sin(fp + 3.4)), 0.121*(1 + 0.14*sin(fp + 3.4)))"}
      - ellipsoid: {c: [0.773, "0.359 + 0.05*sin(fp + 2.9)", 1.748], r: "v(0.230*(1 + 0.14*sin(fp + 2.1)), 0.147*(1 + 0.14*sin(fp + 2.1)), 0.202*(1 + 0.14*sin(fp + 2.1)))"}
      - ellipsoid: {c: [0.476, "0.237 + 0.05*sin(fp + 4.6)", 2.048], r: "v(0.152*(1 + 0.14*sin(fp + 3.8)), 0.097*(1 + 0.14*sin(fp + 3.8)), 0.134*(1 + 0.14*sin(fp + 3.8)))"}
      - ellipsoid: {c: [1.140, "0.197 + 0.05*sin(fp + 6.3)", 1.454], r: "v(0.127*(1 + 0.14*sin(fp + 5.5)), 0.081*(1 + 0.14*sin(fp + 5.5)), 0.111*(1 + 0.14*sin(fp + 5.5)))"}
      - ellipsoid: {c: [-0.889, "0.406 + 0.05*sin(fp + 4.8)", 1.762], r: "v(0.260*(1 + 0.14*sin(fp + 4.0)), 0.166*(1 + 0.14*sin(fp + 4.0)), 0.229*(1 + 0.14*sin(fp + 4.0)))"}
      - ellipsoid: {c: [-1.283, "0.268 + 0.05*sin(fp + 6.5)", 1.686], r: "v(0.172*(1 + 0.14*sin(fp + 5.7)), 0.110*(1 + 0.14*sin(fp + 5.7)), 0.151*(1 + 0.14*sin(fp + 5.7)))"}
