      - sphere: {c: "v(2.75*rs*0.9727, 0, 2.75*rs*-0.2320)", r: "0.16*rs"}

  # ================= arrows (tip at the frame origin, tail up along +y) =================
  heads:
    material: steel
    space: body
    prims:
      - cone: {a: {at: a0, off: [0, 0, 0]}, b: {at: a0, off: [0, 0.22, 0]}, r: [0.015, 0.075]}
