  a14: {parent: body, pos: "v(0.7 - 0.2*(1.8*(i14 == 0) + 0.8*(i14 == 1) - 0.40*(i14 >= 2)*(i14 <= 6) - 10*(i14 > 6)), 0.98*(1.8*(i14 == 0) + 0.8*(i14 == 1) - 0.40*(i14 >= 2)*(i14 <= 6) - 10*(i14 > 6)), 0.9)", rot: "[0, 0, 0.2014 + 0.12*(i14 == 2)]", scale: "max(ascale, 0.01)"}
  a15: {parent: body, pos: "v(-1.0 - 0.2*(1.8*(i15 == 0) + 0.8*(i15 == 1) - 0.40*(i15 >= 2)*(i15 <= 7) - 10*(i15 > 7)), 0.98*(1.8*(i15 == 0) + 0.8*(i15 == 1) - 0.40*(i15 >= 2)*(i15 <= 7) - 10*(i15 > 7)), -1.8)", rot: "[0, 0, 0.2014 + 0.12*(i15 == 2)]", scale: "max(ascale, 0.01)"}

parts:
  # ================= targeting ring =================
  ring:
    when: "rb > 0.5 and rs > 0.05"
    material: ring
    space: body
    prims:
      - torus: {c: [0, 0.01, 0], R: "2.75*rs", r: 0.075}
    cut:
      - box: {c: [0, -1.0, 0], half: [4, 1.0, 4]}
  ring_hi:               # gold core line on top of the green-gold ring
    when: "rb > 0.5 and rs > 0.05"
    material: ring_hi
    space: l1
    prims:
      - torus: {c: [0, 0.01, 0], R: "2.75*rs", r: 0.028}
    cut:
      - box: {c: [0, -1.0, 0], half: [4, 1.0, 4]}
  ring_dim:
    when: "rb < 0.5 and rs > 0.05 and rt > 0.3"
    material: ring_dim
    space: body
    prims:
      - torus: {c: [0, 0.01, 0], R: "2.75*rs", r: "0.045*rt"}
    cut:                 # dashed: 20 gaps make the ring read faint (no transparency in the engine)
      - box: {c: [0, -1.0, 0], half: [4, 1.0, 4]}
      - sphere: {c: "v(2.75*rs*0.9968, 0, 2.75*rs*0.0799)", r: "0.16*rs"}
      - sphere: {c: "v(2.75*rs*0.9233, 0, 2.75*rs*0.3840)", r: "0.16*rs"}
