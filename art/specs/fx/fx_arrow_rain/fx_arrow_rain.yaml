# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: fx_arrow_rain
kind: prop
view: topdown
size: 128
directions: [s]
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.53551, 0]}   # 22 px above the pivot -> pivot (64, 86)
shadow: null             # a spell effect: no ground shadow

# The archer's Rain of Arrows: arrows pour from the sky onto a circle at the cursor for 3 s.
brief:
  summary: |
    `mark` a green-gold targeting ring (radius ~50 px, ellipse 0.62 as tall as wide) snaps open on the
    ground; `rain` arrows (wooden shaft, steel head, red-white fletching) streak down at a slight slant
    with a pale motion streak, land at scattered points inside the ring with a dust puff and stay stuck a
    few frames, the ring faint; `end` the last arrows land, stuck arrows and ring shrink away, dust settles.
  must_keep: [radius ~50 px, empty inside of the ring in `mark`, staggered landings (no pulse), red-white fletching]
  simplify: [arrows are capsules (round fletching), dust puffs are two flat layers without outline]
  exceptions: |
    kind prop, size 128, directions [s] only, mirror false, shadow null, camera.center [0, 1.53551, 0]
    (integer pivot). Ring and streaks emissive without outline; own ramps `aim` (green-gold) and `dust`.
    camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (64, 86) = the ground point at the centre of the circle (the cursor).
    The ring is a ground torus of R 2.75 (= 50 px); the 38 deg pitch makes it 0.62 as tall as wide.
    16 arrows with fixed landing points (radius <= 2.3). Each arrow k has a life index i_k = (f + o_k) mod 8
    (0 high in the air, 1 low with a long streak, 2 impact + quiver, 3..S_k stuck, then hidden); every
    offset 0..7 is used by exactly two arrows, so each frame shows the same number of arrows in each stage.
    Arrows fly along b = (-0.2, 0.98, 0) (from the upper left); hidden ones are pushed below the ground and
    removed by the ground cut. Dust size d_k per arrow; channel `ascale` shrinks the arrows into the ground,
    `rs` scales the ring, `dm` scales the dust (used by `end`).

ramps:
  aim:  ["#2f3a10", "#5c8a22", "#8ec63a", "#ecd65e", "#fff8c8"]
  dust: ["#1c0f1a", "#7d5a3c", "#a3825a", "#c9ae86", "#e6d9b0"]

materials:
  ring:      {ramp: aim, emissive: true, band: 2, outline: false, line: false, glow: {color: "#8ec63a", mix: 0.35, radius: 1}}
  ring_hi:   {ramp: aim, emissive: true, band: 3, outline: false, line: false}
  ring_dim:  {ramp: aim, emissive: true, band: 2, outline: false, line: false}
  wood:      {ramp: wood, bands: [2, 4]}
  steel:     {ramp: steel, bands: [2, 4]}
  fletch_r:  {ramp: cloth_red, bands: [2, 3]}
  fletch_w:  {ramp: eye_white, bands: [1, 2]}
  streak:    {ramp: fx_mid, emissive: true, band: 0, outline: false, line: false}
  dust:      {ramp: dust, bands: [2, 2], outline: false, line: false}
  dust_hi:   {ramp: dust, bands: [3, 3], outline: false, line: false}

channels:
  root: [0, 0, 0]
  rs: 1.0          # ring scale (mark grows it, end shrinks it)
  rb: 0            # 1 = bright ring (mark), 0 = faint ring
  ascale: 1.0         # arrow scale (end shrinks the stuck arrows into the ground)
  dm: 1.0          # dust multiplier (end settles it)
  rt: 1.0          # faint ring tube thickness (end thins it away)

  # life index of each arrow (99 = hidden); rain sets i_k = (f + o_k) mod 8
  i0: 99
  i1: 99
  i2: 99
  i3: 99
  i4: 99
  i5: 99
  i6: 99
  i7: 99
  i8: 99
  i9: 99
  i10: 99
  i11: 99
  i12: 99
  i13: 99
  i14: 99
  i15: 99
  # dust puff size of each arrow
  d0: 0
  d1: 0
  d2: 0
  d3: 0
  d4: 0
  d5: 0
  d6: 0
  d7: 0
  d8: 0
  d9: 0
  d10: 0
  d11: 0
  d12: 0
  d13: 0
  d14: 0
  d15: 0

bones:
  body: {parent: root}
  l1: {parent: body, pos: [0, 0.216, 0.276]}    # 0.35 toward the camera: draws on top, same pixels
  # arrow frames: origin = the tip, local +y = back along the flight (b = (-0.2, 0.98, 0));
  # height of the tip along b: 1.8 (i=0), 0.8 (i=1), buried -0.40 while stuck (head hidden), -10 = hidden
  a0: {parent: body, pos: "v(0.2 - 0.2*(1.8*(i0 == 0) + 0.8*(i0 == 1) - 0.40*(i0 >= 2)*(i0 <= 4) - 10*(i0 > 4)), 0.98*(1.8*(i0 == 0) + 0.8*(i0 == 1) - 0.40*(i0 >= 2)*(i0 <= 4) - 10*(i0 > 4)), 0.1)", rot: "[0, 0, 0.2014 + 0.12*(i0 == 2)]", scale: "max(ascale, 0.01)"}
  a1: {parent: body, pos: "v(-1.5 - 0.2*(1.8*(i1 == 0) + 0.8*(i1 == 1) - 0.40*(i1 >= 2)*(i1 <= 5) - 10*(i1 > 5)), 0.98*(1.8*(i1 == 0) + 0.8*(i1 == 1) - 0.40*(i1 >= 2)*(i1 <= 5) - 10*(i1 > 5)), -1.0)", rot: "[0, 0, 0.2014 + 0.12*(i1 == 2)]", scale: "max(ascale, 0.01)"}
  a2: {parent: body, pos: "v(1.6 - 0.2*(1.8*(i2 == 0) + 0.8*(i2 == 1) - 0.40*(i2 >= 2)*(i2 <= 6) - 10*(i2 > 6)), 0.98*(1.8*(i2 == 0) + 0.8*(i2 == 1) - 0.40*(i2 >= 2)*(i2 <= 6) - 10*(i2 > 6)), 0.9)", rot: "[0, 0, 0.2014 + 0.12*(i2 == 2)]", scale: "max(ascale, 0.01)"}
  a3: {parent: body, pos: "v(-0.6 - 0.2*(1.8*(i3 == 0) + 0.8*(i3 == 1) - 0.40*(i3 >= 2)*(i3 <= 7) - 10*(i3 > 7)), 0.98*(1.8*(i3 == 0) + 0.8*(i3 == 1) - 0.40*(i3 >= 2)*(i3 <= 7) - 10*(i3 > 7)), 1.7)", rot: "[0, 0, 0.2014 + 0.12*(i3 == 2)]", scale: "max(ascale, 0.01)"}
  a4: {parent: body, pos: "v(0.9 - 0.2*(1.8*(i4 == 0) + 0.8*(i4 == 1) - 0.40*(i4 >= 2)*(i4 <= 4) - 10*(i4 > 4)), 0.98*(1.8*(i4 == 0) + 0.8*(i4 == 1) - 0.40*(i4 >= 2)*(i4 <= 4) - 10*(i4 > 4)), -1.6)", rot: "[0, 0, 0.2014 + 0.12*(i4 == 2)]", scale: "max(ascale, 0.01)"}
  a5: {parent: body, pos: "v(-2.0 - 0.2*(1.8*(i5 == 0) + 0.8*(i5 == 1) - 0.40*(i5 >= 2)*(i5 <= 5) - 10*(i5 > 5)), 0.98*(1.8*(i5 == 0) + 0.8*(i5 == 1) - 0.40*(i5 >= 2)*(i5 <= 5) - 10*(i5 > 5)), 0.6)", rot: "[0, 0, 0.2014 + 0.12*(i5 == 2)]", scale: "max(ascale, 0.01)"}
  a6: {parent: body, pos: "v(2.1 - 0.2*(1.8*(i6 == 0) + 0.8*(i6 == 1) - 0.40*(i6 >= 2)*(i6 <= 6) - 10*(i6 > 6)), 0.98*(1.8*(i6 == 0) + 0.8*(i6 == 1) - 0.40*(i6 >= 2)*(i6 <= 6) - 10*(i6 > 6)), -0.5)", rot: "[0, 0, 0.2014 + 0.12*(i6 == 2)]", scale: "max(ascale, 0.01)"}
  a7: {parent: body, pos: "v(-0.3 - 0.2*(1.8*(i7 == 0) + 0.8*(i7 == 1) - 0.40*(i7 >= 2)*(i7 <= 7) - 10*(i7 > 7)), 0.98*(1.8*(i7 == 0) + 0.8*(i7 == 1) - 0.40*(i7 >= 2)*(i7 <= 7) - 10*(i7 > 7)), -0.8)", rot: "[0, 0, 0.2014 + 0.12*(i7 == 2)]", scale: "max(ascale, 0.01)"}
  a8: {parent: body, pos: "v(1.0 - 0.2*(1.8*(i8 == 0) + 0.8*(i8 == 1) - 0.40*(i8 >= 2)*(i8 <= 4) - 10*(i8 > 4)), 0.98*(1.8*(i8 == 0) + 0.8*(i8 == 1) - 0.40*(i8 >= 2)*(i8 <= 4) - 10*(i8 > 4)), 0.0)", rot: "[0, 0, 0.2014 + 0.12*(i8 == 2)]", scale: "max(ascale, 0.01)"}
  a9: {parent: body, pos: "v(-1.1 - 0.2*(1.8*(i9 == 0) + 0.8*(i9 == 1) - 0.40*(i9 >= 2)*(i9 <= 5) - 10*(i9 > 5)), 0.98*(1.8*(i9 == 0) + 0.8*(i9 == 1) - 0.40*(i9 >= 2)*(i9 <= 5) - 10*(i9 > 5)), 0.4)", rot: "[0, 0, 0.2014 + 0.12*(i9 == 2)]", scale: "max(ascale, 0.01)"}
  a10: {parent: body, pos: "v(0.4 - 0.2*(1.8*(i10 == 0) + 0.8*(i10 == 1) - 0.40*(i10 >= 2)*(i10 <= 6) - 10*(i10 > 6)), 0.98*(1.8*(i10 == 0) + 0.8*(i10 == 1) - 0.40*(i10 >= 2)*(i10 <= 6) - 10*(i10 > 6)), 1.9)", rot: "[0, 0, 0.2014 + 0.12*(i10 == 2)]", scale: "max(ascale, 0.01)"}
  a11: {parent: body, pos: "v(-0.4 - 0.2*(1.8*(i11 == 0) + 0.8*(i11 == 1) - 0.40*(i11 >= 2)*(i11 <= 7) - 10*(i11 > 7)), 0.98*(1.8*(i11 == 0) + 0.8*(i11 == 1) - 0.40*(i11 >= 2)*(i11 <= 7) - 10*(i11 > 7)), -2.0)", rot: "[0, 0, 0.2014 + 0.12*(i11 == 2)]", scale: "max(ascale, 0.01)"}
