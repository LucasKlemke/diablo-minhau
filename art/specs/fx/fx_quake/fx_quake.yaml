# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: fx_quake
kind: prop
view: topdown
size: 192
directions: [s]
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.55837, 0]}   # 8 px above the pivot -> pivot (96, 104)
shadow: null             # a ground effect: no shadow

# Barbarian skill effect: Earthquake (the axe smashes the ground, massive area damage within ~90 px).
brief:
  summary: |
    `quake` deep magma-orange fissures race out from the centre to ~90 px, ground slabs heave up and drop,
    rock debris flies, a dust wave rolls out to the 90 px ellipse, then a second smaller pulse (flare, slabs
    heave again, a smaller dust ring); it ends on cooling cracks shrinking away.
  must_keep: [fissures and dust wave reach ~90 px (180 x ~111 px ellipse), glowing magma only in the fissures and the centre, outlined slabs and rocks]
  simplify: [fissures as three flat layers (charred lip, glow, white-hot core), dust as one lit band of outlined puffs, no transparency - fading is shrinking/darkening]
  exceptions: |
    fx sprite: kind prop, size 192, directions [s], mirror false, shadow null, camera.center [0, 0.55837, 0]
    (integer pivot). Magma emissive (farm `fire` ramp, no outline). camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (96, 104) = the ground point where the axe strikes. One-shot, 11 frames, 800 ms;
    event `hit` on frame 0 (the smash) and `pulse` on frame 5 (370 ms, the second, smaller pulse).
    Cooling = the glow layer swaps to the darkest fire tone and thins while the fissures shrink back.

ramps:
  qk_rock:   ["#1c0f1a", "#3a302e", "#5e5048", "#857262", "#a8957e"]
  qk_earth:  ["#1c0f1a", "#4a2a1a", "#7a4a2a", "#a8703f", "#cf9c62"]
  qk_dust:   ["#1c0f1a", "#7d5a3c", "#a3825a", "#c9ae86", "#e6d9b0"]
  qk_scorch: ["#1c0f1a", "#22141a"]
  qk_scar:   ["#1c0f1a", "#4f3424"]

materials:
  rock:       {ramp: qk_rock, bands: [2, 4]}
  earth:      {ramp: qk_earth, bands: [2, 4]}
  dust:       {ramp: qk_dust, bands: [2, 4], line: false}
  scorch:     {ramp: qk_scorch, bands: [1, 1], outline: false, line: false}
  scar:       {ramp: qk_scar, bands: [1, 1], outline: false, line: false}
  magma:      {ramp: fire, emissive: true, band: 1, outline: false, glow: {color: "#fe6607", mix: 0.35, radius: 1}}
  magma_cool: {ramp: fire, emissive: true, band: 0, outline: false}
  magma_hot:  {ramp: fire, emissive: true, band: 2, outline: false}
  ember:      {ramp: fire, emissive: true, band: 2, outline: false}

channels:
  root: [0, 0, 0]
  fl: 0       # fissure length (0..1 of ~4.6 units = ~84 px)
  cw: 1       # charred lip width
  gw: 1       # glow width (> 0.45 orange, 0.05..0.45 cooling dark red, > 0.7 white-hot core)
  scar: 0     # broken ground patch at the centre (radius scale)
  sl: 0       # slab size (0 = none)
  hv: 0       # slab heave (0 flat .. 1 up and tilted)
  rd: 0       # debris distance
  rh: 0       # debris height
  rs: 1       # debris size
  d1: 0       # main dust wave radius
  s1: 0       # main dust puff radius
  h1: 0       # main dust drifting up
  d2: 0       # second pulse radius
  s2: 0       # second pulse puff radius
  h2: 0
  fx: 0       # central magma flare size
  ed: 0       # embers: distance
  eh: 0       # embers: height
  er: 0       # embers: radius

bones:
  body: {parent: root}
  # layers along the view ray (camera direction (0, 0.616, 0.788)): same pixels, nearer = drawn on top
  g1: {parent: body, pos: [0, 0.185, 0.236]}     # 0.3 front: glow over the charred lip, under dust and slabs
  g2: {parent: body, pos: [0, 0.277, 0.355]}     # 0.45 front: hot core
  f1: {parent: body, pos: [0, 0.370, 0.473]}     # 0.6 front
  f2: {parent: body, pos: [0, 0.739, 0.946]}     # 1.2 front
  f3: {parent: body, pos: [0, 1.109, 1.418]}     # 1.8 front

parts:
  scar_patch:       # smashed ground at the strike point
    when: "scar > 0.05"
    material: scar
    space: body
    prims:
      - ellipsoid: {c: [0, 0.004, 0], r: ["1.0*scar", 0.004, "0.9*scar"], rot: [0, 0.4, 0]}
      - ellipsoid: {c: [0.2, 0.004, -0.15], r: ["0.8*scar", 0.004, "0.85*scar"], rot: [0, 1.3, 0]}
