# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: fx_war_roar
kind: prop
view: topdown
size: 96
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}   # frame centre = ground point -> pivot (48, 48)
shadow: null             # a spell effect: light, not shadow

# Barbarian Berserker Rage activation: a war roar played once around the hero.
brief:
  summary: a blast of rage around the barbarian - a brief crimson starburst flash behind/around the body,
    concentric red-orange shockwave rings racing out along the ground to ~40 px, jagged sound-wave arcs fanning
    out left and right at head height, and red embers + hot sparks spraying outward
  must_keep: [concentric ground rings (ellipse 0.62 tall, pitch 38), jagged roar arcs at head height, embers and sparks, crimson flash with a clear face]
  simplify: [rings are thin tori that thin out and cool down instead of fading; arcs are zigzag chains; no transparency - fading is cooling (band) and thinning]
  exceptions: |
    fx sprite: kind prop, size 96, directions 1, mirror false, shadow null, camera.center [0, 0, 0] so the
    pivot is the frame centre (48, 48). Everything is emissive with outline false, so the project's dark outline
    does not apply. Own ramp `rage` (#c1272d up to #ff5a3a, hot orange #ff8c3a / #ffc46a highlights).
    camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (48, 48) = the ground point under the barbarian's feet (his own pivot). `roar` is
    one-shot, 8 frames, 550 ms; event `roar` on frame 0. Rings are world-space tori on the ground (3 rings,
    staggered, outer ring stops at R 2.2 = 40 px -> 80 x 49 px ellipse). The back arcs of the rings are cut
    where they would run behind the body (|x| < 12 px). Bone `scr` faces the camera (rot x 0.908): x = screen
    right, z = screen down, 1 px = 0.055. Roar arcs are centred 19 px above the pivot (head) and start at
    13 px radius, so they never cross the face (|x| < 7 px, 10..26 px up). The flash is a hollow starburst
    centred 14 px up with an empty core of radius 11 px, drawn behind the hero (scr y -1), so it frames the
    body without covering the face. Sparks start 8+ px from the centre, low in front of the body.

ramps:
  rage: ["#1c0f1a", "#7d1224", "#c1272d", "#e8463c", "#ff5a3a", "#ff8c3a", "#ffc46a"]

materials:
  ring_hot:  {ramp: rage, emissive: true, band: 5, outline: false, line: false, glow: {color: "#ff5a3a", mix: 0.45, radius: 1}}
  ring:      {ramp: rage, emissive: true, band: 4, outline: false, line: false, glow: {color: "#c1272d", mix: 0.4, radius: 1}}
  ring_dim:  {ramp: rage, emissive: true, band: 2, outline: false, line: false}
  arc_hot:   {ramp: rage, emissive: true, band: 5, outline: false, line: false, glow: {color: "#ff5a3a", mix: 0.4, radius: 1}}
  arc:       {ramp: rage, emissive: true, band: 4, outline: false, line: false}
  arc_dim:   {ramp: rage, emissive: true, band: 2, outline: false, line: false}
  flash_core: {ramp: rage, emissive: true, band: 5, outline: false, line: false}
  flash:     {ramp: rage, emissive: true, band: 2, outline: false, line: false, glow: {color: "#c1272d", mix: 0.5, radius: 1}}
  flash_dim: {ramp: rage, emissive: true, band: 1, outline: false, line: false}
  glow:      {ramp: rage, emissive: true, band: 3, outline: false, line: false}
  spark:     {ramp: rage, emissive: true, band: 6, outline: false, line: false}
  ember:     {ramp: rage, emissive: true, band: 3, outline: false, line: false}
  ember_dim: {ramp: rage, emissive: true, band: 2, outline: false, line: false}

channels:
  root: [0, 0, 0]
  r1: 0          # ring radii (units; 2.2 = 40 px)
  r2: 0
  r3: 0
  w1: 0          # ring thickness (0 = off)
  w2: 0
  w3: 0
  h1: 2          # ring heat 3 hot / 2 red-orange / 1 crimson
  h2: 2
  h3: 2
  a: 0.7         # radius of the outer roar arc (units, around the head)
  aw: 0          # arc thickness (0 = off)
  ah: 2          # arc heat
  fl: 0          # flash size (0 = off)
  fh: 2          # flash heat: 3 core hot / 2 crimson / 1 dark
  gl: 0          # ground glow under the feet
  sp: 0          # spark/ember travel 0..1
  ss: 0          # spark size (0 = off)

bones:
  scr: {parent: root, rot: [0.908, 0, 0]}     # camera-facing plane through the pivot

