animations:
  loop:
    frames: 8
    ms: 100
    channels:
      spin: "p/3"            # 3 runes, 1/3 turn per loop -> seamless
      pulse: "p"
      glint: "-1.75 + 3.5*p/tau"
  up:
    loop: false
    keys:
      - {ms: 60, set: {grow: 0, ring: 0.55, rim: 0, facets: 0, runes: 0, rhot: 1}}
      - {ms: 60, set: {grow: 0, ring: 0.85, rim: 0, facets: 0, runes: 0, rhot: 1}}
      - {ms: 70, set: {grow: 0.3, ring: 1.05, facets: 0, runes: 0, hot: 1}}
      - {ms: 70, set: {grow: 0.72, ring: 1.0, facets: 0, runes: 0, hot: 1}}
      - {ms: 70, set: {grow: 1.06, fhot: 1, hot: 1, spin: -0.6}}
      - {ms: 80, set: {grow: 1.0, spin: -0.3}}
  break:
    loop: false
    keys:
      - {ms: 70, set: {crack: 0.9, hot: 1, shimmer: 0, fhot: 1}}
      - {ms: 70, set: {crack: 1.6, shimmer: 0, runes: 0}}
      - {ms: 60, set: {rim: 0, facets: 0, runes: 0, brk: 0.1, ring: 0.9}}
      - {ms: 70, set: {rim: 0, facets: 0, runes: 0, brk: 0.4, ring: 0.6}}
      - {ms: 70, set: {rim: 0, facets: 0, runes: 0, brk: 0.68, ring: 0}}
      - {ms: 80, set: {rim: 0, facets: 0, runes: 0, brk: 0.92, ring: 0}}
