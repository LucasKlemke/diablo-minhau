# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: fx_meteor
kind: prop
view: topdown
size: 128
directions: [s]
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.11673, 0]}   # 16 px above the pivot -> pivot (64, 80)
shadow: null             # fire casts light, not shadow

# The mage's ultimate (spell effect): a burning rock dives in, explodes and leaves a burning crater.
brief:
  summary: |
    `fall` a cracked rock wrapped in fire diving from the upper left with a long fire trail;
    `impact` a dome of fire, a shockwave ring on the ground reaching ~56 px and rock chunks flying out;
    `burn` the scorched crater left behind, small flames licking around its rim, embers rising.
  must_keep: [fire tones of the farm `fire` ramp, dark-outlined rock, the ring reaches the spell radius (~56 px)]
  simplify: [fire layers one band each without outline, a flat scorched decal for the crater]
  exceptions: |
    kind prop, size 128 (one size for every clip: the spec has one frame size), directions [s] only,
    shadow null, camera.center [0, 1.11673, 0] (integer pivot). Flames emissive, no outline, as fire_large.
    camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (64, 80). In `fall` the rock's centre sits on the pivot (the game places the
    sprite at the falling rock's point); in `impact` and `burn` the pivot is the ground point at the
    centre of the blast. Fire layers sit on bones pushed toward the camera (c0 back .. c3 front) so the
    inner tones always draw over the outer ones without changing the silhouette.
    `impact` ends on the crater pose of `burn`, so the game can chain impact -> burn without a pop.

ramps:
  mt_rock:  ["#1c0f1a", "#2c2426", "#433834", "#5e5048", "#7c6c5e"]
  mt_halo:  ["#1c0f1a", "#5a4038"]
  mt_soot:  ["#1c0f1a", "#33262a"]
  mt_core:  ["#1c0f1a", "#170e12"]
  mt_glow:  ["#902308", "#fe6607", "#fbbe71"]

materials:
  outer: {ramp: fire, emissive: true, band: 0, outline: false, glow: {color: "#fe6607", mix: 0.3, radius: 1}}
  mid:   {ramp: fire, emissive: true, band: 1, outline: false}
  inner: {ramp: fire, emissive: true, band: 2, outline: false}
  core:  {ramp: fire, emissive: true, band: 3, outline: false}
  crack: {ramp: mt_glow, emissive: true, band: 1, outline: false}
  rock:  {ramp: mt_rock, bands: [2, 4]}
  halo:  {ramp: mt_halo, bands: [1, 1], outline: false, line: false}
  soot:  {ramp: mt_soot, bands: [1, 1], outline: false, line: false}
  pit:   {ramp: mt_core, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]
  fall: 0         # 1 = falling rock + trail
  imp: 0          # 1 = impact blast parts
  crater: 0       # 1 = scorched crater on the ground
  fp: 0.0         # flame phase of the crater flames (burn sets it to p)
  fs: 1.0         # crater flame size (0 = none)
  dr: 0.0         # blast dome radius
  dc: 0.0         # blast white core radius
  up: 0.0         # how far the blast puffs have risen
  rr: 0.0         # shockwave ring radius
  rt: 0.12        # shockwave ring tube radius
  cd: 0.0         # rock chunks: distance from the centre
  ch: 0.0         # rock chunks: height
  emb: 0.0        # embers: distance from the centre
  eh: 0.0         # embers: height
  er: 0.0         # embers: radius

bones:
  body: {parent: root}
  # layers along the view ray (camera direction (0, 0.616, 0.788)): same pixels, nearer = drawn on top
  c0: {parent: body, pos: [0, -1.232, -1.576]}   # 2.0 back
  c1: {parent: body, pos: [0, -0.862, -1.103]}   # 1.4 back
  c2: {parent: body, pos: [0, -0.554, -0.709]}   # 0.9 back
  c3: {parent: body, pos: [0, -0.308, -0.394]}   # 0.5 back
  f1: {parent: body, pos: [0, 0.370, 0.473]}     # 0.6 front
  f2: {parent: body, pos: [0, 0.739, 0.946]}     # 1.2 front
  f3: {parent: body, pos: [0, 1.109, 1.418]}     # 1.8 front
  rock: {parent: body, rot: "[0.4, 0.3, -p]", scale: 1.2}    # tumbling meteor

parts:
  # ================= fall: trail toward the upper left, T = (-0.62, 0.78, 0), N = (0.78, 0.62, 0) =================
  tr_outer:
    when: "fall > 0.5"
    material: outer
    space: c0
    blend: 0.10
    prims:
      - chain: {pts: [[0, 0, 0], ["-0.50 + 0.06*sin(p)", "0.62 + 0.05*sin(p)", 0], ["-1.05 + 0.12*sin(p + 1)", "1.28 + 0.10*sin(p + 1)", 0], ["-1.60 + 0.18*sin(p + 2)", "1.98 + 0.14*sin(p + 2)", 0], ["-2.10 + 0.22*sin(p + 3)", "2.62 + 0.18*sin(p + 3) + 0.10*sin(2*p)", 0]], r: [0.66, 0.54, 0.40, 0.24, 0.05]}
      - chain: {pts: [[0.25, 0.20, 0], ["-0.30 + 0.12*sin(p + 2)", "1.05 + 0.08*sin(2*p)", 0], ["-0.75 + 0.18*sin(p + 3)", "1.85 + 0.10*sin(2*p + 1)", 0]], r: [0.36, 0.20, 0.04]}
      - chain: {pts: [[-0.20, -0.25, 0], ["-1.05 + 0.10*sin(p + 4)", "0.42 + 0.10*sin(2*p + 2)", 0], ["-1.75 + 0.14*sin(p + 5)", "1.00 + 0.12*sin(2*p + 3)", 0]], r: [0.36, 0.20, 0.04]}
  tr_mid:
    when: "fall > 0.5"
    material: mid
    space: c1
    blend: 0.08
    prims:
      - chain: {pts: [[0, 0, 0], ["-0.45 + 0.05*sin(p + 0.5)", "0.56 + 0.04*sin(p)", 0], ["-0.95 + 0.10*sin(p + 1.5)", "1.18 + 0.08*sin(p + 1)", 0], ["-1.40 + 0.14*sin(p + 2.5)", "1.74 + 0.12*sin(p + 2) + 0.08*sin(2*p + 1)", 0]], r: [0.54, 0.40, 0.24, 0.04]}
  tr_inner:
    when: "fall > 0.5"
    material: inner
    space: c2
    blend: 0.06
    prims:
      - chain: {pts: [[0, 0, 0], ["-0.40 + 0.04*sin(p + 1)", "0.50 + 0.04*sin(p + 0.5)", 0], ["-0.82 + 0.08*sin(p + 2)", "1.02 + 0.06*sin(2*p + 2)", 0]], r: [0.42, 0.26, 0.04]}
  tr_core:
    when: "fall > 0.5"
    material: core
    space: c3
    blend: 0.05
    prims:
      - chain: {pts: [[0.05, -0.05, 0], ["-0.30", "0.40 + 0.04*sin(2*p)", 0], ["-0.52 + 0.04*sin(p)", "0.68 + 0.04*sin(2*p + 1)", 0]], r: [0.36, 0.18, 0.03]}
  tr_sparks:
    when: "fall > 0.5"
    material: inner
    space: f3
    prims:
      - sphere: {c: ["-0.62*(1.0 + 1.8*(p/tau + 0.0 - floor(p/tau + 0.0))) + 0.30", "0.78*(1.0 + 1.8*(p/tau + 0.0 - floor(p/tau + 0.0))) + 0.25", 0], r: "0.07*(1 - 0.5*(p/tau + 0.0 - floor(p/tau + 0.0)))"}
      - sphere: {c: ["-0.62*(1.0 + 1.8*(p/tau + 0.5 - floor(p/tau + 0.5))) - 0.35", "0.78*(1.0 + 1.8*(p/tau + 0.5 - floor(p/tau + 0.5))) - 0.20", 0], r: "0.07*(1 - 0.5*(p/tau + 0.5 - floor(p/tau + 0.5)))"}
      - sphere: {c: ["-0.62*(1.4 + 1.6*(p/tau + 0.3 - floor(p/tau + 0.3))) + 0.55", "0.78*(1.4 + 1.6*(p/tau + 0.3 - floor(p/tau + 0.3))) + 0.45", 0], r: "0.06*(1 - 0.5*(p/tau + 0.3 - floor(p/tau + 0.3)))"}
      - sphere: {c: ["-0.62*(1.2 + 1.6*(p/tau + 0.8 - floor(p/tau + 0.8))) - 0.55", "0.78*(1.2 + 1.6*(p/tau + 0.8 - floor(p/tau + 0.8))) - 0.40", 0], r: "0.06*(1 - 0.5*(p/tau + 0.8 - floor(p/tau + 0.8)))"}
  meteor:
    when: "fall > 0.5"
    material: rock
    space: rock
    blend: 0.06
    prims:
      - sphere: {c: [0, 0, 0], r: 0.36}
      - ellipsoid: {c: [0.12, 0.10, 0.05], r: [0.30, 0.26, 0.30], rot: [0.3, 0.5, 0.2]}
      - ellipsoid: {c: [-0.14, -0.08, 0.06], r: [0.28, 0.24, 0.26], rot: [0.8, -0.3, 0.6]}
      - sphere: {c: [0.05, -0.18, -0.12], r: 0.22}
    cut:
      - sphere: {c: [0.42, 0.30, 0.25], r: 0.16}
      - sphere: {c: [-0.35, 0.28, -0.20], r: 0.14}
  meteor_cracks:
    when: "fall > 0.5"
    material: crack
    space: rock
    prims:
      - chain: {pts: [[-0.20, 0.10, 0.33], [0.00, 0.02, 0.38], [0.12, 0.16, 0.35], [0.26, 0.10, 0.30]], r: [0.045, 0.040, 0.040, 0.03]}
      - chain: {pts: [[0.00, 0.02, 0.38], [-0.04, -0.18, 0.34], [0.10, -0.28, 0.26]], r: [0.04, 0.04, 0.03]}
      - chain: {pts: [[0.30, -0.02, -0.25], [0.36, 0.12, -0.10], [0.34, 0.26, 0.05]], r: [0.04, 0.04, 0.03]}
      - chain: {pts: [[-0.32, -0.10, -0.15], [-0.30, -0.24, 0.05], [-0.18, -0.30, 0.18]], r: [0.04, 0.04, 0.03]}
  # flame licks wrapping the trailing side of the rock, in front of it
  meteor_licks:
    when: "fall > 0.5"
    material: mid
    space: f1
    blend: 0.04
    prims:
      - chain: {pts: [[0.30, 0.22, 0], ["-0.05 + 0.06*sin(2*p)", "0.62 + 0.05*sin(2*p)", 0], ["-0.42 + 0.08*sin(2*p + 1)", "0.98 + 0.06*sin(2*p + 1)", 0]], r: [0.10, 0.08, 0.02]}
      - chain: {pts: [[-0.30, -0.18, 0], ["-0.62 + 0.06*sin(2*p + 2)", "0.18 + 0.05*sin(2*p + 2)", 0], ["-0.96 + 0.08*sin(2*p + 3)", "0.56 + 0.06*sin(2*p + 3)", 0]], r: [0.10, 0.08, 0.02]}
  meteor_licks_hot:
    when: "fall > 0.5"
    material: inner
    space: f2
    prims:
      - chain: {pts: [[0.24, 0.30, 0], ["0.02 + 0.04*sin(2*p)", "0.58 + 0.04*sin(2*p)", 0]], r: [0.05, 0.02]}
      - chain: {pts: [[-0.34, -0.08, 0], ["-0.58 + 0.04*sin(2*p + 2)", "0.18 + 0.04*sin(2*p + 2)", 0]], r: [0.05, 0.02]}

  # ================= crater (end of impact, burn) =================
  cr_halo:
    when: "crater > 0.5"
    material: halo
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.004, 0.02], r: [2.95, 0.004, 2.80], rot: [0, 0.4, 0]}
      - ellipsoid: {c: [-0.30, 0.004, 0.30], r: [2.70, 0.004, 2.75], rot: [0, 1.1, 0]}
      - ellipsoid: {c: [2.30, 0.004, -1.30], r: [0.80, 0.004, 0.22], rot: [0, 0.52, 0]}
      - ellipsoid: {c: [-2.40, 0.004, 1.30], r: [0.75, 0.004, 0.20], rot: [0, 0.50, 0]}
      - ellipsoid: {c: [-1.20, 0.004, -2.50], r: [0.70, 0.004, 0.20], rot: [0, -1.12, 0]}
      - ellipsoid: {c: [1.10, 0.004, 2.55], r: [0.72, 0.004, 0.20], rot: [0, -1.15, 0]}
  cr_soot:
    when: "crater > 0.5"
    material: soot
    space: body
    prims:
      - ellipsoid: {c: [0, 0.008, 0], r: [2.25, 0.004, 2.15], rot: [0, 0.7, 0]}
      - ellipsoid: {c: [0.30, 0.008, -0.20], r: [2.05, 0.004, 2.25], rot: [0, 0.2, 0]}
  cr_pit:
    when: "crater > 0.5"
    material: pit
    space: body
    prims:
      - ellipsoid: {c: [0, 0.012, 0], r: [1.30, 0.004, 1.20], rot: [0, 0.3, 0]}
  cr_rim:           # broken ring of thrown-up rock around the pit
    when: "crater > 0.5"
    material: rock
    space: body
    blend: 0.08
    prims:
      - torus: {c: [0, 0.0, 0], R: 1.50, r: 0.16}
      - sphere: {c: [1.45, 0.08, 0.45], r: 0.24}
      - sphere: {c: [-1.30, 0.06, 0.75], r: 0.22}
      - sphere: {c: [0.30, 0.06, 1.48], r: 0.20}
      - sphere: {c: [-0.60, 0.06, -1.40], r: 0.22}
      - sphere: {c: [1.05, 0.06, -1.05], r: 0.18}
    cut:
      - box: {c: [0, -0.5, 0], half: [3, 0.5, 3]}
  cr_lava:          # glowing cracks and the half-buried meteor core
    when: "crater > 0.5"
    material: crack
    space: body
    prims:
      - ellipsoid: {c: [0, 0.03, 0], r: [0.55, 0.03, 0.48]}
      - box: {c: [0.75, 0.02, 0.05], half: [0.45, 0.02, 0.035], rot: [0, 0.2, 0]}
      - box: {c: [-0.70, 0.02, 0.30], half: [0.42, 0.02, 0.035], rot: [0, -0.5, 0]}
      - box: {c: [0.10, 0.02, -0.75], half: [0.035, 0.02, 0.42], rot: [0, 0.3, 0]}
      - box: {c: [-0.15, 0.02, 0.78], half: [0.035, 0.02, 0.40], rot: [0, -0.4, 0]}
  cr_lava_hot:
    when: "crater > 0.5"
    material: inner
    space: f1
    prims:
      - ellipsoid: {c: [0, 0.04, 0], r: [0.30, 0.03, 0.26]}
  cr_rock:          # what is left of the meteor, cracked and glowing
    when: "crater > 0.5"
    material: rock
    space: body
    blend: 0.05
    prims:
      - ellipsoid: {c: [0.05, 0.08, -0.05], r: [0.36, 0.20, 0.30], rot: [0, 0.6, 0]}
      - sphere: {c: [-0.15, 0.06, 0.10], r: 0.18}
  # small flames licking around the crater: tapered chains swaying with fp (outer -> core along the view ray)
  cr_fl_outer:
    when: "crater > 0.5 and fs > 0.05"
    material: outer
    space: body
    prims:
      - chain: {pts: [[1.70, 0.05, 0.60], ["1.70 + 0.05*sin(fp + 0.0)", "0.05 + fs*0.36*(1 + 0.2*sin(2*fp + 0.0))", 0.60], ["1.70 + 0.10*sin(fp + 0.9)", "0.05 + fs*0.72*(1 + 0.2*sin(2*fp + 0.0))", 0.60]], r: [0.20, 0.13, 0.02]}
      - chain: {pts: [[-1.55, 0.05, 0.90], ["-1.55 + 0.05*sin(fp + 2.1)", "0.05 + fs*0.42*(1 + 0.2*sin(2*fp + 1.6))", 0.90], ["-1.55 + 0.10*sin(fp + 3.0)", "0.05 + fs*0.84*(1 + 0.2*sin(2*fp + 1.6))", 0.90]], r: [0.22, 0.14, 0.02]}
      - chain: {pts: [[0.40, 0.05, 1.75], ["0.40 + 0.05*sin(fp + 4.2)", "0.05 + fs*0.30*(1 + 0.2*sin(2*fp + 3.1))", 1.75], ["0.40 + 0.10*sin(fp + 5.1)", "0.05 + fs*0.60*(1 + 0.2*sin(2*fp + 3.1))", 1.75]], r: [0.18, 0.12, 0.02]}
      - chain: {pts: [[-0.70, 0.05, -1.60], ["-0.70 + 0.05*sin(fp + 1.0)", "0.05 + fs*0.40*(1 + 0.2*sin(2*fp + 4.7))", -1.60], ["-0.70 + 0.10*sin(fp + 1.9)", "0.05 + fs*0.80*(1 + 0.2*sin(2*fp + 4.7))", -1.60]], r: [0.22, 0.14, 0.02]}
      - chain: {pts: [[1.20, 0.05, -1.25], ["1.20 + 0.05*sin(fp + 3.1)", "0.05 + fs*0.32*(1 + 0.2*sin(2*fp + 2.2))", -1.25], ["1.20 + 0.10*sin(fp + 4.0)", "0.05 + fs*0.64*(1 + 0.2*sin(2*fp + 2.2))", -1.25]], r: [0.18, 0.12, 0.02]}
      - chain: {pts: [[-1.85, 0.05, -0.45], ["-1.85 + 0.05*sin(fp + 5.0)", "0.05 + fs*0.28*(1 + 0.2*sin(2*fp + 5.5))", -0.45], ["-1.85 + 0.10*sin(fp + 5.9)", "0.05 + fs*0.56*(1 + 0.2*sin(2*fp + 5.5))", -0.45]], r: [0.17, 0.11, 0.02]}
      - chain: {pts: [[0.15, 0.10, 0.10], ["0.15 + 0.05*sin(fp + 1.7)", "0.10 + fs*0.45*(1 + 0.2*sin(2*fp + 0.8))", 0.10], ["0.15 + 0.10*sin(fp + 2.6)", "0.10 + fs*0.90*(1 + 0.2*sin(2*fp + 0.8))", 0.10]], r: [0.22, 0.14, 0.02]}
  cr_fl_mid:
    when: "crater > 0.5 and fs > 0.05"
    material: mid
    space: f1
    prims:
      - chain: {pts: [[1.70, 0.05, 0.60], ["1.70 + 0.04*sin(fp + 0.0)", "0.05 + fs*0.26*(1 + 0.2*sin(2*fp + 0.0))", 0.60], ["1.70 + 0.07*sin(fp + 0.9)", "0.05 + fs*0.50*(1 + 0.2*sin(2*fp + 0.0))", 0.60]], r: [0.14, 0.09, 0.02]}
      - chain: {pts: [[-1.55, 0.05, 0.90], ["-1.55 + 0.04*sin(fp + 2.1)", "0.05 + fs*0.30*(1 + 0.2*sin(2*fp + 1.6))", 0.90], ["-1.55 + 0.07*sin(fp + 3.0)", "0.05 + fs*0.58*(1 + 0.2*sin(2*fp + 1.6))", 0.90]], r: [0.15, 0.10, 0.02]}
      - chain: {pts: [[0.40, 0.05, 1.75], ["0.40 + 0.04*sin(fp + 4.2)", "0.05 + fs*0.21*(1 + 0.2*sin(2*fp + 3.1))", 1.75], ["0.40 + 0.07*sin(fp + 5.1)", "0.05 + fs*0.42*(1 + 0.2*sin(2*fp + 3.1))", 1.75]], r: [0.12, 0.08, 0.02]}
      - chain: {pts: [[-0.70, 0.05, -1.60], ["-0.70 + 0.04*sin(fp + 1.0)", "0.05 + fs*0.28*(1 + 0.2*sin(2*fp + 4.7))", -1.60], ["-0.70 + 0.07*sin(fp + 1.9)", "0.05 + fs*0.56*(1 + 0.2*sin(2*fp + 4.7))", -1.60]], r: [0.15, 0.10, 0.02]}
      - chain: {pts: [[1.20, 0.05, -1.25], ["1.20 + 0.04*sin(fp + 3.1)", "0.05 + fs*0.22*(1 + 0.2*sin(2*fp + 2.2))", -1.25], ["1.20 + 0.07*sin(fp + 4.0)", "0.05 + fs*0.44*(1 + 0.2*sin(2*fp + 2.2))", -1.25]], r: [0.12, 0.08, 0.02]}
      - chain: {pts: [[-1.85, 0.05, -0.45], ["-1.85 + 0.04*sin(fp + 5.0)", "0.05 + fs*0.20*(1 + 0.2*sin(2*fp + 5.5))", -0.45], ["-1.85 + 0.07*sin(fp + 5.9)", "0.05 + fs*0.38*(1 + 0.2*sin(2*fp + 5.5))", -0.45]], r: [0.12, 0.08, 0.02]}
      - chain: {pts: [[0.15, 0.10, 0.10], ["0.15 + 0.04*sin(fp + 1.7)", "0.10 + fs*0.32*(1 + 0.2*sin(2*fp + 0.8))", 0.10], ["0.15 + 0.07*sin(fp + 2.6)", "0.10 + fs*0.62*(1 + 0.2*sin(2*fp + 0.8))", 0.10]], r: [0.15, 0.10, 0.02]}
  cr_fl_inner:
    when: "crater > 0.5 and fs > 0.05"
    material: inner
    space: f2
    prims:
      - chain: {pts: [[1.70, 0.05, 0.60], ["1.70 + 0.04*sin(fp + 0.5)", "0.05 + fs*0.26*(1 + 0.2*sin(2*fp + 0.0))", 0.60]], r: [0.08, 0.02]}
      - chain: {pts: [[-1.55, 0.05, 0.90], ["-1.55 + 0.04*sin(fp + 2.6)", "0.05 + fs*0.30*(1 + 0.2*sin(2*fp + 1.6))", 0.90]], r: [0.09, 0.02]}
      - chain: {pts: [[0.40, 0.05, 1.75], ["0.40 + 0.04*sin(fp + 4.7)", "0.05 + fs*0.22*(1 + 0.2*sin(2*fp + 3.1))", 1.75]], r: [0.07, 0.02]}
      - chain: {pts: [[-0.70, 0.05, -1.60], ["-0.70 + 0.04*sin(fp + 1.5)", "0.05 + fs*0.28*(1 + 0.2*sin(2*fp + 4.7))", -1.60]], r: [0.09, 0.02]}
      - chain: {pts: [[0.15, 0.10, 0.10], ["0.15 + 0.04*sin(fp + 2.2)", "0.10 + fs*0.34*(1 + 0.2*sin(2*fp + 0.8))", 0.10]], r: [0.09, 0.02]}
  cr_embers:
    when: "crater > 0.5 and fs > 0.5"
    material: inner
    space: f3
    prims:
      - sphere: {c: ["0.30 + 0.10*sin(fp)", "0.6 + 1.2*(fp/tau + 0.0 - floor(fp/tau + 0.0))", 0.20], r: 0.055}
      - sphere: {c: ["1.60 + 0.10*sin(fp + 2)", "0.4 + 1.0*(fp/tau + 0.4 - floor(fp/tau + 0.4))", 0.60], r: 0.05}
      - sphere: {c: ["-1.45 + 0.10*sin(fp + 4)", "0.5 + 1.0*(fp/tau + 0.7 - floor(fp/tau + 0.7))", 0.80], r: 0.05}

  # ================= impact: dome of fire, shockwave ring, flying chunks, embers =================
  ix_ring_outer:
    when: "imp > 0.5 and rr > 0.05"
    material: outer
    space: body
    prims:
      - torus: {c: [0, 0.02, 0], R: rr, r: "rt*1.6"}
  ix_ring:
    when: "imp > 0.5 and rr > 0.05 and rt > 0.09"
    material: inner
    space: f1
    prims:
      - torus: {c: [0, 0.02, 0], R: "rr - 0.04", r: "rt*0.8"}
  ix_dome_outer:
    when: "imp > 0.5 and dr > 0.05"
    material: outer
    space: body
    blend: 0.15
    prims:
      - ellipsoid: {c: [0, 0, 0], r: "v(dr, 0.85*dr, dr)"}
      - sphere: {c: "v(0.35*dr, 0.55*dr + 1.1*up, 0.10)", r: "0.42*dr"}
      - sphere: {c: "v(-0.40*dr, 0.50*dr + 0.9*up, -0.10)", r: "0.40*dr"}
      - sphere: {c: "v(0.00, 0.75*dr + 1.4*up, -0.20)", r: "0.38*dr"}
      - sphere: {c: "v(0.75*dr + 0.3*up, 0.20*dr, 0.30*dr)", r: "0.36*dr"}
      - sphere: {c: "v(-0.75*dr - 0.3*up, 0.20*dr, 0.20*dr)", r: "0.36*dr"}
    cut:
      - box: {c: [0, -2.0, 0], half: [4, 2.0, 4]}
  ix_dome_mid:
    when: "imp > 0.5 and dr > 0.05"
    material: mid
    space: f1
    blend: 0.12
    prims:
      - ellipsoid: {c: [0, 0, 0], r: "v(0.78*dr, 0.66*dr, 0.78*dr)"}
      - sphere: {c: "v(0.35*dr, 0.55*dr + 1.1*up, 0.10)", r: "0.28*dr"}
      - sphere: {c: "v(0.00, 0.75*dr + 1.4*up, -0.20)", r: "0.26*dr"}
    cut:
      - box: {c: [0, -2.0, 0], half: [4, 2.0, 4]}
  ix_dome_inner:
    when: "imp > 0.5 and dr > 0.05 and up < 0.9"
    material: inner
    space: f2
    prims:
      - ellipsoid: {c: [0, 0, 0], r: "v(0.56*dr*(1 - 0.6*up), 0.48*dr*(1 - 0.6*up), 0.56*dr*(1 - 0.6*up))"}
    cut:
      - box: {c: [0, -2.0, 0], half: [4, 2.0, 4]}
  ix_dome_core:
    when: "imp > 0.5 and dc > 0.05"
    material: core
    space: f3
    prims:
      - ellipsoid: {c: [0, 0, 0], r: "v(dc, 0.8*dc, dc)"}
    cut:
      - box: {c: [0, -2.0, 0], half: [4, 2.0, 4]}
  ix_chunks:
    when: "imp > 0.5 and cd > 0.05"
    material: rock
    space: body
    prims:
      - box: {c: "v(0.94*cd, ch, 0.34*cd)",   half: [0.15, 0.11, 0.13], rot: "[cd*2, cd, 0.5]", round: 0.03}
      - box: {c: "v(0.26*cd, 0.9*ch, 0.97*cd)", half: [0.13, 0.10, 0.12], rot: "[0.3, cd*2.5, cd]", round: 0.03}
      - box: {c: "v(-0.77*cd, 1.1*ch, 0.64*cd)", half: [0.16, 0.12, 0.12], rot: "[cd, 0.4, cd*2]", round: 0.03}
      - box: {c: "v(-0.94*cd, 0.8*ch, -0.34*cd)", half: [0.12, 0.10, 0.11], rot: "[cd*1.5, cd, 0.2]", round: 0.03}
      - box: {c: "v(-0.17*cd, 1.2*ch, -0.98*cd)", half: [0.14, 0.11, 0.12], rot: "[0.6, cd*2, cd]", round: 0.03}
      - box: {c: "v(0.77*cd, ch, -0.64*cd)",   half: [0.13, 0.10, 0.12], rot: "[cd*2.2, 0.3, cd]", round: 0.03}
  ix_embers:
    when: "imp > 0.5 and er > 0.01"
    material: inner
    space: f3
    prims:
      - sphere: {c: "v(1.00*emb, eh, 0.00*emb)", r: er}
      - sphere: {c: "v(0.64*emb, 1.2*eh, 0.77*emb)", r: er}
      - sphere: {c: "v(-0.34*emb, 0.9*eh, 0.94*emb)", r: er}
      - sphere: {c: "v(-0.98*emb, 1.1*eh, 0.17*emb)", r: er}
      - sphere: {c: "v(-0.64*emb, 1.3*eh, -0.77*emb)", r: er}
      - sphere: {c: "v(0.34*emb, 0.8*eh, -0.94*emb)", r: er}
      - sphere: {c: "v(0.20*emb, 1.6*eh, 0.10*emb)", r: er}
      - sphere: {c: "v(-0.25*emb, 1.5*eh, -0.10*emb)", r: er}

animations:
  fall:
    frames: 6
    ms: 70
    channels: {fall: 1}
  impact:
    loop: false
    keys:
      - {ms: 40, event: hit, set: {imp: 1, fs: 0, dr: 1.0, dc: 0.80, rr: 0.9, rt: 0.16, cd: 0.30, ch: 0.40}}
      - {ms: 50, set: {imp: 1, fs: 0, dr: 1.7, dc: 1.10, rr: 1.5, rt: 0.15, cd: 0.80, ch: 0.90, emb: 1.0, eh: 0.8, er: 0.07}}
      - {ms: 60, set: {imp: 1, fs: 0, dr: 2.2, dc: 0.90, up: 0.2, rr: 2.1, rt: 0.14, cd: 1.40, ch: 1.30, emb: 1.6, eh: 1.3, er: 0.07}}
      - {ms: 60, set: {imp: 1, fs: 0, crater: 1, dr: 2.3, dc: 0.40, up: 0.5, rr: 2.6, rt: 0.13, cd: 1.90, ch: 1.40, emb: 2.0, eh: 1.5, er: 0.065}}
      - {ms: 70, set: {imp: 1, fs: 0.3, crater: 1, dr: 1.8, up: 1.0, rr: 2.95, rt: 0.11, cd: 2.30, ch: 1.10, emb: 2.3, eh: 1.6, er: 0.06}}
      - {ms: 70, set: {imp: 1, fs: 0.5, crater: 1, fp: 1.0, dr: 1.2, up: 1.5, rr: 3.05, rt: 0.08, cd: 2.60, ch: 0.60, emb: 2.5, eh: 1.5, er: 0.055}}
      - {ms: 80, set: {imp: 1, fs: 0.8, crater: 1, fp: 2.0, dr: 0.6, up: 2.0, cd: 2.80, ch: 0.15, emb: 2.6, eh: 1.2, er: 0.05}}
      - {ms: 80, set: {imp: 1, fs: 1.0, crater: 1, fp: 3.0, cd: 2.85, ch: 0.08, emb: 2.6, eh: 0.8, er: 0.045}}
      - {ms: 90, set: {imp: 1, fs: 1.0, crater: 1, fp: 0.0, cd: 2.85, ch: 0.08}}
  burn:
    frames: 6
    ms: 90
    channels: {crater: 1, fs: 1, fp: p, imp: 1, cd: 2.85, ch: 0.08}
