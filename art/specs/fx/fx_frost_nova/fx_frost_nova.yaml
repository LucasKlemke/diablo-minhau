# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: fx_frost_nova
kind: prop
view: topdown
size: 160
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}   # frame centre = ground point -> pivot (80, 80)
shadow: null             # a spell effect: light, not shadow

# Mage spell effect: Frost Nova, played once around the caster.
brief:
  summary: an icy burst around the mage - a white-cyan flash, then a ring of jagged ice shards erupts from the ground and races out to ~70 px radius with frost mist, then the shards crack, shrink and sparkle away
  must_keep: [ellipse ring (0.6 as tall as wide, pitch 38), jagged shards, bright flash at the start, cracking end]
  simplify: [shards as tapered cones in two pieces (base + tip that breaks off), mist as flat puffs, no transparency - fading is shrinking]
  exceptions: |
    fx sprite: kind prop, size 160, directions 1, mirror false, shadow null. Flash, ground frost ring, mist and
    sparkles are emissive (farm `frost` ramp, one band per layer, no outline). The ice shards are lit solid ice
    with the frost ramp, outlined in its darkest tone (#174682) so they read over grass. camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (80, 80) = the ground point under the caster. `burst` is one-shot, 9 frames, 600 ms;
    event `hit` on frame 2 (110 ms), when the ring is at ~45 px and the shards are full height.

materials:
  ice:     {ramp: frost, bands: [1, 3], line: false}
  frost:   {ramp: frost, emissive: true, band: 1, outline: false, glow: {color: "#219be7", mix: 0.3, radius: 1}}
  mist:    {ramp: frost, emissive: true, band: 2, outline: false, line: false}
  flash_o: {ramp: frost, emissive: true, band: 2, outline: false, glow: {color: "#7edaf2", mix: 0.5, radius: 1}}
  flash:   {ramp: frost, emissive: true, band: 3, outline: false}
  sparkle: {ramp: frost, emissive: true, band: 3, outline: false}

channels:
  root: [0, 0, 0]
  ring: 3.7        # radius of the shard ring (units; 3.7 = 67 px)
  sh: 1            # outer shard height (0..1)
  sh_in: 1         # inner shard height
  sw: 1            # shard width
  tipr: 1          # size of the shard tips (0 = broken off and gone)
  crack: 0         # tips breaking off and flying outward/up
  flash: 0         # central flash radius
  frost_w: 0.10    # ground frost band thickness
  mist: 0          # mist puff size
  mist_out: 0      # mist drifting out and up
  spark: 0         # sparkle radius
  spark_up: 0      # sparkles rising

parts:
  flash_outer:     # cyan halo of the flash
    material: flash_o
    when: "flash > 0.05"
    prims:
      - ellipsoid: {c: [0, 0.25, 0], r: ["1.35*flash", "0.85*flash", "1.35*flash"]}
      - cone: {a: [0, 0.2, 0], b: ["2.3*flash", 0.1, 0], r: ["0.35*flash", 0.02]}
      - cone: {a: [0, 0.2, 0], b: ["-2.3*flash", 0.1, 0], r: ["0.35*flash", 0.02]}
      - cone: {a: [0, 0.2, 0], b: [0, 0.1, "2.0*flash"], r: ["0.35*flash", 0.02]}
      - cone: {a: [0, 0.2, 0], b: [0, 0.1, "-2.0*flash"], r: ["0.35*flash", 0.02]}
      - cone: {a: [0, 0.3, 0], b: [0, "1.9*flash", 0], r: ["0.35*flash", 0.02]}
  flash_core:      # white-hot centre, in front of the halo so it shows through
    material: flash
    when: "flash > 0.05"
    prims:
      - ellipsoid: {c: [0, 0.35, "0.75*flash"], r: ["0.75*flash", "0.5*flash", "0.6*flash"]}
      - cone: {a: [0, 0.35, "0.75*flash"], b: ["1.5*flash", 0.25, "0.9*flash"], r: ["0.2*flash", 0.02]}
      - cone: {a: [0, 0.35, "0.75*flash"], b: ["-1.5*flash", 0.25, "0.9*flash"], r: ["0.2*flash", 0.02]}
      - cone: {a: [0, 0.35, "0.75*flash"], b: [0, "1.35*flash", "0.9*flash"], r: ["0.2*flash", 0.02]}
  ground_ring:     # frost band on the ground under the shards
    material: frost
    when: "frost_w > 0.02"
    prims:
      - torus: {c: [0, 0, 0], R: "0.97*ring", r: "frost_w"}
  shards_low:
    material: ice
    when: "sh > 0.02"
    prims:
      - cone: {a: ["(ring + 0 + 0.0*crack)*-0.042 + 0.000", "-0.10", "(ring + 0 + 0.0*crack)*0.999 - -0.000"], b: ["(ring + 0.119*sh + 0.0*crack)*-0.042 + -0.068", "0.495*sh", "(ring + 0.119*sh + 0.0*crack)*0.999 - 0.003"], r: ["0.230*sw", "0.143*sw"]}
