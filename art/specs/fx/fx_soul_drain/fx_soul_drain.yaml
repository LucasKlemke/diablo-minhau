animations:
  curse:
    loop: false
    keys:
      - {ms: 50, event: start, set: {flash: 0.55, rad: 1.3, cw: 0.7}}                                   # fel flash, circle spawns
      - {ms: 60, set: {flash: 0.35, rad: 2.35, cw: 1.0, draw: 0.3}}                                      # circle races out
      - {ms: 70, event: hit, set: {flash: 0.15, rad: 2.75, draw: 0.65, up: 0.1, sr: 0.12}}               # full size: damage
      - {ms: 70, set: {rad: 2.75, draw: 1.0, up: 0.4, sr: 0.18}}                                         # sigil complete
      - {ms: 70, set: {rad: 2.75, draw: 1.0, rg: 1.55, up: 0.7, sr: 0.20}}                               # runes flare
      - {ms: 80, set: {rad: 2.75, draw: 1.0, up: 1.0, sr: 0.20}}
      - {ms: 80, event: souls, set: {rad: 2.75, draw: 1.0, rg: 1.45, up: 1.25, sr: 0.19}}               # souls highest
      - {ms: 80, set: {rad: 2.1, cw: 0.9, draw: 1.0, up: 1.35, sr: 0.14, suck: 0.4, vr: 0.12}}          # collapse
      - {ms: 70, set: {rad: 1.2, cw: 0.8, draw: 1.0, rg: 1.0, up: 1.0, sr: 0.08, suck: 0.8, vr: 0.2}}
      - {ms: 70, set: {rad: 0.45, cw: 0.6, draw: 1.0, rg: 0.65, vr: 0.11}}                               # void point
  wisp:
    frames: 6
    ms: 70
    channels: {wisp: 1}
