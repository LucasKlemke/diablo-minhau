# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: fx_soul_drain
kind: prop
view: topdown
size: 128
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}   # frame centre = ground point -> pivot (64, 64)
shadow: null             # a spell effect: light, not shadow

# Sorcerer spell effect: Soul Drain, a curse circle cast at the cursor.
brief:
  summary: a curse sigil burns onto the ground (radius ~50 px) - a fel flash at the centre, a double violet
    circle with a violet pentagram drawn in stroke by stroke and eight fel-green runes igniting around the
    rim; pale-green souls with purple tails rise out of the circle, then the whole sigil collapses into a
    black void point. `wisp` is the small soul orb the game tweens from each enemy to the sorcerer
  must_keep: [ground ellipse ~0.62 as tall as wide (pitch 38), purple circle + green runes, rising souls,
    collapse at the end, "Sorcerer palette: fel 5dff3d, void purple 7a0ff8 and 310e8b"]
  simplify: [runes as 2-3 capsule strokes each, souls as an orb with a tapering tail, no transparency -
    fading is shrinking]
  exceptions: |
    fx sprite: kind prop, size 128, directions 1, mirror false, shadow null. Every material is emissive with
    no outline (farm `arcane` and `fel` ramps, one band per layer; the dark-violet band-0 ring is the edge
    against the grass). Spec-local ramp `voidc` for the void point. camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (64, 64) = the ground point at the centre of the curse circle (the cursor).
    Full circle radius 2.75 units = 50 px (100 x 62 px on screen).
    `curse`: one-shot, 10 frames, 700 ms; event `hit` on frame 2 (110 ms, circle at full size: apply damage),
    event `souls` on frame 6 (400 ms, souls at their highest: spawn the `wisp` sprites and start the heal tween).
    `wisp`: loop, 6 frames x 70 ms; the orb centre sits ON the pivot (64, 64), ~16 px tall with its tail
    hanging below, direction-agnostic so the game can tween it any way.

ramps:
  voidc: ["#0b0612", "#1c0f1a", "#2a0f45"]

materials:
  ring_dk: {ramp: arcane, emissive: true, band: 0, outline: false}
  ring:    {ramp: arcane, emissive: true, band: 1, outline: false, glow: {color: "#7a0ff8", mix: 0.3, radius: 1}}
  ring_hi: {ramp: arcane, emissive: true, band: 2, outline: false}
  rune:    {ramp: fel, emissive: true, band: 1, outline: false, glow: {color: "#5dff3d", mix: 0.35, radius: 1}}
  fel_hi:  {ramp: fel, emissive: true, band: 2, outline: false}
  soul:    {ramp: fel, emissive: true, band: 3, outline: false, glow: {color: "#5dff3d", mix: 0.4, radius: 1}}
  core:    {ramp: voidc, emissive: true, band: 0, outline: false}

channels:
  root: [0, 0, 0]
  rad: 0.0        # curse circle radius (2.75 = 50 px)
  cw: 1.0         # circle line thickness factor
  draw: 0.0       # pentagram strokes and runes drawn in (0..1)
  rg: 1.3         # rune size factor (pulse)
  up: 0.0         # souls rising height
  sr: 0.0         # soul orb radius
  suck: 0.0       # souls drawn toward the centre during the collapse
  flash: 0.0      # central fel flash radius
  vr: 0.0         # central void radius
  wisp: 0         # 1 = the `wisp` orb (loop) instead of the curse

bones:
  body: {parent: root}
  c1: {parent: body, pos: "0.30*v(-sin(radians(yaw))*0.788, 0.616, cos(radians(yaw))*0.788)"}
  c2: {parent: body, pos: "0.60*v(-sin(radians(yaw))*0.788, 0.616, cos(radians(yaw))*0.788)"}

parts:
  # ---------------- curse: the sigil on the ground ----------------
  circle_dk:       # dark violet under-band: the edge against grass
    material: ring_dk
    when: "rad > 0.05"
    prims:
      - torus: {c: [0, -0.03, 0], R: rad, r: "0.11*cw"}
      - torus: {c: [0, -0.03, 0], R: "0.78*rad", r: "0.08*cw"}
  circle:
    material: ring
    when: "rad > 0.05"
    prims:
      - torus: {c: [0, 0.03, 0], R: rad, r: "0.065*cw"}
      - torus: {c: [0, 0.03, 0], R: "0.78*rad", r: "0.045*cw"}
  star:            # pentagram drawn stroke by stroke
    material: ring
    when: "rad > 0.05 and draw > 0.01"
    prims:
      - cone: {a: ["0.72*rad*0.000", 0.03, "0.72*rad*-1.000"], b: ["0.72*rad*(0.000 + (0.588)*clamp(draw*5 - 0, 0, 1))", 0.03, "0.72*rad*(-1.000 + (1.809)*clamp(draw*5 - 0, 0, 1))"], r: ["0.05*clamp((draw*5 - 0)*20, 0, 1)", "0.05*clamp((draw*5 - 0)*20, 0, 1)"]}
      - cone: {a: ["0.72*rad*0.588", 0.03, "0.72*rad*0.809"], b: ["0.72*rad*(0.588 + (-1.539)*clamp(draw*5 - 1, 0, 1))", 0.03, "0.72*rad*(0.809 + (-1.118)*clamp(draw*5 - 1, 0, 1))"], r: ["0.05*clamp((draw*5 - 1)*20, 0, 1)", "0.05*clamp((draw*5 - 1)*20, 0, 1)"]}
      - cone: {a: ["0.72*rad*-0.951", 0.03, "0.72*rad*-0.309"], b: ["0.72*rad*(-0.951 + (1.902)*clamp(draw*5 - 2, 0, 1))", 0.03, "0.72*rad*(-0.309 + (-0.000)*clamp(draw*5 - 2, 0, 1))"], r: ["0.05*clamp((draw*5 - 2)*20, 0, 1)", "0.05*clamp((draw*5 - 2)*20, 0, 1)"]}
      - cone: {a: ["0.72*rad*0.951", 0.03, "0.72*rad*-0.309"], b: ["0.72*rad*(0.951 + (-1.539)*clamp(draw*5 - 3, 0, 1))", 0.03, "0.72*rad*(-0.309 + (1.118)*clamp(draw*5 - 3, 0, 1))"], r: ["0.05*clamp((draw*5 - 3)*20, 0, 1)", "0.05*clamp((draw*5 - 3)*20, 0, 1)"]}
      - cone: {a: ["0.72*rad*-0.588", 0.03, "0.72*rad*0.809"], b: ["0.72*rad*(-0.588 + (0.588)*clamp(draw*5 - 4, 0, 1))", 0.03, "0.72*rad*(0.809 + (-1.809)*clamp(draw*5 - 4, 0, 1))"], r: ["0.05*clamp((draw*5 - 4)*20, 0, 1)", "0.05*clamp((draw*5 - 4)*20, 0, 1)"]}
  runes:           # eight fel runes ignite one after another around the rim
    material: rune
    when: "rad > 0.05 and draw > 0.01"
    prims:
      - cone: {a: ["(0.89*rad + 0.000*rg*clamp(draw*8 - 0, 0, 1))*0.924 - -0.130*rg*clamp(draw*8 - 0, 0, 1)*0.383", 0.04, "(0.89*rad + 0.000*rg*clamp(draw*8 - 0, 0, 1))*0.383 + -0.130*rg*clamp(draw*8 - 0, 0, 1)*0.924"], b: ["(0.89*rad + 0.000*rg*clamp(draw*8 - 0, 0, 1))*0.924 - 0.130*rg*clamp(draw*8 - 0, 0, 1)*0.383", 0.04, "(0.89*rad + 0.000*rg*clamp(draw*8 - 0, 0, 1))*0.383 + 0.130*rg*clamp(draw*8 - 0, 0, 1)*0.924"], r: ["0.055*clamp(draw*8 - 0, 0, 1)", "0.055*clamp(draw*8 - 0, 0, 1)"]}
      - cone: {a: ["(0.89*rad + -0.130*rg*clamp(draw*8 - 0, 0, 1))*0.924 - 0.000*rg*clamp(draw*8 - 0, 0, 1)*0.383", 0.04, "(0.89*rad + -0.130*rg*clamp(draw*8 - 0, 0, 1))*0.383 + 0.000*rg*clamp(draw*8 - 0, 0, 1)*0.924"], b: ["(0.89*rad + 0.130*rg*clamp(draw*8 - 0, 0, 1))*0.924 - 0.000*rg*clamp(draw*8 - 0, 0, 1)*0.383", 0.04, "(0.89*rad + 0.130*rg*clamp(draw*8 - 0, 0, 1))*0.383 + 0.000*rg*clamp(draw*8 - 0, 0, 1)*0.924"], r: ["0.055*clamp(draw*8 - 0, 0, 1)", "0.055*clamp(draw*8 - 0, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.120*rg*clamp(draw*8 - 1, 0, 1))*0.383 - -0.110*rg*clamp(draw*8 - 1, 0, 1)*0.924", 0.04, "(0.89*rad + 0.120*rg*clamp(draw*8 - 1, 0, 1))*0.924 + -0.110*rg*clamp(draw*8 - 1, 0, 1)*0.383"], b: ["(0.89*rad + -0.120*rg*clamp(draw*8 - 1, 0, 1))*0.383 - 0.000*rg*clamp(draw*8 - 1, 0, 1)*0.924", 0.04, "(0.89*rad + -0.120*rg*clamp(draw*8 - 1, 0, 1))*0.924 + 0.000*rg*clamp(draw*8 - 1, 0, 1)*0.383"], r: ["0.055*clamp(draw*8 - 1, 0, 1)", "0.055*clamp(draw*8 - 1, 0, 1)"]}
      - cone: {a: ["(0.89*rad + -0.120*rg*clamp(draw*8 - 1, 0, 1))*0.383 - 0.000*rg*clamp(draw*8 - 1, 0, 1)*0.924", 0.04, "(0.89*rad + -0.120*rg*clamp(draw*8 - 1, 0, 1))*0.924 + 0.000*rg*clamp(draw*8 - 1, 0, 1)*0.383"], b: ["(0.89*rad + 0.120*rg*clamp(draw*8 - 1, 0, 1))*0.383 - 0.110*rg*clamp(draw*8 - 1, 0, 1)*0.924", 0.04, "(0.89*rad + 0.120*rg*clamp(draw*8 - 1, 0, 1))*0.924 + 0.110*rg*clamp(draw*8 - 1, 0, 1)*0.383"], r: ["0.055*clamp(draw*8 - 1, 0, 1)", "0.055*clamp(draw*8 - 1, 0, 1)"]}
      - cone: {a: ["(0.89*rad + -0.130*rg*clamp(draw*8 - 2, 0, 1))*-0.383 - 0.000*rg*clamp(draw*8 - 2, 0, 1)*0.924", 0.04, "(0.89*rad + -0.130*rg*clamp(draw*8 - 2, 0, 1))*0.924 + 0.000*rg*clamp(draw*8 - 2, 0, 1)*-0.383"], b: ["(0.89*rad + 0.130*rg*clamp(draw*8 - 2, 0, 1))*-0.383 - 0.000*rg*clamp(draw*8 - 2, 0, 1)*0.924", 0.04, "(0.89*rad + 0.130*rg*clamp(draw*8 - 2, 0, 1))*0.924 + 0.000*rg*clamp(draw*8 - 2, 0, 1)*-0.383"], r: ["0.055*clamp(draw*8 - 2, 0, 1)", "0.055*clamp(draw*8 - 2, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.040*rg*clamp(draw*8 - 2, 0, 1))*-0.383 - 0.000*rg*clamp(draw*8 - 2, 0, 1)*0.924", 0.04, "(0.89*rad + 0.040*rg*clamp(draw*8 - 2, 0, 1))*0.924 + 0.000*rg*clamp(draw*8 - 2, 0, 1)*-0.383"], b: ["(0.89*rad + 0.130*rg*clamp(draw*8 - 2, 0, 1))*-0.383 - 0.110*rg*clamp(draw*8 - 2, 0, 1)*0.924", 0.04, "(0.89*rad + 0.130*rg*clamp(draw*8 - 2, 0, 1))*0.924 + 0.110*rg*clamp(draw*8 - 2, 0, 1)*-0.383"], r: ["0.055*clamp(draw*8 - 2, 0, 1)", "0.055*clamp(draw*8 - 2, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.040*rg*clamp(draw*8 - 2, 0, 1))*-0.383 - 0.000*rg*clamp(draw*8 - 2, 0, 1)*0.924", 0.04, "(0.89*rad + 0.040*rg*clamp(draw*8 - 2, 0, 1))*0.924 + 0.000*rg*clamp(draw*8 - 2, 0, 1)*-0.383"], b: ["(0.89*rad + 0.130*rg*clamp(draw*8 - 2, 0, 1))*-0.383 - -0.110*rg*clamp(draw*8 - 2, 0, 1)*0.924", 0.04, "(0.89*rad + 0.130*rg*clamp(draw*8 - 2, 0, 1))*0.924 + -0.110*rg*clamp(draw*8 - 2, 0, 1)*-0.383"], r: ["0.055*clamp(draw*8 - 2, 0, 1)", "0.055*clamp(draw*8 - 2, 0, 1)"]}
      - cone: {a: ["(0.89*rad + -0.110*rg*clamp(draw*8 - 3, 0, 1))*-0.924 - -0.110*rg*clamp(draw*8 - 3, 0, 1)*0.383", 0.04, "(0.89*rad + -0.110*rg*clamp(draw*8 - 3, 0, 1))*0.383 + -0.110*rg*clamp(draw*8 - 3, 0, 1)*-0.924"], b: ["(0.89*rad + 0.110*rg*clamp(draw*8 - 3, 0, 1))*-0.924 - 0.110*rg*clamp(draw*8 - 3, 0, 1)*0.383", 0.04, "(0.89*rad + 0.110*rg*clamp(draw*8 - 3, 0, 1))*0.383 + 0.110*rg*clamp(draw*8 - 3, 0, 1)*-0.924"], r: ["0.055*clamp(draw*8 - 3, 0, 1)", "0.055*clamp(draw*8 - 3, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.110*rg*clamp(draw*8 - 3, 0, 1))*-0.924 - -0.110*rg*clamp(draw*8 - 3, 0, 1)*0.383", 0.04, "(0.89*rad + 0.110*rg*clamp(draw*8 - 3, 0, 1))*0.383 + -0.110*rg*clamp(draw*8 - 3, 0, 1)*-0.924"], b: ["(0.89*rad + -0.110*rg*clamp(draw*8 - 3, 0, 1))*-0.924 - 0.110*rg*clamp(draw*8 - 3, 0, 1)*0.383", 0.04, "(0.89*rad + -0.110*rg*clamp(draw*8 - 3, 0, 1))*0.383 + 0.110*rg*clamp(draw*8 - 3, 0, 1)*-0.924"], r: ["0.055*clamp(draw*8 - 3, 0, 1)", "0.055*clamp(draw*8 - 3, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.000*rg*clamp(draw*8 - 4, 0, 1))*-0.924 - -0.130*rg*clamp(draw*8 - 4, 0, 1)*-0.383", 0.04, "(0.89*rad + 0.000*rg*clamp(draw*8 - 4, 0, 1))*-0.383 + -0.130*rg*clamp(draw*8 - 4, 0, 1)*-0.924"], b: ["(0.89*rad + 0.000*rg*clamp(draw*8 - 4, 0, 1))*-0.924 - 0.130*rg*clamp(draw*8 - 4, 0, 1)*-0.383", 0.04, "(0.89*rad + 0.000*rg*clamp(draw*8 - 4, 0, 1))*-0.383 + 0.130*rg*clamp(draw*8 - 4, 0, 1)*-0.924"], r: ["0.055*clamp(draw*8 - 4, 0, 1)", "0.055*clamp(draw*8 - 4, 0, 1)"]}
      - cone: {a: ["(0.89*rad + -0.130*rg*clamp(draw*8 - 4, 0, 1))*-0.924 - 0.000*rg*clamp(draw*8 - 4, 0, 1)*-0.383", 0.04, "(0.89*rad + -0.130*rg*clamp(draw*8 - 4, 0, 1))*-0.383 + 0.000*rg*clamp(draw*8 - 4, 0, 1)*-0.924"], b: ["(0.89*rad + 0.130*rg*clamp(draw*8 - 4, 0, 1))*-0.924 - 0.000*rg*clamp(draw*8 - 4, 0, 1)*-0.383", 0.04, "(0.89*rad + 0.130*rg*clamp(draw*8 - 4, 0, 1))*-0.383 + 0.000*rg*clamp(draw*8 - 4, 0, 1)*-0.924"], r: ["0.055*clamp(draw*8 - 4, 0, 1)", "0.055*clamp(draw*8 - 4, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.120*rg*clamp(draw*8 - 5, 0, 1))*-0.383 - -0.110*rg*clamp(draw*8 - 5, 0, 1)*-0.924", 0.04, "(0.89*rad + 0.120*rg*clamp(draw*8 - 5, 0, 1))*-0.924 + -0.110*rg*clamp(draw*8 - 5, 0, 1)*-0.383"], b: ["(0.89*rad + -0.120*rg*clamp(draw*8 - 5, 0, 1))*-0.383 - 0.000*rg*clamp(draw*8 - 5, 0, 1)*-0.924", 0.04, "(0.89*rad + -0.120*rg*clamp(draw*8 - 5, 0, 1))*-0.924 + 0.000*rg*clamp(draw*8 - 5, 0, 1)*-0.383"], r: ["0.055*clamp(draw*8 - 5, 0, 1)", "0.055*clamp(draw*8 - 5, 0, 1)"]}
      - cone: {a: ["(0.89*rad + -0.120*rg*clamp(draw*8 - 5, 0, 1))*-0.383 - 0.000*rg*clamp(draw*8 - 5, 0, 1)*-0.924", 0.04, "(0.89*rad + -0.120*rg*clamp(draw*8 - 5, 0, 1))*-0.924 + 0.000*rg*clamp(draw*8 - 5, 0, 1)*-0.383"], b: ["(0.89*rad + 0.120*rg*clamp(draw*8 - 5, 0, 1))*-0.383 - 0.110*rg*clamp(draw*8 - 5, 0, 1)*-0.924", 0.04, "(0.89*rad + 0.120*rg*clamp(draw*8 - 5, 0, 1))*-0.924 + 0.110*rg*clamp(draw*8 - 5, 0, 1)*-0.383"], r: ["0.055*clamp(draw*8 - 5, 0, 1)", "0.055*clamp(draw*8 - 5, 0, 1)"]}
      - cone: {a: ["(0.89*rad + -0.130*rg*clamp(draw*8 - 6, 0, 1))*0.383 - 0.000*rg*clamp(draw*8 - 6, 0, 1)*-0.924", 0.04, "(0.89*rad + -0.130*rg*clamp(draw*8 - 6, 0, 1))*-0.924 + 0.000*rg*clamp(draw*8 - 6, 0, 1)*0.383"], b: ["(0.89*rad + 0.130*rg*clamp(draw*8 - 6, 0, 1))*0.383 - 0.000*rg*clamp(draw*8 - 6, 0, 1)*-0.924", 0.04, "(0.89*rad + 0.130*rg*clamp(draw*8 - 6, 0, 1))*-0.924 + 0.000*rg*clamp(draw*8 - 6, 0, 1)*0.383"], r: ["0.055*clamp(draw*8 - 6, 0, 1)", "0.055*clamp(draw*8 - 6, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.040*rg*clamp(draw*8 - 6, 0, 1))*0.383 - 0.000*rg*clamp(draw*8 - 6, 0, 1)*-0.924", 0.04, "(0.89*rad + 0.040*rg*clamp(draw*8 - 6, 0, 1))*-0.924 + 0.000*rg*clamp(draw*8 - 6, 0, 1)*0.383"], b: ["(0.89*rad + 0.130*rg*clamp(draw*8 - 6, 0, 1))*0.383 - 0.110*rg*clamp(draw*8 - 6, 0, 1)*-0.924", 0.04, "(0.89*rad + 0.130*rg*clamp(draw*8 - 6, 0, 1))*-0.924 + 0.110*rg*clamp(draw*8 - 6, 0, 1)*0.383"], r: ["0.055*clamp(draw*8 - 6, 0, 1)", "0.055*clamp(draw*8 - 6, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.040*rg*clamp(draw*8 - 6, 0, 1))*0.383 - 0.000*rg*clamp(draw*8 - 6, 0, 1)*-0.924", 0.04, "(0.89*rad + 0.040*rg*clamp(draw*8 - 6, 0, 1))*-0.924 + 0.000*rg*clamp(draw*8 - 6, 0, 1)*0.383"], b: ["(0.89*rad + 0.130*rg*clamp(draw*8 - 6, 0, 1))*0.383 - -0.110*rg*clamp(draw*8 - 6, 0, 1)*-0.924", 0.04, "(0.89*rad + 0.130*rg*clamp(draw*8 - 6, 0, 1))*-0.924 + -0.110*rg*clamp(draw*8 - 6, 0, 1)*0.383"], r: ["0.055*clamp(draw*8 - 6, 0, 1)", "0.055*clamp(draw*8 - 6, 0, 1)"]}
      - cone: {a: ["(0.89*rad + -0.110*rg*clamp(draw*8 - 7, 0, 1))*0.924 - -0.110*rg*clamp(draw*8 - 7, 0, 1)*-0.383", 0.04, "(0.89*rad + -0.110*rg*clamp(draw*8 - 7, 0, 1))*-0.383 + -0.110*rg*clamp(draw*8 - 7, 0, 1)*0.924"], b: ["(0.89*rad + 0.110*rg*clamp(draw*8 - 7, 0, 1))*0.924 - 0.110*rg*clamp(draw*8 - 7, 0, 1)*-0.383", 0.04, "(0.89*rad + 0.110*rg*clamp(draw*8 - 7, 0, 1))*-0.383 + 0.110*rg*clamp(draw*8 - 7, 0, 1)*0.924"], r: ["0.055*clamp(draw*8 - 7, 0, 1)", "0.055*clamp(draw*8 - 7, 0, 1)"]}
      - cone: {a: ["(0.89*rad + 0.110*rg*clamp(draw*8 - 7, 0, 1))*0.924 - -0.110*rg*clamp(draw*8 - 7, 0, 1)*-0.383", 0.04, "(0.89*rad + 0.110*rg*clamp(draw*8 - 7, 0, 1))*-0.383 + -0.110*rg*clamp(draw*8 - 7, 0, 1)*0.924"], b: ["(0.89*rad + -0.110*rg*clamp(draw*8 - 7, 0, 1))*0.924 - 0.110*rg*clamp(draw*8 - 7, 0, 1)*-0.383", 0.04, "(0.89*rad + -0.110*rg*clamp(draw*8 - 7, 0, 1))*-0.383 + 0.110*rg*clamp(draw*8 - 7, 0, 1)*0.924"], r: ["0.055*clamp(draw*8 - 7, 0, 1)", "0.055*clamp(draw*8 - 7, 0, 1)"]}
  flash:
    material: fel_hi
    when: "flash > 0.02"
    prims:
      - ellipsoid: {c: [0, "0.25*flash", 0], r: ["flash", "0.7*flash", "flash"]}
  flash_core:
    material: soul
    when: "flash > 0.15"
    space: c1
    prims:
      - sphere: {c: [0, "0.25*flash", 0], r: "0.5*flash"}
  void_pt:
    material: core
    when: "vr > 0.02"
    space: c1
    prims:
      - ellipsoid: {c: [0, "0.3*vr", 0], r: ["vr", "0.8*vr", "vr"]}
  void_rim:
    material: ring_hi
    when: "vr > 0.02"
    prims:
      - ellipsoid: {c: [0, "0.3*vr", 0], r: ["1.35*vr", "1.05*vr", "1.35*vr"]}

  # ---------------- souls rising out of the circle ----------------
  soul_ptail:
    material: ring
    when: "sr > 0.01"
    blend: 0.03
    prims:
      - chain: {pts: [["-1.25*(1 - 0.35*suck) + 0.06*sin(1.3*f + 0.0) + 0.05*sin(1.3*f + 0.0 + 1)", "(0.25 + 1.0*up) - 1.6*sr", "-0.9*(1 - 0.35*suck)"], ["-1.25*(1 - 0.35*suck) + 0.06*sin(1.3*f + 0.0) - 0.06*sin(1.3*f + 0.0 + 2.5)", "(0.25 + 1.0*up) - 5.2*sr", "-0.9*(1 - 0.35*suck) - 0.05"]], r: ["sr*0.75", 0.03]}
      - chain: {pts: [["1.35*(1 - 0.35*suck) + 0.06*sin(1.3*f + 1.3) + 0.05*sin(1.3*f + 1.3 + 1)", "(0.25 + 0.85*up) - 1.6*sr", "-0.6*(1 - 0.35*suck)"], ["1.35*(1 - 0.35*suck) + 0.06*sin(1.3*f + 1.3) - 0.06*sin(1.3*f + 1.3 + 2.5)", "(0.25 + 0.85*up) - 5.2*sr", "-0.6*(1 - 0.35*suck) - 0.05"]], r: ["sr*0.75", 0.03]}
