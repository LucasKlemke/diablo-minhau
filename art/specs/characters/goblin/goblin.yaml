spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: goblin
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.95, 0]}
shadow: {rx: 8, ry: 3, alpha: 120}

# Goblin: basic enemy, about 0.7x a human (~1.3 units tall), same camera.scale as every asset.
brief:
  summary: small hunched green goblin, chibi big head, huge pointy ears, glowing yellow eyes,
    ragged brown loincloth, crude wooden club in the right hand
  must_keep: [huge pointy ears, hunch, club, yellow emissive eyes]
  simplify: [no fingers, bare feet as simple blobs, no teeth]
  decisions: limbs in goblin_dark so the body reads over green grass; arms long, legs short and bent

# spec-local skin: the shared `goblin` ramp, shifted olive and darker so it reads over the grass (#79bf56)
ramps:
  goblin_skin: ["#1c0f1a", "#304a1c", "#5b7d27", "#93ad38", "#c6d46a"]

materials:
  skin:  {ramp: goblin_skin, bands: [1, 3]}
  limb:  {ramp: goblin_dark, bands: [1, 2]}
  ear_in: {ramp: goblin_dark, bands: [1, 2], outline: false}
  rag:   {ramp: rag, bands: [1, 3]}
  wood:  {ramp: wood, bands: [1, 3]}
  eye:   {ramp: eye, emissive: true, band: 1, outline: false, glow: {color: "#ffe14d", mix: 0.4, radius: 1}}
  mouth: {ramp: mouth, emissive: true, band: 1, outline: false}
  fx_tail: {ramp: fx_tail, emissive: true}
  fx_mid:  {ramp: fx_mid, emissive: true}
  fx_core: {ramp: fx_core, emissive: true}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.35        # the hunch
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  ear_L: 0          # ear perk (+ up, - droop)
  hand_L: [0.20, 0.02, 0.10]
  foot_L: [0.10, 0, 0.03]
  pitch_foot_L: 0
  coat: 0           # loincloth sway (-1..1)
  club_rot: 0       # club pitch in the hand (radians)
  smear_w: 0
  smear_a0: 0
  smear_a1: 0
  smear_r: 0.55
  smear_y: 0.6
  smear_z: 0.15
  smear_fade: 1

bones:
  torso_rot: {parent: root, pos: "[0, 0.40 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.33, 0.07], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.8 - 0.30, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.8}
  ear_L:     {parent: head, pos: [0.105, 0.13, -0.01], rot: "[0, 0.25, ear_L]"}
  shoulder_L: {parent: pelvis, pos: [0.15, 0.26, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.08, -0.01, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.25, 0]"}
  coatbase:   {parent: pelvis, rot: "[-coat*0.3, 0, 0]"}
  club:       {parent: wrist_R, rot: "[club_rot, 0, 0]"}
  fxspace:    {parent: root, rot: "[0, twist*0.3, 0]"}

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.18, 0.17],
          pole: [0.3, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.05, -0.01]", lengths: [0.19, 0.18],
          pole: [0.2, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:           # small pot-bellied body
    material: skin
    space: pelvis
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.06, 0.01], r: [0.14, 0.11, 0.12]}
      - ellipsoid: {c: [0, 0.20, 0.0], r: [0.15, 0.11, 0.11]}
  loincloth:       # ragged wrap with front and back flaps
    material: rag
    space: coatbase
    blend: 0.02
    prims:
      - cylinder: {a: [0, -0.01, 0], b: [0, 0.07, 0], r: 0.15, round: 0.02}
      - box: {c: [0.0, -0.08, 0.11], half: [0.08, 0.09, 0.02], rot: [0.15, 0, 0.08], round: 0.01}
      - box: {c: [0.0, -0.08, -0.11], half: [0.09, 0.09, 0.02], rot: [-0.15, 0, -0.06], round: 0.01}
    cut:
      - box: {c: [0.03, -0.17, 0.11], half: [0.025, 0.03, 0.05], rot: [0, 0, 0.6]}    # ragged notch
      - box: {c: [-0.04, -0.17, -0.11], half: [0.025, 0.03, 0.05], rot: [0, 0, -0.6]}
  head:
    material: skin
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.12, 0.0], r: [0.12, 0.11, 0.115]}
      - ellipsoid: {c: [0, 0.05, 0.04], r: [0.095, 0.065, 0.09]}       # jaw
      - cone: {a: [0, 0.09, 0.10], b: [0, 0.055, 0.19], r: [0.03, 0.012]}   # long pointy nose
  brow:
    material: limb
    space: head
    prims:
      - ellipsoid: {c: [0, 0.155, 0.085], r: [0.10, 0.025, 0.04], rot: [0.2, 0, 0]}
  ear_L:           # huge pointy ear
    material: skin
    space: ear_L
    blend: 0.02
    prims:
      - cone: {a: [0, 0, 0], b: [0.21, 0.08, -0.05], r: [0.055, 0.008]}
  ear_in_L:
    material: ear_in
    space: ear_L
    prims:
      - cone: {a: [0.03, -0.005, 0.03], b: [0.16, 0.06, -0.01], r: [0.03, 0.006]}
  eye_L:
    material: eye
    space: head
    prims:
      - sphere: {c: [0.05, 0.115, 0.095], r: 0.032}
  mouth:
    material: mouth
    space: head
    prims:
      - ellipsoid: {c: [0, 0.035, 0.115], r: [0.05, 0.012, 0.02]}
  arm_L:
    material: limb
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.06}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.05, 0.04]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.04, 0.045]}
  hand_L:
    material: limb
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.03], r: 0.05}
  leg_L:
    material: limb
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.065, 0.05]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.05, 0.04]}
  foot_L:          # big bare foot
    material: limb
    space: sole_L
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, -0.02, 0.05], r: [0.055, 0.035, 0.10]}
  club:            # right hand only (no _L => not mirrored)
    material: wood
    space: club
    blend: 0.03
    prims:
      - cone: {a: [0, -0.03, 0.03], b: [-0.03, 0.36, -0.27], r: [0.028, 0.07]}
      - sphere: {c: [-0.03, 0.37, -0.28], r: 0.078}
      - sphere: {c: [0.03, 0.28, -0.19], r: 0.035}   # knot
  smear:
    when: "smear_w > 0"
    materials: [fx_tail, fx_mid, fx_core]
    space: fxspace
    prims:
      - arc: {c: "[0, smear_y, smear_z]", r: smear_r, a0: smear_a0, a1: smear_a1, width: smear_w, fade: smear_fade, dip: 0.10}

sockets:
  hand_R: {bone: wrist_R}
  hit: {bone: club, offset: [-0.03, 0.37, -0.28]}
  head: {bone: head, offset: [0, 0.25, 0]}

animations:
  idle:            # twitchy: ears flick, head jerks
    frames: 4
    ms: 160
    channels:
      bob: "0.02*sin(p)"
      squash: "1 + 0.02*sin(p)"
      ear_L: "0.25*(f == 1) - 0.1*(f == 3)"
      head_yaw: "0.30*(f == 2) - 0.15*(f == 3)"
      hand_L: "[0.20, 0.02 + 0.02*sin(p), 0.10]"
      hand_R: "[0.25, 0.08 + 0.02*sin(p), 0.20]"
      coat: "0.2*sin(p - 1.0)"
  walk:            # scurry
    frames: 6
    ms: 85
    events: {0: step_l, 3: step_r}
    channels:
      lean: 0.48
      bob: "-0.03*cos(2*p) + 0.01"
      twist: "0.12*cos(p)"
      foot_L: "[0.10, 0.07*pos(-sin(p)), 0.03 + 0.13*cos(p)]"
      foot_R: "[0.10, 0.07*pos(sin(p)), 0.03 - 0.13*cos(p)]"
      pitch_foot_L: "0.4*pos(-sin(p))"
      pitch_foot_R: "0.4*pos(sin(p))"
      hand_L: "[0.20, 0.04 + 0.03*pos(cos(p)), 0.10 - 0.12*cos(p)]"
      hand_R: "[0.20, 0.08 + 0.03*pos(-cos(p)), 0.14 + 0.10*cos(p)]"
      head_yaw: "-0.08*cos(p)"
      ear_L: "-0.15 + 0.12*sin(2*p)"
      coat: "0.6*sin(2*p)"
  attack:          # quick side swing of the club, right to left
    loop: false
    keys:
      - ms: 130
        event: windup
        set: {twist: -0.45, lean: 0.20, bob: -0.03, squash: 0.92, club_rot: 1.1, hand_R: [0.30, 0.40, -0.08], hand_L: [0.16, 0.10, 0.20],
              foot_L: [0.10, 0, 0.08], foot_R: [0.10, 0, -0.04], coat: -0.4, head_pitch: -0.10, ear_L: 0.25}
      - ms: 50
        set: {root: [0, 0, 0.08], twist: 0.15, lean: 0.45, squash: 1.06, club_rot: 0.6, hand_R: [0.14, 0.24, 0.32], hand_L: [0.22, 0.04, 0.0],
              foot_L: [0.10, 0, 0.16], foot_R: [0.10, 0, -0.08], coat: 0.6, ear_L: -0.2,
              smear_y: 0.55, smear_a0: -1.6, smear_a1: -0.1, smear_w: 0.08}
      - ms: 90
        event: hit
        set: {root: [0, 0, 0.11], twist: 0.50, lean: 0.55, squash: 1.0, club_rot: 0.6, hand_R: [-0.18, 0.18, 0.30], hand_L: [0.24, 0.02, -0.06],
              foot_L: [0.10, 0, 0.18], foot_R: [0.10, 0, -0.08], coat: 0.8, ear_L: -0.25,
              smear_y: 0.55, smear_a0: -1.2, smear_a1: 1.0, smear_w: 0.09}
      - ms: 100
        set: {root: [0, 0, 0.09], twist: 0.60, lean: 0.50, squash: 0.97, club_rot: 0.3, hand_R: [-0.26, 0.08, 0.14], hand_L: [0.24, 0.02, -0.04],
              foot_L: [0.10, 0, 0.16], foot_R: [0.10, 0, -0.06], coat: 0.4, ear_L: -0.1,
              smear_y: 0.55, smear_a0: 0.3, smear_a1: 1.3, smear_w: 0.05, smear_fade: 0.7}
      - ms: 110
        set: {root: [0, 0, 0.03], twist: 0.15, lean: 0.40, hand_R: [0.10, 0.06, 0.22], coat: 0.1}
  hit:
    loop: false
    keys:
      - ms: 70
        set: {root: [0, 0, -0.06], lean: 0.0, bob: -0.02, squash: 0.92, head_pitch: -0.25, ear_L: 0.35,
              hand_L: [0.26, 0.12, 0.0], hand_R: [0.26, 0.14, 0.04], coat: -0.5}
      - ms: 90
        set: {root: [0, 0, -0.08], lean: 0.10, bob: -0.01, squash: 0.96, head_pitch: -0.15, ear_L: 0.15,
              hand_L: [0.24, 0.08, 0.04], hand_R: [0.24, 0.10, 0.08], coat: -0.3}
      - ms: 100
        set: {root: [0, 0, -0.04], lean: 0.28, ear_L: -0.05, hand_R: [0.20, 0.06, 0.12], coat: -0.1}
  death:           # knocked back, falls on its back
    loop: false
    keys:
      - ms: 90
        set: {root: [0, 0, -0.05], lean: -0.10, bob: -0.02, squash: 0.92, head_pitch: -0.35, ear_L: 0.4,
              hand_L: [0.28, 0.18, 0.0], hand_R: [0.28, 0.22, 0.04], coat: -0.5}
      - ms: 100
        set: {root: [0, 0, -0.10], lean: -0.55, bob: -0.08, head_pitch: -0.25, ear_L: 0.1,
              hand_L: [0.30, 0.25, -0.05], hand_R: [0.30, 0.28, -0.02], foot_L: [0.10, 0.03, 0.12], foot_R: [0.10, 0, 0.06], coat: -0.3}
      - ms: 110
        set: {root: [0, 0, 0.0], lean: -1.10, bob: -0.20, head_pitch: -0.10, ear_L: -0.2,
              hand_L: [0.30, 0.22, -0.10], hand_R: [0.30, 0.24, -0.08], foot_L: [0.10, 0.08, 0.20], foot_R: [0.10, 0.04, 0.14], coat: 0.3}
      - ms: 90
        set: {root: [0, 0, 0.13], lean: -1.40, bob: -0.27, squash: 0.94, head_pitch: 0.05, ear_L: -0.35,
              hand_L: [0.30, 0.10, -0.08], hand_R: [0.32, 0.12, -0.06], foot_L: [0.10, 0.06, 0.24], foot_R: [0.11, 0.02, 0.20], coat: 0.1}
      - ms: 500
        set: {root: [0, 0, 0.13], lean: -1.45, bob: -0.28, head_pitch: 0.05, ear_L: -0.4,
              hand_L: [0.32, 0.05, -0.08], hand_R: [0.34, 0.06, -0.06], foot_L: [0.10, 0.03, 0.24], foot_R: [0.11, 0.0, 0.20]}
