spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: mage
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.95, 0]}
shadow: {rx: 10, ry: 3.5, alpha: 120}

# Chibi wizard (player class, fire & frost). Project style: topdown, 32 px, dark outline, flat, chibi, snappy.
brief:
  summary: chibi wizard - big pointy blue hat with gold band, blue robe to the ground, white beard,
    wooden staff in the right hand topped with a glowing frost orb
  must_keep: [pointy hat bent back, staff + glowing orb, long robe, white beard]
  simplify: [no fingers, legs hidden under the robe (only boots peek out)]
  decisions: >
    Head scale 1.8 (chibi). Whole body hangs on `body` (channel `fall`) so death can tip the mage over.
    The staff hangs on `staff` (at wrist_R, yaw follows the torso) and is pitched by `staff_pitch`.
    Orb uses the frost ramp (emissive) and pulses with `orb`. Socket `muzzle` = orb centre.

# Spec-local ramps (shared palette untouched)
ramps:
  beard: ["#1c0f1a", "#8a8fa3", "#c9cfdb", "#f2f4f8"]

materials:
  skin:  {ramp: skin, bands: [2, 3]}
  robe:  {ramp: cloth_blue, bands: [1, 3]}
  hat:   {ramp: cloth_blue, bands: [1, 3]}
  gold:  {ramp: gold, bands: [1, 3]}
  beard: {ramp: beard, bands: [1, 3]}
  wood:  {ramp: wood, bands: [1, 2]}
  boot:  {ramp: leather, bands: [1, 2]}
  ink:   {ramp: cloth, emissive: true, band: 0, outline: false}
  orb:   {ramp: frost, emissive: true, band: 2, glow: {color: "#7edaf2", mix: 0.5, radius: 1}}
  orb_core: {ramp: frost, emissive: true, band: 3}

channels:
  root: [0, 0, 0]
  fall: 0           # whole-body tip (death), radians; negative = backwards
  bob: 0
  lean: 0.03
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  hand_L: [0.24, 0.12, 0.04]
  foot_L: [0.10, 0, 0.04]
  pitch_foot_L: 0
  coat: 0           # robe hem sway (-1..1)
  staff_pitch: 0.08 # staff tilt forward (+) / back (-)
  staff_roll: 0.12  # staff tilt sideways (+ = top away from the body)
  orb: 1            # orb size multiplier (pulse / flare)
  hat_off: [0, 0, 0]   # hat offset in head space (death: the hat falls off)
  hat_rx: 0
  hat_rz: 0

bones:
  body:      {parent: root, rot: "[fall, 0, 0]"}
  torso_rot: {parent: body, pos: "[0, 0.52 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.43, 0.02], inherit_scale: false, rot: "[-lean*0.5, 0, 0]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.8}
  hatbone:   {parent: head, pos: hat_off, rot: "[hat_rx, 0, hat_rz]"}
  shoulder_L: {parent: pelvis, pos: [0.19, 0.36, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.09, -0.02, 0.0]}
  legyaw:     {parent: body, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: body, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  coatbase:   {parent: pelvis, rot: "[-coat*0.25, 0, 0]"}
  staffyaw:   {parent: body, rot: "[0, twist, 0]"}
  staff:      {parent: staffyaw, at: wrist_R, rot: "[staff_pitch, 0, staff_roll]"}

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.17, 0.16],
          pole: [0.3, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: body, target: "foot_L + [0, 0.07, -0.02]", lengths: [0.23, 0.22],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:
    material: robe
    space: pelvis
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.06, 0], r: [0.19, 0.14, 0.16]}
      - ellipsoid: {c: [0, 0.28, 0.0], r: [0.21, 0.15, 0.15]}
  robe:            # skirt to the ground
    material: robe
    space: coatbase
    blend: 0.03
    prims:
      - cone: {a: [0, 0.10, 0], b: [0, -0.40, -0.02], r: [0.18, 0.26]}
  hem:
    material: gold
    space: coatbase
    prims:
      - cylinder: {a: [0, -0.42, -0.02], b: [0, -0.37, -0.02], r: 0.275, round: 0.01}
  sash:
    material: gold
    space: pelvis
    prims:
      - cylinder: {a: [0, 0.10, 0], b: [0, 0.15, 0], r: 0.185}
  head:
    material: skin
    space: head
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.13, 0.0], r: [0.15, 0.15, 0.14]}
      - sphere: {c: [0, 0.10, 0.145], r: 0.03}      # nose
  beard:
    material: beard
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.05, 0.08], r: [0.12, 0.08, 0.08]}
      - cone: {a: [0, 0.03, 0.11], b: [0, -0.12, 0.13], r: [0.09, 0.025]}
  hair_L:          # white tufts under the brim
    material: beard
    space: head
    prims:
      - ellipsoid: {c: [0.13, 0.13, -0.04], r: [0.04, 0.07, 0.08]}
  hair_back:       # white hair at the back of the head (direction n)
    material: beard
    space: head
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.12, -0.07], r: [0.145, 0.11, 0.10]}
  eye_L:
    material: ink
    space: head
    prims:
      - sphere: {c: [0.055, 0.15, 0.13], r: 0.025}
  hat:
    material: hat
    space: hatbone
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.265, -0.03], r: [0.21, 0.028, 0.20], rot: [-0.15, 0, 0]}   # brim
      - chain: {pts: [[0, 0.26, -0.04], [0, 0.40, -0.06], [0, 0.50, -0.12], [0, 0.545, -0.20]],
                r: [0.15, 0.09, 0.045, 0.025]}                               # cone bent back
  hatband:
    material: gold
    space: hatbone
    prims:
      - cylinder: {a: [0, 0.285, -0.04], b: [0, 0.325, -0.045], r: 0.14, round: 0.01}
  arm_L:
    material: robe
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.075}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.065, 0.06]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.065, 0.085]}       # bell sleeve
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.04], r: 0.05}
  boot_L:
    material: boot
    space: sole_L
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, -0.02, 0.05], r: [0.07, 0.055, 0.10]}
  staff:           # right hand only (no _L => not mirrored)
    material: wood
    space: staff
    blend: 0.02
    prims:
      - cylinder: {a: [0, -0.52, 0.04], b: [0, 0.80, 0.04], r: 0.03, round: 0.01}
      - cone: {a: [0, 0.78, 0.04], b: [0.07, 0.92, 0.04], r: [0.03, 0.02]}
      - cone: {a: [0, 0.78, 0.04], b: [-0.07, 0.92, 0.04], r: [0.03, 0.02]}
  orb:
    material: orb
    space: staff
    prims:
      - sphere: {c: [0, 0.92, 0.04], r: "0.11*orb"}
  orb_core:
    material: orb_core
    space: staff
    prims:
      - sphere: {c: [-0.025, 0.93, 0.10], r: "0.05*orb"}

sockets:
  muzzle: {bone: staff, offset: [0, 0.92, 0.04]}

timing: {attack: {release: 240ms, total: 480ms}}

animations:
  idle:
    frames: 4
    ms: 170
    channels:
      bob: "0.03*sin(p)"
      squash: "1 + 0.015*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      hand_L: "[0.24, 0.12 + 0.02*sin(p - 0.6), 0.04]"
      hand_R: "[0.34, 0.14 + 0.02*sin(p - 0.6), 0.14]"
      coat: "0.12*sin(p - 1.0)"
      orb: "1 + 0.12*sin(p)"
  walk:
    frames: 6
    ms: 110
    events: {0: step_l, 3: step_r}
    channels:
      lean: 0.08
      bob: "-0.04*cos(2*p) + 0.01"
      twist: "0.08*cos(p)"
      foot_L: "[0.10, 0.08*pos(-sin(p)), 0.06 + 0.16*cos(p)]"
      foot_R: "[0.10, 0.08*pos(sin(p)), 0.06 - 0.16*cos(p)]"
      pitch_foot_L: "0.3*pos(-sin(p))"
      pitch_foot_R: "0.3*pos(sin(p))"
      hand_L: "[0.24, 0.13 + 0.03*pos(cos(p)), 0.04 - 0.12*cos(p)]"
      hand_R: "[0.34, 0.14, 0.16 + 0.04*cos(p)]"
      staff_pitch: "0.10 + 0.08*cos(p)"
      head_yaw: "-0.05*cos(p)"
      coat: "0.5*sin(2*p)"
  attack:          # thrust the staff forward and fire a bolt
    loop: false
    keys:
      - {ms: 90, set: {hand_R: [0.22, 0.18, 0.12], staff_pitch: 0.0, orb: 1.1}}
      - ms: 150
        event: windup
        set: {twist: -0.35, lean: -0.08, bob: -0.03, squash: 0.95, hand_R: [0.26, 0.24, -0.12], hand_L: [0.20, 0.14, 0.14],
              staff_pitch: -0.35, coat: -0.3, head_pitch: -0.05, orb: 1.3}
      - ms: 70
        event: release
        set: {root: [0, 0, 0.02], twist: 0.20, lean: 0.16, squash: 1.04, hand_R: [0.12, 0.27, 0.24], hand_L: [0.26, 0.10, -0.08],
              staff_pitch: "0.92 - 0.22*pulse(yaw, 0, 70)", foot_L: [0.10, 0, 0.12], coat: 0.5, orb: 1.5}
      - ms: 90
        set: {root: [0, 0, 0.02], twist: 0.15, lean: 0.12, hand_R: [0.14, 0.24, 0.26], hand_L: [0.26, 0.10, -0.06],
              staff_pitch: "0.85 - 0.3*pulse(yaw, 0, 70)", foot_L: [0.10, 0, 0.10], coat: 0.3, orb: 1.15}
      - ms: 80
        set: {root: [0, 0, 0.02], twist: 0.05, lean: 0.06, hand_R: [0.20, 0.18, 0.22], staff_pitch: 0.4, coat: 0.05}
  cast:            # both arms raise the staff overhead, area spell (frost nova) at the peak
    loop: false
    keys:
      - ms: 100
        set: {bob: -0.04, squash: 0.94, lean: 0.10, hand_R: [0.32, 0.08, 0.18], hand_L: [0.16, 0.12, 0.20],
              staff_pitch: 0.15, staff_roll: 0.15, orb: 1.1}
      - ms: 170
        event: windup
        set: {bob: 0.02, squash: 1.04, lean: -0.10, hand_R: [0.24, 0.50, 0.06], hand_L: [0.12, 0.44, 0.08],
              staff_pitch: -0.05, staff_roll: 0.35, head_pitch: -0.12, coat: -0.2, orb: 1.4}
      - ms: 200
        event: release
        set: {bob: -0.05, squash: 0.92, lean: 0.12, hand_R: [0.26, 0.62, 0.08], hand_L: [0.16, 0.56, 0.08],
              staff_pitch: 0.0, staff_roll: 0.30, head_pitch: -0.05, coat: 0.6, orb: 1.9}
      - ms: 120
        set: {bob: -0.02, squash: 0.97, lean: 0.06, hand_R: [0.32, 0.30, 0.14], hand_L: [0.22, 0.20, 0.10],
              staff_pitch: 0.10, staff_roll: 0.25, coat: 0.3, orb: 1.3}
      - ms: 120
        set: {hand_R: [0.34, 0.18, 0.14], staff_pitch: 0.08, coat: 0.05, orb: 1.05}
  hit:
    loop: false
    keys:
      - ms: 70
        event: hit
        set: {root: [0, 0, -0.04], lean: -0.12, bob: -0.02, squash: 0.94, head_pitch: -0.06, hand_R: [0.26, 0.20, 0.06],
              hand_L: [0.28, 0.20, 0.10], staff_pitch: -0.05, coat: -0.5, orb: 0.8}
      - ms: 90
        set: {root: [0, 0, -0.04], lean: -0.12, squash: 0.97, head_pitch: -0.1, hand_R: [0.24, 0.17, 0.10],
              hand_L: [0.26, 0.14, 0.06], staff_pitch: -0.10, coat: -0.2, orb: 0.9}
      - ms: 100
        set: {hand_R: [0.34, 0.14, 0.14], coat: 0.05}
  death:           # knees buckle, tips over backwards (chin on chest, hat tip up), staff falls
    loop: false
    keys:
      - ms: 90
        event: hit
        set: {root: [0, 0, -0.03], lean: -0.10, head_pitch: -0.05, hand_R: [0.28, 0.18, 0.06], hand_L: [0.28, 0.22, 0.08],
              staff_pitch: 0.0, coat: -0.4, orb: 0.8}
      - ms: 120
        set: {root: [0, -0.04, -0.02], bob: -0.08, squash: 0.9, lean: 0.25, head_pitch: 0.2, foot_L: [0.12, 0, 0.10],
              hand_R: [0.26, 0.05, 0.18], hand_L: [0.26, 0.05, 0.18], staff_pitch: 0.4, coat: 0.3, orb: 0.6}
      - ms: 110
        set: {root: [0, -0.06, 0.1], bob: -0.12, squash: 0.9, fall: -0.6, lean: 0.1, head_pitch: 0.2, foot_L: [0.12, 0, 0.14],
              hand_R: [0.30, 0.30, 0.0], hand_L: [0.30, 0.30, 0.0], staff_pitch: 0.9, staff_roll: 0.4, coat: 0.5, orb: 0.4}
      - ms: 100
        set: {root: "[0.28*pos(sin(2*radians(yaw))) - 0.15*(dir == 'ne'), -0.06, 0.45 - 0.45*cos(radians(yaw)) + 0.5*sin(radians(yaw))*cos(radians(yaw))]", bob: -0.14, fall: -1.20, lean: 0.1, foot_L: [0.12, 0, 0.14],
              hat_off: [0.18, 0.06, 0.12], hat_rx: 0.7, hat_rz: -0.5,
              hand_R: [0.32, 0.36, -0.05], hand_L: [0.32, 0.36, -0.05], staff_pitch: 0.3, staff_roll: 0.5, coat: 0.6, orb: 0.2}
      - ms: 500
        set: {root: "[0.32*pos(sin(2*radians(yaw))) + 0.32*pos(-sin(2*radians(yaw))), -0.08, 0.60 - 0.75*cos(radians(yaw)) + 0.6*sin(radians(yaw))*cos(radians(yaw))]", bob: -0.14, squash: 0.95, fall: -1.45, foot_L: [0.12, 0, 0.14], head_yaw: 0.3,
              hat_off: [0.34, 0.05, -0.38], hat_rx: 1.4, hat_rz: -0.2,
              hand_R: [0.34, 0.38, -0.05], hand_L: [0.34, 0.38, -0.05], staff_pitch: 0.1, staff_roll: 0.5, coat: 0.2, orb: 0.0}
