spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: barbarian_berserk
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.95, 0]}
shadow: {rx: 11, ry: 4, alpha: 120}

# The barbarian in Berserker Rage. The game swaps the hero's sprite to this one while the buff is active and
# swaps back keeping the clip progress, so skeleton, channels, clips, frame counts, ms, events and sockets are
# copied 1:1 from barbarian.yaml. Only the look changes. Project style: 32 px humans, dark outline, flat, chibi.
brief:
  summary: >
    Same chibi barbarian, enraged: bulkier deltoids, arms and chest with pec/ab lines that pulse, flushed red
    skin with near-black war paint (eye mask, chest claw stripes, arm bands), glowing red eyes, a long wild
    red mane flowing back from under the helmet, and a red rage aura of flame tongues and wisps rising from
    the shoulders and back. Same horned helmet, fur pelt, kilt, boots and huge axe.
  must_keep: [horned helmet, huge axe, wide shoulders, red beard, bare chest, glowing red eyes, rage aura]
  simplify: [paint as 3 shapes only (mask, chest stripes, arm bands), aura as 5 tongues + 3 wisps]
  exceptions: |
    Aura and eyes are emissive with no outline (like props/fire_large): their darkest tone #c1272d is the rim.
    Frame size, camera (pitch, scale, center), light and shadow identical to barbarian.yaml.
  decisions: |
    CONTRACT: clips/frames/ms/events/sockets must match barbarian.yaml exactly (sprite swap keeps progress).
    Animations are the barbarian's verbatim; the only additions are `flex` and `mane` values (look-only channels).
    flex = muscle pulse. Every muscle radius/scale reads RAGE = flex + 3*smear_w + 1.5*|1 - squash|, so idle
    breathes through flex and every attack bulges by itself on its smear (impact) and squash (windup) frames.
    The aura height reads the same signal (flares on strikes) and dies out as he falls in death (lean < -0.6).
    The mane hangs from the back of the helmet and swings back with lean, strikes and the `mane` channel.

ramps:
  hair_red:   ["#1c0f1a", "#6e1d24", "#b8432a", "#e3713c", "#f4a565"]
  skin_rage:  ["#1c0f1a", "#7a1c2a", "#c4555a", "#e07e78", "#f4b0a4"]
  warpaint:   ["#1c0f1a", "#2a0a14", "#4a0f1c", "#6e1d24"]
  rage_fire:  ["#c1272d", "#e8402f", "#ff5a3a", "#ffb08a"]
  rage_eye:   ["#c1272d", "#ff5a3a", "#ffd2b8"]

materials:
  skin:    {ramp: skin_rage, bands: [2, 4]}
  paint:   {ramp: warpaint, bands: [1, 1], line: false}
  fur:     {ramp: fur, bands: [1, 3]}
  leather: {ramp: leather, bands: [1, 3]}
  hair:    {ramp: hair_red, bands: [2, 4]}
  mane:    {ramp: hair_red, bands: [1, 2]}
  steel:   {ramp: steel, bands: [1, 3]}
  horn:    {ramp: bone, bands: [2, 4]}
  wood:    {ramp: wood, bands: [1, 2]}
  eye:     {ramp: rage_eye, emissive: true, band: 1, outline: false, glow: {color: "#ff3a1a", mix: 0.5, radius: 1}}
  aura_outer: {ramp: rage_fire, emissive: true, band: 0, outline: false, glow: {color: "#ff5a3a", mix: 0.3, radius: 1}}
  aura_core:  {ramp: rage_fire, emissive: true, band: 2, outline: false}
  aura_hot:   {ramp: rage_fire, emissive: true, band: 3, outline: false}
  fx_tail: {ramp: fx_tail, emissive: true}
  fx_mid:  {ramp: fx_mid, emissive: true}
  fx_core: {ramp: fx_core, emissive: true}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.04
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  hand_L: [0.34, 0.14, 0.08]
  foot_L: [0.14, 0, 0.02]
  pitch_foot_L: 0
  axe_pitch: 0.15     # axe rotation in torso space (x: forward tilt of the haft)
  axe_yaw: 0
  axe_roll: 0.60      # z: tilts the haft outward / across the body
  flap: 0           # loincloth flap sway (-1..1)
  smear_w: 0
  smear_a0: 0
  smear_a1: 0
  smear_r: 0.85
  smear_y: 0.75
  smear_z: 0.2
  smear_fade: 1
  smear_roll: 0      # tilts the smear plane: 0 horizontal, ~1.57 vertical
  flex: 0            # BERSERK look only: muscle pulse 0..1 (idle breathes with it; strikes add smear/squash)
  mane: 0            # BERSERK look only: extra swing of the long mane (+ = flung back/up)

bones:
  torso_rot: {parent: root, pos: "[0, 0.60 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  chest:     {parent: pelvis, pos: [0, 0.28, 0],
              scale: "[1 + 0.07*(flex + 3*smear_w + 1.5*abs(1 - squash)), 1 + 0.04*(flex + 3*smear_w + 1.5*abs(1 - squash)), 1 + 0.10*(flex + 3*smear_w + 1.5*abs(1 - squash))]"}
  headbase:  {parent: pelvis, pos: [0, 0.50, 0.03], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.8}
  manebase:  {parent: head, pos: [0, 0.15, -0.10],
              rot: "[-(0.10 + mane + 0.45*pos(lean) + 2.5*smear_w), 0, 0]"}
  shoulder_L: {parent: pelvis, pos: [0.29, 0.40, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.12, -0.02, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  flapbase:   {parent: pelvis, rot: "[-flap*0.3, 0, 0]"}
  axe:        {parent: torso_rot, at: wrist_R, rot: "[axe_pitch, axe_yaw, axe_roll]"}
  axeblade:   {parent: axe, rot: [0, -0.75, 0]}   # blade turned outward-forward so its face reads
  fxspace:    {parent: root, rot: "[0, twist*0.3, 0]"}
  smearspace: {parent: fxspace, pos: "[0, smear_y, smear_z]", rot: "[0, 0, smear_roll]"}
  aura:       {parent: root, pos: "[0.42*sin(lean)*sin(twist), 0.60 + bob, 0.42*sin(lean)*cos(twist)]",
               rot: "[0, twist, 0]"}   # upright frame at the chest that follows lean and twist

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.21, 0.20],
          pole: [0.4, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.08, -0.02]", lengths: [0.27, 0.26],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:           # bare barrel belly and flanks (the chest is its own part so a line separates them)
    material: skin
    space: pelvis
    blend: 0.07
    prims:
      - ellipsoid: {c: [0, 0.06, 0], r: [0.21, 0.13, 0.15]}
      - ellipsoid: {c: [0, 0.20, 0.0], r: [0.23, 0.13, 0.15]}
  chest:           # huge pecs + traps, scaled by the chest bone (the pulse)
    material: skin
    space: chest
    blend: 0.05
    line: true
    prims:
      - ellipsoid: {c: [0, 0.08, -0.01], r: [0.33, 0.13, 0.16]}
      - ellipsoid: {c: [0.10, 0.03, 0.06], r: [0.12, 0.09, 0.11]}
      - ellipsoid: {c: [-0.10, 0.03, 0.06], r: [0.12, 0.09, 0.11]}
  pelt:            # fur mantle over the shoulders (pushed out by the bigger deltoids)
    material: fur
    space: pelvis
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.45, -0.07], r: [0.29, 0.08, 0.16]}
      - sphere: {c: [0.31, 0.47, -0.03], r: 0.12}
      - sphere: {c: [-0.31, 0.47, -0.03], r: 0.12}
      - ellipsoid: {c: [0, 0.32, -0.15], r: [0.26, 0.14, 0.06]}
  kilt:            # leather kilt + belt
    material: leather
    space: pelvis
    blend: 0.03
    prims:
      - cylinder: {a: [0, 0.08, 0], b: [0, 0.14, 0], r: 0.22}
      - cone: {a: [0, 0.08, 0], b: [0, -0.10, 0], r: [0.21, 0.23]}
  buckle:
    material: steel
    space: pelvis
    prims:
      - box: {c: [0, 0.11, 0.215], half: [0.05, 0.04, 0.02]}
  flap:            # fur loincloth flap in front
    material: fur
    space: flapbase
    prims:
      - box: {c: [0, -0.10, 0.21], half: [0.09, 0.12, 0.025], round: 0.02}
  neck:            # thick bull neck
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.40, 0], b: [0, 0.52, 0.03], r: [0.13, 0.10]}
  head:
    material: skin
    space: head
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.13, 0.0], r: [0.15, 0.15, 0.145]}
      - sphere: {c: [0, 0.10, 0.145], r: 0.028}
  mask:            # war paint: dark band across the eyes, the red eyes burn inside it
    material: paint
    space: head
    prims:
      - ellipsoid: {c: [0, 0.125, 0.015], r: [0.154, 0.045, 0.144]}
    cut:
      - box: {c: [0, 0.125, -0.12], half: [0.3, 0.1, 0.12]}
  helmet:          # steel cap with a rim, sits just above the eyes
    material: steel
    space: head
    blend: 0.02
    prims:
      - ellipsoid: {c: [0, 0.20, -0.02], r: [0.158, 0.115, 0.155]}
      - cylinder: {a: [0, 0.175, -0.02], b: [0, 0.20, -0.02], r: 0.163, round: 0.01}
    cut:
      - box: {c: [0, 0.06, 0], half: [0.3, 0.115, 0.3]}
  horn_L:          # bone horns curving out and up
    material: horn
    space: head
    prims:
      - chain: {pts: [[0.13, 0.21, 0.0], [0.22, 0.24, 0.02], [0.29, 0.31, 0.03], [0.31, 0.40, 0.01]],
                r: [0.045, 0.036, 0.026, 0.016]}
  hair:            # wild red hair bursting from under the helmet rim
    material: hair
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.10, -0.08], r: [0.165, 0.12, 0.11]}
      - ellipsoid: {c: [0.13, 0.12, -0.03], r: [0.05, 0.07, 0.07]}
      - ellipsoid: {c: [-0.13, 0.12, -0.03], r: [0.05, 0.07, 0.07]}
  mane:            # long wild mane flowing back and down from the helmet, swings with motion
    material: mane
    space: manebase
    blend: 0.05
    prims:
      - chain: {pts: [[0, 0, 0], [0, -0.07, -0.08], ["0.02*sin(p)", -0.17, -0.12], ["0.04*sin(p - 0.8)", -0.27, -0.12]],
                r: [0.085, 0.07, 0.05, 0.025]}
      - chain: {pts: [[0.08, 0, 0.0], [0.12, -0.05, -0.05], ["0.15 + 0.02*sin(p - 0.4)", -0.12, -0.08], ["0.17 + 0.03*sin(p - 1.2)", -0.18, -0.07]],
                r: [0.055, 0.045, 0.03, 0.015]}
      - chain: {pts: [[-0.08, 0, 0.0], [-0.12, -0.05, -0.05], ["-0.15 + 0.02*sin(p - 0.4)", -0.12, -0.08], ["-0.17 + 0.03*sin(p - 1.2)", -0.18, -0.07]],
                r: [0.055, 0.045, 0.03, 0.015]}
  beard:           # big wild red beard
    material: hair
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, -0.005, 0.08], r: [0.14, 0.075, 0.095]}
      - ellipsoid: {c: [0, -0.07, 0.10], r: [0.09, 0.08, 0.065]}
  eye_L:           # glowing red eyes
    material: eye
    space: head
    prims:
      - sphere: {c: [0.062, 0.123, 0.136], r: 0.033}
  arm_L:           # bulging deltoid, biceps and forearm; radii pulse with RAGE
    material: skin
    blend: 0.035
    prims:
      - sphere: {c: "@shoulder_L", r: "0.135*(1 + 0.16*(flex + 3*smear_w + 1.5*abs(1 - squash)))"}
      - cone: {a: "@shoulder_L", b: "@elbow_L",
               r: ["0.12*(1 + 0.20*(flex + 3*smear_w + 1.5*abs(1 - squash)))", "0.095*(1 + 0.12*(flex + 3*smear_w + 1.5*abs(1 - squash)))"]}
      - sphere: {c: {between: ["@shoulder_L", "@elbow_L"], t: 0.55}, r: "0.115*(1 + 0.25*(flex + 3*smear_w + 1.5*abs(1 - squash)))"}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.10, 0.08]}
  armband_L:       # war paint band around the biceps
    material: paint
    prims:
      - cone: {a: {between: ["@shoulder_L", "@elbow_L"], t: 0.30}, b: {between: ["@shoulder_L", "@elbow_L"], t: 0.40},
               r: ["0.125*(1 + 0.22*(flex + 3*smear_w + 1.5*abs(1 - squash)))", "0.125*(1 + 0.22*(flex + 3*smear_w + 1.5*abs(1 - squash)))"]}
  bracer_L:
    material: leather
    prims:
      - cone: {a: {between: ["@elbow_L", "@wrist_L"], t: 0.35}, b: {between: ["@elbow_L", "@wrist_L"], t: 0.9}, r: [0.103, 0.09]}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.04], r: 0.08}
  leg_L:
    material: skin
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.125, 0.09]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.09, 0.075]}
  boot_L:          # chunky fur boots
    material: fur
    space: sole_L
    blend: 0.03
    prims:
      - cone: {a: [0, 0.14, 0], b: [0, -0.02, 0.0], r: [0.10, 0.09]}
      - ellipsoid: {c: [0, -0.03, 0.05], r: [0.085, 0.05, 0.125]}
  haft:            # two-handed axe: long wooden haft (right hand only, no _L)
    material: wood
    space: axe
    prims:
      - cylinder: {a: [0, -0.20, 0], b: [0, 0.80, 0], r: 0.034}
      - sphere: {c: [0, -0.22, 0], r: 0.048}
  axe_head:        # big crescent blade facing forward (+z), spike at the back
    material: steel
    space: axeblade
    blend: 0.03
    prims:
      - box: {c: [0, 0.66, 0.07], half: [0.035, 0.08, 0.08]}
      - ellipsoid: {c: [0, 0.66, 0.21], r: [0.035, 0.27, 0.12]}
      - cone: {a: [0, 0.66, -0.02], b: [0, 0.68, -0.15], r: [0.045, 0.018]}
  # RAGE AURA (emissive, no outline). Tongue height = h*F with
  # F = (0.9 + 0.3*flex + 2.5*smear_w + 1.2*|1 - squash|) * clamp(1.7 + 1.8*lean, 0, 1): pulses with flex, flares on
  # windups/strikes, dies out as he falls. Every motion is periodic in p, so idle and walk loop seamlessly.
  # Dark-red tongues stand behind/outside, bright red-orange ones in front/inside, so both tones show in all 8 dirs.
  aura_flames:     # dark-red (#c1272d) tongues: tall, outside the shoulders and up the back, plus rising wisps
    material: aura_outer
    space: aura
    when: "lean > -1.0"
    prims:
      - chain: {pts: [[0.40, 0.40, -0.08], ["0.44 + 0.03*sin(p + 0.4)", "0.40 + 0.5*0.64*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.2*sin(2*p + 0.6))", -0.12], ["0.48 + 0.06*sin(p + 1.3)", "0.40 + 0.64*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.2*sin(2*p + 0.6))", -0.16]],
                r: [0.09, 0.065, 0.012]}
      - chain: {pts: [[-0.40, 0.40, -0.08], ["-0.44 + 0.03*sin(p + 2.2)", "0.40 + 0.5*0.58*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.2*sin(2*p + 2.9))", -0.12], ["-0.48 + 0.06*sin(p + 3.1)", "0.40 + 0.58*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.2*sin(2*p + 2.9))", -0.16]],
                r: [0.09, 0.065, 0.012]}
      - sphere: {c: ["0.40 + 0.05*sin(2*p)", "0.95 + 0.40*(p/tau + 0.10 - floor(p/tau + 0.10))", -0.14], r: "0.05*(1 - (p/tau + 0.10 - floor(p/tau + 0.10)))*clamp(1.7 + 1.8*lean, 0, 1)"}
      - sphere: {c: ["-0.38 + 0.05*sin(2*p + 2)", "0.95 + 0.40*(p/tau + 0.60 - floor(p/tau + 0.60))", -0.16], r: "0.05*(1 - (p/tau + 0.60 - floor(p/tau + 0.60)))*clamp(1.7 + 1.8*lean, 0, 1)"}
  aura_core:       # bright red-orange (#ff5a3a) tongues: in front of / inside the dark ones
    material: aura_core
    space: aura
    when: "lean > -1.0"
    prims:
      - chain: {pts: [[0.38, 0.42, 0.0], ["0.41 + 0.03*sin(p + 1.4)", "0.42 + 0.5*0.42*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.22*sin(2*p + 3.6))", -0.02], ["0.44 + 0.05*sin(p + 2.3)", "0.42 + 0.42*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.22*sin(2*p + 3.6))", -0.04]],
                r: [0.07, 0.05, 0.010]}
      - chain: {pts: [[-0.38, 0.42, 0.0], ["-0.41 + 0.03*sin(p + 3.2)", "0.42 + 0.5*0.38*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.22*sin(2*p + 5.9))", -0.02], ["-0.44 + 0.05*sin(p + 4.1)", "0.42 + 0.38*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.22*sin(2*p + 5.9))", -0.04]],
                r: [0.07, 0.05, 0.010]}
      - chain: {pts: [[0.22, 0.36, -0.20], ["0.24 + 0.03*sin(p + 5.3)", "0.36 + 0.5*0.54*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.2*sin(2*p + 1.7))", -0.26], ["0.27 + 0.06*sin(p + 6.2)", "0.36 + 0.54*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.2*sin(2*p + 1.7))", -0.30]],
                r: [0.08, 0.06, 0.010]}
      - chain: {pts: [[-0.22, 0.36, -0.20], ["-0.24 + 0.03*sin(p + 1.1)", "0.36 + 0.5*0.58*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.2*sin(2*p + 5.0))", -0.26], ["-0.27 + 0.06*sin(p + 2.0)", "0.36 + 0.58*(0.9 + 0.3*flex + 2.5*smear_w + 1.2*abs(1 - squash))*clamp(1.7 + 1.8*lean, 0, 1)*(1 + 0.2*sin(2*p + 5.0))", -0.30]],
                r: [0.08, 0.06, 0.010]}
      - sphere: {c: ["0.10 + 0.05*sin(2*p + 4)", "1.00 + 0.40*(p/tau + 0.35 - floor(p/tau + 0.35))", -0.32], r: "0.045*(1 - (p/tau + 0.35 - floor(p/tau + 0.35)))*clamp(1.7 + 1.8*lean, 0, 1)"}

sockets:
  hand_R: {bone: wrist_R}
  hit: {bone: axeblade, offset: [0, 0.66, 0.18]}
  head: {bone: head, offset: [0, 0.30, 0]}

animations:
  idle:
    frames: 4
    ms: 200
    channels:
      bob: "0.03*sin(p)"
      squash: "1 + 0.02*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      hand_L: "[0.34, 0.14 + 0.02*sin(p - 0.6), 0.08]"
      hand_R: "[0.40, 0.22 + 0.02*sin(p - 0.6), 0.14]"
      flap: "0.15*sin(p - 1.0)"
      flex: "0.5 + 0.5*sin(p)"          # BERSERK: heavy breathing pulse (chest and arms swell)
      mane: "0.10*sin(p - 1.2)"
  walk:
    frames: 6
    ms: 110
    events: {0: step_l, 3: step_r}
    channels:
      lean: 0.12
      bob: "-0.035*cos(2*p) + 0.01"
      twist: "0.10*cos(p)"
      foot_L: "[0.14, 0.10*pos(-sin(p)), 0.02 + 0.20*cos(p)]"
      foot_R: "[0.14, 0.10*pos(sin(p)), 0.02 - 0.20*cos(p)]"
      pitch_foot_L: "0.4*pos(-sin(p))"
      pitch_foot_R: "0.4*pos(sin(p))"
      hand_L: "[0.34, 0.16 + 0.04*pos(cos(p)), 0.08 - 0.16*cos(p)]"
