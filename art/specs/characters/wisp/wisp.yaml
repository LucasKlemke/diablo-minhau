spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: wisp
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.66, 0]}
shadow: {rx: 6, ry: 2.2, alpha: 90}

# Will-o'-the-wisp: swamp enemy. A floating ball of pale cyan-green light (~12 px) hovering well above its
# shadow, with flickering wisps trailing behind. It drifts toward the hero and blows itself up (attack).
brief:
  summary: floating ball of pale cyan-green light, ~0.66 units across (~12 px), hovering ~0.8 above the
    ground, bright white-green emissive core, three flickering flame-like wisps trailing back and down,
    two tiny motes circling it
  must_keep: [round glowing ball, emissive core, trailing wisps that flicker, clear gap to the ground shadow]
  simplify: [no face, no particles beyond two motes]
  exceptions: |
    The whole creature is light: every material is emissive. The shell keeps the dark project outline
    (outline: true) so it still reads as the same game; the wisps and motes have none.
  decisions: |
    The core sits slightly forward in the shell so it shows from every direction.
    Attack is a self-destruct: it swells (windup) and bursts into a ring of rays; `hit` fires on the burst.
    The burst's last frame keeps a few fading motes so the frame is never empty.
    Death pops: it shrinks, flashes a small ring, and leaves a dim mote.

ramps:
  wisp:      ["#1c0f1a", "#1f8f8a", "#5fe0c8", "#b8fbe8", "#f4fff8"]
  wisp_core: ["#5fe0c8", "#b8fbe8", "#f4fff8", "#ffffff"]
  wisp_dim:  ["#1c0f1a", "#1a5f62", "#2e9a92", "#5fc8b4"]

materials:
  shell:  {ramp: wisp, emissive: true, band: 2, outline: true, glow: {color: "#7ef2d8", mix: 0.35, radius: 1}}
  rim:    {ramp: wisp, emissive: true, band: 3, outline: false}
  core:   {ramp: wisp_core, emissive: true, band: 2, outline: false}
  trail:  {ramp: wisp, emissive: true, band: 2, outline: false, glow: {color: "#5fe0c8", mix: 0.3, radius: 1}}
  mote:   {ramp: wisp, emissive: true, band: 3, outline: false}
  dim:    {ramp: wisp_dim, emissive: true, band: 2, outline: false}

channels:
  root: [0, 0, 0]
  hover: 0.80     # height of the ball centre
  bob: 0
  size: 1         # ball scale (swell before the burst, shrink on death)
  ball: 1         # 1 = ball visible, 0 = gone (burst / pop)
  core: 1         # core size
  lean: 0         # tilt forward when drifting (+)
  trail: 0        # extra trail length (drifting)
  fl1: 0          # wisp flicker offsets (-1..1)
  fl2: 0
  fl3: 0
  orb: 0          # motes orbit angle
  motes: 1        # motes size (0 = hidden)
  burst: 0        # explosion radius (0 = none)
  bfade: 1        # explosion ray thickness
  pop: 0          # small pop ring (death)
  ember: 0        # dim left-over mote (death)

bones:
  float: {parent: root, pos: "[0, hover + bob, 0]", rot: "[lean, 0, 0]"}
  ball:  {parent: float, scale: "size"}

parts:
  shell:
    when: "ball > 0.5"
    material: shell
    space: ball
    prims:
      - sphere: {c: [0, 0, 0], r: 0.30}
  rim:             # brighter upper cap of the shell (reads as the lit top)
    when: "ball > 0.5"
    material: rim
    space: ball
    prims:
      - ellipsoid: {c: [0, 0.12, 0.04], r: [0.22, 0.17, 0.22]}
  core:
    when: "ball > 0.5"
    material: core
    space: ball
    prims:
      - sphere: {c: "[-0.13*sin(radians(yaw)), 0.10, 0.13*cos(radians(yaw))]", r: "0.19*core"}   # cheated toward the camera
  wisp_L:          # side wisp: flame tongue trailing back and down
    when: "ball > 0.5"
    material: trail
    space: ball
    blend: 0.03
    prims:
      - chain:
          pts: ["[0.15, 0.02, -0.16]", "[0.22 + 0.04*fl1, 0.10, -0.36 - 0.10*trail]", "[0.20 + 0.08*fl1, 0.20 + 0.05*fl2, -0.54 - 0.06*fl2 - 0.22*trail]"]
          r: [0.11, 0.06, 0.015]
  wisp_c:
    when: "ball > 0.5"
    material: trail
    space: ball
    blend: 0.03
    prims:
      - chain:
          pts: ["[0, 0.06, -0.20]", "[0.05*fl3, 0.16, -0.44 - 0.12*trail]", "[0.10*fl3, 0.30 + 0.06*fl1, -0.68 - 0.08*fl1 - 0.28*trail]"]
          r: [0.14, 0.07, 0.015]
      - chain:
          pts: ["[0, -0.10, -0.20]", "[-0.04*fl2, -0.10, -0.42 - 0.10*trail]", "[-0.06*fl2, -0.06 + 0.05*fl3, -0.60 - 0.06*fl3 - 0.22*trail]"]
          r: [0.10, 0.05, 0.012]
  motes:
    when: "motes > 0.05"
    material: mote
    space: float
    prims:
      - sphere: {c: "[0.46*cos(orb), 0.10*sin(2*orb), 0.46*sin(orb)]", r: "0.045*motes"}
      - sphere: {c: "[-0.40*cos(orb + 0.6), 0.16 + 0.08*cos(2*orb), -0.40*sin(orb + 0.6)]", r: "0.035*motes"}
  burst_ring:      # self-destruct explosion: bright shell of rays
    when: "burst > 0.05"
    material: trail
    space: float
    blend: 0.02
    prims:
      - torus: {c: [0, 0, 0], R: "0.50*burst", r: "0.07*bfade", rot: [0, 0, 0]}
      - cone: {a: "[0.30*burst, 0, 0]", b: "[0.85*burst, 0, 0]", r: ["0.10*bfade", 0.015]}
      - cone: {a: "[-0.30*burst, 0, 0]", b: "[-0.85*burst, 0, 0]", r: ["0.10*bfade", 0.015]}
      - cone: {a: "[0, 0, 0.30*burst]", b: "[0, 0, 0.85*burst]", r: ["0.10*bfade", 0.015]}
      - cone: {a: "[0, 0, -0.30*burst]", b: "[0, 0, -0.85*burst]", r: ["0.10*bfade", 0.015]}
      - cone: {a: "[0, 0.25*burst, 0]", b: "[0, 0.75*burst, 0]", r: ["0.10*bfade", 0.015]}
      - cone: {a: "[0.21*burst, 0.12*burst, 0.21*burst]", b: "[0.55*burst, 0.35*burst, 0.55*burst]", r: ["0.09*bfade", 0.015]}
      - cone: {a: "[-0.21*burst, 0.12*burst, 0.21*burst]", b: "[-0.55*burst, 0.35*burst, 0.55*burst]", r: ["0.09*bfade", 0.015]}
      - cone: {a: "[0.21*burst, 0.12*burst, -0.21*burst]", b: "[0.55*burst, 0.35*burst, -0.55*burst]", r: ["0.09*bfade", 0.015]}
      - cone: {a: "[-0.21*burst, 0.12*burst, -0.21*burst]", b: "[-0.55*burst, 0.35*burst, -0.55*burst]", r: ["0.09*bfade", 0.015]}
  burst_core:
    when: "burst > 0.05 and bfade > 0.5"
    material: core
    space: float
    prims:
      - sphere: {c: [0, 0, 0], r: "0.30*bfade"}
  pop:             # small ring when it pops (death)
    when: "pop > 0.05"
    material: trail
    space: float
    prims:
      - torus: {c: [0, 0, 0], R: "0.36*pop", r: 0.045, rot: [0, 0, 0]}
  ember:
    when: "ember > 0.05"
    material: dim
    space: float
    prims:
      - sphere: {c: [0, 0, 0], r: "0.10*ember"}
      - chain: {pts: ["[0, 0.06, 0]", "[0.05, 0.22*ember, -0.03]", "[-0.02, 0.38*ember, -0.05]"], r: ["0.07*ember", "0.045*ember", 0.012]}

sockets:
  hit: {bone: float, offset: [0, 0, 0]}
  core: {bone: ball, offset: [0, 0, 0.10]}

timing: {attack: {hit: 330ms, total: 560ms}}

animations:
  idle:            # hovering, wisps flicker, motes circle
    frames: 4
    ms: 140
    channels:
      bob: "0.04*sin(p)"
      core: "1 + 0.12*sin(2*p)"
      fl1: "sin(p)"
      fl2: "sin(p + 2.1)"
      fl3: "sin(p + 4.2)"
      orb: "p"
  walk:            # drifting: leans forward, wisps stream back
    frames: 4
    ms: 110
    channels:
      bob: "0.03*sin(p)"
      lean: 0.15
      trail: "0.6 + 0.15*sin(p)"
      core: "1 + 0.1*sin(2*p)"
      fl1: "sin(p)"
      fl2: "sin(p + 2.1)"
      fl3: "sin(p + 4.2)"
      orb: "p"
  attack:          # self-destruct: swells, flickers, bursts (hit 330 ms, total 560 ms)
    loop: false
    keys:
      - {ms: 110, event: windup, set: {size: 1.15, core: 1.2, bob: -0.03, fl1: 1, fl2: -1, fl3: 0.5, orb: 1.0, motes: 0.8}}
      - {ms: 110, set: {size: 1.30, core: 1.45, bob: 0.0, fl1: -1, fl2: 1, fl3: -0.5, orb: 2.2, motes: 0.6}}
      - {ms: 110, set: {size: 1.48, core: 1.7, bob: 0.02, fl1: 1, fl2: 0, fl3: 1, orb: 3.4, motes: 0.4}}
      - {ms: 80, event: hit, set: {ball: 0, motes: 0, burst: 0.75, bfade: 1.3}}
      - {ms: 80, set: {ball: 0, motes: 0, burst: 1.15, bfade: 0.75}}
      - {ms: 70, set: {ball: 0, motes: 0.8, orb: 4.4, burst: 1.35, bfade: 0.35}}
  hit:             # knocked back, squashed, dims
    loop: false
    keys:
      - {ms: 70, event: hit, set: {root: [0, 0, -0.08], size: 0.85, core: 0.7, lean: -0.3, fl1: 1, fl2: 1, fl3: 1, trail: -0.3}}
      - {ms: 80, set: {root: [0, 0, -0.05], size: 1.08, core: 1.1, lean: -0.1, fl1: -1, fl2: -0.5, fl3: 0}}
      - {ms: 90, set: {root: [0, 0, -0.02], size: 1.0, core: 1.0}}
  death:           # shrinks and pops, leaving a dim ember that sinks (last frame 600 ms)
    loop: false
    keys:
      - {ms: 90, set: {size: 1.12, core: 1.4, fl1: 1, fl2: -1, fl3: 1}}
      - {ms: 90, set: {size: 0.75, core: 0.8, fl1: -1, fl2: 1, fl3: -1, motes: 0.6, orb: 1.5}}
      - {ms: 90, set: {size: 0.45, core: 0.6, motes: 0.4, orb: 3.0}}
      - {ms: 90, set: {ball: 0, motes: 0, pop: 0.8}}
      - {ms: 100, set: {ball: 0, motes: 0, pop: 1.2, ember: 1.0, bob: -0.10}}
      - {ms: 600, event: dead, set: {ball: 0, motes: 0, ember: 1.1, hover: 0.30}}
