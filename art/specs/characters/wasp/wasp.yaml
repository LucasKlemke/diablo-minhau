spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: wasp
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.50, -0.05]}
shadow: {rx: 7, ry: 2.5, alpha: 100}

# Giant wasp: Act I flying enemy (~12 px tall). The body hovers above its ground shadow: `hover` lifts the
# `body` bone (not `root`, so the shadow stays on the ground). Thorax and head on `body`, the striped
# abdomen on its own bone (`curl` swings it forward under the body for the sting), two wing pairs on
# `wing_L` (mirrored) flapping with `flap` around the body's length axis.
brief:
  summary: giant yellow-and-black wasp hovering above the ground, big chibi head with glowing red eyes,
    black thorax, fat yellow abdomen with black stripes and a dark stinger, pale translucent-looking wings
    in a fast flutter, thin dangling legs
  must_keep: [yellow/black striped abdomen, stinger, pale wings that flutter, red emissive eyes, hovering above its shadow]
  simplify: [no wing veins, legs as one dangling cone pair each, no mandibles]
  decisions: wings are a very pale cyan-white two-sided material (reads as translucent over grass without
    real transparency); the flutter alternates up/down every frame (cos 2p on 4/6-frame cycles) so the
    wings read as a blur; stripes are dark bands slightly larger than the yellow abdomen; the sting curls
    the abdomen forward under the body with a short lunge

ramps:
  wasp_yellow: ["#1c0f1a", "#8a5410", "#e1a227", "#f5d040", "#fbf0a0"]
  wasp_black:  ["#1c0f1a", "#231823", "#3a2c38", "#58485c"]
  wasp_wing:   ["#1c0f1a", "#8fb6cc", "#c6e4f0", "#eef9ff"]
  wasp_eye:    ["#1c0f1a", "#ff3b2b", "#ffb0a0"]

materials:
  yellow: {ramp: wasp_yellow, bands: [2, 3]}
  black:  {ramp: wasp_black, bands: [1, 3]}
  wing:   {ramp: wasp_wing, bands: [1, 3], two_sided: true, line: false}
  eye:    {ramp: wasp_eye, emissive: true, band: 1, outline: false, glow: {color: "#ff3b2b", mix: 0.4, radius: 1}}

channels:
  root: [0, 0, 0]
  hover: 0.58       # body height above the ground
  bob: 0
  pitch: 0          # + noses down
  twist: 0
  roll: 0           # death: onto its back
  head_pitch: 0
  curl: 0           # + swings the abdomen forward under the body (sting)
  flap: 0           # wing angle (+ up)
  leg: 0            # + legs tuck up (death curl)

bones:
  body:    {parent: root, pos: "[0, hover + bob, 0]", rot: "[pitch, twist, roll]", scale: 1.15}
  head:    {parent: body, pos: [0, 0.03, 0.13], rot: "[head_pitch, 0, 0]", scale: 1.5}
  abdomen: {parent: body, pos: [0, -0.02, -0.09], rot: "[-0.55 - curl, 0, 0]"}
  wing_L:  {parent: body, pos: [0.05, 0.09, 0.0], rot: "[0, 0, 0.15 + flap]"}
  leg_L:   {parent: body, pos: [0.05, -0.08, 0.02], rot: "[-0.3 + leg, 0, 0.35 - 0.5*leg]"}

parts:
  thorax:
    material: black
    space: body
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0, 0], r: [0.11, 0.10, 0.12]}
      - sphere: {c: [0, -0.01, -0.09], r: 0.05}                       # waist
  thorax_mark:     # yellow shoulder spots
    material: yellow
    space: body
    prims:
      - ellipsoid: {c: [0.075, 0.05, 0.03], r: [0.04, 0.035, 0.05]}
      - ellipsoid: {c: [-0.075, 0.05, 0.03], r: [0.04, 0.035, 0.05]}
  head:
    material: yellow
    space: head
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.0, 0.04], r: [0.085, 0.08, 0.07]}
      - ellipsoid: {c: [0, -0.04, 0.09], r: [0.05, 0.04, 0.035]}      # face plate
  crown:
    material: black
    space: head
    prims:
      - ellipsoid: {c: [0, 0.055, 0.02], r: [0.06, 0.03, 0.05]}
  eye_L:           # big compound eye
    material: eye
    space: head
    prims:
      - ellipsoid: {c: [0.06, 0.01, 0.07], r: [0.03, 0.045, 0.035]}
  antenna_L:
    material: black
    space: head
    prims:
      - chain: {pts: [[0.025, 0.06, 0.08], [0.06, 0.14, 0.12], [0.09, 0.15, 0.18]], r: [0.016, 0.014, 0.012]}
  abdomen:         # fat yellow abdomen, axis along -z of the abdomen bone
    material: yellow
    space: abdomen
    prims:
      - ellipsoid: {c: [0, 0, -0.20], r: [0.13, 0.12, 0.20]}
  stripes:         # dark bands, slightly larger than the abdomen's cross-section
    material: black
    space: abdomen
    blend: 0.0
    prims:
      - ellipsoid: {c: [0, 0, -0.10], r: [0.13, 0.12, 0.05]}
      - ellipsoid: {c: [0, 0, -0.22], r: [0.148, 0.137, 0.05]}
      - ellipsoid: {c: [0, 0, -0.33], r: [0.117, 0.108, 0.045]}
  stinger:
    material: black
    space: abdomen
    prims:
      - cone: {a: [0, -0.01, -0.37], b: [0, -0.03, -0.50], r: [0.035, 0.008]}
  wing_L:          # forewing + hindwing, swept back
    material: wing
    space: wing_L
    prims:
      - ellipsoid: {c: [0.17, 0.01, -0.07], r: [0.18, 0.014, 0.07], rot: [0, 0.45, 0]}
      - ellipsoid: {c: [0.12, 0.0, -0.15], r: [0.12, 0.012, 0.05], rot: [0, 0.85, 0]}
  legs_L:
    material: black
    space: leg_L
    blend: 0.01
    prims:
      - cone: {a: [0, 0, 0.05], b: [0.05, -0.17, 0.10], r: [0.02, 0.012]}
      - cone: {a: [0, 0, 0.0], b: [0.06, -0.19, -0.02], r: [0.02, 0.012]}
      - cone: {a: [0, 0, -0.05], b: [0.05, -0.18, -0.13], r: [0.02, 0.012]}

sockets:
  hit: {bone: abdomen, offset: [0, -0.03, -0.50]}
  head: {bone: head, offset: [0, 0.12, 0]}

timing: {attack: {hit: 210ms, total: 440ms}}

animations:
  idle:            # hover: slow bob, wings flutter every frame
    frames: 4
    ms: 80
    channels:
      bob: "0.025*sin(p)"
      flap: "0.75*cos(2*p)"
      curl: "0.08*sin(p - 0.8)"
      leg: "0.08*sin(p)"
  walk:            # flying forward: nose down, faster bob
    frames: 6
    ms: 70
    channels:
      pitch: 0.18
      bob: "0.02*sin(2*p)"
      twist: "0.05*sin(p)"
      flap: "0.8*cos(3*p)"
      curl: "-0.15 + 0.06*sin(2*p - 0.8)"
      leg: 0.25
  attack:          # rears back, abdomen cocked, then lunges and stings forward (hit at 210 ms)
    loop: false
    keys:
      - ms: 80
        set: {root: [0, 0, -0.03], bob: 0.04, pitch: -0.15, curl: -0.25, flap: 0.8, head_pitch: -0.1}
      - ms: 130
        event: windup
        set: {root: [0, 0, -0.08], bob: 0.08, pitch: -0.30, curl: -0.30, flap: -0.7, head_pitch: -0.15}
      - ms: 70
        event: hit
        set: {root: [0, 0, 0.16], bob: -0.06, pitch: 0.15, curl: 1.45, flap: 0.8, head_pitch: 0.1}
      - ms: 80
        set: {root: [0, 0, 0.12], bob: -0.03, pitch: 0.08, curl: 1.0, flap: -0.7}
      - ms: 80
        set: {root: [0, 0, 0.04], curl: 0.3, flap: 0.75}
  hit:             # knocked back and up, wings jammed
    loop: false
    keys:
      - ms: 70
        set: {root: [0, 0, -0.08], bob: 0.05, pitch: -0.35, roll: 0.25, curl: -0.3, flap: 0.9, head_pitch: -0.2, leg: 0.4}
      - ms: 80
        set: {root: [0, 0, -0.07], bob: 0.02, pitch: -0.15, roll: 0.1, curl: -0.15, flap: -0.6, leg: 0.2}
      - ms: 80
        set: {root: [0, 0, -0.03], flap: 0.7}
  death:           # wings stop, spins and drops, lands on its back, legs curl
    loop: false
    keys:
      - ms: 80
        set: {root: [0, 0, -0.05], bob: 0.05, pitch: -0.3, roll: 0.4, curl: -0.3, flap: 0.9, leg: 0.4}
      - ms: 90
        set: {root: [0, 0, -0.06], bob: -0.15, pitch: 0.2, roll: 1.4, curl: 0.3, flap: -0.3, leg: 0.6}
      - ms: 90
        set: {root: [0, 0, -0.06], bob: -0.32, pitch: 0.1, roll: 2.4, curl: 0.4, flap: 0.2, leg: 0.8}
      - ms: 100
        set: {root: [0, 0, -0.06], bob: -0.44, roll: 3.0, curl: 0.3, flap: 0.1, leg: 1.0}
      - ms: 600
        set: {root: [0, 0, -0.06], bob: -0.45, roll: 3.1, curl: 0.25, flap: 0.05, leg: 1.1}
