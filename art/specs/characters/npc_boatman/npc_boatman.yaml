spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: npc_boatman
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.95, 0]}
shadow: {rx: 9, ry: 3.2, alpha: 120}

# Act II swamp-camp NPC "Tito, o barqueiro". Project style: topdown, 32 px, dark outline, flat, chibi, snappy.
brief:
  summary: >
    Chibi swamp boatman and guide - lean, wiry man, wide flat straw hat, faded teal sleeveless shirt
    with a red neckerchief, khaki trousers rolled up to the knee (bare shins and bare feet), coil of
    rope slung over the left shoulder across the chest, long dark punting pole held upright in the
    right hand, rising well above the hat.
  must_keep: [wide straw hat, long punting pole taller than him, rope coil across the chest, rolled trousers + bare shins]
  simplify: [no fingers, rope coil is two tori, hat is a crown + one wide brim, toes not modelled]
  decisions: >
    Head scale 1.75 (chibi), lean build from the hunter (thin limbs, narrow trunk). Colour identity:
    straw yellow hat + teal shirt + khaki, none used by Act I NPCs or heroes; the red neckerchief is the
    small accent. The pole lives in its own frame at wrist_R, kept world-vertical and planted on the
    ground, so it is the tallest silhouette of the camp (reads from afar as "the boatman"). Bare feet
    because he wades in the swamp. Idle: relaxed sway leaning on the pole. Talk: the free left hand
    waves/beckons at shoulder height ("come aboard").

ramps:
  straw: ["#1c0f1a", "#8a5a1c", "#d0a03a", "#ecd06a", "#f8eaa6"]
  shirt_teal: ["#1c0f1a", "#1d4a4a", "#2f7a72", "#4fa894", "#86cdb4"]
  khaki: ["#1c0f1a", "#3e2a24", "#62443a", "#86624f", "#a88470"]
  pole_dark: ["#1c0f1a", "#3a2416", "#5e3b22", "#82552f"]
  rope: ["#1c0f1a", "#7a5a30", "#b8925a", "#dcc08a"]

materials:
  skin:  {ramp: skin, bands: [2, 4], line_band: 2}
  shirt: {ramp: shirt_teal, bands: [1, 3]}
  pants: {ramp: khaki, bands: [1, 3]}
  hat:   {ramp: straw, bands: [1, 3]}
  band:  {ramp: cloth_red, bands: [1, 3]}
  hair:  {ramp: hair_dark, bands: [1, 2]}
  rope:  {ramp: rope, bands: [1, 3]}
  pole:  {ramp: pole_dark, bands: [1, 3]}
  ink:   {ramp: cloth, emissive: true, band: 0, outline: false}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.02
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  hand_L: [0.22, 0.04, 0.04]
  foot_L: [0.10, 0, 0.02]
  pitch_foot_L: 0
  pole_pitch: 0     # pole tilt forward (+) / back (-), world-vertical at 0

bones:
  torso_rot: {parent: root, pos: "[0, 0.56 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.40, 0.02], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.75}
  shoulder_L: {parent: pelvis, pos: [0.17, 0.30, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.08, -0.02, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  poleyaw:    {parent: root, rot: "[0, twist, 0]"}
  pole:       {parent: poleyaw, at: wrist_R, rot: "[pole_pitch, 0, 0]"}

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.18, 0.17],
          pole: [0.3, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.06, -0.02]", lengths: [0.26, 0.24],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:           # lean teal shirt
    material: shirt
    space: pelvis
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.07, 0], r: [0.14, 0.11, 0.11]}
      - ellipsoid: {c: [0, 0.23, 0.0], r: [0.16, 0.11, 0.115]}
      - cone: {a: [0, 0.02, 0], b: [0, -0.06, 0], r: [0.13, 0.14]}
  waist:           # rope belt
    material: rope
    space: pelvis
    prims:
      - cylinder: {a: [0, -0.04, 0], b: [0, 0.0, 0], r: 0.145}
  hips:            # khaki trousers top
    material: pants
    space: pelvis
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, -0.07, 0], r: [0.14, 0.07, 0.11]}
  scarf:           # red neckerchief, knot in front
    material: band
    space: pelvis
    blend: 0.02
    prims:
      - torus: {c: [0, 0.33, 0.0], R: 0.08, r: 0.035}
      - cone: {a: [0, 0.32, 0.08], b: [0.02, 0.24, 0.12], r: [0.04, 0.02]}
  coil:            # rope coil over the left shoulder, across the chest to the right hip
    material: rope
    space: pelvis
    blend: 0.015
    prims:
      - torus: {c: [0.03, 0.16, 0.0], R: 0.215, r: 0.032, rot: [0, 0, 0.9]}
      - torus: {c: [0.045, 0.175, 0.0], R: 0.205, r: 0.03, rot: [0.1, 0, 0.85]}
  neck:
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.30, 0], b: [0, 0.40, 0.02], r: [0.05, 0.045]}
  head:
    material: skin
    space: head
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.14, 0.0], r: [0.145, 0.15, 0.14]}
      - ellipsoid: {c: [0, 0.07, 0.03], r: [0.10, 0.07, 0.10]}           # long jaw
      - sphere: {c: [0, 0.11, 0.145], r: 0.024}
  hair:            # short black hair under the hat
    material: hair
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.15, -0.05], r: [0.152, 0.12, 0.12]}
  stubble:         # dark moustache
    material: hair
    space: head
    prims:
      - ellipsoid: {c: [0, 0.07, 0.135], r: [0.06, 0.018, 0.02]}
  hat:             # wide flat straw hat: low crown + big brim, red band
    material: hat
    space: head
    blend: 0.02
    prims:
      - cylinder: {a: [0, 0.23, -0.03], b: [0, 0.32, -0.03], r: 0.13, round: 0.03}
      - ellipsoid: {c: [0, 0.245, -0.03], r: [0.245, 0.024, 0.245], rot: [-0.18, 0, 0]}   # brim
  hatband:
    material: band
    space: head
    prims:
      - cylinder: {a: [0, 0.255, -0.03], b: [0, 0.28, -0.03], r: 0.135}
  eye_L:
    material: ink
    space: head
    line: false
    prims:
      - ellipsoid: {c: [0.055, 0.12, 0.135], r: [0.022, 0.026, 0.02]}
  sleeve_L:        # short sleeve
    material: shirt
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.07}
      - cone: {a: "@shoulder_L", b: {between: ["@shoulder_L", "@elbow_L"], t: 0.5}, r: [0.065, 0.06]}
  arm_L:           # bare wiry arm
    material: skin
    prims:
      - cone: {a: {between: ["@shoulder_L", "@elbow_L"], t: 0.4}, b: "@elbow_L", r: [0.048, 0.045]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.045, 0.042]}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.035], r: 0.05}
  leg_L:           # khaki thigh, rolled cuff below the knee
    material: pants
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.085, 0.07]}
      - cone: {a: "@knee_L", b: {between: ["@knee_L", "@ankle_L"], t: 0.2}, r: [0.08, 0.08]}
  shin_L:          # bare shin and foot
    material: skin
    blend: 0.03
    prims:
      - cone: {a: {between: ["@knee_L", "@ankle_L"], t: 0.2}, b: "@ankle_L", r: [0.045, 0.04]}
  foot_L:
    material: skin
    space: sole_L
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, -0.03, 0.05], r: [0.055, 0.035, 0.10]}
  pole:            # long punting pole, planted on the ground, rises far above the hat (right hand only)
    material: pole
    space: pole
    prims:
      - cylinder: {a: [0, -0.76, 0.0], b: [0, 1.42, 0.0], r: 0.03, round: 0.01}
  pole_grip:       # rope wrap where he holds it
    material: rope
    space: pole
    prims:
      - cylinder: {a: [0, -0.06, 0.0], b: [0, 0.10, 0.0], r: 0.038}

animations:
  idle:            # relaxed sway, leaning on the pole
    frames: 4
    ms: 180
    channels:
      bob: "0.025*sin(p)"
      squash: "1 + 0.015*sin(p)"
      roll: "-0.03*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      hand_L: "[0.22, 0.04 + 0.02*sin(p - 0.6), 0.04]"
      hand_R: "[0.36, 0.20, 0.04 + 0.20*pulse(yaw, 90, 60)]"
  talk:            # left hand waves/beckons at shoulder height, head nods
    frames: 4
    ms: 150
    channels:
      bob: "0.03*sin(2*p)"
      roll: "0.05*sin(p)"
      head_pitch: "-0.10*sin(2*p)"
      hand_L: "[0.26 + 0.06*sin(p), 0.36 + 0.03*cos(p), 0.18]"
      hand_R: "[0.36, 0.20, 0.04 + 0.20*pulse(yaw, 90, 60)]"
