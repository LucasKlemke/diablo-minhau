spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: npc_seer
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.95, 0]}
shadow: {rx: 9.5, ry: 3.4, alpha: 120}

# Act III village NPC "Lia", the seer of the Forte da Montanha.
# Project style: topdown, 32 px, dark outline, flat, chibi, snappy.
brief:
  summary: >
    Chibi young seer - slender, long pale-blue robe to the ground with a thick white fur hem and fur
    mantle over the shoulders, deep-blue sash, very long ink-blue hair down to the waist, deep-blue
    blindfold with two tails fluttering behind, cradling a glowing ice-blue crystal at her chest in
    both hands.
  must_keep: [glowing blue crystal (emissive), blindfold with tails, long dark hair, pale robe + white fur trim]
  simplify: [no fingers, no eyes (blindfold), crystal is two cones (bipyramid), fur hem is one torus]
  decisions: >
    Head scale 1.75 (chibi). The robe is white/pale blue as asked, so the snow readability comes from
    the dark outline, the ink-blue hair (a big dark mass in n/ne/e) and the deep-blue blindfold and
    sash; the crystal is the only emissive (frost ramp + glow) and is the brightest pixel cluster.
    Blindfold is deep blue rather than white so the face reads. Crystal lives in its own bone in front
    of the chest (pelvis space) so both hands cup it in idle; it pulses with the `shine` channel. Talk:
    the left hand leaves the crystal and opens toward the listener while the crystal brightens.

ramps:
  robe_ice: ["#1c0f1a", "#4f6390", "#8ea6d2", "#c6d8f0", "#eef4fc"]
  fur_snow: ["#1c0f1a", "#8f98ad", "#d6dce8", "#f6f8fc"]
  hair_ink: ["#1c0f1a", "#1a1e3c", "#2c3460", "#46508a"]
  sash_blue: ["#1c0f1a", "#16236a", "#2645b0", "#3f6ad8"]

materials:
  skin:  {ramp: skin, bands: [2, 4], line_band: 2}
  robe:  {ramp: robe_ice, bands: [1, 3]}
  fur:   {ramp: fur_snow, bands: [1, 3]}
  hair:  {ramp: hair_ink, bands: [1, 3]}
  sash:  {ramp: sash_blue, bands: [1, 3]}
  boots: {ramp: leather, bands: [1, 2]}
  crystal: {ramp: frost, emissive: true, band: 2, outline: false, glow: {color: "#7edaf2", mix: 0.5, radius: 1}}
  core:  {ramp: frost, emissive: true, band: 3, outline: false}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.0
  twist: 0
  roll: 0
  squash: 1
  head_pitch: -0.06
  head_yaw: 0
  hand_L: [0.09, 0.08, 0.25]
  foot_L: [0.08, 0, 0.03]
  pitch_foot_L: 0
  coat: 0           # robe hem sway (-1..1)
  tails: 0          # blindfold tails flutter (-1..1)
  shine: 1          # crystal pulse (scale)

bones:
  torso_rot: {parent: root, pos: "[0, 0.54 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.40, 0.02], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.75}
  shoulder_L: {parent: pelvis, pos: [0.16, 0.30, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.07, -0.02, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  coatbase:   {parent: root, pos: "[0, 0.54 + bob, 0]", rot: "[-coat*0.2, twist*0.5, 0]"}
  crystal:    {parent: torso_rot, pos: [0, 0.14, 0.27], scale: shine}

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.17, 0.16],
          pole: [0.5, -0.2, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.07, -0.02]", lengths: [0.25, 0.23],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:           # slender bodice
    material: robe
    space: pelvis
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.06, 0], r: [0.13, 0.11, 0.105]}
      - ellipsoid: {c: [0, 0.22, 0.0], r: [0.145, 0.11, 0.11]}
  robe:            # long skirt to the ground
    material: robe
    space: coatbase
    blend: 0.03
    prims:
      - cone: {a: [0, 0.02, 0], b: [0, -0.46, 0], r: [0.14, 0.24]}
  hem:             # white fur hem
    material: fur
    space: coatbase
    prims:
      - torus: {c: [0, -0.45, 0], R: 0.22, r: 0.045}
  sash:            # deep-blue sash with a hanging end
    material: sash
    space: pelvis
    blend: 0.01
    prims:
      - cylinder: {a: [0, 0.04, 0], b: [0, 0.10, 0], r: 0.142}
      - cone: {a: [0.06, 0.06, 0.13], b: [0.08, -0.20, 0.17], r: [0.035, 0.03]}
  mantle:          # fur mantle over the shoulders
    material: fur
    space: pelvis
    blend: 0.05
    prims:
      - torus: {c: [0, 0.33, -0.01], R: 0.13, r: 0.07}
      - ellipsoid: {c: [0, 0.31, -0.06], r: [0.20, 0.08, 0.12]}
  neck:
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.30, 0], b: [0, 0.40, 0.02], r: [0.045, 0.04]}
  head:
    material: skin
    space: head
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.14, 0.0], r: [0.145, 0.15, 0.14]}
      - ellipsoid: {c: [0, 0.08, 0.03], r: [0.10, 0.08, 0.10]}
  hair:            # long ink-blue hair: crown, fringe parted, long fall down the back
    material: hair
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.18, -0.02], r: [0.16, 0.125, 0.152]}
      - ellipsoid: {c: [0, 0.10, -0.08], r: [0.155, 0.12, 0.10]}
      - ellipsoid: {c: [0, -0.06, -0.13], r: [0.11, 0.14, 0.055]}
      - ellipsoid: {c: [0, -0.20, -0.14], r: [0.08, 0.08, 0.04]}
    cut:
      - box: {c: [0, 0.08, 0.17], half: [0.14, 0.135, 0.1]}
  locks_L:         # side locks framing the face
    material: hair
    space: head
    blend: 0.02
    prims:
      - chain: {pts: [[0.13, 0.17, 0.06], [0.145, 0.08, 0.06], [0.14, 0.01, 0.04]], r: [0.035, 0.032, 0.022]}
  blindfold:       # deep-blue band over the eyes
    material: sash
    space: head
    prims:
      - torus: {c: [0, 0.14, 0.0], R: 0.145, r: 0.02}
  tail_L:          # knot tails fluttering behind the head
    material: sash
    space: head
    prims:
      - chain: {pts: [[0.03, 0.13, -0.15], "[0.07, 0.10 + 0.02*tails, -0.24]", "[0.09, 0.06 + 0.04*tails, -0.32]"],
                r: [0.03, 0.026, 0.018]}
  arm_L:           # wide robe sleeve with a fur cuff
    material: robe
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.06}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.055, 0.055]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.055, 0.075]}
  cuff_L:
    material: fur
    space: wrist_L
    prims:
      - torus: {c: [0, 0, -0.01], R: 0.06, r: 0.025, rot: [1.5708, 0, 0]}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.035], r: 0.048}
  boot_L:          # boot tips under the hem
    material: boots
    space: sole_L
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, -0.02, 0.06], r: [0.06, 0.045, 0.09]}
  crystal:         # glowing ice crystal (bipyramid)
    material: crystal
    space: crystal
    blend: 0.0
    prims:
      - cone: {a: [0, 0.0, 0], b: [0, 0.19, 0], r: [0.09, 0.014]}
      - cone: {a: [0, 0.0, 0], b: [0, -0.11, 0], r: [0.09, 0.014]}
  crystal_core:
    material: core
    space: crystal
    prims:
      - sphere: {c: [0, 0.02, 0.05], r: 0.035}

animations:
  idle:            # calm breath, crystal pulses, hair tails drift
    frames: 4
    ms: 180
    channels:
      bob: "0.025*sin(p)"
      squash: "1 + 0.015*sin(p)"
      head_pitch: "-0.06 - 0.03*sin(p - 0.5)"
      hand_L: "[0.09, 0.08 + 0.015*sin(p), 0.25]"
      hand_R: "[0.09, 0.08 + 0.015*sin(p), 0.25]"
      coat: "0.10*sin(p - 1.0)"
      tails: "sin(p - 1.2)"
      shine: "1 + 0.08*sin(p)"
  talk:            # left hand opens toward the listener, crystal brightens, head tilts
    frames: 4
    ms: 150
    channels:
      bob: "0.015*sin(2*p)"
      head_pitch: "-0.06 - 0.06*sin(2*p)"
      hand_L: "[0.24 + 0.04*sin(p), 0.24 + 0.05*sin(p), 0.20]"
      hand_R: "[0.09, 0.08, 0.25]"
      coat: "0.08*sin(p - 1.0)"
      tails: "sin(2*p - 1.2)"
      shine: "1.08 + 0.10*sin(2*p)"
