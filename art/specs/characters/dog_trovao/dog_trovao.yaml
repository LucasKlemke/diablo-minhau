spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: dog_trovao
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.50, -0.05]}
shadow: {rx: 14, ry: 5, alpha: 120}

# Trovão, the big shaggy village mutt (Act I; the purified form of the boss "Trovão, o Uivador").
# Quadruped skeleton from wolf.yaml, authored in "wolf units" and grown by the `rig` bone (scale 1.2):
# the largest of the three barn dogs, clearly bigger than the wolf. Parts live in spaces under `rig` so
# radii grow too. IK targets are in the scaled body space, but IK `lengths` are world units (wolf x 1.2);
# the head bone does not inherit the rig scale (its 2.7 is final). Four 2-bone IK legs (_L mirrored),
# paw targets in body space (`plant` 1 cancels `bob`). Ears are floppy: they hang from the skull and
# `ear_L` swings them out (+) for flaps in the run and the shake.
brief:
  summary: big, gentle, slightly clumsy shaggy mutt; slate blue-grey scruffy long coat, lighter grey chest
    and beard-like muzzle, floppy ears, bushy tail, kind dark eyes
  must_keep: [slate blue-grey shaggy coat with a ragged belly fringe, pale grey chest bib and beard,
    floppy hanging ears, bushy tail with a pale tip, dark kind eyes, largest of the three dogs]
  simplify: [no fur strands; shagginess is a few hanging tufts on the belly line, cheeks and tail;
    no toes; eyes are dark dots]
  decisions: rig scale 1.2 over the wolf-unit skeleton (1.2x the wolf, the largest of the three barn dogs,
    which are wolf-sized; 1.35 clipped the 48 px frame in the howl); head 2.7 (chibi, big and round); the slate is greyer than
    Jimmy's steel-blue coat so they never read as the same dog; the pale beard hangs from the jaw so it
    opens with the mouth; dark eyes are non-emissive (a pet, not a monster) under shaggy brow tufts;
    walk is slower than the wolf's (100 ms) for the clumsy weight.
  exceptions: rig scale 1.2; same camera scale/pitch/light; spec-local ramps.

ramps:
  tr_slate: ["#1c0f1a", "#303750", "#4d5872", "#75819a", "#a2adc0"]
  tr_pale:  ["#1c0f1a", "#6c7080", "#a2a6b4", "#cdd0d8", "#eceef2"]
  tr_ear:   ["#1c0f1a", "#262a3c", "#3a4258", "#56607a"]
  tr_dark:  ["#1c0f1a", "#1f1c28", "#2e2b3a", "#46435a"]
  tr_eye:   ["#1c0f1a", "#1c0f1a", "#2b1a1e", "#ffffff"]
  tr_water: ["#3a6aa0", "#7ec4ea", "#c8ecfa", "#f2fcff"]
  tr_pink:  ["#1c0f1a", "#8a4a52", "#c87a7e", "#e8a8a8"]

materials:
  fur:   {ramp: tr_slate, bands: [1, 4]}
  earfur: {ramp: tr_ear, bands: [1, 3]}
  pale:  {ramp: tr_pale, bands: [2, 4]}
  dark:  {ramp: tr_dark, bands: [1, 2]}
  pink:  {ramp: tr_pink, bands: [1, 2], outline: false}
  mouth: {ramp: mouth, bands: [1, 2], outline: false, line: false}
  water: {ramp: tr_water, emissive: true, band: 2, outline: false, line: false}
  eye:   {ramp: tr_eye, bands: [1, 2], outline: false, line: false}

channels:
  root: [0, 0, 0]
  bob: 0            # body height offset
  plant: 1          # 1: paws stay on the ground when bob changes; 0: paws follow the body (sit)
  rear: 0           # + raises the front of the body
  roll: 0           # roll around the body length (shake)
  twist: 0          # body yaw wiggle
  squash: 1
  head_pitch: 0     # + looks down
  head_yaw: 0
  head_tilt: 0      # head roll
  jaw: 0            # + opens the mouth
  ear_L: 0          # + flaps the floppy ear out
  tail: 0           # tail wag (yaw)
  tail_up: 0        # + raises the tail
  spray: 0          # 0..1 water droplets flung off in the shake
  ffoot_L: [0.13, -0.43, 0.23]    # front paw target (body space)
  hfoot_L: [0.13, -0.43, -0.23]   # hind paw target (body space)

bones:
  rig:      {parent: root, scale: 1.2}
  body:     {parent: rig, pos: "[0, 0.49 + bob, 0]", rot: "[-rear, twist, roll]",
             scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase: {parent: body, pos: [0, 0.26, 0.40], inherit_scale: false}
  head:     {parent: headbase, rot: "[0.10 + head_pitch + 0.8*rear, head_yaw, head_tilt]", scale: 2.7}
  jaw:      {parent: head, pos: [0, -0.01, 0.07], rot: "[jaw, 0, 0]"}
  ear_L:    {parent: head, pos: [0.085, 0.085, -0.01], rot: "[0.15, 0, 0.30 + ear_L]"}
  tail:     {parent: body, pos: [0, 0.07, -0.33], rot: "[-0.75 + tail_up, tail, 0]"}
  shoulder_L: {parent: body, pos: [0.12, -0.04, 0.21]}
  hip_L:      {parent: body, pos: [0.12, -0.04, -0.21]}

ik:
  fleg_L: {start: shoulder_L, space: body, target: "ffoot_L + [0, 0.04 - bob*plant, 0]", lengths: [0.252, 0.24],
           pole: [0, 0, -1], pole_space: body, joint: felbow_L, end: fpaw_L}
  hleg_L: {start: hip_L, space: body, target: "hfoot_L + [0, 0.04 - bob*plant, 0]", lengths: [0.252, 0.252],
           pole: [0, 0, 1], pole_space: body, joint: hknee_L, end: hpaw_L}

parts:
  torso:           # heavy chest, barrel body, hips
    material: fur
    space: body
    blend: 0.09
    prims:
      - ellipsoid: {c: [0, 0.03, 0.14], r: [0.22, 0.21, 0.21]}
      - ellipsoid: {c: [0, 0.04, -0.04], r: [0.20, 0.18, 0.17]}
      - ellipsoid: {c: [0, 0.04, -0.20], r: [0.20, 0.18, 0.17]}
      - cone: {a: [0, 0.08, 0.22], b: [0, 0.24, 0.34], r: [0.16, 0.12]}     # neck
      - ellipsoid: {c: [0, 0.17, 0.10], r: [0.13, 0.08, 0.12]}              # shaggy withers
  shag_L:          # long coat hanging from the flanks in ragged tufts
    material: fur
    space: body
    blend: 0.05
    prims:
      - ellipsoid: {c: [0.13, -0.06, 0.10], r: [0.10, 0.11, 0.13]}
      - ellipsoid: {c: [0.13, -0.06, -0.13], r: [0.10, 0.11, 0.14]}
      - cone: {a: [0.15, -0.10, 0.16], b: [0.17, -0.21, 0.17], r: [0.05, 0.016]}
      - cone: {a: [0.16, -0.10, 0.02], b: [0.18, -0.20, 0.0], r: [0.05, 0.016]}
      - cone: {a: [0.15, -0.10, -0.12], b: [0.17, -0.21, -0.14], r: [0.05, 0.016]}
      - cone: {a: [0.12, -0.10, -0.26], b: [0.13, -0.23, -0.30], r: [0.05, 0.016]}
  chest:           # pale grey bib hanging in a point between the front legs
    material: pale
    space: body
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.03, 0.35], r: [0.16, 0.20, 0.10], rot: [0.45, 0, 0]}
      - cone: {a: [0, -0.06, 0.32], b: [0, -0.23, 0.30], r: [0.08, 0.022]}
      - ellipsoid: {c: [0, -0.13, 0.05], r: [0.12, 0.08, 0.20]}            # pale belly line
  head:            # big shaggy skull, cheek tufts and brows
    material: fur
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.05, -0.01], r: [0.12, 0.10, 0.11]}
      - ellipsoid: {c: [0.085, -0.01, -0.01], r: [0.05, 0.065, 0.055]}           # cheek shag
      - ellipsoid: {c: [-0.085, -0.01, -0.01], r: [0.05, 0.065, 0.055]}
      - cone: {a: [0.09, -0.02, 0.0], b: [0.12, -0.09, 0.0], r: [0.035, 0.012]}  # cheek tufts
      - cone: {a: [-0.09, -0.02, 0.0], b: [-0.12, -0.09, 0.0], r: [0.035, 0.012]}
      - ellipsoid: {c: [0.05, 0.125, 0.05], r: [0.045, 0.026, 0.04], rot: [-0.3, 0, 0]}   # brows
      - ellipsoid: {c: [-0.05, 0.125, 0.05], r: [0.045, 0.026, 0.04], rot: [-0.3, 0, 0]}
      - ellipsoid: {c: [0, 0.14, -0.02], r: [0.06, 0.035, 0.05]}                # scruffy top tuft
  snout:           # broad pale muzzle
    material: pale
    space: head
    blend: 0.03
    prims:
      - cone: {a: [0, 0.03, 0.06], b: [0, 0.015, 0.165], r: [0.062, 0.048]}
  beard:           # beard-like fur hanging under the muzzle (opens with the jaw)
    material: pale
    space: jaw
    blend: 0.03
    prims:
      - cone: {a: [0, -0.02, 0.0], b: [0, -0.02, 0.09], r: [0.045, 0.035]}
      - ellipsoid: {c: [0, -0.05, 0.06], r: [0.045, 0.04, 0.04]}
      - cone: {a: [0, -0.06, 0.07], b: [0, -0.11, 0.065], r: [0.032, 0.01]}
  mouth:
    when: "jaw > 0.12"
    material: mouth
    space: head
    prims:
      - ellipsoid: {c: [0, -0.005, 0.12], r: [0.04, 0.02, 0.06]}
  tongue:
    when: "jaw > 0.18"
    material: pink
    space: jaw
    prims:
      - ellipsoid: {c: [0.015, -0.02, 0.12], r: [0.028, 0.012, 0.05], rot: [0.3, 0, 0]}
  nose:
    material: dark
    space: head
    prims:
      - sphere: {c: [0, 0.04, 0.175], r: 0.032}
  eye_L:
    material: eye
    space: head
    prims:
      - sphere: {c: [0.052, 0.075, 0.092], r: 0.03}
  ear_L:           # floppy ear hanging beside the head (darker slate so it reads against the skull)
    material: earfur
    space: ear_L
    blend: 0.02
    prims:
      - ellipsoid: {c: [0.015, -0.06, 0.0], r: [0.032, 0.085, 0.06]}
      - cone: {a: [0.015, -0.10, 0.0], b: [0.02, -0.16, -0.005], r: [0.045, 0.018]}
  tail:            # bushy tail, held level
    material: fur
    space: tail
    blend: 0.05
    prims:
      - chain: {pts: [[0, 0, 0], [0, 0.0, -0.12], [0, 0.03, -0.24], [0, 0.08, -0.34]], r: [0.07, 0.11, 0.12, 0.08]}
      - cone: {a: [0, -0.02, -0.16], b: [0, -0.13, -0.20], r: [0.05, 0.015]}     # hanging tuft
  tail_tip:
    material: pale
    space: tail
    blend: 0.03
    prims:
      - sphere: {c: [0, 0.09, -0.37], r: 0.065}
  fleg_L:
    material: fur
    space: rig
    blend: 0.03
    prims:
      - ellipsoid: {c: {at: shoulder_L, off: [0, 0.02, -0.02]}, r: [0.09, 0.13, 0.10]}
      - cone: {a: "@shoulder_L", b: "@felbow_L", r: [0.065, 0.048]}
      - cone: {a: "@felbow_L", b: "@fpaw_L", r: [0.046, 0.04]}
      - cone: {a: "@felbow_L", b: {at: felbow_L, off: [0, -0.10, -0.06]}, r: [0.04, 0.012]}   # elbow feathering
      - ellipsoid: {c: {at: fpaw_L, off: [0, -0.01, 0.03]}, r: [0.05, 0.035, 0.06]}
  hleg_L:
    material: fur
    space: rig
    blend: 0.03
    prims:
      - ellipsoid: {c: {at: hip_L, off: [0, 0.02, 0.0]}, r: [0.095, 0.14, 0.12]}
      - cone: {a: "@hip_L", b: "@hknee_L", r: [0.075, 0.05]}
      - cone: {a: "@hknee_L", b: "@hpaw_L", r: [0.046, 0.04]}
      - ellipsoid: {c: {at: hpaw_L, off: [0, -0.01, 0.03]}, r: [0.05, 0.035, 0.06]}
  spray:           # droplets flung off the coat in the shake (rig space: they do not roll with the body)
    when: "spray > 0.05"
    material: water
    space: rig
    prims:
      - sphere: {c: "[0.30 + 0.12*spray, 0.62 + 0.06*spray, 0.12]", r: 0.045}
      - sphere: {c: "[-0.32 - 0.10*spray, 0.70 + 0.05*spray, -0.06]", r: 0.045}
      - sphere: {c: "[0.26 + 0.10*spray, 0.78 + 0.08*spray, -0.22]", r: 0.04}
      - sphere: {c: "[-0.28 - 0.12*spray, 0.56 + 0.04*spray, 0.26]", r: 0.04}
      - sphere: {c: "[0.05, 0.95 + 0.10*spray, -0.10]", r: 0.04}
      - sphere: {c: "[0.34 + 0.08*spray, 0.50, -0.38]", r: 0.04}
      - sphere: {c: "[-0.30 - 0.08*spray, 0.84 + 0.06*spray, 0.40]", r: 0.04}

sockets:
  head: {bone: head, offset: [0, 0.18, 0]}
  mouth: {bone: head, offset: [0, 0.0, 0.20]}

animations:
  idle:            # happy panting, tongue out, tail wagging
    frames: 6
    ms: 130
    channels:
      bob: "0.012*sin(2*p)"
      squash: "1 + 0.02*sin(2*p)"
      jaw: "0.26 + 0.06*sin(2*p)"
      head_pitch: "0.03*sin(2*p)"
      tail: "0.5*sin(p)"
      ear_L: "0.06*sin(2*p - 1)"
  walk:            # heavy, slightly clumsy trot: diagonal pairs, head nods, ears and tail flop behind
    frames: 6
    ms: 100
    events: {0: step_l, 3: step_r}
    channels:
      bob: "0.02*cos(2*p)"
      twist: "0.05*sin(p)"
      roll: "0.03*sin(p)"
      head_pitch: "0.04 + 0.05*cos(2*p)"
      jaw: 0.2
      tail: "0.35*sin(p - 0.8)"
      tail_up: 0.15
      ear_L: "0.12 + 0.12*sin(2*p - 1.2)"
      ffoot_L: "[0.13, -0.43 + 0.09*pos(-sin(p)), 0.23 + 0.13*cos(p)]"
      hfoot_R: "[0.13, -0.43 + 0.09*pos(-sin(p)), -0.23 + 0.13*cos(p)]"
      ffoot_R: "[0.13, -0.43 + 0.09*pos(sin(p)), 0.23 - 0.13*cos(p)]"
      hfoot_L: "[0.13, -0.43 + 0.09*pos(sin(p)), -0.23 - 0.13*cos(p)]"
  run:             # happy lolloping gallop: front pair then hind pair, body rocks, ears flap, tongue out
    frames: 6
    ms: 75
    events: {0: step_l, 3: step_r}
    channels:
      bob: "0.03 + 0.035*sin(p)"
      rear: "0.09*sin(p + 0.6)"
      squash: "1 + 0.04*sin(p)"
      head_pitch: "0.12 - 0.08*sin(p + 0.6)"
      jaw: 0.3
      tail: "0.2*sin(p - 1.0)"
      tail_up: "0.45 + 0.1*sin(p - 1.0)"
      ear_L: "0.35 + 0.3*sin(p - 1.4)"
      ffoot_L: "[0.13, -0.43 + 0.13*pos(sin(p)), 0.25 + 0.20*cos(p)]"
      ffoot_R: "[0.13, -0.43 + 0.13*pos(sin(p - 0.5)), 0.25 + 0.20*cos(p - 0.5)]"
      hfoot_L: "[0.13, -0.43 + 0.12*pos(sin(p + 2.6)), -0.23 + 0.20*cos(p + 2.6)]"
      hfoot_R: "[0.13, -0.43 + 0.12*pos(sin(p + 2.1)), -0.23 + 0.20*cos(p + 2.1)]"
  sit:             # plops down on his haunches and holds; the last frame is the resting sit
    loop: false
    keys:
      - ms: 90
        set: {bob: -0.10, plant: 0, rear: 0.2, head_pitch: -0.05, tail: 0.2, jaw: 0.1,
              ffoot_L: [0.13, -0.37, 0.19], ffoot_R: [0.13, -0.37, 0.19], hfoot_L: [0.14, -0.30, -0.19], hfoot_R: [0.14, -0.30, -0.19]}
      - ms: 110
        set: {bob: -0.18, plant: 0, rear: 0.45, head_pitch: -0.05, jaw: 0.1, squash: 0.95,
              ffoot_L: [0.13, -0.338, 0.134], ffoot_R: [0.13, -0.338, 0.134], hfoot_L: [0.15, -0.207, -0.136], hfoot_R: [0.15, -0.207, -0.136]}
      - ms: 200
        set: {bob: -0.19, plant: 0, rear: 0.45, squash: 0.98, head_pitch: 0.0, jaw: 0.25, tail: -0.25, ear_L: 0.1,
              ffoot_L: [0.13, -0.338, 0.134], ffoot_R: [0.13, -0.338, 0.134], hfoot_L: [0.15, -0.207, -0.136], hfoot_R: [0.15, -0.207, -0.136]}
      - ms: 400
        set: {bob: -0.18, plant: 0, rear: 0.45, head_pitch: -0.05, jaw: 0.28, tail: 0.25, head_tilt: 0.14,
              ffoot_L: [0.13, -0.338, 0.134], ffoot_R: [0.13, -0.338, 0.134], hfoot_L: [0.15, -0.207, -0.136], hfoot_R: [0.15, -0.207, -0.136]}
  bark:            # one deep bark, then a short happy howl, nose to the sky
    loop: false
    keys:
      - ms: 100
        set: {bob: -0.03, squash: 0.94, head_pitch: 0.22, jaw: 0.05, ear_L: -0.1, tail: 0.2}
      - ms: 70
        event: bark
        set: {root: [0, 0, 0.03], rear: 0.06, squash: 1.06, head_pitch: -0.18, jaw: 0.6, ear_L: 0.45, tail: -0.2, tail_up: 0.2}
      - ms: 110
        set: {root: [0, 0, 0.02], head_pitch: -0.02, jaw: 0.22, ear_L: 0.15, tail: 0.3, tail_up: 0.2}
      - ms: 110
        set: {bob: 0.01, rear: 0.12, squash: 1.02, head_pitch: -0.35, jaw: 0.2, ear_L: 0.0, tail: -0.3, tail_up: 0.25}
      - ms: 260
        event: howl
        set: {bob: 0.02, rear: 0.18, squash: 1.04, head_pitch: -0.85, jaw: 0.45, ear_L: -0.15, tail: 0.3, tail_up: 0.3}
      - ms: 220
        set: {bob: 0.02, rear: 0.18, squash: 1.05, head_pitch: -0.9, jaw: 0.5, ear_L: -0.2, tail: -0.3, tail_up: 0.3}
      - ms: 160
        set: {head_pitch: -0.1, jaw: 0.28, ear_L: 0.1, tail: 0.4, tail_up: 0.2}
  shake:           # wet-dog shake from head to tail, fur and droplets flying, then a happy grin
    loop: false
    keys:
      - ms: 120
        event: shake_start
        set: {bob: -0.03, squash: 0.93, head_pitch: 0.15, ear_L: -0.05}
      - ms: 55
        set: {roll: 0.28, twist: 0.12, head_yaw: -0.45, head_tilt: -0.35, ear_L: 0.9, tail: -0.6, spray: 0.5, squash: 1.03}
      - ms: 55
        set: {roll: -0.30, twist: -0.12, head_yaw: 0.45, head_tilt: 0.35, ear_L: 0.2, tail: 0.6, spray: 0.8, squash: 1.0}
      - ms: 55
        set: {roll: 0.30, twist: 0.12, head_yaw: -0.45, head_tilt: -0.35, ear_L: 0.9, tail: -0.6, spray: 1.0, squash: 1.03}
      - ms: 55
        set: {roll: -0.30, twist: -0.12, head_yaw: 0.45, head_tilt: 0.35, ear_L: 0.2, tail: 0.6, spray: 1.0, squash: 1.0}
      - ms: 55
        set: {roll: 0.22, twist: 0.08, head_yaw: -0.3, head_tilt: -0.25, ear_L: 0.7, tail: -0.5, spray: 0.7, squash: 1.02}
      - ms: 60
        set: {roll: -0.12, twist: -0.05, head_yaw: 0.2, head_tilt: 0.15, ear_L: 0.3, tail: 0.4, spray: 0.4}
      - ms: 220
        set: {bob: 0.01, head_pitch: -0.08, head_tilt: 0.12, jaw: 0.3, ear_L: 0.15, tail: 0.45, tail_up: 0.2}
      - ms: 200
        set: {head_pitch: -0.04, head_tilt: 0.0, jaw: 0.28, ear_L: 0.1, tail: -0.45, tail_up: 0.2}
