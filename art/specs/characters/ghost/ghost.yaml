spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: ghost
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 1.02, 0]}
shadow: {rx: 8, ry: 3, alpha: 90}

# Ghost: floating undead (crypts, graveyard). Chibi sheet ghost with a big round head, hollow dark eyes,
# ragged sleeve-arms ending in dark claws, and a wispy tail instead of legs. ~30 px tall on screen.
brief:
  summary: floating chibi ghost ~30 px tall, pale blue-white sheet body (big round head flowing into a
    tapering body), hollow dark oval eyes and a small dark O mouth, two ragged sleeve-arms with three dark
    claws each, body ends in a curling wispy tail (no legs), hovering above its shadow
  must_keep: [hollow dark eyes, pale blue-white sheet body, wispy tail instead of legs, claws for the swipe,
    gap between tail and shadow]
  simplify: [no fingers beyond 3 claws, no face beyond eyes and mouth, translucency suggested by colour only]
  decisions: |
    "Translucent-looking" is suggested with a cool pale ramp whose shadow band is a soft periwinkle (no real
    alpha: the engine can lower the sprite alpha if wanted). The dark project outline is kept.
    Claws are dark slate so they read against the pale body and over snow/stone floors.
    Two small side tongues at the hem plus the main tail make the "wispy" bottom; the tail sways and trails.
    Attack is a right-hand claw swipe across the front with a horizontal smear; mirrored directions swap hands.
    Death: the ghost wails (mouth open), stretches upward and dissolves into shrinking wisps.

ramps:
  ghost:      ["#1c0f1a", "#5e6fa6", "#9fb4e2", "#d4e2f8", "#f2f7ff"]
  ghost_hole: ["#1c0f1a", "#15112a", "#251c40"]
  ghost_claw: ["#1c0f1a", "#2a2f4c", "#454e78", "#6b77a6"]

materials:
  sheet: {ramp: ghost, bands: [2, 4]}
  claw:  {ramp: ghost_claw, bands: [1, 3]}
  hole:  {ramp: ghost_hole, emissive: true, band: 1, outline: false, line: false}
  fx_tail: {ramp: frost, emissive: true, band: 1}
  fx_mid:  {ramp: frost, emissive: true, band: 2}
  fx_core: {ramp: fx_core, emissive: true}

channels:
  root: [0, 0, 0]
  hover: 0.30       # float height
  bob: 0
  lean: 0.05
  twist: 0
  roll: 0
  squash: 1
  head_pitch: -0.25
  head_tilt: 0
  hand_L: [0.32, 0.60, 0.30]
  hand_R: [0.32, 0.60, 0.30]
  claw_L: 0         # claw spread (+ open)
  claw_R: 0
  tail: 0           # tail side sway (-1..1)
  trail: 0          # tail streaming back
  mouth: 0          # mouth open (wail)
  fade: 1           # body size factor on death (dissolve)
  smear_w: 0
  smear_a0: 0
  smear_a1: 0
  smear_r: 0.78
  smear_y: 0.62
  smear_fade: 1

bones:
  float:     {parent: root, pos: "[0, hover + bob, 0]", scale: 1.15}
  body:      {parent: float, rot: "[lean, twist, roll]", scale: "[fade/sqrt(squash), fade*squash, fade/sqrt(squash)]"}
  head:      {parent: body, pos: [0, 1.12, 0.02], rot: "[head_pitch, 0, head_tilt]"}
  tailbase:  {parent: body, pos: [0, 0.40, -0.02], rot: "[0, tail*0.5, 0]"}
  shoulder_L: {parent: body, pos: [0.26, 0.82, 0.02]}
  fxspace:   {parent: float, rot: "[0, twist*0.3, 0]"}

ik:
  arm_L: {start: shoulder_L, space: body, target: hand_L, lengths: [0.22, 0.22],
          pole: [0.6, -0.2, -1.0], pole_space: body, up: [0, 0, 1], joint: elbow_L, end: wrist_L}

parts:
  sheet:           # head and body: one sheet flowing down from the round head, flaring at the hem
    material: sheet
    space: body
    blend: 0.14
    prims:
      - sphere: {c: [0, 1.12, 0.02], r: 0.37}
      - cone: {a: [0, 1.02, 0.0], b: [0, 0.48, -0.02], r: [0.30, 0.33]}
      - ellipsoid: {c: [0, 0.48, -0.03], r: [0.33, 0.12, 0.30]}
  tail:            # main wispy tail curling back and down
    material: sheet
    space: tailbase
    blend: 0.08
    prims:
      - chain:
          pts: ["[0, 0.06, 0]", "[0.10*tail, -0.14, -0.14 - 0.10*trail]", "[0.22*tail, -0.26, -0.34 - 0.20*trail]", "[0.30*tail, -0.28 + 0.06*trail, -0.56 - 0.28*trail]"]
          r: [0.28, 0.18, 0.09, 0.02]
  tongue_L:        # small side tongues of the ragged hem
    material: sheet
    space: tailbase
    blend: 0.04
    prims:
      - chain:
          pts: ["[0.22, 0.04, 0.10]", "[0.27 + 0.04*tail, -0.10, 0.10 - 0.06*trail]", "[0.26 + 0.08*tail, -0.20, 0.04 - 0.14*trail]"]
          r: [0.09, 0.05, 0.015]
  arm_L:           # sleeve arm, wider at the cuff
    material: sheet
    blend: 0.04
    prims:
      - sphere: {c: "@shoulder_L", r: 0.10}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.09, 0.08]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.08, 0.11]}
  claws_L:
    material: claw
    space: wrist_L
    blend: 0.01
    prims:
      - cone: {a: [0.03, -0.02, 0.06], b: ["0.10 + 0.06*claw_L", -0.14, 0.18], r: [0.04, 0.014]}
      - cone: {a: [0, -0.02, 0.07], b: [0, -0.17, 0.21], r: [0.04, 0.014]}
      - cone: {a: [-0.03, -0.02, 0.06], b: ["-0.10 - 0.06*claw_L", -0.14, 0.18], r: [0.04, 0.014]}
  eyes:            # hollow dark ovals
    material: hole
    space: head
    prims:
      - ellipsoid: {c: [0.13, 0.05, 0.31], r: [0.085, 0.13, 0.09], rot: [0, 0.38, 0]}
      - ellipsoid: {c: [-0.13, 0.05, 0.31], r: [0.085, 0.13, 0.09], rot: [0, -0.38, 0]}
  mouth:
    material: hole
    space: head
    prims:
      - ellipsoid: {c: [0, -0.15, 0.32], r: ["0.045 + 0.03*mouth", "0.04 + 0.07*mouth", 0.06], rot: [-0.4, 0, 0]}
  smear:
    when: "smear_w > 0"
    materials: [fx_tail, fx_mid, fx_core]
    space: fxspace
    prims:
      - arc: {c: "[0, smear_y, 0.10]", r: smear_r, a0: smear_a0, a1: smear_a1, width: smear_w, fade: smear_fade, dip: 0.06}

sockets:
  hit: {bone: fxspace, offset: [0, 0.8, 0.55]}
  head: {bone: head, offset: [0, 0.30, 0]}

timing: {attack: {hit: 260ms, total: 520ms}}

animations:
  idle:            # slow float, arms drift, tail sways
    frames: 4
    ms: 160
    channels:
      bob: "0.06*sin(p)"
      squash: "1 + 0.015*sin(p)"
      head_pitch: "-0.25 - 0.04*sin(p - 0.6)"
      hand_L: "[0.32, 0.60 + 0.04*sin(p - 0.8), 0.30]"
      hand_R: "[0.32, 0.60 + 0.04*sin(p - 0.8), 0.30]"
      tail: "0.6*sin(p - 1.0)"
      trail: "0.15 + 0.1*sin(p - 1.4)"
  walk:            # glide forward: lean, arms reach, tail streams back
    frames: 4
    ms: 110
    channels:
      lean: 0.20
      bob: "0.04*sin(p)"
      twist: "0.06*sin(p)"
      head_pitch: -0.28
      hand_L: "[0.32, 0.46 + 0.05*sin(p), 0.30 + 0.05*sin(p)]"
      hand_R: "[0.32, 0.46 - 0.05*sin(p), 0.30 - 0.05*sin(p)]"
      tail: "0.7*sin(p - 1.0)"
      trail: "0.8 + 0.15*sin(p - 1.4)"
  attack:          # right-claw swipe across the front (hit 260 ms, total 520 ms)
    loop: false
    keys:
      - ms: 140
        event: windup
        set: {lean: -0.10, bob: 0.04, squash: 1.04, twist: -0.45, head_pitch: -0.30, mouth: 0.5,
              hand_R: [0.42, 0.92, -0.12], claw_R: 0.8, hand_L: [0.30, 0.56, 0.30], tail: -0.6, trail: 0.2}
      - ms: 120
        set: {lean: -0.12, bob: 0.06, squash: 1.06, twist: -0.55, head_pitch: -0.32, mouth: 0.6,
              hand_R: [0.44, 0.98, -0.18], claw_R: 1.0, hand_L: [0.30, 0.54, 0.30], tail: -0.8, trail: 0.2}
      - ms: 60
        event: hit
        set: {root: [0, 0, 0.10], lean: 0.30, squash: 0.95, twist: 0.45, head_pitch: -0.22, mouth: 0.8,
              hand_R: [-0.10, 0.55, 0.50], claw_R: 1.0, hand_L: [0.34, 0.60, 0.10], tail: 0.8, trail: 0.6,
              smear_a0: -1.2, smear_a1: 1.0, smear_w: 0.10}
      - ms: 90
        set: {root: [0, 0, 0.10], lean: 0.28, squash: 0.97, twist: 0.60, head_pitch: -0.22, mouth: 0.5,
              hand_R: [-0.22, 0.48, 0.38], claw_R: 0.6, hand_L: [0.34, 0.60, 0.10], tail: 0.9, trail: 0.5,
              smear_a0: -0.2, smear_a1: 1.4, smear_w: 0.06, smear_fade: 0.7}
      - ms: 110
        set: {root: [0, 0, 0.04], lean: 0.12, twist: 0.20, mouth: 0.1, hand_R: [0.20, 0.52, 0.34], tail: 0.4, trail: 0.3}
  hit:             # flinches back, flickers thin
    loop: false
    keys:
      - {ms: 70, event: hit, set: {root: [0, 0, -0.10], lean: -0.30, squash: 0.88, head_pitch: -0.45, mouth: 0.8, hand_L: [0.42, 0.78, 0.0], hand_R: [0.42, 0.78, 0.0], claw_L: 1, claw_R: 1, tail: 0.8, trail: -0.2}}
      - {ms: 80, set: {root: [0, 0, -0.06], lean: -0.14, squash: 1.06, head_pitch: -0.32, mouth: 0.4, hand_L: [0.36, 0.66, 0.16], hand_R: [0.36, 0.66, 0.16], tail: -0.6}}
      - {ms: 100, set: {root: [0, 0, -0.02], lean: 0.02, mouth: 0.1, tail: 0.2}}
  death:           # wails, stretches upward and dissolves into shrinking wisps (last frame 600 ms)
    loop: false
    keys:
      - {ms: 100, set: {lean: -0.20, squash: 0.90, head_pitch: -0.55, mouth: 1.0, hand_L: [0.44, 0.92, 0.0], hand_R: [0.44, 0.92, 0.0], claw_L: 1, claw_R: 1, tail: 0.8}}
      - {ms: 110, set: {lean: -0.10, bob: 0.08, squash: 1.18, head_pitch: -0.60, mouth: 1.0, hand_L: [0.40, 1.02, 0.04], hand_R: [0.40, 1.02, 0.04], claw_L: 1, claw_R: 1, tail: -0.8, trail: 0.4}}
      - {ms: 110, set: {bob: 0.16, squash: 1.28, fade: 0.80, head_pitch: -0.50, mouth: 0.8, hand_L: [0.30, 0.90, 0.10], hand_R: [0.30, 0.90, 0.10], tail: 0.9, trail: 0.8}}
      - {ms: 110, set: {bob: 0.24, squash: 1.30, fade: 0.58, head_pitch: -0.40, mouth: 0.5, hand_L: [0.26, 0.70, 0.16], hand_R: [0.26, 0.70, 0.16], tail: -0.9, trail: 1.0}}
      - {ms: 120, set: {bob: 0.30, squash: 1.25, fade: 0.38, head_pitch: -0.30, mouth: 0.3, tail: 0.9, trail: 1.2}}
      - {ms: 600, event: dead, set: {bob: 0.34, squash: 1.2, fade: 0.24, head_pitch: -0.30, mouth: 0.2, tail: -0.6, trail: 1.2}}
