spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: beetle
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.40, -0.02]}
shadow: {rx: 15, ry: 6, alpha: 125}

# Armoured carapace beetle: slow, tanky dungeon enemy that rams with its horn. Own skeleton, built like
# the spider: `body` carries the pronotum (front shield), `head` holds the curved horn, the two elytra
# (wing cases) are separate parts so a seam line shows between them and they can lift (`open`).
# Three stubby FK legs per side (coxa -> femur -> tibia, written once as _L and mirrored to _R).
brief:
  summary: heavy rhinoceros-style beetle, big domed iridescent blue-green shell split down the middle,
    a front shield, a tall curved horn, small amber eyes, six short thick legs; slow and stubborn
  must_keep: [domed iridescent shell with a centre seam, big curved horn, front shield (pronotum), six stubby legs]
  simplify: [no antennae (too thin at 16 px), no leg spines, tarsus merged into the tibia]
  decisions: shell uses 4 bands (one more than the flat style) so the teal sheen reads as iridescent;
    legs a dark navy so the shell dominates; small amber emissive eyes so the front reads in the dark;
    ram attack = backs up and lowers the horn, charges forward and tosses the horn up on the hit

ramps:
  shell:     ["#1c0f1a", "#1e1a42", "#183c5c", "#1d6668", "#46ad8c"]
  shell_dk:  ["#1c0f1a", "#18163a", "#17304e", "#1d4c5a", "#2c6e6a"]
  beetle_leg: ["#1c0f1a", "#141a2a", "#242e48", "#384866", "#56688a"]
  horn:      ["#1c0f1a", "#18283c", "#2a4660", "#4a7488", "#8ab8b8"]
  beetle_eye: ["#1c0f1a", "#ffb02e", "#fff0a0"]

materials:
  shell:  {ramp: shell, bands: [1, 4]}
  front:  {ramp: shell_dk, bands: [1, 4]}
  horn:   {ramp: horn, bands: [1, 4]}
  leg:    {ramp: beetle_leg, bands: [1, 3]}
  eye:    {ramp: beetle_eye, emissive: true, band: 1, outline: false, glow: {color: "#ffb02e", mix: 0.35, radius: 1}}

channels:
  root: [0, 0, 0]
  bob: 0            # body height offset
  rear: 0           # + raises the front of the body
  roll: 0           # body roll around its length (death flip: pi)
  head_p: 0         # + head (and horn) pitches down
  open_L: 0         # + lifts the wing case
  curl: 0           # 0..1 legs fold in (death)
  sw1_L: 0          # leg yaw swing (+ toward the back), legs 1 (front) .. 3 (rear)
  sw2_L: 0
  sw3_L: 0
  lf1_L: 0          # femur lift (radians, + up)
  lf2_L: 0
  lf3_L: 0

bones:
  body:    {parent: root, pos: "[0, 0.32 + bob, 0]", rot: "[-rear, 0, roll]"}
  head:    {parent: body, pos: [0, 0.03, 0.30], rot: "[head_p, 0, 0]", scale: 1.25}
  elytra_L: {parent: body, pos: [0.015, 0.10, 0.02], rot: "[-0.4*open_L, -0.25*open_L, 0.6*open_L]"}
  # leg 1 (front)
  coxa1_L: {parent: body, pos: [0.13, -0.08, 0.16], rot: "[0, 0.55 + sw1_L, 0]"}
  fem1_L:  {parent: coxa1_L, rot: "[-(0.55 + lf1_L - 1.0*curl), 0, 0]"}
  tib1_L:  {parent: fem1_L, pos: [0, 0, 0.22], rot: "[1.55 - 0.2*curl, 0, 0]"}
  foot1_L: {parent: tib1_L, pos: [0, 0, 0.30]}
  # leg 2 (middle)
  coxa2_L: {parent: body, pos: [0.15, -0.08, 0.0], rot: "[0, 1.45 + sw2_L, 0]"}
  fem2_L:  {parent: coxa2_L, rot: "[-(0.55 + lf2_L - 1.0*curl), 0, 0]"}
  tib2_L:  {parent: fem2_L, pos: [0, 0, 0.22], rot: "[1.55 - 0.2*curl, 0, 0]"}
  foot2_L: {parent: tib2_L, pos: [0, 0, 0.30]}
  # leg 3 (rear)
  coxa3_L: {parent: body, pos: [0.13, -0.08, -0.16], rot: "[0, 2.35 + sw3_L, 0]"}
  fem3_L:  {parent: coxa3_L, rot: "[-(0.55 + lf3_L - 1.0*curl), 0, 0]"}
  tib3_L:  {parent: fem3_L, pos: [0, 0, 0.24], rot: "[1.55 - 0.2*curl, 0, 0]"}
  foot3_L: {parent: tib3_L, pos: [0, 0, 0.32]}

parts:
  belly:
    material: front
    space: body
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, -0.04, -0.04], r: [0.20, 0.10, 0.34]}
  pronotum:          # front shield
    material: front
    space: body
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.07, 0.17], r: [0.23, 0.15, 0.15]}
  elytron_L:         # one wing case (the _R twin makes the seam)
    material: shell
    space: elytra_L
    blend: 0.02
    prims:
      - ellipsoid: {c: [0.115, 0.0, -0.17], r: [0.13, 0.23, 0.33], rot: [0.08, 0, -0.12]}
  head:
    material: front
    space: head
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.0, 0.05], r: [0.12, 0.08, 0.09]}
  horn:
    material: horn
    space: head
    blend: 0.03
    prims:
      - chain: {pts: [[0, 0.02, 0.08], [0, 0.08, 0.20], [0, 0.20, 0.28], [0, 0.33, 0.27], [0, 0.40, 0.21]],
                r: [0.075, 0.06, 0.045, 0.035, 0.024]}
  eye_L:
    material: eye
    space: head
    prims:
      - sphere: {c: [0.095, 0.02, 0.09], r: 0.03}
  legs_L:
    material: leg
    blend: 0.025
    prims:
      - cone: {a: "@fem1_L", b: "@tib1_L", r: [0.055, 0.045]}
      - sphere: {c: "@tib1_L", r: 0.048}
      - cone: {a: "@tib1_L", b: "@foot1_L", r: [0.045, 0.03]}
      - cone: {a: "@fem2_L", b: "@tib2_L", r: [0.055, 0.045]}
      - sphere: {c: "@tib2_L", r: 0.048}
      - cone: {a: "@tib2_L", b: "@foot2_L", r: [0.045, 0.03]}
      - cone: {a: "@fem3_L", b: "@tib3_L", r: [0.055, 0.045]}
      - sphere: {c: "@tib3_L", r: 0.048}
      - cone: {a: "@tib3_L", b: "@foot3_L", r: [0.045, 0.03]}

sockets:
  hit: {bone: head, offset: [0, 0.15, 0.34]}
  head: {bone: body, offset: [0, 0.35, 0]}

timing: {attack: {hit: 280ms, total: 520ms}}

animations:
  idle:            # heavy breathing, the shell rises a hair, head nods, a leg shifts
    frames: 4
    ms: 180
    channels:
      bob: "0.012*sin(p)"
      head_p: "0.06*sin(p - 0.8)"
      open_L: "0.04*pos(sin(p))"
      open_R: "0.04*pos(sin(p))"
      lf2_L: "0.2*(f == 1)"
      lf1_R: "0.2*(f == 3)"
  walk:            # slow, heavy tripod gait: set A = L1 R2 L3, set B = R1 L2 R3
    frames: 6
    ms: 120
    events: {0: step_l, 3: step_r}
    channels:
      bob: "0.010*cos(2*p)"
      roll: "0.04*sin(p)"
      head_p: "0.05*cos(2*p)"
      sw1_L: "-0.25*sin(p)"
      lf1_L: "0.35*pos(cos(p))"
      sw3_L: "-0.22*sin(p)"
      lf3_L: "0.35*pos(cos(p))"
      sw2_R: "-0.25*sin(p)"
      lf2_R: "0.35*pos(cos(p))"
      sw1_R: "0.25*sin(p)"
      lf1_R: "0.35*pos(-cos(p))"
      sw3_R: "0.22*sin(p)"
      lf3_R: "0.35*pos(-cos(p))"
      sw2_L: "0.25*sin(p)"
      lf2_L: "0.35*pos(-cos(p))"
  attack:          # ram: backs up and lowers the horn (held), charges and tosses the horn up (hit at 280 ms)
    loop: false
    keys:
      - ms: 100
        set: {root: [0, 0, -0.06], rear: -0.08, bob: -0.02, head_p: 0.25, sw1_L: 0.15, sw1_R: 0.15,
              sw3_L: -0.1, sw3_R: -0.1}
      - ms: 180
        event: windup
        set: {root: [0, 0, -0.12], rear: -0.14, bob: -0.04, head_p: 0.45, open_L: 0.1, open_R: 0.1,
              sw1_L: 0.25, sw1_R: 0.25, sw3_L: -0.25, sw3_R: -0.25, lf2_L: 0.1, lf2_R: 0.1}
      - ms: 70
        event: hit
        set: {root: [0, 0, 0.20], rear: 0.12, bob: 0.03, head_p: -0.50, sw1_L: -0.30, sw1_R: -0.30,
              sw3_L: 0.30, sw3_R: 0.30, lf1_L: 0.3, lf1_R: 0.3}
      - ms: 90
        set: {root: [0, 0, 0.16], rear: 0.06, bob: 0.01, head_p: -0.30, sw1_L: -0.2, sw1_R: -0.2,
              sw3_L: 0.15, sw3_R: 0.15, lf1_L: 0.15, lf1_R: 0.15}
      - ms: 80
        set: {root: [0, 0, 0.06], head_p: -0.08, sw1_L: -0.05, sw1_R: -0.05}
  hit:             # shell rattles, knocked back a little (it is heavy)
    loop: false
    keys:
      - ms: 70
        set: {root: [0, 0, -0.05], rear: 0.12, bob: 0.02, roll: 0.06, head_p: -0.2, open_L: 0.25, open_R: 0.18,
              lf1_L: 0.2, lf1_R: 0.2, lf2_L: -0.1, lf2_R: -0.1}
      - ms: 80
        set: {root: [0, 0, -0.04], rear: 0.04, roll: -0.03, head_p: -0.05, open_L: 0.08, open_R: 0.1}
      - ms: 100
        set: {root: [0, 0, -0.01]}
  death:           # wing cases burst open, it tips over onto its back, legs curl and twitch still
    loop: false
    keys:
      - ms: 90
        set: {root: [0, 0, -0.04], rear: 0.25, bob: 0.03, head_p: -0.3, open_L: 0.6, open_R: 0.6,
              lf1_L: 0.35, lf1_R: 0.35, lf2_L: 0.25, lf2_R: 0.25, lf3_L: 0.2, lf3_R: 0.2}
      - ms: 110
        set: {root: [0, 0, -0.05], rear: 0.12, roll: 1.1, bob: 0.14, curl: 0.3, open_L: 0.4, open_R: 0.4}
      - ms: 110
        set: {root: [0, 0, -0.05], rear: 0.04, roll: 2.3, bob: 0.12, curl: 0.5, open_L: 0.1, open_R: 0.1}
      - ms: 120
        set: {root: [0, 0, -0.04], roll: 3.14159, bob: 0.10, curl: 0.8, head_p: 0.15}
      - ms: 700
        set: {root: [0, 0, -0.04], roll: 3.14159, bob: 0.08, curl: 1.0, head_p: 0.2}
