spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: npc_hunter
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.95, 0]}
shadow: {rx: 9, ry: 3.2, alpha: 120}

# Village NPC "Cacador Ivo". Project style: topdown, 32 px, dark outline, flat, chibi, snappy.
brief:
  summary: >
    Chibi village scout - lean and tall-ish, rust-brown cloak with a thick cream fur collar, slate-grey
    tunic with a belt, dark pants, tall leather boots, sandy hair, brown felt cap with a long red
    feather, short spear (wood shaft, steel leaf head) resting on the right shoulder.
  must_keep: [fur collar, feathered cap, spear over the shoulder, long legs + tall boots]
  simplify: [no fingers, cap is a dome + small brim, feather is one tapered chain]
  decisions: >
    Head scale 1.75 (chibi). Colours chosen away from the heroes: no green (archer), no blue (mage), no
    purple (sorcerer), no bare skin/horns (barbarian): rust cloak + slate tunic + brown cap + red
    feather. The spear lives in its own frame at wrist_R (torso space), haft tilted back over the
    shoulder so the steel head rises above the cap in every direction. Talk: the free left hand points
    ahead (giving directions).

ramps:
  cloak_rust: ["#1c0f1a", "#4a1f14", "#7d3a22", "#a65a35", "#c97e52"]
  tunic_slate: ["#1c0f1a", "#2c3040", "#464c62", "#666e86"]
  cap_felt: ["#1c0f1a", "#2a1812", "#48291a", "#6a3e22"]

materials:
  skin:  {ramp: skin, bands: [2, 4], line_band: 2}
  cloak: {ramp: cloak_rust, bands: [1, 3]}
  fur:   {ramp: fur, bands: [2, 4]}
  tunic: {ramp: tunic_slate, bands: [1, 3]}
  strap: {ramp: leather, bands: [1, 2]}
  pants: {ramp: cloth, bands: [2, 4]}
  boots: {ramp: leather, bands: [1, 3]}
  hair:  {ramp: hair, bands: [3, 4]}
  cap:   {ramp: cap_felt, bands: [1, 3]}
  feather: {ramp: cloth_red, bands: [2, 3]}
  wood:  {ramp: wood, bands: [1, 3]}
  steel: {ramp: steel, bands: [2, 4]}
  ink:   {ramp: cloth, emissive: true, band: 0, outline: false}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.02
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  hand_L: [0.24, 0.04, 0.04]
  foot_L: [0.10, 0, 0.02]
  pitch_foot_L: 0
  cape: 0                       # cloak sway (-1..1)
  spear_rot: [-0.18, 0, 0.05]  # spear orientation in torso space (haft over the right shoulder)

bones:
  torso_rot: {parent: root, pos: "[0, 0.56 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.40, 0.02], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.75}
  shoulder_L: {parent: pelvis, pos: [0.18, 0.30, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.085, -0.02, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  capebase:   {parent: pelvis, pos: [0, 0.32, -0.09], rot: "[-cape*0.3, 0, 0]"}
  spear:      {parent: torso_rot, at: wrist_R, rot: spear_rot}

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.18, 0.17],
          pole: [0.3, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.08, -0.02]", lengths: [0.26, 0.24],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:           # lean slate tunic
    material: tunic
    space: pelvis
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.07, 0], r: [0.15, 0.11, 0.115]}
      - ellipsoid: {c: [0, 0.23, 0.0], r: [0.165, 0.11, 0.115]}
      - cone: {a: [0, 0.0, 0], b: [0, -0.12, 0], r: [0.14, 0.17]}     # tunic skirt
  belt:
    material: strap
    space: pelvis
    prims:
      - cylinder: {a: [0, 0.03, 0], b: [0, 0.075, 0], r: 0.158}
      - box: {c: [0.10, -0.03, 0.10], half: [0.04, 0.05, 0.025], round: 0.01, rot: [0, 0.6, 0]}   # pouch
  collar:          # thick fur collar
    material: fur
    space: pelvis
    blend: 0.05
    prims:
      - torus: {c: [0, 0.33, -0.01], R: 0.15, r: 0.08}
      - ellipsoid: {c: [0, 0.32, -0.09], r: [0.22, 0.09, 0.12]}
      - ellipsoid: {c: [0, 0.30, 0.10], r: [0.14, 0.07, 0.07]}      # bib under the chin
  cloak:           # rust cloak hanging from the shoulders to the knees
    material: cloak
    space: capebase
    blend: 0.03
    prims:
      - cone: {a: [0, 0.0, 0.0], b: [0, -0.48, -0.06], r: [0.17, 0.23]}
    cut:
      - box: {c: [0, -0.2, 0.17], half: [0.4, 0.6, 0.14]}
  neck:
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.30, 0], b: [0, 0.40, 0.02], r: [0.055, 0.05]}
  head:
    material: skin
    space: head
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.14, 0.0], r: [0.15, 0.15, 0.14]}
      - ellipsoid: {c: [0, 0.08, 0.03], r: [0.11, 0.08, 0.10]}
      - sphere: {c: [0, 0.11, 0.145], r: 0.022}
  hair:            # sandy hair under the cap
    material: hair
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.15, -0.05], r: [0.158, 0.13, 0.12]}
      - ellipsoid: {c: [0.11, 0.12, 0.05], r: [0.045, 0.07, 0.06]}
  cap:             # brown felt cap: dome + small brim, peak to the back
    material: cap
    space: head
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.25, -0.02], r: [0.15, 0.075, 0.15]}
      - ellipsoid: {c: [0, 0.225, -0.01], r: [0.185, 0.022, 0.185], rot: [-0.18, 0, 0]}   # brim
      - cone: {a: [0, 0.26, -0.03], b: [0, 0.30, -0.15], r: [0.09, 0.03]}               # peak
  feather:         # long red feather on the cap's left side, sweeping back
    material: feather
    space: head
    prims:
      - chain: {pts: [[0.14, 0.22, -0.02], [0.19, 0.31, -0.10], [0.21, 0.40, -0.22], [0.19, 0.44, -0.32]],
                r: [0.028, 0.036, 0.03, 0.014]}
  eye_L:
    material: ink
    space: head
    line: false
    prims:
      - ellipsoid: {c: [0.055, 0.115, 0.135], r: [0.024, 0.03, 0.02]}
  arm_L:           # tunic sleeve
    material: tunic
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.07}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.065, 0.055]}
  bracer_L:
    material: strap
    blend: 0.02
    prims:
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.056, 0.05]}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.035], r: 0.05}
  leg_L:
    material: pants
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.08, 0.065]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.065, 0.055]}
  boot_L:          # tall leather boots with a folded cuff
    material: boots
    space: sole_L
    blend: 0.03
    prims:
      - cone: {a: [0, 0.22, 0], b: [0, -0.02, 0.0], r: [0.075, 0.068]}
      - cylinder: {a: [0, 0.20, 0], b: [0, 0.25, 0], r: 0.082, round: 0.01}
      - ellipsoid: {c: [0, -0.03, 0.05], r: [0.068, 0.045, 0.11]}
  shaft:           # spear haft (right hand only)
    material: wood
    space: spear
    prims:
      - cylinder: {a: [0, -0.28, 0.02], b: [0, 1.08, 0.02], r: 0.028}
  spearhead:       # steel leaf blade + binding
    material: steel
    space: spear
    blend: 0.01
    prims:
      - ellipsoid: {c: [0, 1.20, 0.02], r: [0.055, 0.14, 0.025]}
      - cone: {a: [0, 1.28, 0.02], b: [0, 1.36, 0.02], r: [0.03, 0.008]}

animations:
  idle:            # relaxed breathing, cloak and feather settle
    frames: 4
    ms: 170
    channels:
      bob: "0.025*sin(p)"
      squash: "1 + 0.015*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      hand_L: "[0.24, 0.04 + 0.02*sin(p - 0.6), 0.04]"
      hand_R: "[0.27, 0.14 + 0.015*sin(p - 0.6), 0.14]"
      cape: "0.15*sin(p - 1.0)"
  talk:            # left hand points ahead (gives directions), head nods
    frames: 4
    ms: 150
    channels:
      bob: "0.015*sin(2*p)"
      head_pitch: "-0.06*sin(2*p)"
      hand_L: "[0.22 + 0.03*sin(p), 0.24 + 0.05*sin(p), 0.24]"
      hand_R: "[0.27, 0.14, 0.14]"
      cape: "0.10*sin(p - 1.0)"
