spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: centipede
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.30, 0]}
shadow: {rx: 16, ry: 6, alpha: 110}

# Giant deep centipede: ambush enemy that bursts out of the ground (`emerge`). Own skeleton: a chain of
# body segments anchored at the MIDDLE (`s0` on the root) so the long body stays centred in the frame:
# f1..f3 run forward to the `head`, b1..b4 run back to the `tail`. Every joint yaws by
# `bend` (uniform curl: coil) plus a travelling wave (`wamp`, `wph`: the walk); `rise` pitches the front
# segments up (rearing, emerging). Body segments alternate between two parts so a seam line shows between
# them. One leg pair per segment, all in `legs_L` (mirrored to `legs_R`), swinging with `lph_L` / `lph_R`.
# Every body part is cut by a huge sphere under y = 0, so whatever sinks below the ground (emerge) is hidden.
brief:
  summary: giant orange-brown cave centipede, long low segmented body, big dark head with pale curved
    pincers and long antennae, many amber legs, two tail spikes; ambushes by bursting out of the earth
  must_keep: [long segmented body with visible plates, many legs, pale curved pincers, long antennae, tail spikes]
  simplify: [one leg pair per segment (8 pairs, not dozens), legs as two thin cones, no eyes]
  decisions: body ~1.6 units long (segments 0.15 apart) so it fits frame 48 in profile, lunge kept small (0.06); segments alternate between two parts for
    seam lines; legs a lighter amber so the leg fringe reads against the orange-brown body; head darker and
    chibi-big; idle is coiled (C-curl, head raised), walk is a travelling S-wave; emerge starts with only a
    dirt mound, then the front bursts up nearly vertical and the body slides out and settles

ramps:
  centi:      ["#1c0f1a", "#4a1c12", "#7c3418", "#ac5420", "#d27e38"]
  centi_head: ["#1c0f1a", "#2e1210", "#521e16", "#7a3020", "#a04a2c"]
  centi_leg:  ["#1c0f1a", "#7a4614", "#c4822a", "#eab24c", "#f8dc8a"]
  dirt:       ["#1c0f1a", "#2a2026", "#43363a", "#615248", "#7f6e5c"]

materials:
  body:   {ramp: centi, bands: [1, 3]}
  head:   {ramp: centi_head, bands: [1, 3]}
  leg:    {ramp: centi_leg, bands: [1, 3]}
  pincer: {ramp: bone, bands: [1, 3]}
  dirt:   {ramp: dirt, bands: [1, 3]}

channels:
  root: [0, 0, 0]
  bob: 0            # body height offset (emerge starts below ground)
  turn: 0           # yaw of the middle segment
  roll: 0           # roll of the middle segment (death)
  bend: 0           # yaw per joint: + curls the body (coil)
  wamp: 0           # travelling wave amplitude (rad per joint)
  wph: 0            # travelling wave phase
  rise: 0           # 0..1+ pitches the front segments up (rear, emerge)
  dive: 0           # 0..1 bends the rear segments down (into the hole, emerge)
  head_p: 0         # + head pitches down
  pinch_L: 0        # + opens the pincer outward
  antp_L: 0         # antenna pitch (+ up)
  lph_L: 0          # leg swing phase
  lsw: 0            # leg swing amplitude
  lcurl: 0          # 0..1 legs fold up (death)
  mound: 0          # dirt mound size (emerge)
  clod: 0           # 0..1 flying clods of earth (emerge)

bones:
  s0:   {parent: root, pos: "[0, 0.15 + bob, 0]", rot: "[0, turn, roll]"}
  f1:   {parent: s0, pos: [0, 0, 0.15], rot: "[-0.30*rise, bend + wamp*sin(wph + 0.9), 0]"}
  f2:   {parent: f1, pos: [0, 0, 0.15], rot: "[-0.45*rise, bend + wamp*sin(wph + 1.8), 0]"}
  f3:   {parent: f2, pos: [0, 0, 0.15], rot: "[-0.55*rise, bend + wamp*sin(wph + 2.7), 0]"}
  head: {parent: f3, pos: [0, 0.01, 0.15], rot: "[head_p + 0.65*rise, 0.5*bend + 0.5*wamp*sin(wph + 3.6), 0]", scale: 1.5}
  b1:   {parent: s0, pos: [0, 0, -0.15], rot: "[-0.45*dive, -(bend + wamp*sin(wph - 0.9)), 0]"}
  b2:   {parent: b1, pos: [0, 0, -0.15], rot: "[-0.40*dive, -(bend + wamp*sin(wph - 1.8)), 0]"}
  b3:   {parent: b2, pos: [0, 0, -0.15], rot: "[-0.30*dive, -(bend + wamp*sin(wph - 2.7)), 0]"}
  b4:   {parent: b3, pos: [0, 0, -0.14], rot: "[0, -(bend + wamp*sin(wph - 3.6)), 0]"}
  tail: {parent: b4, pos: [0, 0, -0.13], rot: "[0, -(bend + wamp*sin(wph - 4.5)), 0]"}
  pinc_L: {parent: head, pos: [0.06, -0.035, 0.09], rot: "[0, pinch_L, 0]"}
  ant_L:  {parent: head, pos: [0.045, 0.04, 0.10], rot: "[-0.35 - antp_L, 0.65, 0]"}

parts:
  seg_a:             # segments s0, f2, b2, b4 (one seam colour: the line between seg_a and seg_b)
    material: body
    line: true
    blend: 0.01
    prims:
      - ellipsoid: {c: {at: s0, off: [0, 0, 0]}, r: [0.13, 0.09, 0.11], align: ["@b1", "@f1"]}
      - ellipsoid: {c: {at: f2, off: [0, 0, 0]}, r: [0.125, 0.09, 0.105], align: ["@f1", "@f3"]}
      - ellipsoid: {c: {at: b2, off: [0, 0, 0]}, r: [0.12, 0.085, 0.105], align: ["@b3", "@b1"]}
      - ellipsoid: {c: {at: b4, off: [0, 0, 0]}, r: [0.115, 0.075, 0.095], align: ["@tail", "@b3"]}
    cut:
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 20}
  seg_b:             # segments f1, f3, b1, b3, tail
    material: body
    line: true
    blend: 0.01
    prims:
      - ellipsoid: {c: {at: f1, off: [0, 0, 0]}, r: [0.13, 0.09, 0.11], align: ["@s0", "@f2"]}
      - ellipsoid: {c: {at: f3, off: [0, 0, 0]}, r: [0.115, 0.085, 0.10], align: ["@f2", "@head"]}
      - ellipsoid: {c: {at: b1, off: [0, 0, 0]}, r: [0.13, 0.09, 0.11], align: ["@b2", "@s0"]}
      - ellipsoid: {c: {at: b3, off: [0, 0, 0]}, r: [0.11, 0.08, 0.10], align: ["@b4", "@b2"]}
      - ellipsoid: {c: {at: tail, off: [0, 0, -0.01]}, r: [0.09, 0.065, 0.09]}
    cut:
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 20}
  tailspike_L:
    material: leg
    space: tail
    blend: 0.01
    prims:
      - cone: {a: [0.03, 0.0, -0.05], b: [0.11, 0.02, -0.25], r: [0.035, 0.016]}
    cut:
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 20}
  head:
    material: head
    space: head
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.01, 0.03], r: [0.12, 0.08, 0.11]}
    cut:
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 13.333}   # 20 / head scale 1.5
  pincer_L:
    material: pincer
    space: pinc_L
    blend: 0.015
    prims:
      - chain: {pts: [[0, 0, 0], [0.07, -0.01, 0.08], [0.05, -0.015, 0.17], [-0.04, -0.01, 0.21]], r: [0.034, 0.03, 0.024, 0.016]}
    cut:
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 13.333}   # 20 / head scale 1.5
  antenna_L:
    material: leg
    space: ant_L
    blend: 0.01
    prims:
      - chain: {pts: [[0, 0, 0], [0.03, 0.03, 0.16], [0.09, 0.02, 0.32]], r: [0.02, 0.018, 0.015]}
    cut:
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 13.333}   # 20 / head scale 1.5
  legs_L:            # one pair per segment: hip -> knee (up-out) -> foot (down on the ground)
    material: leg
    blend: 0.015
    prims:
      - chain: {pts: [{at: f3, off: [0.08, -0.02, 0]}, {at: f3, off: "[0.19, 0.05 + 0.12*lcurl, 0.04*lsw*sin(lph_L + 3.0)]"}, {at: f3, off: "[0.29 - 0.12*lcurl, -0.13 + 0.30*lcurl, 0.06*lsw*sin(lph_L + 3.0)]"}], r: [0.026, 0.024, 0.018]}
      - chain: {pts: [{at: f2, off: [0.09, -0.02, 0]}, {at: f2, off: "[0.20, 0.05 + 0.12*lcurl, 0.04*lsw*sin(lph_L + 2.0)]"}, {at: f2, off: "[0.31 - 0.12*lcurl, -0.13 + 0.30*lcurl, 0.06*lsw*sin(lph_L + 2.0)]"}], r: [0.026, 0.024, 0.018]}
      - chain: {pts: [{at: f1, off: [0.09, -0.02, 0]}, {at: f1, off: "[0.20, 0.05 + 0.12*lcurl, 0.04*lsw*sin(lph_L + 1.0)]"}, {at: f1, off: "[0.31 - 0.12*lcurl, -0.13 + 0.30*lcurl, 0.06*lsw*sin(lph_L + 1.0)]"}], r: [0.026, 0.024, 0.018]}
      - chain: {pts: [{at: s0, off: [0.09, -0.02, 0]}, {at: s0, off: "[0.20, 0.05 + 0.12*lcurl, 0.04*lsw*sin(lph_L)]"}, {at: s0, off: "[0.31 - 0.12*lcurl, -0.13 + 0.30*lcurl, 0.06*lsw*sin(lph_L)]"}], r: [0.026, 0.024, 0.018]}
      - chain: {pts: [{at: b1, off: [0.09, -0.02, 0]}, {at: b1, off: "[0.20, 0.05 + 0.12*lcurl, 0.04*lsw*sin(lph_L - 1.0)]"}, {at: b1, off: "[0.31 - 0.12*lcurl, -0.13 + 0.30*lcurl, 0.06*lsw*sin(lph_L - 1.0)]"}], r: [0.026, 0.024, 0.018]}
      - chain: {pts: [{at: b2, off: [0.09, -0.02, 0]}, {at: b2, off: "[0.20, 0.05 + 0.12*lcurl, 0.04*lsw*sin(lph_L - 2.0)]"}, {at: b2, off: "[0.30 - 0.12*lcurl, -0.13 + 0.30*lcurl, 0.06*lsw*sin(lph_L - 2.0)]"}], r: [0.026, 0.024, 0.018]}
      - chain: {pts: [{at: b3, off: [0.08, -0.02, 0]}, {at: b3, off: "[0.19, 0.05 + 0.12*lcurl, 0.04*lsw*sin(lph_L - 3.0)]"}, {at: b3, off: "[0.29 - 0.12*lcurl, -0.13 + 0.30*lcurl, 0.06*lsw*sin(lph_L - 3.0)]"}], r: [0.026, 0.024, 0.018]}
      - chain: {pts: [{at: b4, off: [0.07, -0.02, 0]}, {at: b4, off: "[0.17, 0.05 + 0.12*lcurl, 0.04*lsw*sin(lph_L - 4.0)]"}, {at: b4, off: "[0.26 - 0.12*lcurl, -0.12 + 0.28*lcurl, 0.06*lsw*sin(lph_L - 4.0)]"}], r: [0.024, 0.022, 0.016]}
    cut:
      - sphere: {c: {at: root, off: [0, -20, 0]}, r: 20}
  mound:             # emerge: the earth heaving up around the hole
    material: dirt
    when: "mound > 0.02"
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0, 0.12], r: "[0.16*mound, 0.05*mound, 0.14*mound]"}       # heave in the middle
      - sphere: {c: "[0.30*mound, 0.02, 0.12]", r: "0.075*mound"}                      # ring of clumps
      - sphere: {c: "[0.19*mound, 0.02, 0.12 + 0.24*mound]", r: "0.07*mound"}
      - sphere: {c: "[-0.12*mound, 0.02, 0.12 + 0.27*mound]", r: "0.075*mound"}
      - sphere: {c: "[-0.30*mound, 0.02, 0.10]", r: "0.07*mound"}
      - sphere: {c: "[-0.18*mound, 0.02, 0.12 - 0.22*mound]", r: "0.065*mound"}
      - sphere: {c: "[0.16*mound, 0.02, 0.12 - 0.24*mound]", r: "0.07*mound"}
  clods:             # emerge: clods of earth thrown up by the burst
    material: dirt
    when: "clod > 0.02"
    prims:
      - sphere: {c: "[0.30*clod, 0.10 + 0.55*sin(pi*clod), 0.25 + 0.10*clod]", r: 0.045}
      - sphere: {c: "[-0.34*clod, 0.10 + 0.45*sin(pi*clod), 0.20]", r: 0.04}
      - sphere: {c: "[0.08*clod, 0.10 + 0.70*sin(pi*clod), 0.15 + 0.30*clod]", r: 0.035}
      - sphere: {c: "[-0.15*clod, 0.10 + 0.50*sin(pi*clod), 0.05 - 0.25*clod]", r: 0.04}

sockets:
  hit: {bone: head, offset: [0, -0.04, 0.24]}
  head: {bone: head, offset: [0, 0.12, 0]}
  hole: {bone: root, offset: [0, 0, 0.15]}

timing: {attack: {hit: 210ms, total: 450ms}}

animations:
  idle:            # coiled in a C, head raised, antennae and pincers twitch, the coil breathes
    frames: 4
    ms: 170
    channels:
      bend: "0.28 + 0.03*sin(p)"
      turn: "-3.5*(0.28 + 0.03*sin(p))"   # keeps the head facing the direction
      rise: "0.40 + 0.05*sin(p)"
      head_p: "-0.1 + 0.08*sin(p - 0.8)"
      pinch_L: "0.15 + 0.12*sin(p)"
      pinch_R: "0.15 + 0.12*sin(p)"
      antp_L: "0.2*sin(p)"
      antp_R: "0.2*sin(p + 1.5)"
      lph_L: "p"
      lph_R: "p + pi"
      lsw: 0.4
  walk:            # travelling S-wave down the body, legs ripple in waves from head to tail
    frames: 6
    ms: 90
    events: {0: step_l, 3: step_r}
    channels:
      wamp: 0.20
      wph: "p"
      rise: 0.15
      head_p: "0.05*sin(p)"
      bob: "0.006*cos(2*p)"
      pinch_L: 0.1
      pinch_R: 0.1
      antp_L: "0.15*sin(p)"
      antp_R: "0.15*sin(p + 1)"
      lph_L: "2*p"
      lph_R: "2*p + pi"
      lsw: 1.0
  attack:          # rears the front up with pincers wide, then strikes down and snaps them shut (hit at 210 ms)
    loop: false
    keys:
      - ms: 80
        set: {root: [0, 0, -0.04], rise: 0.6, head_p: -0.2, pinch_L: 0.5, pinch_R: 0.5, wamp: 0.08, wph: 1.0,
              antp_L: 0.3, antp_R: 0.3, lsw: 0.6, lph_L: 1.0, lph_R: 4.1}
      - ms: 130
        event: windup
        set: {root: [0, 0, -0.06], rise: 1.0, head_p: -0.35, pinch_L: 0.9, pinch_R: 0.9, wamp: 0.12, wph: 1.6,
              antp_L: 0.5, antp_R: 0.5, lsw: 0.6, lph_L: 1.6, lph_R: 4.7}
      - ms: 70
        event: hit
        set: {root: [0, 0, 0.06], rise: -0.05, head_p: 0.35, pinch_L: -0.25, pinch_R: -0.25, wamp: 0.05, wph: 3.0,
              antp_L: -0.3, antp_R: -0.3, lsw: 1.0, lph_L: 3.0, lph_R: 6.1}
      - ms: 80
        set: {root: [0, 0, 0.06], rise: 0.05, head_p: 0.22, pinch_L: -0.15, pinch_R: -0.15, wph: 3.5, lsw: 0.6}
      - ms: 90
        set: {root: [0, 0, 0.03], rise: 0.15, head_p: 0.05, pinch_L: 0.05, pinch_R: 0.05}
  hit:             # flinches: the front recoils up, a kink runs down the body
    loop: false
    keys:
      - ms: 70
        set: {root: [0, 0, -0.08], rise: 0.55, head_p: -0.4, wamp: 0.30, wph: 1.2, pinch_L: 0.6, pinch_R: 0.6,
              antp_L: 0.5, antp_R: 0.5, lsw: 1.0, lph_L: 1.0, lph_R: 4.1}
      - ms: 80
        set: {root: [0, 0, -0.06], rise: 0.30, head_p: -0.15, wamp: 0.18, wph: 2.6, pinch_L: 0.3, pinch_R: 0.3,
              antp_L: 0.2, antp_R: 0.2}
      - ms: 100
        set: {root: [0, 0, -0.02], rise: 0.15, wamp: 0.06, wph: 4.0, pinch_L: 0.1, pinch_R: 0.1}
  death:           # writhes, rolls onto its side and back, curls up with the legs folded
    loop: false
    keys:
      - ms: 80
        set: {root: [0, 0, -0.05], rise: 0.7, head_p: -0.4, wamp: 0.35, wph: 0.0, pinch_L: 0.8, pinch_R: 0.8,
              antp_L: 0.5, antp_R: 0.5, lsw: 1.0, lph_L: 0.0, lph_R: 3.1}
      - ms: 100
        set: {root: [0, 0, -0.05], rise: 0.3, wamp: 0.35, wph: 2.0, bend: 0.12, roll: 0.6, pinch_L: 0.6, pinch_R: 0.6,
              lsw: 1.0, lph_L: 2.0, lph_R: 5.1}
      - ms: 100
        set: {root: [0, 0, -0.04], rise: 0.1, wamp: 0.2, wph: 4.0, bend: 0.25, roll: 1.6, bob: 0.02, lcurl: 0.5,
              pinch_L: 0.4, pinch_R: 0.4}
      - ms: 110
        set: {root: [0, 0, -0.04], bend: 0.36, roll: 2.6, bob: 0.03, lcurl: 0.8, head_p: 0.2, pinch_L: 0.3, pinch_R: 0.3,
              antp_L: -0.3, antp_R: -0.3}
      - ms: 650
        set: {root: [0, 0, -0.04], bend: 0.40, roll: 2.8, bob: 0.03, lcurl: 1.0, head_p: 0.3, pinch_L: 0.35, pinch_R: 0.35,
              antp_L: -0.4, antp_R: -0.4}
  emerge:          # ambush: the earth heaves, the front bursts up nearly vertical throwing clods, the body
                   # rises out of the ground and settles into the idle pose
    loop: false
    keys:
      - ms: 110
        set: {bob: -1.10, rise: 1.2, dive: 1.0, mound: 0.55, head_p: -0.3}
      - ms: 70
        event: burst
        set: {bob: -0.55, rise: 1.2, dive: 1.0, mound: 1.0, clod: 0.25, head_p: -0.35, pinch_L: 0.8, pinch_R: 0.8, antp_L: 0.5, antp_R: 0.5}
      - ms: 70
        set: {bob: -0.25, rise: 1.15, dive: 0.9, mound: 1.0, clod: 0.55, head_p: -0.3, pinch_L: 0.9, pinch_R: 0.9, antp_L: 0.4, antp_R: 0.4,
              lsw: 1.0, lph_L: 1.0, lph_R: 4.1}
      - ms: 80
        set: {bob: -0.06, rise: 0.85, dive: 0.5, mound: 0.9, clod: 0.85, head_p: -0.2, pinch_L: 0.6, pinch_R: 0.6, wamp: 0.15, wph: 1.0,
              lsw: 1.0, lph_L: 2.5, lph_R: 5.6}
      - ms: 100
        set: {bob: 0.0, rise: 0.6, dive: 0.15, mound: 0.6, head_p: -0.15, pinch_L: 0.4, pinch_R: 0.4, wamp: 0.12, wph: 2.2,
              bend: 0.14, turn: -0.49, lsw: 0.8, lph_L: 4.0, lph_R: 7.1}
      - ms: 120
        set: {bob: 0.0, rise: 0.45, mound: 0.3, head_p: -0.1, pinch_L: 0.2, pinch_R: 0.2, bend: 0.25, turn: -0.87,
              lsw: 0.4, lph_L: 5.0, lph_R: 8.1}
      - ms: 150
        event: done
        set: {bob: 0.0, rise: 0.40, head_p: -0.1, pinch_L: 0.15, pinch_R: 0.15, bend: 0.28, turn: -0.98, lsw: 0.4, lph_L: 0.0, lph_R: 3.14}
