    line: false
    prims:
      - chain: {pts: [[0.065, -0.10, -0.05], [0.09, -0.22, -0.06], [0.085, -0.36, -0.07]], r: [0.018, 0.025, 0.022]}
  head:            # big tan Yorkie head, heavy brow
    material: tan
    space: head
    blend: 0.035
    prims:
      - ellipsoid: {c: [0, 0.04, 0.0], r: [0.10, 0.09, 0.09]}
      - ellipsoid: {c: [0, 0.01, 0.09], r: [0.055, 0.044, 0.07]}              # muzzle
      - ellipsoid: {c: [0, 0.072, 0.06], r: [0.078, 0.025, 0.03]}             # heavy brow
      - ellipsoid: {c: [0.07, -0.02, 0.01], r: [0.05, 0.06, 0.05]}            # cheek fur
      - ellipsoid: {c: [-0.07, -0.02, 0.01], r: [0.05, 0.06, 0.05]}
      - ellipsoid: {c: [0, 0.12, -0.01], r: [0.05, 0.05, 0.05]}               # top-knot
  mane_L:          # long Yorkie fall: moustache and cheek hair drooping in heavy locks, messy top-knot
    material: tan
    space: head
    blend: 0.025
    prims:
      - chain: {pts: [[0.08, 0.0, 0.0], [0.11, -0.07, -0.01], [0.12, -0.16, -0.03]], r: [0.04, 0.035, 0.012]}
      - chain: {pts: [[0.07, 0.04, -0.05], [0.11, -0.02, -0.08], [0.13, -0.11, -0.10]], r: [0.035, 0.03, 0.01]}
      - chain: {pts: [[0.035, -0.02, 0.10], [0.05, -0.08, 0.10], [0.055, -0.17, 0.08]], r: [0.03, 0.028, 0.01]}
