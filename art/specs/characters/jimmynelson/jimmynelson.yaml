      - chain: {pts: [[0.03, 0.250, -0.02], [0.13, 0.22, -0.02], [0.20, 0.13, -0.03]], r: [0.010, 0.011, 0.009]}
      - chain: {pts: [[0.03, 0.225, -0.20], [0.11, 0.20, -0.21], [0.17, 0.12, -0.23]], r: [0.010, 0.010, 0.008]}
