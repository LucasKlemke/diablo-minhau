spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: jimmynelson
mirror: true
kind: character
size: 128
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 2.15, 0.0]}
shadow: {rx: 35, ry: 12, alpha: 130}

# JIMMYNELSON: Jimmy (jimmy_pup.yaml) turned into a colossal, blood-soaked beast, Act I boss. Same density as
# every asset (scale 0.055); only the frame is bigger (128). Quadruped skeleton from wolf.yaml authored in "wolf
# units" and blown up by the `rig` bone (scale 4.6): ~4.5 units tall, about 3x a human. Every part lives in a
# space under `rig` so radii scale too, except the legs (world-space IK points: radii x4.6). Four 2-bone IK
# legs (_L mirrored), paw targets in body space (`plant` 1 cancels `bob`). IK targets live in the scaled body
# space but IK `lengths` are world units (authored 0.205 x rig 4.6).
# COAT: the Yorkie coat is parted along the spine and falls in heavy locks down both flanks (bones lock1..6_L
# on the spine line). `hair` is the phase of their swing and `hamp` its amplitude: each lock lags a little more
# than the one in front of it (overlap), so the curtain ripples back to front in the walk. Lock tips, chest bib,
# forelegs and muzzle are matted with dark blood (`gore` material); claws are red; `drip` grows a drop under
# the chin. `fume` drives the green-yellow miasma puffs (emissive); `roar` > 0 shows the sonic rings of the
# cast; `rend` uses `smear` (claw slash) and `splat` (blood burst at the hit socket).
brief:
  summary: >
    Jimmy the Yorkshire terrier mutated into a hulking, bloodthirsty boss: a tan Yorkie head with a long
    drooping beard and moustache, small erect ears, a torn red bow on the dishevelled top-knot, glowing red
    eyes, a scarred face and a jaw of fangs dripping blood and red slaver. The dark steel-blue coat is parted
    along the spine and falls in long, heavy, shaggy locks down both flanks almost to the knees; the locks
    sway with a lag when it walks. Tan legs with shaggy cuffs and red, blood-soaked claws; the chest bib, the
    lock tips, the forelegs and the muzzle are matted with dark blood. A foul green-yellow miasma drifts around it.
  must_keep: [reads as a Yorkshire (tan head and legs vs dark steel-blue back, small erect ears, beard, coat
    parted on the spine), torn red bow on the top-knot, glowing red eyes, fangs, long heavy locks (no spikes),
    blood: muzzle, drips, matted tips and chest, red claws, scars; green-yellow miasma]
  simplify: [locks as tapered chains (one bone each), blood as flat dark-red decals on the fur, the blood
    burst as a few drops and a red claw smear, scars as 1 px pink lines]
  decisions: >
    Redesign (v2): the old steel-blue plates and spine spikes read as a porcupine and, seen from behind (n),
    the round hump plates made a face. Now the back is one smooth mass with a darker parting line down the
    spine and the locks hang off it to both sides, longest at mid-flank and ragged at the hem; from n it reads
    as a shaggy mop with a parting, never as features. Hunched, heavy-fronted posture (front raised, massive
    shoulders) so it towers; head scale 1.35 x rig over a short muzzle so it stays a Yorkie and not a wolf.
    Blood is a non-emissive dark crimson (gore) darker than the bow's cloth red, so the bow stays the brightest
    red on the body and the eyes stay the only glowing red; the claw smear of `rend` is an emissive red slash.
    The bow keeps one red lobe, the other is torn to a stub with a ribbon dangling. Scar: three slashes across
    the beast's left brow and muzzle (one side only; mirrored directions flip it, accepted). Cast = roar with the
    head thrown up and the jaw wide (release at 450 ms). Rend = a raking left fore-claw swipe followed by a bite
    on the same spot; the blood burst spawns at the `hit` socket (in front of the muzzle) on the hit frame.
  exceptions: frame size 128 (boss), rig scale 4.6, spec-local ramps; same camera scale/pitch/light.

ramps:
  jn_tan:    ["#1c0f1a", "#6a3a14", "#b07228", "#dca24c", "#f2cf86"]
  jn_steel:  ["#1c0f1a", "#161c34", "#283554", "#41557a", "#6a83a8"]
  jn_part:   ["#1c0f1a", "#10142a", "#1c2440"]
  jn_dark:   ["#1c0f1a", "#24181c", "#3a2a2a", "#55403a"]
  jn_fang:   ["#1c0f1a", "#8a7a5a", "#d8ccaa", "#f6efd8"]
  jn_eye:    ["#5a0a0a", "#ff2a1a", "#ff8a6a", "#ffe0d0"]
  jn_miasma: ["#3c4a10", "#9cc22a", "#d6ec5a", "#f4fcb8"]
  jn_gore:   ["#1c0f1a", "#3e0610", "#6c0c18", "#9c1420", "#cf2a26"]
  jn_scar:   ["#1c0f1a", "#7a2a3a", "#c0607a"]
  jn_fx_tail: ["#7a0c16"]
  jn_fx_mid:  ["#d0201e"]
  jn_fx_core: ["#ff7a52"]
  # Sarah (copied from sarah_young.yaml so the carried princess matches her own sprite)
  skin_fair:  ["#1c0f1a", "#a35a5a", "#eebfa4", "#fbdcc8", "#fff1e6"]
  hair_brown: ["#1c0f1a", "#24130e", "#43261a", "#653c26"]
  gown_lav:   ["#1c0f1a", "#6a5a9a", "#a796d6", "#cbbdf0", "#ece4ff"]
  white_trim: ["#1c0f1a", "#a8a3c0", "#e4e0f0", "#ffffff"]
  flower:     ["#1c0f1a", "#b0406a", "#f07aa6", "#ffc4dc"]

materials:
  tan:    {ramp: jn_tan, bands: [1, 3]}
  coat:   {ramp: jn_steel, bands: [1, 4]}
  part:   {ramp: jn_part, bands: [1, 2], outline: false, line: false}
  sheen:  {ramp: jn_steel, bands: [4, 4], outline: false, line: false}
  dark:   {ramp: jn_dark, bands: [1, 2]}
  bow:    {ramp: cloth_red, bands: [1, 3]}
  fang:   {ramp: jn_fang, bands: [2, 3]}
  gore:   {ramp: jn_gore, bands: [1, 3], line: false}
  wet:    {ramp: jn_gore, bands: [2, 4], line: false}
  claw:   {ramp: jn_gore, bands: [3, 4]}
  scar:   {ramp: jn_scar, bands: [1, 2], outline: false, line: false}
  mouth:  {ramp: mouth, bands: [1, 2], outline: false, line: false}
  eye:    {ramp: jn_eye, emissive: true, band: 2, outline: false, glow: {color: "#ff2a1a", mix: 0.55, radius: 1}}
  miasma: {ramp: jn_miasma, emissive: true, band: 1, outline: false, glow: {color: "#b8e03a", mix: 0.35, radius: 1}}
  sonic:  {ramp: jn_miasma, emissive: true, band: 3, outline: false, glow: {color: "#d6ec5a", mix: 0.4, radius: 1}}
  fx_tail: {ramp: jn_fx_tail, emissive: true, outline: false}
  fx_mid:  {ramp: jn_fx_mid, emissive: true, outline: false}
  fx_core: {ramp: jn_fx_core, emissive: true, outline: false}
  s_skin:   {ramp: skin_fair, bands: [2, 4], line_band: 2}
  s_gown:   {ramp: gown_lav, bands: [1, 3]}
  s_trim:   {ramp: white_trim, bands: [1, 3]}
  s_hair:   {ramp: hair_brown, bands: [1, 3]}
  s_gold:   {ramp: gold, bands: [2, 3]}
  s_flower: {ramp: flower, bands: [2, 3]}
  s_shoes:  {ramp: cloth_purple, bands: [1, 2]}
  s_ink:    {ramp: cloth, emissive: true, band: 0, outline: false}
  chain:    {ramp: jn_miasma, emissive: true, band: 1, outline: false, glow: {color: "#9cc22a", mix: 0.4, radius: 1}}

channels:
  root: [0, 0, 0]
  bob: 0            # body height offset
  plant: 1          # 1: paws stay on the ground when bob changes; 0: paws follow the body (death)
  rear: 0.12        # + raises the front of the body (hunched, heavy front by default)
  roll: 0           # roll around the body length (death)
  twist: 0          # body yaw
  squash: 1
  head_pitch: 0     # + looks down
  head_yaw: 0
  jaw: 0            # + opens the mouth
  ear_L: 0          # + perks / - flattens back
  tail: 0
  tail_up: 0
  fume: 0           # miasma phase (radians): puffs drift up and around
  roar: 0           # 0..1 sonic rings (cast)
  hair: 0           # phase of the coat locks' swing (radians)
  hamp: 0           # amplitude of the locks' swing (0 still, 1 walk)
  hlift: 0          # + flares the locks outward (lunges, hits)
  drip: 0           # 0..1 blood drop growing under the chin
  smear: 0          # claw smear width (rend)
  smear_a0: 0
  smear_a1: 0
  smear_fade: 1
  splat: 0          # 0..1 blood burst at the hit socket (rend)
  carry: 0          # 1: Sarah hangs from the jaws, bitten by the dress (carry_idle / carry_walk only)
  sw_x: 0           # Sarah swing, front/back (rad)
  sw_z: 0           # Sarah swing, side to side (rad)
  s_fold: 0         # + folds her more over the jaws
  s_head: 0         # her head lifts (+) / drops (-)
  flail_L: 0        # her arms flail (rad, + forward)
  kick_L: 0         # her legs kick (rad, + forward)
  ffoot_L: [0.16, -0.475, 0.24]    # front paw target (body space)
  hfoot_L: [0.15, -0.425, -0.20]   # hind paw target (body space)

bones:
  rig:      {parent: root, scale: 4.6}
  body:     {parent: rig, pos: "[0, 0.44 + bob, 0]", rot: "[-rear, twist, roll]",
             scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase: {parent: body, pos: [0, 0.24, 0.32], inherit_scale: false}
  head:     {parent: headbase, rot: "[0.26 + head_pitch, head_yaw, 0]", scale: 6.21}   # 1.35 x rig 4.6 (headbase does not inherit scale)
  jaw:      {parent: head, pos: [0, -0.025, 0.05], rot: "[jaw, 0, 0]"}
  chin:     {parent: jaw, pos: [0, -0.055, 0.07], inherit_rot: false}            # blood drips hang straight down
  ear_L:    {parent: head, pos: [0.07, 0.08, -0.02], rot: "[ear_L - 0.15, 0, -0.55]"}
  tail:     {parent: body, pos: [0, 0.12, -0.26], rot: "[-0.9 - tail_up, tail, 0]"}
  shoulder_L: {parent: body, pos: [0.13, -0.05, 0.20]}
  hip_L:      {parent: body, pos: [0.12, -0.05, -0.19]}
  fumespace:  {parent: rig, rot: "[0, twist, 0]"}
  # coat locks hanging from the spine line, front (1) to rump (6); each lags 0.55 rad behind the one before
  lock1_L:  {parent: body, pos: [0.16, 0.10, 0.20], rot: "[0.12*hamp*sin(hair) - 0.12, 0, -0.18*hlift - 0.06*hamp*sin(hair - 0.4)]"}
  lock2_L:  {parent: body, pos: [0.18, 0.09, 0.08], rot: "[0.12*hamp*sin(hair - 0.6), 0, -0.18*hlift - 0.06*hamp*sin(hair - 1.0)]"}
  lock3_L:  {parent: body, pos: [0.18, 0.09, -0.04], rot: "[0.12*hamp*sin(hair - 1.2), 0, -0.18*hlift - 0.06*hamp*sin(hair - 1.6)]"}
  lock4_L:  {parent: body, pos: [0.17, 0.09, -0.16], rot: "[0.12*hamp*sin(hair - 1.8), 0, -0.18*hlift - 0.06*hamp*sin(hair - 2.2)]"}
  lock5_L:  {parent: body, pos: [0.12, 0.10, -0.28], rot: "[0.14*hamp*sin(hair - 2.4) + 0.15, 0.6, -0.18*hlift]"}
  # Sarah (1.45x real size, no rig scale), hung from a fang by a fetid chain and the back of her dress:
  # she dangles upright beside the muzzle on the beast's right (-x, the near side in s/se/e), clear of
  # its eyes, facing out. `sgrip` ignores the head rotation so she keeps world "down" and swings.
  sgrip:      {parent: jaw, pos: [0, -0.03, 0.10], inherit_rot: false, inherit_scale: false,
               rot: "[sw_x, twist, sw_z]", scale: 1.45}   # 1.45x real size so she reads at 1x
  swaist:     {parent: sgrip, pos: [-0.24, -0.60, 0.04], rot: "[0.08, 0.35, 0.22]"}
  supper:     {parent: swaist, rot: "[0.05 + 0.3*s_fold, 0, 0]"}
  slower:     {parent: swaist, rot: "[-0.25*s_fold, 0, 0]"}
  shead:      {parent: supper, pos: [0, 0.38, 0.03], rot: "[0.05 - 0.35*s_head, 0, 0.12*s_head]", scale: 1.75}
  sarm_L:     {parent: supper, pos: [0.15, 0.29, 0.0], rot: "[flail_L, 0, -2.75]"}
  sleg_L:     {parent: slower, pos: [0.07, -0.05, 0.0], rot: "[-kick_L, 0, 0.05]"}
  roarspace:  {parent: head, pos: [0, -0.02, 0.13], rot: [0.6, 0, 0], scale: "1 - 0.55*pulse(abs(yaw), 180, 90)"}   # sonic rings follow the open jaws
  # rend: the claw smear in front of the chest, and the blood burst at the bite point (= `hit` socket)
  fxspace:    {parent: body, pos: [0, 0.10, 0.62], inherit_scale: false, rot: [-1.45, 0, 0.35]}   # arc plane faces forward (vertical)
  burst:      {parent: head, pos: [0, -0.02, 0.18], inherit_rot: false, inherit_scale: false, rot: "[0, twist, 0]", scale: 4.6}

ik:
  fleg_L: {start: shoulder_L, space: body, target: "ffoot_L + [0, 0.04 - bob*plant, 0]", lengths: [0.94, 0.94],
           pole: [0, 0, -1], pole_space: body, joint: felbow_L, end: fpaw_L}
  hleg_L: {start: hip_L, space: body, target: "hfoot_L + [0, 0.04 - bob*plant, 0]", lengths: [0.94, 0.94],
           pole: [0, 0, 1], pole_space: body, joint: hknee_L, end: hpaw_L}

parts:
  torso:           # heavy tan chest and haunches under the coat
    material: tan
    space: body
    blend: 0.08
    prims:
      - ellipsoid: {c: [0, 0.0, 0.14], r: [0.21, 0.21, 0.19]}
      - ellipsoid: {c: [0, 0.0, -0.13], r: [0.18, 0.17, 0.17]}
      - cone: {a: [0, 0.06, 0.18], b: [0, 0.22, 0.30], r: [0.17, 0.14]}       # thick neck
  bib:             # long tan chest hair hanging between the forelegs, matted at the ends
    material: tan
    space: body
    blend: 0.03
    prims:
      - cone: {a: [0, 0.02, 0.30], b: [0.0, -0.22, 0.30], r: [0.10, 0.03]}
      - cone: {a: [0.06, 0.04, 0.29], b: [0.08, -0.18, 0.27], r: [0.07, 0.022]}
      - cone: {a: [-0.06, 0.04, 0.29], b: [-0.09, -0.20, 0.27], r: [0.07, 0.022]}
  bib_gore:        # dried blood soaking the chest bib
    material: gore
    space: body
    blend: 0.02
    prims:
      - ellipsoid: {c: [0.01, -0.06, 0.335], r: [0.07, 0.08, 0.03], rot: [-0.25, 0, 0.2]}
      - cone: {a: [0.0, -0.12, 0.31], b: [0.0, -0.21, 0.30], r: [0.04, 0.02]}
      - cone: {a: [-0.07, -0.10, 0.285], b: [-0.09, -0.195, 0.27], r: [0.03, 0.016]}
  coat:            # one smooth dark steel-blue mass over the back (the locks hang from it)
    material: coat
    space: body
    blend: 0.07
    prims:
      - ellipsoid: {c: [0, 0.11, -0.02], r: [0.215, 0.14, 0.33]}
      - ellipsoid: {c: [0, 0.16, 0.16], r: [0.19, 0.11, 0.15]}               # shoulders
      - cone: {a: [0, 0.17, 0.22], b: [0, 0.27, 0.31], r: [0.14, 0.11]}       # nape, under the head
  parting:         # the darker parting line down the spine, the Yorkie hallmark
    material: part
    space: body
    prims:
      - chain: {pts: [[0, 0.268, 0.24], [0, 0.262, 0.10], [0, 0.252, -0.04], [0, 0.235, -0.18], [0, 0.20, -0.30]],
                r: [0.012, 0.013, 0.013, 0.012, 0.010]}
  lock1_L:         # heavy locks falling off the flank, ragged hem; line: false so the curtain reads as one mass
    material: coat
    space: lock1_L
    blend: 0.04
    line: false
    prims:
      - chain: {pts: [[-0.03, 0.06, 0.03], [0.03, -0.05, 0.03], [0.06, -0.20, 0.02], [0.065, -0.36, 0.00]], r: [0.05, 0.055, 0.045, 0.016]}
      - chain: {pts: [[-0.03, 0.06, -0.05], [0.03, -0.05, -0.05], [0.055, -0.18, -0.06], [0.06, -0.26, -0.08]], r: [0.05, 0.05, 0.04, 0.014]}
  lock2_L:
    material: coat
    space: lock2_L
    blend: 0.04
    line: false
    prims:
      - chain: {pts: [[-0.03, 0.06, 0.03], [0.03, -0.05, 0.03], [0.06, -0.20, 0.02], [0.065, -0.47, 0.00]], r: [0.05, 0.055, 0.045, 0.016]}
      - chain: {pts: [[-0.03, 0.06, -0.05], [0.03, -0.05, -0.05], [0.055, -0.18, -0.06], [0.06, -0.3, -0.08]], r: [0.05, 0.05, 0.04, 0.014]}
  lock3_L:
    material: coat
    space: lock3_L
    blend: 0.04
    line: false
    prims:
      - chain: {pts: [[-0.03, 0.06, 0.03], [0.03, -0.05, 0.03], [0.06, -0.20, 0.02], [0.065, -0.34, 0.00]], r: [0.05, 0.055, 0.045, 0.016]}
      - chain: {pts: [[-0.03, 0.06, -0.05], [0.03, -0.05, -0.05], [0.055, -0.18, -0.06], [0.06, -0.48, -0.08]], r: [0.05, 0.05, 0.04, 0.014]}
  lock4_L:
    material: coat
    space: lock4_L
    blend: 0.04
    line: false
    prims:
      - chain: {pts: [[-0.03, 0.06, 0.03], [0.03, -0.05, 0.03], [0.06, -0.20, 0.02], [0.065, -0.43, 0.00]], r: [0.05, 0.055, 0.045, 0.016]}
      - chain: {pts: [[-0.03, 0.06, -0.05], [0.03, -0.05, -0.05], [0.055, -0.18, -0.06], [0.06, -0.28, -0.08]], r: [0.05, 0.05, 0.04, 0.014]}
  lock5_L:
    material: coat
    space: lock5_L
    blend: 0.04
    line: false
    prims:
      - chain: {pts: [[-0.03, 0.06, 0.03], [0.03, -0.05, 0.03], [0.06, -0.20, 0.02], [0.065, -0.3, 0.00]], r: [0.05, 0.055, 0.045, 0.016]}
      - chain: {pts: [[-0.03, 0.06, -0.05], [0.03, -0.05, -0.05], [0.055, -0.18, -0.06], [0.06, -0.22, -0.08]], r: [0.05, 0.05, 0.04, 0.014]}
  sheen_L:         # a few lighter strands combed from the parting down the back (hair texture)
