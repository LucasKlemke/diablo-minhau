sockets:
  hit:   {bone: head, offset: [0, -0.02, 0.18]}      # bite / rend impact point (the blood burst spawns here)
  mouth: {bone: head, offset: [0, -0.02, 0.13]}
  head:  {bone: head, offset: [0, 0.22, 0]}
  roar:  {bone: roarspace, offset: [0, 0, 0.2]}
  claw_L: {bone: fpaw_L, offset: [0, -0.10, 0.45]}   # fore-claw tips (automatic claw_R twin)

timing: {attack: {hit: 380ms, total: 900ms}, cast: {release: 450ms, total: 1150ms}, rend: {hit: 360ms, total: 960ms}}

animations:
  idle:            # heavy panting, blood dripping from the chin, the locks settle, an ear twitch
    frames: 4
    ms: 180
    channels:
      fume: "p"
      hair: "p"
      hamp: 0.35
      drip: "0.5 + 0.5*sin(p - 1.2)"
      bob: "0.010*sin(p)"
      squash: "1 + 0.02*sin(p)"
      head_pitch: "0.04*sin(p)"
      jaw: "0.30 + 0.08*sin(p)"
      tail: "0.2*sin(p - 0.8)"
      ear_L: "-0.3*(f == 2)"
  walk:            # heavy lumbering trot, diagonal pairs, head swaying; the locks swing behind the body (overlap)
    frames: 6
    ms: 115
    events: {0: step_l, 3: step_r}
    channels:
      fume: "p"
      hair: "2*p - 0.6"
      hamp: 1
      drip: "0.5 + 0.5*sin(2*p)"
      bob: "0.016*cos(2*p)"
      twist: "0.05*sin(p)"
      roll: "0.03*sin(p)"
      head_pitch: "0.04*cos(2*p)"
      head_yaw: "0.08*sin(p)"
      jaw: 0.22
      tail: "0.3*sin(p - 0.8)"
      ffoot_L: "[0.16, -0.475 + 0.07*pos(-sin(p)), 0.24 + 0.10*cos(p)]"
      hfoot_R: "[0.15, -0.425 + 0.07*pos(-sin(p)), -0.20 + 0.10*cos(p)]"
      ffoot_R: "[0.16, -0.475 + 0.07*pos(sin(p)), 0.24 - 0.10*cos(p)]"
      hfoot_L: "[0.15, -0.425 + 0.07*pos(sin(p)), -0.20 - 0.10*cos(p)]"
  attack:          # rears back with jaws open, then slams forward in a crushing bite (hit 380 ms, total 900 ms)
    loop: false
    keys:
      - ms: 130
        set: {fume: 0.5, hair: 0.5, hamp: 0.6, root: [0, 0, -0.10], bob: -0.02, rear: 0.22, head_pitch: -0.2, jaw: 0.3, ear_L: -0.3, tail_up: 0.2}
      - ms: 250
        event: windup
        set: {fume: 1.0, hair: 1.2, hamp: 0.8, root: [0, 0, -0.16], bob: -0.01, rear: 0.34, squash: 0.94, head_pitch: -0.4, jaw: 0.7, ear_L: -0.5, tail_up: 0.3,
              ffoot_L: [0.16, -0.40, 0.30], ffoot_R: [0.16, -0.40, 0.30]}
      - ms: 70
        event: hit
        set: {fume: 1.6, hair: 2.6, hamp: 1, hlift: 0.6, root: [0, 0, 0.18], bob: -0.04, rear: -0.10, squash: 1.08, head_pitch: 0.35, jaw: 0.05, ear_L: -0.6, tail_up: -0.1,
              ffoot_L: [0.16, -0.475, 0.34], ffoot_R: [0.16, -0.475, 0.34], hfoot_L: [0.15, -0.425, -0.28], hfoot_R: [0.15, -0.425, -0.28]}
