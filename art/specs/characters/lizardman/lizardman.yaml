spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: lizardman
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.85, 0]}
shadow: {rx: 10, ry: 3.4, alpha: 120}

# Lizardman: Act II swamp spearman. Same humanoid skeleton as the bandit (head ~1.8x) but a bit taller
# (pelvis 0.54) so it reads ~32 px in game units, plus a tail. Project style: flat 2-3 tones, dark outline,
# chibi, snappy.
brief:
  summary: chibi swamp lizardman - green-teal scaly body, pale yellow belly and throat, long snout with a
    toothy mouth line, yellow side eyes, red-orange head frill/crest, thick tail, leather loin belt, wooden
    spear with a steel leaf tip and a red rag tie in the right hand; throws darts with the left hand (cast)
  must_keep: [snout profile, red crest, tail, yellow belly, long spear]
  simplify: [scales are flat colour (no pattern), toes are three claw cones, darts are a tiny stick]
  exceptions: |
    size stays 48 as asked: the spear is shortened (~1.0 world units) so the thrust fits the frame.
  decisions:
    - teal scales follow the game's placeholder colours (#3f8a6e/#5dab8d); belly is a spec-local warm yellow
    - the crest uses a spec-local red-orange ramp, also used on the spear's rag tie (one warm accent)
    - spear lives in its own frame (spear) at the right wrist, pitched by spear_pitch (0 = upright, ~1.5 = level forward)
    - attack is a two-step thrust (pull back, lunge with the spear level); no smear, the lunge and the long
      spear carry the read
    - cast is a left-hand overhand dart throw; the dart is drawn while `dart` > 0.5 and leaves on the release
      frame; `muzzle` socket at the left hand for the game's projectile spawn
    - tail sways with its own channel; death falls on the side with the spear dropping
    - mirrored directions swap the spear to the left hand (project mirror style)

ramps:
  scales: ["#1c0f1a", "#1f5a4e", "#3f8a6e", "#5dab8d"]   # green-teal scales
  belly:  ["#1c0f1a", "#9a7a1f", "#d8c040", "#efe08a"]   # pale yellow belly
  frill:  ["#1c0f1a", "#7a2418", "#cf4a26", "#f0864a"]   # red-orange crest

materials:
  scales: {ramp: scales, bands: [1, 3]}
  belly:  {ramp: belly, bands: [1, 3]}
  frill:  {ramp: frill, bands: [1, 3]}
  strap:  {ramp: leather, bands: [1, 3]}
  wood:   {ramp: wood, bands: [1, 3]}
  steel:  {ramp: steel, bands: [2, 4]}
  claw:   {ramp: bone, bands: [2, 3]}
  mouth:  {ramp: mouth, emissive: true, band: 0, outline: false, line: false}
  eye:    {ramp: eye, emissive: true, band: 1, outline: false, glow: {color: "#ffe14d", mix: 0.2, radius: 1}}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.08
  twist: 0
  roll: 0
  squash: 1
  head_pitch: -0.08
  head_yaw: 0
  head_roll: 0
  jaw: 0            # mouth open (radians)
  hand_L: [0.25, 0.0, 0.08]
  hand_R: [0.24, 0.08, 0.14]
  foot_L: [0.10, 0, 0.02]
  pitch_foot_L: 0
  tail: 0           # tail sway (-1..1)
  tail_lift: 0      # tail pitch (+ lifts it toward the back; death keeps it above the ground)
  spear_pitch: 0.08 # spear pitch in the hand (0 = upright, + tips the point forward)
  dart: 0           # dart drawn in the left hand (cast)
  spos: 0.12        # spear slide along its axis in the grip (+ = more spear above the hand)

bones:
  torso_rot: {parent: root, pos: "[0, 0.60 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.37, 0.03], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, head_roll]", scale: 1.8}
  jawb:      {parent: head, pos: [0, 0.08, 0.02], rot: "[jaw, 0, 0]"}
  tailbase:  {parent: pelvis, pos: [0, -0.02, -0.08], rot: "[tail_lift, tail*0.35, 0]"}
  shoulder_L: {parent: pelvis, pos: [0.18, 0.28, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.09, -0.02, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.12, 0]"}
  spear:      {parent: torso_rot, at: wrist_R, rot: "[spear_pitch, 0, 0]"}

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.19, 0.18],
          pole: [0.3, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.08, -0.02]", lengths: [0.28, 0.26],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:           # scaly barrel chest
    material: scales
    space: pelvis
    blend: 0.06
    prims:
      - ellipsoid: {c: [0, 0.07, -0.01], r: [0.15, 0.11, 0.11]}
      - ellipsoid: {c: [0, 0.22, -0.01], r: [0.17, 0.11, 0.12]}
  belly:           # yellow belly plate down the front
    material: belly
    space: pelvis
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.15, 0.05], r: [0.115, 0.16, 0.09]}
  belt:
    material: strap
    space: pelvis
    blend: 0.02
    prims:
      - cylinder: {a: [0, 0.0, 0], b: [0, 0.045, 0], r: 0.152}
      - box: {c: [0, -0.07, 0.13], half: [0.06, 0.07, 0.015], rot: [0.15, 0, 0], round: 0.01}   # front flap
  neck:
    material: scales
    space: pelvis
    prims:
      - cone: {a: [0, 0.28, 0], b: [0, 0.37, 0.03], r: [0.06, 0.055]}
  tail:            # thick tail, swings with `tail`
    material: scales
    space: tailbase
    blend: 0.03
    prims:
      - chain: {pts: [[0, 0.02, 0], [0, -0.14, -0.20], "[0.06*tail, -0.34, -0.36]", "[0.16*tail, -0.46, -0.54]"],
                r: [0.09, 0.07, 0.045, 0.018]}
  head:            # cranium and long snout
    material: scales
    space: head
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.15, -0.03], r: [0.125, 0.115, 0.125]}
      - ellipsoid: {c: [0, 0.12, 0.10], r: [0.085, 0.06, 0.12]}       # snout
      - ellipsoid: {c: [0, 0.205, 0.04], r: [0.10, 0.035, 0.07]}      # brow ridge
  throat:          # pale throat and lower jaw
    material: belly
    space: jawb
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, -0.005, 0.07], r: [0.075, 0.035, 0.11]}
  mouth:           # mouth line along the snout
    material: mouth
    space: head
    prims:
      - box: {c: [0, 0.085, 0.12], half: [0.08, 0.008, 0.09]}
  eye_L:           # yellow eyes on the sides of the head
    material: eye
    space: head
    prims:
      - sphere: {c: [0.085, 0.175, 0.07], r: 0.028}
  pupil_L:
    material: mouth
    space: head
    prims:
      - ellipsoid: {c: [0.105, 0.175, 0.08], r: [0.008, 0.02, 0.008]}
  crest:           # red-orange frill spikes along the top and back of the head
    material: frill
    space: head
    blend: 0.02
    prims:
      - cone: {a: [0, 0.24, 0.06], b: [0, 0.33, 0.02], r: [0.03, 0.008]}
      - cone: {a: [0, 0.26, -0.03], b: [0, 0.37, -0.08], r: [0.035, 0.008]}
      - cone: {a: [0, 0.22, -0.11], b: [0, 0.31, -0.19], r: [0.035, 0.008]}
      - cone: {a: [0, 0.14, -0.15], b: [0, 0.18, -0.25], r: [0.03, 0.008]}
  frill_L:         # side frills behind the jaw
    material: frill
    space: head
    prims:
      - cone: {a: [0.10, 0.12, -0.06], b: [0.19, 0.17, -0.13], r: [0.03, 0.008]}
  arm_L:
    material: scales
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.062}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.058, 0.048]}
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.048, 0.042]}
  hand_L:
    material: scales
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.035], r: 0.046}
  handclaw_L:
    material: claw
    space: wrist_L
    prims:
      - cone: {a: [0.02, -0.02, 0.06], b: [0.03, -0.05, 0.11], r: [0.016, 0.006]}
      - cone: {a: [-0.02, -0.02, 0.06], b: [-0.03, -0.05, 0.11], r: [0.016, 0.006]}
  leg_L:           # thick thighs, thinner shins
    material: scales
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.08, 0.06]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.055, 0.045]}
  foot_L:
    material: scales
    space: sole_L
    blend: 0.02
    prims:
      - ellipsoid: {c: [0, -0.03, 0.04], r: [0.06, 0.04, 0.09]}
  toeclaw_L:
    material: claw
    space: sole_L
    prims:
      - cone: {a: [0.03, -0.04, 0.10], b: [0.045, -0.06, 0.15], r: [0.018, 0.006]}
      - cone: {a: [-0.03, -0.04, 0.10], b: [-0.045, -0.06, 0.15], r: [0.018, 0.006]}
  shaft:           # right hand only: wooden spear shaft
    material: wood
    space: spear
    prims:
      - cylinder: {a: "[0, -0.34 + spos, 0.0]", b: "[0, 0.52 + spos, 0.0]", r: 0.024}
  spearhead:       # steel leaf tip
    material: steel
    space: spear
    blend: 0.01
    prims:
      - ellipsoid: {c: "[0, 0.60 + spos, 0]", r: [0.045, 0.10, 0.02]}
      - cone: {a: "[0, 0.66 + spos, 0]", b: "[0, 0.72 + spos, 0]", r: [0.025, 0.005]}
  spear_tie:       # red rag tied under the head
    material: frill
    space: spear
    blend: 0.01
    prims:
      - cylinder: {a: "[0, 0.48 + spos, 0]", b: "[0, 0.52 + spos, 0]", r: 0.034}
      - cone: {a: "[0, 0.50 + spos, 0.0]", b: "[0, 0.40 + spos, -0.05]", r: [0.022, 0.01]}
  dart:            # throwing dart in the left hand (cast)
    when: "dart > 0.5"
    material: wood
    space: wrist_L
    prims:
      - cylinder: {a: [0, 0.0, -0.06], b: [0, 0.0, 0.14], r: 0.016}
  dart_tip:
    when: "dart > 0.5"
    material: steel
    space: wrist_L
    prims:
      - cone: {a: [0, 0.0, 0.13], b: [0, 0.0, 0.20], r: [0.024, 0.005]}

sockets:
  hit: {bone: spear, offset: [0, 0.45, 0]}         # spear tip at full thrust (spos -0.15)
  muzzle: {bone: wrist_L, offset: [0, 0, 0.10]}     # dart spawn (cast)
  head: {bone: head, offset: [0, 0.40, 0]}

timing: {attack: {hit: 190ms, total: 480ms}, cast: {release: 300ms, total: 510ms}}

animations:
  idle:            # breathing, tail swaying, jaw flicking
    frames: 4
    ms: 170
    channels:
      bob: "0.025*sin(p)"
      squash: "1 + 0.02*sin(p)"
      head_pitch: "-0.08 - 0.04*sin(p - 0.5)"
      jaw: "0.15*(f == 2)"
      hand_L: "[0.25, 0.0 + 0.02*sin(p - 0.6), 0.08]"
      hand_R: "[0.24, 0.08 + 0.015*sin(p - 0.6), 0.14]"
      spear_pitch: "0.08 + 0.04*sin(p - 0.8)"
      tail: "0.6*sin(p - 1.0)"
  walk:            # 6-frame stride, tail swinging against the hips, spear bobbing
    frames: 6
    ms: 105
    events: {0: step_l, 3: step_r}
    channels:
      lean: 0.14
      bob: "-0.03*cos(2*p) + 0.01"
      twist: "0.09*cos(p)"
      foot_L: "[0.10, 0.08*pos(-sin(p)), 0.02 + 0.16*cos(p)]"
      foot_R: "[0.10, 0.08*pos(sin(p)), 0.02 - 0.16*cos(p)]"
      pitch_foot_L: "0.4*pos(-sin(p))"
      pitch_foot_R: "0.4*pos(sin(p))"
      hand_L: "[0.25, 0.0 + 0.03*pos(cos(p)), 0.08 - 0.12*cos(p)]"
      hand_R: "[0.24, 0.08, 0.14 + 0.06*cos(p)]"
      spear_pitch: "0.25 + 0.06*cos(p)"
      tail: "0.9*sin(p - 0.8)"
  attack:          # spear thrust: pull back (held), lunge level, impact at full reach, recover
    loop: false
    keys:
      - ms: 130
        event: windup
        set: {twist: -0.35, lean: -0.05, bob: -0.02, squash: 0.95, hand_R: [0.24, 0.18, -0.16], spear_pitch: 1.45, spos: -0.15,
              hand_L: [0.14, 0.16, 0.22], foot_L: [0.10, 0, 0.10], foot_R: [0.10, 0, -0.06], tail: -0.5, jaw: 0.2}
      - ms: 60
        set: {root: [0, 0, 0.08], twist: 0.10, lean: 0.20, squash: 1.05, hand_R: [0.14, 0.20, 0.26], spear_pitch: "1.40 - 0.35*pulse(yaw, 0, 70)", spos: -0.15,
              hand_L: [0.22, 0.04, 0.0], foot_L: [0.10, 0, 0.18], foot_R: [0.10, 0, -0.08], tail: 0.3, jaw: 0.4}
      - ms: 110
        event: hit
        set: {root: [0, 0, 0.10], twist: 0.18, lean: 0.28, hand_R: [0.10, 0.20, 0.32], spear_pitch: "1.32 - 0.35*pulse(yaw, 0, 70)", spos: -0.15,
              hand_L: [0.24, 0.02, -0.04], foot_L: [0.10, 0, 0.20], foot_R: [0.10, 0, -0.10], tail: 0.6, jaw: 0.4}
      - ms: 90
        set: {root: [0, 0, 0.08], twist: 0.08, lean: 0.18, hand_R: [0.18, 0.14, 0.22], spear_pitch: 1.1, spos: -0.10,
              hand_L: [0.24, 0.0, 0.02], foot_L: [0.10, 0, 0.14], foot_R: [0.10, 0, -0.06], tail: 0.3}
      - ms: 90
        set: {root: [0, 0, 0.03], lean: 0.10, hand_R: [0.24, 0.10, 0.16], spear_pitch: 0.4, spos: 0.0, tail: 0.0}
  cast:            # left-hand dart throw: wind up overhead (held), whip forward, release, recover
    loop: false
    keys:
      - ms: 120
        event: windup
        set: {twist: 0.40, lean: -0.06, squash: 0.96, hand_L: [0.36, 0.48, -0.06], dart: 1, hand_R: [0.26, 0.04, 0.08],
              spear_pitch: -0.05, foot_L: [0.10, 0, -0.04], foot_R: [0.10, 0, 0.10], tail: 0.4}
      - ms: 120
        set: {twist: 0.52, lean: -0.10, squash: 0.95, hand_L: [0.38, 0.52, -0.10], dart: 1, hand_R: [0.26, 0.04, 0.08],
              spear_pitch: -0.08, foot_L: [0.10, 0, -0.04], foot_R: [0.10, 0, 0.10], tail: 0.5, jaw: 0.2}
      - ms: 60
        set: {root: [0, 0, 0.04], twist: -0.20, lean: 0.18, squash: 1.04, hand_L: [0.20, 0.42, 0.30], dart: 1, hand_R: [0.26, 0.04, 0.10],
              spear_pitch: 0.1, foot_L: [0.10, 0, 0.12], foot_R: [0.10, 0, -0.06], tail: -0.3, jaw: 0.3}
      - ms: 90
        event: release
        set: {root: [0, 0, 0.06], twist: -0.40, lean: 0.26, hand_L: [0.06, 0.12, 0.38], dart: 0, hand_R: [0.26, 0.04, 0.10],
              spear_pitch: 0.15, foot_L: [0.10, 0, 0.14], foot_R: [0.10, 0, -0.08], tail: -0.6, jaw: 0.3}
      - ms: 120
        set: {root: [0, 0, 0.02], twist: -0.12, lean: 0.12, hand_L: [0.22, 0.02, 0.14], hand_R: [0.24, 0.07, 0.13],
              spear_pitch: 0.1, tail: -0.2}
  hit:
    loop: false
    keys:
      - {ms: 70, set: {lean: -0.25, root: [0, 0, -0.07], squash: 0.93, head_pitch: -0.30, jaw: 0.4, hand_L: [0.32, 0.12, 0.0],
                       hand_R: [0.30, 0.14, 0.04], spear_pitch: -0.25, tail: 0.7, foot_R: [0.10, 0, -0.06]}}
      - {ms: 90, set: {lean: -0.10, root: [0, 0, -0.05], squash: 1.03, head_pitch: -0.15, jaw: 0.2, hand_L: [0.29, 0.06, 0.06],
                       hand_R: [0.27, 0.10, 0.10], spear_pitch: -0.1, tail: 0.3, foot_R: [0.10, 0, -0.04]}}
      - {ms: 110, set: {lean: 0.04, root: [0, 0, -0.02], hand_R: [0.24, 0.08, 0.13], tail: 0.1}}
  death:           # rears back hissing, knees buckle, falls on its back, spear drops, tail flops
    loop: false
    keys:
      - {ms: 100, set: {lean: -0.25, squash: 0.95, head_pitch: -0.40, jaw: 0.5, root: [0, 0, -0.05], hand_L: [0.32, 0.15, 0.0],
                        hand_R: [0.30, 0.16, 0.02], spear_pitch: -0.4, tail: 0.6}}
      - {ms: 110, set: {bob: -0.14, lean: -0.45, squash: 0.92, head_pitch: -0.35, jaw: 0.5, root: [0, 0, -0.08], hand_L: [0.34, 0.22, -0.04],
                        hand_R: [0.34, 0.22, -0.02], spear_pitch: -0.9, foot_L: [0.11, 0, 0.10], foot_R: [0.11, 0, 0.06], tail: 0.8}}
      - {ms: 120, set: {bob: -0.30, lean: -0.95, head_pitch: -0.1, jaw: 0.4, root: [0, 0, 0.06], hand_L: [0.36, 0.25, -0.05],
                        hand_R: [0.36, 0.25, -0.05], spear_pitch: -0.6, foot_L: [0.11, 0.04, 0.22], foot_R: [0.11, 0, 0.18], tail: 0.4, tail_lift: 0.6}}
      - {ms: 110, set: {bob: -0.34, lean: -1.30, squash: 0.92, head_pitch: 0.25, jaw: 0.3, root: [0, 0, 0.16], hand_L: [0.40, 0.18, 0.0],
                        hand_R: [0.40, 0.18, 0.0], spear_pitch: -0.25, foot_L: [0.11, 0.02, 0.30], foot_R: [0.12, 0, 0.26], tail: 0.0, tail_lift: 1.1}}
      - {ms: 600, set: {bob: -0.34, lean: -1.35, head_pitch: 0.3, jaw: 0.3, root: [0, 0, 0.16], hand_L: [0.42, 0.15, 0.02],
                        hand_R: [0.42, 0.15, 0.02], spear_pitch: -0.25, foot_L: [0.11, 0, 0.30], foot_R: [0.12, 0, 0.27], tail: -0.2, tail_lift: 1.2}}
