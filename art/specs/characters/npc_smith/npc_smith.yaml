spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: npc_smith
mirror: true
kind: character
size: 48
directions: 8
palette: "farm"
camera: {"pitch": 38, "scale": 0.055, "center": [0, 0.90, 0]}
shadow: {rx: 10.5, ry: 3.8, alpha: 120}

# Village NPC "Ferreira Marta". Project style: topdown, 32 px, dark outline, flat, chibi, snappy.
brief:
  summary: >
    Chibi blacksmith woman - stocky and broad-shouldered, red shirt with sleeves rolled to the elbow (bare
    forearms), long dark-brown leather apron from chest to shins with a neck strap, dark pants, heavy
    boots, short dark hair tied back in a small bun, soot smudges on the cheeks, smithing hammer hanging
    in the right hand.
  must_keep: [red shirt + brown apron, broad shoulders, hammer in the right hand, hair bun, bare forearms]
  simplify: [no fingers, apron strap is a thin band, soot = two dark dots on the cheeks]
  decisions: >
    Head scale 1.75 (chibi). The hammer lives in its own frame at wrist_R (torso space) so it hangs
    by the leg at rest and can be lifted in talk. Shirt red (cloth_red) is the colour accent; the
    barbarian's red is only hair, his torso is bare skin + fur, so the silhouettes differ (apron box,
    no horns). Talk: she taps the hammer head into the free left palm.

ramps:
  soot: ["#1c0f1a", "#3a2a30", "#5a4448"]
  hair_smith: ["#1c0f1a", "#24161c", "#3e2a2c", "#5e4240"]
  apron: ["#1c0f1a", "#3a2216", "#5e3a22", "#80532f"]

materials:
  skin:  {ramp: skin, bands: [2, 4], line_band: 2}
  shirt: {ramp: cloth_red, bands: [1, 3]}
  apron: {ramp: apron, bands: [1, 3]}
  pants: {ramp: cloth, bands: [2, 4]}
  boots: {ramp: leather, bands: [1, 2]}
  hair:  {ramp: hair_smith, bands: [1, 3]}
  steel: {ramp: steel, bands: [1, 3]}
  wood:  {ramp: wood, bands: [1, 3]}
  soot:  {ramp: soot, emissive: true, band: 2, outline: false}
  ink:   {ramp: cloth, emissive: true, band: 0, outline: false}

channels:
  root: [0, 0, 0]
  bob: 0
  lean: 0.03
  twist: 0
  roll: 0
  squash: 1
  head_pitch: 0
  head_yaw: 0
  hand_L: [0.30, 0.10, 0.06]
  foot_L: [0.12, 0, 0.02]
  pitch_foot_L: 0
  ham_rot: [0.15, 0, 0.12]   # hammer orientation in torso space (rest: hanging, head down)

bones:
  torso_rot: {parent: root, pos: "[0, 0.56 + bob, 0]", rot: "[lean, twist, roll]"}
  pelvis:    {parent: torso_rot, scale: "[1/sqrt(squash), squash, 1/sqrt(squash)]"}
  headbase:  {parent: pelvis, pos: [0, 0.53, 0.03], inherit_rot: false, inherit_scale: false,
              rot: "[lean*0.5, twist, roll]"}
  head:      {parent: headbase, rot: "[head_pitch, head_yaw, 0]", scale: 1.75}
  shoulder_L: {parent: pelvis, pos: [0.25, 0.36, 0.0]}
  hip_L:      {parent: pelvis, pos: [0.11, -0.02, 0.0]}
  legyaw:     {parent: root, rot: "[0, twist*0.5, 0]"}
  footyaw:    {parent: root, rot: "[0, twist*0.4, 0]"}
  sole_L:     {parent: footyaw, at: ankle_L, rot: "[pitch_foot_L, 0.08, 0]"}
  hammer:     {parent: torso_rot, at: wrist_R, rot: ham_rot}

ik:
  arm_L: {start: shoulder_L, space: torso_rot, target: hand_L, lengths: [0.19, 0.18],
          pole: [0.4, 0.0, -1.0], pole_space: torso_rot, up: [0, 0, 1], joint: elbow_L, end: wrist_L}
  leg_L: {start: hip_L, space: root, target: "foot_L + [0, 0.08, -0.02]", lengths: [0.25, 0.24],
          pole: [0.1, 0, 1.0], pole_space: legyaw, joint: knee_L, end: ankle_L}

parts:
  torso:           # stocky trunk, wide shoulders
    material: shirt
    space: pelvis
    blend: 0.07
    prims:
      - ellipsoid: {c: [0, 0.05, 0], r: [0.20, 0.13, 0.15]}
      - ellipsoid: {c: [0, 0.22, 0.01], r: [0.21, 0.15, 0.16]}
      - ellipsoid: {c: [0, 0.34, 0.0], r: [0.26, 0.11, 0.15]}
  apron:           # leather apron: bib + skirt to the shins, strap round the neck
    material: apron
    space: pelvis
    blend: 0.02
    prims:
      - box: {c: [0, 0.22, 0.135], half: [0.15, 0.15, 0.04], round: 0.03, rot: [-0.08, 0, 0]}
      - box: {c: [0, -0.12, 0.16], half: [0.20, 0.22, 0.035], round: 0.03, rot: [0.06, 0, 0]}
      - cylinder: {a: [0, 0.07, 0], b: [0, 0.12, 0], r: 0.215}               # waist tie
      - torus: {c: [0, 0.40, 0.03], R: 0.11, r: 0.02, rot: [0.35, 0, 0]}       # neck strap
  neck:
    material: skin
    space: pelvis
    prims:
      - cone: {a: [0, 0.40, 0], b: [0, 0.54, 0.03], r: [0.09, 0.08]}
  head:
    material: skin
    space: head
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 0.13, 0.0], r: [0.15, 0.15, 0.145]}
      - sphere: {c: [0, 0.10, 0.145], r: 0.024}
  hair:            # short dark hair swept back, small bun
    material: hair
    space: head
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.18, -0.03], r: [0.158, 0.115, 0.152]}
      - ellipsoid: {c: [0, 0.11, -0.08], r: [0.152, 0.10, 0.09]}
      - sphere: {c: [0, 0.13, -0.19], r: 0.07}                                         # bun
    cut:
      - box: {c: [0, 0.06, 0.14], half: [0.3, 0.13, 0.1]}
  soot_L:          # smudges on the cheeks
    material: soot
    space: head
    prims:
      - ellipsoid: {c: [0.105, 0.065, 0.11], r: [0.025, 0.018, 0.02]}
  eye_L:
    material: ink
    space: head
    prims:
      - sphere: {c: [0.058, 0.12, 0.135], r: 0.026}
  sleeve_L:        # rolled red sleeve to the elbow
    material: shirt
    blend: 0.03
    prims:
      - sphere: {c: "@shoulder_L", r: 0.10}
      - cone: {a: "@shoulder_L", b: "@elbow_L", r: [0.095, 0.08]}
      - sphere: {c: "@elbow_L", r: 0.085}
  arm_L:           # bare forearm
    material: skin
    prims:
      - cone: {a: "@elbow_L", b: "@wrist_L", r: [0.07, 0.065]}
  hand_L:
    material: skin
    space: wrist_L
    prims:
      - sphere: {c: [0, 0, 0.04], r: 0.065}
  leg_L:
    material: pants
    blend: 0.03
    prims:
      - cone: {a: "@hip_L", b: "@knee_L", r: [0.11, 0.085]}
      - cone: {a: "@knee_L", b: "@ankle_L", r: [0.085, 0.07]}
  boot_L:
    material: boots
    space: sole_L
    blend: 0.03
    prims:
      - cone: {a: [0, 0.12, 0], b: [0, -0.02, 0.0], r: [0.085, 0.08]}
      - ellipsoid: {c: [0, -0.03, 0.05], r: [0.08, 0.05, 0.12]}
  handle:          # hammer haft (right hand only)
    material: wood
    space: hammer
    prims:
      - cylinder: {a: [0, 0.08, 0.02], b: [0, -0.36, 0.02], r: 0.032}
  hammerhead:      # steel head at the bottom of the haft
    material: steel
    space: hammer
    prims:
      - box: {c: [0, -0.38, 0.02], half: [0.07, 0.07, 0.13], round: 0.015}

animations:
  idle:            # steady breathing, hammer hangs
    frames: 4
    ms: 180
    channels:
      bob: "0.03*sin(p)"
      squash: "1 + 0.02*sin(p)"
      head_pitch: "-0.04*sin(p - 0.5)"
      hand_L: "[0.30, 0.10 + 0.02*sin(p - 0.6), 0.06]"
      hand_R: "[0.36, 0.10 + 0.02*sin(p - 0.6), 0.14]"
      ham_rot: "[0.15 + 0.05*sin(p - 1.0), 0, 0.12]"
  talk:            # lifts the hammer and taps it into the left palm
    frames: 4
    ms: 150
    channels:
      bob: "0.015*sin(2*p)"
      head_pitch: "-0.05*sin(2*p)"
      hand_L: "[0.10, 0.22, 0.26]"
      hand_R: "[0.18, 0.26 + 0.06*sin(p), 0.22]"
      ham_rot: "[-1.6 + 0.3*sin(p), 0, 0.3]"
