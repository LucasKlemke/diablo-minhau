# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: scorch_mark
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}   # pivot = frame centre (24, 24) = the ground point
shadow: null             # a decal on the ground

# Prologue (the burning castle): burn marks on the marble floor where fire raged or something exploded.
brief:
  summary: black soot burns on the floor - an irregular charred blot with a near-black core, a brown-grey
    scorched halo and blast streaks radiating out; three of the four still have a couple of glowing embers
  must_keep: [near-black core, brown scorched halo that reads on white marble, radial streaks, 4 shapes]
  simplify: [flat decals, 3 exact colours + an emissive ember tone]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 0, 0]. No outline (a decal);
    the halo is the edge. camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (24, 24) = frame centre = the ground point under the mark; floor-decal layer.
    VARIANTS: animation `variants` has 4 frames (frame i = variant i; 0, 2 and 3 have embers, emissive);
    `idle` = variant 0. Geometry generated once from a seeded random layout (flat ellipsoids).

ramps:
  sc_halo: ["#1c0f1a", "#6e5a52"]
  sc_soot: ["#1c0f1a", "#33262a"]
  sc_core: ["#1c0f1a", "#170e12"]

materials:
  halo:  {ramp: sc_halo, bands: [1, 1], outline: false, line: false}
  soot:  {ramp: sc_soot, bands: [1, 1], outline: false, line: false}
  core:  {ramp: sc_core, bands: [1, 1], outline: false, line: false}
  ember: {ramp: fire, emissive: true, band: 1, outline: false, glow: {color: "#fe6607", mix: 0.3, radius: 1}}

channels:
  root: [0, 0, 0]
  var: 0             # variant 0..3

bones:
  body: {parent: root}

