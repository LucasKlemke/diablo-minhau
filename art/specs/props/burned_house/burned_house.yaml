# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: burned_house
kind: prop
view: topdown
size: 128
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 2.5127 = 36 px above the pivot -> pivot (64, 100), integer
camera: {pitch: 38, scale: 0.055, center: [0, 2.5127, 0]}
shadow: {rx: 44, ry: 10, alpha: 70}

# Act I, Minhau: a house burned in the raid ten years ago, never rebuilt (replaces generic houses).
brief:
  summary: the burned shell of a village house, same 5x3 plan as `house` - a low grey fieldstone sill
    round a floor of black soot and grey ash, no roof left; charred black timber posts and beams, jagged
    remains of the plank walls, fallen rafters across the inside, ash heaps and a few stones
  must_keep: [same footprint and front-wall line as house, stone sill outlining the plan, charred posts of
    uneven height, jagged burned wall tops, fallen beams, ash floor, open sky (no roof)]
  simplify: [planks as grooves on wall slabs, ash as flat blobs, char as 3 flat tones]
  exceptions: |
    kind prop, size 128, directions 1, mirror false, camera.center [0, 2.5127, 0] (integer pivot).
    v2 has a smouldering ember (emissive, the only warm accent). camera.scale/pitch/light untouched.
    Ramps from palettes/ruin.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT (same as house): world origin (= exported pivot, frame px 64,100) is the ground point
    at the centre of the FRONT edge of the 5x3 footprint (bottom-centre of the front wall). The sill spans
    x -1.75..1.75, z -2.64..0 like house; the game places it exactly like `house` (pivot on the bottom edge
    of the footprint's front tile row) and blocks the same 5x3 tiles. The doorway gap is at x 0.3..1.1.
    Clips: idle (= variant 0) and `variants` (3 frames, frame i = variant i):
    0 back wall standing - the back and left plank walls survive to jagged heights, corner posts, the
      ridge beam fallen diagonally across the floor;
    1 chimney - only the stone chimney stands at the back left, low wall stumps, a heap of rafters;
    2 skeleton - the timber frame of the front gable still stands (one rafter snapped), walls fallen,
      embers still smouldering in the rubble.

materials:
  stone:   {ramp: rstone, bands: [1, 3]}
  mortar:  {ramp: rstone, bands: [1, 1], outline: false, line: false}
  floor:   {ramp: rburnt, bands: [2, 4], outline: false, line: false}
  ash:     {ramp: rash, bands: [1, 2], outline: false, line: false}
  char:    {ramp: rchar, bands: [2, 4]}
  wall:    {ramp: rwood, bands: [1, 3]}
  groove:  {ramp: rchar, bands: [1, 1], outline: false, line: false}
  soot:    {ramp: rchar, bands: [1, 2]}
  ember:   {ramp: rfire, emissive: true, band: 4, outline: false, line: false, glow: {color: "#fe6607", mix: 0.35, radius: 1}}
  ember_hi: {ramp: rfire, emissive: true, band: 6, outline: false, line: false}

channels:
  root: [0, 0, 0]
  v: 0

bones:
  body: {parent: root}

parts:
  # ================= common: floor, sill, ash =================
  floor:
    material: floor
    space: body
    prims:
      - box: {c: [0, 0.01, -1.32], half: [1.72, 0.01, 1.3]}
  ash:
    material: ash
    space: body
    blend: 0.04
    prims:
      - ellipsoid: {c: [-0.6, 0.03, -1.0], r: [0.7, 0.04, 0.5]}
      - ellipsoid: {c: [0.7, 0.03, -1.8], r: [0.6, 0.04, 0.45]}
      - ellipsoid: {c: [0.1, 0.03, -0.4], r: [0.4, 0.03, 0.25]}
  sill:              # low fieldstone sill all round; doorway gap in front at x 0.3..1.1
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0, 0.12, -2.58], half: [1.78, 0.12, 0.1], round: 0.03}
      - box: {c: [-1.72, 0.12, -1.3], half: [0.1, 0.12, 1.33], round: 0.03}
      - box: {c: [1.72, 0.12, -1.3], half: [0.1, 0.12, 1.33], round: 0.03}
      - box: {c: [-0.73, 0.12, -0.05], half: [1.05, 0.12, 0.1], round: 0.03}
      - box: {c: [1.45, 0.12, -0.05], half: [0.33, 0.12, 0.1], round: 0.03}
  sill_joints:
    material: mortar
    space: body
    prims:
      - box: {c: [-1.2, 0.12, 0.06], half: [0.015, 0.11, 0.01]}
      - box: {c: [-0.5, 0.12, 0.06], half: [0.015, 0.11, 0.01]}
      - box: {c: [0.1, 0.12, 0.06], half: [0.015, 0.11, 0.01]}
      - box: {c: [1.5, 0.12, 0.06], half: [0.015, 0.11, 0.01]}
  rubble:            # stones and charred chunks spilled out in front
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [-1.2, 0.07, 0.3], half: [0.12, 0.07, 0.1], rot: [0, 0.5, 0], round: 0.04}
      - box: {c: [1.95, 0.06, -0.4], half: [0.1, 0.06, 0.09], rot: [0, 0.9, 0], round: 0.04}
      - box: {c: [-1.95, 0.07, -1.6], half: [0.11, 0.07, 0.1], rot: [0, 0.2, 0], round: 0.04}
  chunks:
    material: char
    space: body
    line: true
    prims:
      - box: {c: [-0.4, 0.06, 0.32], half: [0.3, 0.05, 0.06], rot: [0, 0.3, 0]}
      - box: {c: [0.7, 0.07, -0.9], half: [0.28, 0.06, 0.07], rot: [0, -0.8, 0]}

  # ================= variant 0: back wall standing =================
  v0_back_wall:      # charred plank wall with a jagged burned top
    material: wall
    space: body
    line: true
    when: "v < 0.5"
    prims:
      - box: {c: [-1.35, 0.95, -2.6], half: [0.4, 0.95, 0.07]}
      - box: {c: [-0.75, 0.75, -2.6], half: [0.22, 0.75, 0.07]}
      - box: {c: [-0.3, 0.9, -2.6], half: [0.25, 0.9, 0.07]}
      - box: {c: [0.15, 0.55, -2.6], half: [0.22, 0.55, 0.07]}
      - box: {c: [0.6, 0.4, -2.6], half: [0.25, 0.4, 0.07]}
      - box: {c: [1.2, 0.25, -2.6], half: [0.4, 0.25, 0.07]}
  v0_left_wall:
    material: wall
    space: body
    line: true
    when: "v < 0.5"
    prims:
      - box: {c: [-1.7, 0.85, -2.05], half: [0.07, 0.85, 0.5]}
      - box: {c: [-1.7, 0.5, -1.3], half: [0.07, 0.5, 0.3]}
      - box: {c: [-1.7, 0.3, -0.6], half: [0.07, 0.3, 0.4]}
  v0_grooves:
    material: groove
    space: body
    when: "v < 0.5"
    prims:
      - box: {c: [-0.5, 0.4, -2.52], half: [1.2, 0.018, 0.01]}
      - box: {c: [-0.6, 0.8, -2.52], half: [1.1, 0.018, 0.01]}
      - box: {c: [-1.0, 1.2, -2.52], half: [0.7, 0.018, 0.01]}
      - box: {c: [-1.3, 1.6, -2.52], half: [0.4, 0.018, 0.01]}
  v0_char_tops:      # blackened tops of the burned walls
    material: char
    space: body
    when: "v < 0.5"
    prims:
      - box: {c: [-1.35, 1.82, -2.58], half: [0.4, 0.1, 0.09]}
      - box: {c: [-0.75, 1.42, -2.58], half: [0.22, 0.09, 0.09]}
      - box: {c: [-0.3, 1.72, -2.58], half: [0.25, 0.1, 0.09]}
      - box: {c: [0.15, 1.02, -2.58], half: [0.22, 0.09, 0.09]}
      - box: {c: [0.6, 0.72, -2.58], half: [0.25, 0.09, 0.09]}
      - box: {c: [-1.68, 1.62, -2.05], half: [0.09, 0.1, 0.5]}
      - box: {c: [-1.68, 0.92, -1.3], half: [0.09, 0.09, 0.3]}
  v0_posts:
    material: char
    space: body
    line: true
    when: "v < 0.5"
    prims:
      - box: {c: [-1.7, 1.2, -2.6], half: [0.12, 1.2, 0.12]}            # back left, tall
      - box: {c: [1.7, 0.7, -2.6], half: [0.12, 0.7, 0.12]}             # back right, snapped
      - cone: {a: [1.7, 1.38, -2.6], b: [1.74, 1.62, -2.56], r: [0.1, 0.02]}
      - box: {c: [-1.7, 0.55, -0.05], half: [0.12, 0.55, 0.12]}         # front left, low
      - box: {c: [0.3, 0.8, -0.05], half: [0.1, 0.8, 0.1]}              # door post
      - cone: {a: [0.3, 1.58, -0.05], b: [0.28, 1.8, -0.02], r: [0.08, 0.02]}
  v0_beams:          # ridge beam fallen diagonally across the floor, wall plate stub
    material: char
    space: body
    line: true
    when: "v < 0.5"
    prims:
      - box: {c: [-0.35, 1.0, -1.5], half: [0.11, 0.11, 1.45], rot: [0.62, -0.75, 0]}
      - box: {c: [-1.7, 2.32, -2.3], half: [0.08, 0.08, 0.45], rot: [0.2, 0, 0]}
      - box: {c: [0.9, 0.12, -1.3], half: [0.75, 0.1, 0.1], rot: [0, 0.4, 0.04]}

  # ================= variant 1: lone chimney =================
  v1_chimney:
    material: stone
    space: body
    line: true
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [-1.2, 1.55, -2.3], half: [0.34, 1.55, 0.3]}
      - box: {c: [-1.2, 3.16, -2.3], half: [0.4, 0.07, 0.36]}
  v1_chimney_joints:
    material: mortar
    space: body
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [-1.2, 0.6, -1.99], half: [0.34, 0.02, 0.01]}
      - box: {c: [-1.2, 1.1, -1.99], half: [0.34, 0.02, 0.01]}
      - box: {c: [-1.2, 1.6, -1.99], half: [0.34, 0.02, 0.01]}
      - box: {c: [-1.2, 2.1, -1.99], half: [0.34, 0.02, 0.01]}
      - box: {c: [-1.2, 2.6, -1.99], half: [0.34, 0.02, 0.01]}
      - box: {c: [-1.05, 0.85, -1.99], half: [0.02, 0.24, 0.01]}
      - box: {c: [-1.35, 1.35, -1.99], half: [0.02, 0.24, 0.01]}
      - box: {c: [-1.1, 1.85, -1.99], half: [0.02, 0.24, 0.01]}
      - box: {c: [-1.32, 2.35, -1.99], half: [0.02, 0.24, 0.01]}
  v1_hearth:         # dark hearth mouth at the chimney foot
    material: soot
    space: body
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [-1.2, 0.3, -1.98], half: [0.2, 0.28, 0.02]}
  v1_soot:           # soot streaks up the chimney face
    material: groove
    space: body
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [-1.2, 0.85, -1.985], half: [0.1, 0.25, 0.008]}
      - box: {c: [-1.2, 3.0, -1.985], half: [0.22, 0.12, 0.008]}
  v1_stumps:         # low wall stumps
    material: wall
    space: body
    line: true
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [0.3, 0.4, -2.6], half: [0.5, 0.4, 0.07]}
      - box: {c: [1.2, 0.25, -2.6], half: [0.4, 0.25, 0.07]}
      - box: {c: [1.7, 0.6, -1.8], half: [0.07, 0.6, 0.55]}
      - box: {c: [1.7, 0.3, -0.9], half: [0.07, 0.3, 0.35]}
  v1_tops:
    material: char
    space: body
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [0.3, 0.76, -2.58], half: [0.5, 0.08, 0.09]}
      - box: {c: [1.68, 1.12, -1.8], half: [0.09, 0.09, 0.55]}
  v1_posts:
    material: char
    space: body
    line: true
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [1.7, 1.0, -2.6], half: [0.12, 1.0, 0.12]}
      - cone: {a: [1.7, 1.98, -2.6], b: [1.66, 2.25, -2.56], r: [0.1, 0.02]}
      - box: {c: [1.1, 0.65, -0.05], half: [0.1, 0.65, 0.1]}
  v1_heap:           # collapsed rafters
    material: char
    space: body
    line: true
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [0.2, 0.3, -1.3], half: [1.0, 0.09, 0.09], rot: [0, 0.5, 0.3]}
      - box: {c: [0.4, 0.25, -1.0], half: [0.9, 0.09, 0.09], rot: [0, -0.6, -0.2]}
      - box: {c: [-0.2, 0.2, -0.9], half: [0.08, 0.08, 0.8], rot: [0.25, 0.3, 0]}
      - box: {c: [0.8, 0.45, -1.6], half: [0.08, 0.08, 0.8], rot: [0.5, -0.4, 0]}

  # ================= variant 2: timber skeleton =================
  v2_frame:          # front corner posts, tie beam and gable rafters still standing
    material: char
    space: body
    line: true
    when: "v > 1.5"
    prims:
      - box: {c: [-1.7, 0.98, -0.05], half: [0.12, 0.98, 0.12]}
      - box: {c: [1.7, 0.98, -0.05], half: [0.12, 0.98, 0.12]}
      - box: {c: [-0.6, 1.98, -0.05], half: [1.2, 0.09, 0.1], rot: [0, 0, -0.03]}    # tie beam, broken off on the right
      - box: {c: [-0.86, 2.68, -0.05], half: [1.22, 0.09, 0.1], rot: [0, 0, 0.7854]} # left rafter to the apex
      - box: {c: [1.3, 2.2, -0.05], half: [0.45, 0.09, 0.1], rot: [0, 0, -0.7854]}   # right rafter stub
      - box: {c: [-1.7, 0.9, -2.6], half: [0.12, 0.9, 0.12]}                         # back posts
      - box: {c: [1.7, 0.5, -2.6], half: [0.12, 0.5, 0.12]}
      - box: {c: [-1.7, 1.86, -1.3], half: [0.09, 0.09, 1.32], rot: [-0.05, 0, 0]}   # left wall plate
      - box: {c: [0.0, 1.5, -2.6], half: [0.1, 1.5, 0.1]}                            # back king post
  v2_frame_tips:     # burned-away points
    material: char
    space: body
    line: true
    when: "v > 1.5"
    prims:
      - cone: {a: [1.62, 1.88, -0.05], b: [1.72, 2.08, -0.02], r: [0.08, 0.02]}
      - cone: {a: [0.0, 2.96, -2.6], b: [0.03, 3.25, -2.56], r: [0.09, 0.02]}
      - cone: {a: [1.7, 0.98, -2.6], b: [1.68, 1.2, -2.56], r: [0.1, 0.02]}
  v2_stumps:
    material: wall
    space: body
    line: true
    when: "v > 1.5"
    prims:
      - box: {c: [-0.9, 0.35, -2.6], half: [0.7, 0.35, 0.07]}
      - box: {c: [1.0, 0.22, -2.6], half: [0.55, 0.22, 0.07]}
      - box: {c: [-1.7, 0.3, -1.6], half: [0.07, 0.3, 0.7]}
      - box: {c: [-1.0, 0.25, -0.05], half: [0.55, 0.25, 0.07]}
  v2_tops:
    material: char
    space: body
    when: "v > 1.5"
    prims:
      - box: {c: [-0.9, 0.68, -2.58], half: [0.7, 0.07, 0.09]}
      - box: {c: [-1.0, 0.48, -0.03], half: [0.55, 0.06, 0.09]}
  v2_fallen:         # the broken half of the tie beam and a rafter on the floor
    material: char
    space: body
    line: true
    when: "v > 1.5"
    prims:
      - box: {c: [1.0, 0.45, -0.5], half: [0.65, 0.09, 0.09], rot: [0.3, 0.6, -0.55]}
      - box: {c: [0.2, 0.12, -1.5], half: [0.1, 0.1, 0.9], rot: [0, -0.9, 0]}
  v2_embers:         # still smouldering in the rubble
    material: ember
    space: body
    when: "v > 1.5"
    prims:
      - ellipsoid: {c: [0.35, 0.12, -1.3], r: [0.14, 0.05, 0.1]}
      - sphere: {c: [-0.1, 0.12, -1.75], r: 0.06}
  v2_embers_hi:
    material: ember_hi
    space: body
    when: "v > 1.5"
    prims:
      - sphere: {c: [0.36, 0.16, -1.25], r: 0.04}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {v: 0}
  variants:
    frames: 3
    ms: 1000
    channels: {v: "f"}
