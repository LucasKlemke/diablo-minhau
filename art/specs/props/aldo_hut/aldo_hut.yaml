# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: aldo_hut
kind: prop
view: topdown
size: 96
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 2.3731 = 34 px above the pivot -> pivot (48, 82), integer
camera: {pitch: 38, scale: 0.055, center: [0, 2.3731, 0]}
shadow: {rx: 34, ry: 9, alpha: 80}

# Act I, Minhau: the outside of King Aldo's poor hut (its interior is the hut_* props).
brief:
  summary: the poorest hut of the village, smaller than a house - wattle-and-daub clay walls in a
    smoke-darkened post frame on rough sill logs (the same materials as the interior), gable front to
    the camera like `house`, a heavy old thatch roof weathered grey-gold outside, with a thick ragged
    front edge and a hole on the right slope where the rafters show; a low plank door with a Z brace on
    the left, a closed shutter on the right with warm hearth light leaking through its crack, a smoke
    vent in the gable, a patch where the clay fell off and the wattle shows, a chopping block with an axe
  must_keep: [daub panels + dark posts + log sill (same ramps as hut_wall_back), thatch with a hole and
    visible rafters, plank door with Z brace, shutter with a warm light crack, exposed wattle patch]
  simplify: [straw as strokes along the slopes, wattle as 3 sticks]
  exceptions: |
    kind prop, size 96, directions 1, mirror false, camera.center [0, 2.3731, 0] (integer pivot).
    The light in the shutter crack is emissive (the hearth inside: the only warm accent).
    camera.scale/pitch/light untouched. Wood, daub and post ramps from palettes/hut.yaml so the outside
    matches the interior; the outer thatch uses ruin.yaml's weathered rstraw (the inside of the thatch,
    in the interior props, stays golden: sun-bleached and rained-on outside).
  decisions: |
    PIVOT CONTRACT (same as house): world origin (= exported pivot, frame px 48,82) is the ground point at
    the centre of the FRONT wall's base. Walls x -1.45..1.45, z -2.4..0; thatch eaves x -1.85..1.85,
    front edge z +0.2 -> ~68 px wide: footprint 4x3 tiles (one tile narrower than house), blocking all
    12 tiles; place it like house with the pivot 2 tiles right of the footprint's left edge. The door
    (centre x -0.6, i.e. about -11 px from the pivot) is the entrance: the walkable tile in front of it
    is the one below the footprint's second column. Roof at 45 degrees like house, ridge y ~3.3.
    Static: 1-frame idle.

