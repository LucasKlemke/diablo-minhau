# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: house
kind: prop
view: topdown
size: 128                # 80 px wide, ~110 px tall incl. chimney, 2+ px margins
directions: 1            # faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 2.0, -1.4]}
shadow: {rx: 44, ry: 10, alpha: 90}

# Village cottage (replaces the Farm RPG house frame "h1").
brief:
  summary: cosy village cottage, 5x3 tiles (4.4 x 2.64 units, 80 px wide on screen); gable front facing the
    camera, steep warm red-orange tiled roof with a dark timber ridge beam, cream plank walls in a dark-brown
    timber frame, grey stone chimney on the left, small upper window in the gable, flower window on the left,
    wooden door with a doorstep on the right
  reference: public/assets/farm/house.png frame h1 (x144 y0 w80 h112), seen from s
  must_keep: [red-orange tiled roof with ridge beam, stone chimney on the left, cream plank walls,
    dark timber frame, door with doorstep, flower window, small gable window]
  simplify: [roof tiles as raised courses plus a few cross grooves, planks as thin lines, flowers as 3-4 blobs]
  exceptions: |
    kind prop, size 128, directions 1, mirror false; camera.center [0, 2.0, -1.4] so the tall roof fits.
    camera.scale/pitch/light untouched. Spec-local ramps all keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: the world origin (= the exported pivot) is the ground point at the centre of the FRONT
    (camera-facing) edge of the 5x3 footprint, i.e. the bottom-centre of the front wall. The building spans
    x -2.2..2.2 (roof eaves; walls x -1.75..1.75) and z -2.64..0 (front wall face at z 0); the doorstep and
    the roof overhang stick out a little in front (z > 0). The game puts the pivot on the bottom edge of the
    footprint's front tile row.
    Roof pitch 45 degrees (ridge y 3.75) so the gable reads like the reference at 38 degrees of camera pitch.
    The chimney rises through the left roof slope near the front, like the reference. Only s is rendered,
    the sides and back are modeled plainly (walls and roof continue) and never shown.

ramps:
  h_roof:   ["#1c0f1a", "#5a160a", "#8a2a12", "#c33f1a", "#e0692c"]
  h_wall:   ["#1c0f1a", "#a8786a", "#d9ab91", "#efc9b0", "#f7dbc6"]
  h_plank:  ["#1c0f1a", "#8f5f55", "#b98676", "#d9ab91"]
  h_timber: ["#1c0f1a", "#3a1a1c", "#5e2a24", "#8a3625", "#a8482e"]
  h_door:   ["#1c0f1a", "#5e2a24", "#8a3625", "#ae4924", "#c45a32"]
  h_glass:  ["#1c0f1a", "#3f78a8", "#7ec4ea", "#c4ecfa"]
  h_stone:  ["#1c0f1a", "#5a4a48", "#856c5c", "#b4a07f", "#cdc1a0"]
  h_soot:   ["#1c0f1a", "#241418", "#3a2a2e"]
  h_leaf:   ["#1c0f1a", "#2c6226", "#5dab3d", "#8fcf62"]
  h_flower: ["#1c0f1a", "#685aa4", "#b4a8e8", "#f4f0ff"]
  h_gold:   ["#1c0f1a", "#804a19", "#e1a227", "#eddc83"]

materials:
  roof:    {ramp: h_roof, bands: [2, 4]}
  roof_ln: {ramp: h_roof, bands: [1, 2], outline: false, line: false}
  wall:    {ramp: h_wall, bands: [2, 4]}
  plank:   {ramp: h_plank, bands: [1, 2], outline: false, line: false}
  timber:  {ramp: h_timber, bands: [1, 3]}
  door:    {ramp: h_door, bands: [1, 3]}
  glass:   {ramp: h_glass, bands: [1, 3]}
  stone:   {ramp: h_stone, bands: [1, 4]}
  soot:    {ramp: h_soot, bands: [1, 2]}
  leaf:    {ramp: h_leaf, bands: [1, 3]}
  flower:  {ramp: h_flower, bands: [1, 3]}
  gold:    {ramp: h_gold, bands: [2, 3], outline: false}

channels:
  root: [0, 0, 0]

# Layout (world units, +x = screen right, +z = towards the camera). Pivot/origin = front-centre ground.
# Walls x +-1.75, y 0..1.95, z -2.64..0. Gable apex y 3.70 at x 0. Roof slabs at 45 deg, eaves at x +-2.12 (+outline = 80 px).
bones:
  body: {parent: root}

parts:
  walls:
    material: wall
    space: body
    line: true
    prims:
      - box: {c: [0, 0.975, -1.32], half: [1.75, 0.975, 1.32]}
  attic:           # triangular attic prism (a 45-degree diamond whose lower half hides in the walls)
    material: wall
    space: body
    prims:
      - box: {c: [0, 1.95, -1.32], half: [1.237, 1.237, 1.32], rot: [0, 0, 0.7854]}
  planks:          # horizontal board lines on the front wall and gable
    material: plank
    space: body
    prims:
      - box: {c: [0, 0.36, 0.01], half: [1.70, 0.035, 0.01]}
      - box: {c: [0, 0.76, 0.01], half: [1.70, 0.035, 0.01]}
      - box: {c: [0, 1.16, 0.01], half: [1.70, 0.035, 0.01]}
      - box: {c: [0, 1.56, 0.01], half: [1.70, 0.035, 0.01]}
      - box: {c: [0, 2.40, 0.01], half: [1.25, 0.035, 0.01]}
      - box: {c: [0, 2.80, 0.01], half: [0.85, 0.035, 0.01]}
      - box: {c: [0, 3.20, 0.01], half: [0.45, 0.035, 0.01]}
  frame_L:         # timber corner posts
    material: timber
    space: body
    line: true
    prims:
      - box: {c: [1.68, 0.975, -0.02], half: [0.11, 0.975, 0.10]}
  beam:            # horizontal beam under the gable and the sill along the ground
    material: timber
    space: body
    line: true
    prims:
      - box: {c: [0, 1.98, 0.02], half: [1.82, 0.08, 0.08]}
      - box: {c: [0, 0.05, 0.02], half: [1.80, 0.05, 0.06]}
  roof_L:          # roof slab on +x (screen right), mirrored to roof_R
    material: roof
    space: body
    line: true
    prims:
      - box: {c: [1.075, 2.765, -1.30], half: [1.48, 0.10, 1.60], rot: [0, 0, -0.7854]}
  # Tile grooves sit on the slab's top surface (surface line y = 3.98 - x; s = distance from the ridge).
  # Courses run front-to-back (vertical on screen); cross grooves are staggered (diagonal on screen).
  tiles_L:
    material: roof_ln
    space: body
    prims:
      - box: {c: [0.548, 3.467, -1.30], half: [0.035, 0.02, 1.60], rot: [0, 0, -0.7854]}
      - box: {c: [1.078, 2.937, -1.30], half: [0.035, 0.02, 1.60], rot: [0, 0, -0.7854]}
      - box: {c: [1.609, 2.407, -1.30], half: [0.035, 0.02, 1.60], rot: [0, 0, -0.7854]}
      - box: {c: [0.283, 3.733, 0.00], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.283, 3.733, -0.60], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.283, 3.733, -1.20], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.283, 3.733, -1.80], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.283, 3.733, -2.40], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.813, 3.202, -0.30], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.813, 3.202, -0.90], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.813, 3.202, -1.50], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.813, 3.202, -2.10], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.813, 3.202, -2.70], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.344, 2.672, 0.00], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.344, 2.672, -0.60], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.344, 2.672, -1.20], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.344, 2.672, -1.80], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.344, 2.672, -2.40], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.845, 2.171, -0.30], half: [0.33, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.845, 2.171, -0.90], half: [0.33, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.845, 2.171, -1.50], half: [0.33, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.845, 2.171, -2.10], half: [0.33, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.845, 2.171, -2.70], half: [0.33, 0.02, 0.03], rot: [0, 0, -0.7854]}
  barge_L:         # dark timber bargeboard under the front edge of the tiles
    material: timber
    space: body
    line: true
    prims:
      - box: {c: [1.03, 2.61, 0.27], half: [1.50, 0.13, 0.06], rot: [0, 0, -0.7854]}
  ridge:           # ridge beam with a cap block at the front apex
    material: timber
    space: body
    line: true
    prims:
      - box: {c: [0, 3.86, -1.30], half: [0.13, 0.13, 1.62], round: 0.02}
      - box: {c: [0, 3.70, 0.30], half: [0.17, 0.20, 0.10], round: 0.02}
  door_frame:
    material: timber
    space: body
    line: true
    prims:
      - box: {c: [0.70, 0.72, 0.03], half: [0.46, 0.74, 0.05]}
  door:
    material: door
    space: body
    line: true
    prims:
      - box: {c: [0.70, 0.66, 0.07], half: [0.36, 0.66, 0.03]}
  door_panels:     # two inset panels
    material: timber
    space: body
    prims:
      - box: {c: [0.70, 0.98, 0.10], half: [0.22, 0.20, 0.01]}
      - box: {c: [0.70, 0.40, 0.10], half: [0.22, 0.20, 0.01]}
  knob:
    material: gold
    space: body
    prims:
      - sphere: {c: [0.44, 0.68, 0.12], r: 0.05}
  doorstep:
    material: timber
    space: body
    line: true
    prims:
      - box: {c: [0.70, 0.07, 0.24], half: [0.52, 0.07, 0.24], round: 0.02}
  win_frame:       # flower window (left) and small gable window
    material: timber
    space: body
    line: true
    prims:
      - box: {c: [-0.90, 0.98, 0.03], half: [0.42, 0.38, 0.05]}
      - box: {c: [0, 2.62, 0.03], half: [0.34, 0.30, 0.05]}
  glass:
    material: glass
    space: body
    prims:
      - box: {c: [-0.90, 1.02, 0.07], half: [0.32, 0.28, 0.02]}
      - box: {c: [0, 2.62, 0.07], half: [0.24, 0.20, 0.02]}
  muntins:         # cross bars of the gable window
    material: timber
    space: body
    prims:
      - box: {c: [0, 2.62, 0.09], half: [0.035, 0.20, 0.02]}
      - box: {c: [0, 2.62, 0.09], half: [0.24, 0.035, 0.02]}
  flower_box:
    material: timber
    space: body
    line: true
    prims:
      - box: {c: [-0.90, 0.60, 0.14], half: [0.46, 0.09, 0.12]}
  leaves:
    material: leaf
    space: body
    blend: 0.04
    prims:
      - ellipsoid: {c: [-0.90, 0.72, 0.16], r: [0.40, 0.09, 0.10]}
  flowers:
    material: flower
    space: body
    blend: 0.02
    prims:
      - sphere: {c: [-1.12, 0.84, 0.18], r: 0.11}
      - sphere: {c: [-0.86, 0.90, 0.16], r: 0.12}
      - sphere: {c: [-0.62, 0.82, 0.18], r: 0.10}
  chimney:         # stone chimney rising through the left slope
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [-1.25, 3.10, -0.75], half: [0.30, 1.05, 0.30]}
      - box: {c: [-1.25, 4.10, -0.75], half: [0.36, 0.08, 0.36]}
  chimney_joints:  # mortar lines between stone courses
    material: soot
    space: body
    prims:
      - box: {c: [-1.25, 3.55, -0.44], half: [0.30, 0.025, 0.01]}
      - box: {c: [-1.25, 3.25, -0.44], half: [0.30, 0.025, 0.01]}
      - box: {c: [-1.25, 3.85, -0.44], half: [0.30, 0.025, 0.01]}
      - box: {c: [-1.12, 3.70, -0.44], half: [0.025, 0.15, 0.01]}
      - box: {c: [-1.38, 3.40, -0.44], half: [0.025, 0.15, 0.01]}
  chimney_hole:
    material: soot
    space: body
    prims:
      - box: {c: [-1.25, 4.16, -0.75], half: [0.20, 0.03, 0.20]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
