# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: scorched_ground
kind: prop
view: topdown
size: 64
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}     # pivot (32, 32)
shadow: null                                                # a ground decal

# Act I, Minhau: burned patch of ground, drawn flat under everything.
brief:
  summary: irregular stain of burned earth - a near-black core of charred soil, a ragged rim of grey ash
    fading into the ground, cinder specks and a few charred twigs; four different shapes
  must_keep: [black core, grey ash rim, irregular outline, no dark outline ring (it is a stain, not an object)]
  simplify: [flat ellipsoid blobs, specks as tiny flat discs]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null, camera.center [0, 0, 0] (pivot 32,32).
    Every material has outline off and line off: a decal must melt into the floor, so it breaks the
    "dark outline" style rule on purpose. camera.scale/pitch/light untouched. Ramps from palettes/ruin.yaml.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,32) is the centre of the stain on the ground.
    Up to ~3.2 x 2.6 units (~56 x 30 px) -> about 3x2 tiles, NOT blocking; draw it at floor depth (under
    props and characters, over the ground tiles). Clips: idle (= variant 0) and `variants` (4 frames,
    frame i = variant i).

materials:
  ash:    {ramp: rash, bands: [1, 1], outline: false, line: false}
  ashhi:  {ramp: rash, bands: [2, 2], outline: false, line: false}
  burnt:  {ramp: rburnt, bands: [2, 3], outline: false, line: false}
  core:   {ramp: rburnt, bands: [1, 1], outline: false, line: false}
  twig:   {ramp: rchar, bands: [3, 4], outline: false, line: false}

channels:
  root: [0, 0, 0]
  v: 0

bones:
  body: {parent: root}

parts:
  # each blob set is (x, z) positions per variant chosen with weights w0..w3
  ash_rim:
    material: ash
    space: body
    blend: 0.03
    prims:
      - ellipsoid: {c: "[-0.1 + 0.3*(v == 1) - 0.2*(v == 3), 0.02, 0.05]", r: "[1.15 - 0.3*(v == 2), 0.02, 0.95 + 0.2*(v == 3)]"}
      - ellipsoid: {c: "[0.75 - 1.6*(v == 1) + 0.3*(v == 2), 0.02, -0.5 + 0.9*(v == 3)]", r: [0.6, 0.02, 0.5]}
      - ellipsoid: {c: "[-0.9 + 1.7*(v == 2) + 0.2*(v == 3), 0.02, 0.55 - 1.1*(v == 1)]", r: [0.55, 0.02, 0.45]}
      - ellipsoid: {c: "[0.35 - 0.9*(v == 3), 0.02, 0.85 - 1.7*(v == 2)]", r: [0.42, 0.02, 0.35]}
      - ellipsoid: {c: "[-1.3 + 0.4*(v == 1) + 2.5*(v == 3), 0.02, -0.35 + 0.2*(v == 2)]", r: [0.3, 0.02, 0.3]}
  ash_specks:     # lighter ash flakes on the rim
    material: ashhi
    space: body
    prims:
      - ellipsoid: {c: "[0.9 - 1.8*(v == 1), 0.03, 0.3]", r: [0.09, 0.02, 0.08]}
      - ellipsoid: {c: "[-0.7, 0.03, -0.6 + 1.2*(v == 2)]", r: [0.11, 0.02, 0.09]}
      - ellipsoid: {c: "[0.2 + 0.8*(v == 3), 0.03, -0.85]", r: [0.08, 0.02, 0.07]}
      - ellipsoid: {c: "[-1.1 + 2.2*(v == 3), 0.03, 0.5]", r: [0.07, 0.02, 0.06]}
  burnt:
    material: burnt
    space: body
    blend: 0.03
    prims:
      - ellipsoid: {c: "[-0.1 + 0.3*(v == 1) - 0.2*(v == 3), 0.03, 0.05]", r: "[0.85 - 0.25*(v == 2), 0.02, 0.7 + 0.15*(v == 3)]"}
      - ellipsoid: {c: "[0.6 - 1.3*(v == 1) + 0.3*(v == 2), 0.03, -0.4 + 0.8*(v == 3)]", r: [0.4, 0.02, 0.32]}
      - ellipsoid: {c: "[-0.75 + 1.5*(v == 2), 0.03, 0.45 - 0.9*(v == 1)]", r: [0.36, 0.02, 0.3]}
  core:
    material: core
    space: body
    blend: 0.03
    prims:
      - ellipsoid: {c: "[-0.05 + 0.3*(v == 1) - 0.2*(v == 3), 0.045, 0.0]", r: "[0.45 - 0.15*(v == 2), 0.02, 0.36]"}
      - ellipsoid: {c: "[0.3 - 0.6*(v == 1), 0.045, -0.2 + 0.4*(v == 3)]", r: [0.22, 0.02, 0.2]}
  twigs:          # charred sticks lying in the burn
    material: twig
    space: body
    prims:
      - box: {c: "[0.25 - 0.6*(v == 2), 0.08, 0.3 - 0.5*(v == 1)]", half: [0.32, 0.025, 0.035], rot: "[0, 0.5 + 1.3*(v == 1) - 0.9*(v == 3), 0]"}
      - box: {c: "[-0.45 + 0.9*(v == 3), 0.08, -0.25 + 0.5*(v == 2)]", half: [0.22, 0.025, 0.035], rot: "[0, -0.7 + 1.1*(v == 2), 0]"}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {v: 0}
  variants:
    frames: 4
    ms: 1000
    channels: {v: "f"}
