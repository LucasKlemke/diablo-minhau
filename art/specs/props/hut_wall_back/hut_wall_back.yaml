# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: hut_wall_back
kind: prop
view: topdown
size: 64                 # 64 px wide = 4 tiles, tileable in x; ~58 px tall
directions: 1
mirror: false
palette: ["farm", "hut"]
# centre y 1.9542 = 28 px above the floor line -> pivot (32, 60), integer
camera: {pitch: 38, scale: 0.055, center: [0, 1.9542, 0]}
shadow: null             # wall piece

# Aldo's hut (prologue): the back (north) wall, seen from inside.
brief:
  summary: back wall of a poor hut - two rough logs as a sill on the floor, wattle-and-daub clay panels in a
    smoke-darkened timber frame (posts every 2 tiles, one diagonal brace), a patch where the clay fell off
    and shows the woven wattle, a wall-plate log on top and the bottom of the straw thatch roof above it,
    with hanging fringe and a ragged hole where warm daylight comes through
  must_keep: [log sill, clay panels, dark posts and brace, exposed wattle patch, thatch fringe, sunlit hole]
  simplify: [straw as vertical strokes and a fringe of cones, wattle as 3 sticks]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null, camera.center [0, 1.9542, 0] (integer
    pivot). The wall spans the WHOLE frame width on purpose (tileable; QA side-margin warnings expected).
    The sunlight in the thatch hole is emissive. camera.scale/pitch/light untouched. Ramps from
    palettes/hut.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,60) is the floor point at the centre of the
    wall's face (z 0). Draw it every 64 px in x with the pivot on the top edge of the first floor tile row
    (the wall stands on the row above the floor). Posts sit at x 0 and on both frame edges (half a post on
    each side), so repeats join on a post. Height: wall face 34 px, wall plate, thatch up to ~58 px.
    Two looks: idle (sunlit hole in the thatch, clay fallen off the wattle) and `plain` (thatch intact, clay
    mended) so a long wall can
    alternate them; both 1 frame. The game's light shafts (IntroScene) should start at the hole:
    about (+11, -46) px from the pivot.

materials:
  daub:    {ramp: hdaub, bands: [3, 4]}
  plaster_hi: {ramp: hdaub, bands: [4, 4], outline: false, line: false}
  grime:   {ramp: hdaub, bands: [2, 2], outline: false, line: false}
  fleck:   {ramp: hstraw, bands: [3, 3], outline: false, line: false}
  crack:   {ramp: hdaub, bands: [2, 2], outline: false, line: false}
  wattle_bg: {ramp: hbeam, bands: [1, 1], outline: false, line: false}
  stick:   {ramp: hwood, bands: [2, 3], outline: false}
  post:    {ramp: hbeam, bands: [2, 4]}
  log:     {ramp: hwood, bands: [2, 4]}
  logend:  {ramp: hcut, bands: [1, 2]}
  thatch:  {ramp: hstraw, bands: [3, 3], line: false}
  fringe:  {ramp: hstraw, bands: [3, 4], line: false}
  thatch_dk: {ramp: hstraw, bands: [1, 1], outline: false, line: false}
  thatch_md: {ramp: hstraw, bands: [2, 2], outline: false, line: false}
  thatch_hi: {ramp: hstraw, bands: [5, 5], outline: false, line: false}
  hole_dk: {ramp: hbeam, bands: [2, 2], outline: false, line: false}
  sun:     {ramp: hsun, emissive: true, band: 3, outline: false, line: false, glow: {color: "#ffe6a0", mix: 0.45, radius: 1}}
  sun_core: {ramp: hsun, emissive: true, band: 4, outline: false, line: false}

channels:
  root: [0, 0, 0]
  hole: 1             # 1 = sunlit hole in the thatch, 0 = intact thatch

bones:
  body: {parent: root}

parts:
  # ---------- wattle-and-daub panels ----------
  daub:
    material: daub
    space: body
    prims:
      - box: {c: [0, 1.4, -0.1], half: [2.2, 1.2, 0.1]}
  plaster_hi:         # lighter, newer patches of clay (mended)
    material: plaster_hi
    space: body
    prims:
      - ellipsoid: {c: "[0.8, 1.45, 0.02*(1 - hole)]", r: [0.34, 0.24, 0.01]}
      - ellipsoid: {c: [-1.25, 2.0, 0.0], r: [0.28, 0.2, 0.01]}
      - ellipsoid: {c: [0.35, 2.1, 0.0], r: [0.22, 0.16, 0.01]}
      - ellipsoid: {c: [-0.45, 1.05, 0.0], r: [0.2, 0.14, 0.01]}
  grime:              # damp, darker clay near the floor
    material: grime
    space: body
    prims:
      - box: {c: [0, 0.72, 0.0], half: [2.2, 0.14, 0.008]}
      - ellipsoid: {c: [-1.2, 0.86, 0.0], r: [0.3, 0.1, 0.008]}
      - ellipsoid: {c: [1.15, 0.84, 0.0], r: [0.24, 0.08, 0.008]}
  cracks:             # hairline cracks in the clay
    material: crack
    space: body
    prims:
      - box: {c: [-0.55, 0.95, 0.014], half: [0.16, 0.02, 0.004], rot: [0, 0, 0.5]}
      - box: {c: [-0.4, 0.82, 0.014], half: [0.1, 0.02, 0.004], rot: [0, 0, -0.3]}
      - box: {c: [1.25, 2.05, 0.014], half: [0.14, 0.02, 0.004], rot: [0, 0, -0.6]}
      - box: {c: [0.45, 0.85, 0.014], half: [0.12, 0.02, 0.004], rot: [0, 0, 0.2]}
  flecks:             # straw chopped into the clay
    material: fleck
    space: body
    prims:
      - box: {c: [-1.2, 1.9, 0.014], half: [0.05, 0.018, 0.004], rot: [0, 0, 0.3]}
      - box: {c: [-0.35, 1.6, 0.014], half: [0.05, 0.018, 0.004], rot: [0, 0, -0.4]}
      - box: {c: [0.5, 2.2, 0.014], half: [0.05, 0.018, 0.004], rot: [0, 0, 0.1]}
      - box: {c: [1.3, 1.0, 0.014], half: [0.05, 0.018, 0.004], rot: [0, 0, -0.2]}
      - box: {c: [-1.35, 1.0, 0.014], half: [0.05, 0.018, 0.004], rot: [0, 0, 0.5]}
      - box: {c: [0.25, 1.3, 0.014], half: [0.05, 0.018, 0.004], rot: [0, 0, 0.2]}
  wattle_bg:          # where the clay fell off: dark hollow behind the woven sticks (ragged)
    material: wattle_bg
    when: "hole > 0.5"
    space: body
    blend: 0.04
    prims:
      - ellipsoid: {c: [0.78, 1.42, 0.012], r: [0.36, 0.24, 0.006]}
      - ellipsoid: {c: [1.08, 1.62, 0.012], r: [0.2, 0.16, 0.006]}
      - ellipsoid: {c: [0.52, 1.28, 0.012], r: [0.18, 0.14, 0.006]}
  wattle:             # woven hazel sticks: horizontal withies round vertical stakes
    material: stick
    when: "hole > 0.5"
    space: body
    prims:
      - cylinder: {a: [0.42, 1.24, 0.03], b: [1.06, 1.28, 0.03], r: 0.035}
      - cylinder: {a: [0.4, 1.44, 0.03], b: [1.12, 1.42, 0.03], r: 0.035}
      - cylinder: {a: [0.6, 1.62, 0.03], b: [1.24, 1.64, 0.03], r: 0.035}
  stakes:
    material: post
    when: "hole > 0.5"
    space: body
    prims:
      - cylinder: {a: [0.66, 1.14, 0.025], b: [0.66, 1.66, 0.025], r: 0.04}
      - cylinder: {a: [0.98, 1.2, 0.025], b: [0.98, 1.78, 0.025], r: 0.04}

  # ---------- timber frame ----------
  posts:              # x 0 and both frame edges (half a post each side: repeats join on a post)
    material: post
    space: body
    line: true
    prims:
      - box: {c: [0, 1.3, 0.04], half: [0.12, 1.3, 0.08]}
