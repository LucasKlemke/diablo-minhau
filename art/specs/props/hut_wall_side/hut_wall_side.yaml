# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: hut_wall_side
kind: prop
view: topdown
size: 32                 # a 16 px wide strip, 32 px (2 tiles) tall, tileable in y
directions: 1
mirror: false
palette: ["farm", "hut"]
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}
shadow: null

# Aldo's hut (prologue): the side (west/east) walls, seen from above.
brief:
  summary: top of a side wall seen from above - the straw thatch eave on the outside (straw strokes running
    across the strip, ragged fringe hanging inward) over the smoke-darkened wall-plate log on the inner edge,
    with a squared post head every 32 px
  must_keep: [same straw and beam ramps as hut_wall_back, ragged fringe toward the room, seamless in y]
  simplify: [no rafters, the wall face itself is not visible from this angle]
  exceptions: |
    kind prop, size 32, directions 1, mirror false, shadow null, camera.center [0, 0, 0]. The strip touches
    the top and bottom frame edges on purpose (tileable; QA margin warnings expected). The wall top is
    modelled at floor height so the pivot is the frame centre (the projection is the same; only the
    shadowing of a real 2.6 m wall would differ and there is none). camera.scale/pitch/light untouched.
    Ramps from palettes/hut.yaml (index 0 = #1c0f1a).
  decisions: |
    TILING CONTRACT: pivot = frame centre (16,16). The strip covers frame columns 8..23 (1 tile) and all 32
    rows; draw it every 32 px in y. idle = LEFT wall (room to the right of the strip, fringe pointing
    right); `right` = the same wall turned 180 degrees about the vertical axis for the RIGHT wall (fringe
    pointing left, lit from the same world light; do not flip the left one in the engine). Put the strip on
    the room's outer tile column, from the back wall's top down to the bottom row.
    The strip is 1 px = 0.0893 units in z, so the z period is 2.858; every per-z detail stays inside it.

materials:
  thatch:    {ramp: hstraw, bands: [3, 3], line: false}
  fringe:    {ramp: hstraw, bands: [3, 4], line: false}
  thatch_dk: {ramp: hstraw, bands: [1, 1], outline: false, line: false}
  thatch_md: {ramp: hstraw, bands: [2, 2], outline: false, line: false}
  thatch_hi: {ramp: hstraw, bands: [5, 5], outline: false, line: false}
  log:       {ramp: hwood, bands: [2, 4]}
  post:      {ramp: hbeam, bands: [2, 4]}
  postcut:   {ramp: hcut, bands: [1, 2], outline: false}

channels:
  root: [0, 0, 0]
  flip: 0             # 0 = left wall, 1 = right wall (turned 180 degrees)

bones:
  body: {parent: root, rot: "[0, pi*flip, 0]"}

parts:
  plate:              # wall-plate log along the inner edge (runs past the frame: seamless)
    material: log
    space: body
    line: true
    prims:
      - cylinder: {a: [0.3, 0.12, -2.0], b: [0.3, 0.12, 2.0], r: 0.12}
  post_head:          # squared post head under the plate, once per 32 px
    material: post
    space: body
    line: true
    prims:
      - box: {c: [0.3, 0.14, 0.0], half: [0.13, 0.12, 0.2], round: 0.02}
  post_cut:
    material: postcut
    space: body
    prims:
      - box: {c: [0.3, 0.265, 0.0], half: [0.09, 0.005, 0.14]}
  thatch:             # the eave: a thick slab of straw
    material: thatch
    space: body
    prims:
      - box: {c: [-0.2, 0.15, 0], half: [0.25, 0.15, 2.0]}
  fringe:             # ragged straw ends hanging toward the room
    material: fringe
    space: body
    blend: 0.04
