# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_wall_side
kind: prop
view: topdown
size: 32                 # 16 px wide strip, 32 px period: tileable along y
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}
shadow: null

# Prologue: the side (west / east) walls of the castle hall, a vertically tileable strip.
brief:
  summary: the top of a side wall of the hall seen from above - a 16 px wide cream coping with a dark outline
    on both sides, a light inner edge and a darker outer edge, coping stones jointed every 16 px with a bevel,
    and a short gold inlay in the middle of each stone
  must_keep: [same cap colours as castle_wall_back, dark outline on both long edges, joints every 16 px,
    seamless repeat in y]
  simplify: [only the top is drawn: at camera pitch 38 the side faces of a north-south wall are not seen]
  exceptions: |
    kind prop, size 32, directions 1, mirror false, shadow null, camera.center [0, 0, 0]. A pixel painting on
    the ground plane (pixel-exact one-colour boxes, generated once from a 16x32 layout); the strip touches
    the top and bottom frame edges on purpose (tile). camera.scale/pitch/light untouched.
  decisions: |
    TILING CONTRACT: pivot = frame centre (16, 16); the strip spans frame columns 8..23 (one world tile) and
    all 32 rows. Draw one every 32 px down the west and east edges of the hall (pivot at the centre of the
    wall tile column, rows aligned to the 16 px grid: joints fall on tile edges). Symmetric, so the same
    piece serves both sides. It is the wall's top: the game draws it above the floor and actors (it
    blocks). Where it meets castle_wall_back, the back wall's 4 px cap continues it.
    Static: 1-frame idle.

