# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_floor
kind: prop
view: topdown
size: 32                 # one 32x32 px tile = 2x2 world tiles; the whole frame is floor (tileable)
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}
shadow: null             # it is the ground itself

# Prologue castle hall floor: polished white / cream marble checker, tileable, 4 variants.
brief:
  summary: immaculate castle-hall floor of bevelled polished marble slabs, a white / cream checker of 16 px
    slabs (one slab = one world tile), pale grout, a tiny gold inlay cross at every grout crossing, soft
    lilac-grey veins on the white slabs and tan veins on the cream ones
  must_keep: [white and cream checker, 1 px bevel (light top-left, dark bottom-right), gold inlay at the
    crossings, soft veins, seamless when repeated every 32 px in any variant mix]
  simplify: [veins as 1 px pixel paths, no reflections, no chips (the hall is spotless)]
  exceptions: |
    kind prop, size 32, directions 1, mirror false, shadow null, camera.center [0, 0, 0].
    The floor fills the WHOLE frame on purpose (no margin: QA reports "clipped at the edge", expected for a
    tile). No outlines; every material is one exact colour (ramp of 1 tone + outline slot) so the pixels
    are hand-placed: the parts are pixel-exact boxes, generated once from a pixel layout (slab bevels,
    grout, inlays) and random-walk veins. camera.scale/pitch/light untouched.
  decisions: |
    TILING CONTRACT: the frame is a 32x32 px tile = 2x2 world tiles; draw it every 32 px in x and y (pivot
    = frame centre 16,16). Slab edges fall on world-tile edges: a slab owns its top and left grout line, so
    repeats keep one grout line every 16 px and the gold crosses wrap across the frame edges.
    The checker parity is the same in every variant (white slabs top-left and bottom-right), so variants mix
    freely. VARIANTS: animation `variants` has 4 frames (frame i = variant i, only the veins change);
    `idle` = variant 0. Pick a variant per 32 px cell with a hash of the cell coordinates.

