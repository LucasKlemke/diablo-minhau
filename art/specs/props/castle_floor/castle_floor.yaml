  f_w_hi:    ["#1c0f1a", "#ffffff"]
  f_w_sh:    ["#1c0f1a", "#cbc3d3"]
  f_c_base:  ["#1c0f1a", "#f0e5cd"]
  f_c_hi:    ["#1c0f1a", "#fcf7ea"]
  f_c_sh:    ["#1c0f1a", "#d3c19f"]
