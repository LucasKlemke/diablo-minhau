spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: junk_throne
kind: prop
view: topdown
size: 96                 # footprint 4x3 tiles (~64 px wide), ~75 px tall with the backrest, 2+ px margins
directions: 1            # faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.4657, 0]}   # 21 px above the pivot -> pivot (48, 69)
shadow: {rx: 34, ry: 10, alpha: 120}

# Clareira do Rei Goblin: the throne of Grumm, the Goblin King (boss arena centrepiece).
brief:
  summary: the throne of Grumm, a heaped mountain of looted junk 4 tiles wide - dented copper pots and an
    upturned iron cauldron, cart wheels, broken crates and a barrel, a boar carcass ribcage and bones -
    climbing in crude crate steps to a seat on the top made of a big crate padded with a mangy fur pelt;
    behind it a cart wheel stands as the backrest, crowned with a boar skull, flanked by two spears with
    skulls and a ragged red banner, and a little pile of stolen gold glints at the foot of the seat
  must_keep: [cart-wheel backrest with boar skull, seat with fur pelt on top of the heap, crate steps in
    front, pots and cauldron, wheels, crates and barrel in the heap, ribcage, two skull spears, gold glints]
  simplify: [no rivets or planks drawn beyond a few inner lines; spokes as 4 bars; coins as 2-px dots]
  exceptions: |
    kind prop, size 96, directions 1, mirror false; camera.center [0, 1.4657, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 48,69) is the ground point at the centre of the
    4x3-tile footprint (x -1.76..1.76, z -1.32..1.32). Blocking: all 12 tiles except the front-centre one
    with the lowest step (Grumm stands/sits on the seat at socket `seat`, ~(0, 1.55, -0.30) in world units;
    for a boss that sits there, draw Grumm at the pivot offset by the seat).
    Copper pots (orange-brown) and the red banner are the warm accents that pull the eye; the gold is the
    brightest value so the throne reads as a hoard. Static: 1-frame idle.

ramps:
  jt_wood:   ["#1c0f1a", "#3a2618", "#5a3c24", "#7a5634", "#966c42"]
  jt_old:    ["#1c0f1a", "#2e2622", "#463a32", "#5f5246", "#7a6c5a"]
  jt_iron:   ["#1c0f1a", "#22202a", "#363442", "#504e5e", "#6e6c7c"]
  jt_copper: ["#1c0f1a", "#4a2214", "#7a3a1e", "#a8582a", "#c87a3a"]
  jt_bone:   ["#1c0f1a", "#6a5a4a", "#9a8a72", "#c4b494", "#e2d8bc"]
  jt_fur:    ["#1c0f1a", "#3a3030", "#5a4c46", "#7a6a5e"]
  jt_rag:    ["#1c0f1a", "#4a1014", "#7a1e1c", "#9e3024"]
  jt_gold:   ["#1c0f1a", "#7a4a12", "#c7861f", "#f0c040", "#fff0a0"]
  jt_hole:   ["#1c0f1a", "#120a10"]

materials:
  wood:   {ramp: jt_wood, bands: [1, 4]}
  old:    {ramp: jt_old, bands: [1, 4]}
  iron:   {ramp: jt_iron, bands: [1, 4]}
  copper: {ramp: jt_copper, bands: [1, 4]}
  bone:   {ramp: jt_bone, bands: [1, 4], gamma: 1.3}
  fur:    {ramp: jt_fur, bands: [1, 3]}
  rag:    {ramp: jt_rag, bands: [1, 3]}
  gold:   {ramp: jt_gold, bands: [2, 4]}
  hole:   {ramp: jt_hole, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

sockets:
  seat: {bone: body, offset: [0, 1.55, -0.30]}

parts:
  # ---------------- heap: crates, barrel, cauldron, pots, wheels ----------------
  crates_back:
    material: old
    space: body
    line: true
    prims:
      - box: {c: [-0.55, 0.50, -0.75], half: [0.48, 0.50, 0.45], rot: [0, 0.20, 0.04], round: 0.03}
      - box: {c: [0.60, 0.45, -0.80], half: [0.46, 0.45, 0.42], rot: [0, -0.25, -0.05], round: 0.03}
      - box: {c: [0.10, 0.70, -0.70], half: [0.42, 0.70, 0.40], rot: [0, 0.05, 0], round: 0.03}
  seat_crate:        # the seat
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [0, 1.22, -0.36], half: [0.50, 0.26, 0.42], rot: [0, 0.04, 0], round: 0.03}
  barrel:            # barrel lying on its side, right
    material: wood
    space: body
    line: true
    blend: 0.02
    prims:
      - cylinder: {a: [0.85, 0.32, 0.55], b: [1.55, 0.30, 0.20], r: 0.32, round: 0.05}
  barrel_hoops:
    material: iron
    space: body
    prims:
      - cylinder: {a: [0.98, 0.32, 0.49], b: [1.03, 0.32, 0.47], r: 0.335}
      - cylinder: {a: [1.38, 0.31, 0.29], b: [1.43, 0.31, 0.26], r: 0.335}
  cauldron:          # big iron cauldron upturned, left
    material: iron
    space: body
    line: true
    prims:
      - sphere: {c: [-1.15, 0.30, 0.05], r: 0.55}
      - torus: {c: [-1.15, 0.08, 0.05], R: 0.50, r: 0.06}
    cut:
      - box: {c: [-1.15, -0.5, 0.05], half: [1, 0.5, 1]}
  pots:              # dented copper pots heaped on the left and right
    material: copper
    space: body
    line: true
    prims:
      - sphere: {c: [-1.05, 0.95, -0.30], r: 0.30}
      - cylinder: {a: [-1.05, 1.18, -0.30], b: [-1.05, 1.24, -0.30], r: 0.22}
      - sphere: {c: [-0.62, 1.25, -0.75], r: 0.24}
      - sphere: {c: [0.95, 1.05, -0.62], r: 0.26}
      - cylinder: {a: [1.30, 0.62, -0.10], b: [1.42, 0.92, 0.0], r: 0.20}      # pot on its side, open end out
    cut:
      - box: {c: [-1.05, 1.38, -0.30], half: [0.4, 0.15, 0.4]}
      - sphere: {c: [0.88, 1.12, -0.48], r: 0.12}                               # dent
  pot_dark:          # open mouth of the sideways pot
    material: hole
    space: body
    prims:
      - cylinder: {a: [1.40, 0.88, -0.01], b: [1.43, 0.94, 0.01], r: 0.15}
  pot_handles:
    material: iron
    space: body
    prims:
      - torus: {c: [-1.05, 1.26, -0.30], R: 0.24, r: 0.025, rot: [1.4, 0, 0.3]}
  wheels:            # cart wheels: backrest (vertical, behind the seat) and one leaning on the right
    material: wood
    space: body
    line: true
    prims:
      - torus: {c: [0, 2.08, -0.80], R: 0.72, r: 0.075, rot: [1.57, 0, 0]}
      - torus: {c: [1.25, 1.40, -0.55], R: 0.45, r: 0.06, rot: [1.2, 0.5, 0.35]}
      - torus: {c: [-1.40, 0.10, 0.70], R: 0.40, r: 0.05, rot: [0.25, 0.2, 0]}   # flat on the ground
  spokes:
    material: old
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.70, 2.08, -0.80], b: [0.70, 2.08, -0.80], r: 0.04}
      - cylinder: {a: [0, 1.38, -0.80], b: [0, 2.78, -0.80], r: 0.04}
      - cylinder: {a: [-0.50, 1.58, -0.80], b: [0.50, 2.58, -0.80], r: 0.035}
      - cylinder: {a: [0.50, 1.58, -0.80], b: [-0.50, 2.58, -0.80], r: 0.035}
      - cylinder: {a: [1.05, 1.15, -0.45], b: [1.45, 1.65, -0.65], r: 0.03}
      - cylinder: {a: [1.45, 1.15, -0.45], b: [1.05, 1.65, -0.65], r: 0.03}
  hub:
    material: iron
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 2.08, -0.86], b: [0, 2.08, -0.70], r: 0.13}
  steps:             # crude crate steps up to the seat
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [-0.05, 0.42, 0.10], half: [0.46, 0.42, 0.38], rot: [0, -0.06, 0], round: 0.03}
      - box: {c: [0.10, 0.17, 0.72], half: [0.38, 0.17, 0.30], rot: [0, 0.12, 0], round: 0.03}
  planks:            # broken planks sticking out of the heap
    material: old
    space: body
    line: true
    prims:
      - box: {c: [-0.62, 1.05, -0.40], half: [0.06, 0.40, 0.035], rot: [0.2, 0.3, 0.55], round: 0.01}
      - box: {c: [0.62, 0.98, 0.02], half: [0.05, 0.30, 0.03], rot: [0.3, -0.2, -0.6], round: 0.01}
      - box: {c: [0.55, 0.06, 1.05], half: [0.40, 0.04, 0.06], rot: [0, -0.5, 0], round: 0.01}

  clutter:           # a dented round shield and a helmet thrown on the heap
    material: iron
    space: body
    line: true
    prims:
      - cylinder: {a: [0.80, 0.70, -0.05], b: [0.86, 0.76, 0.03], r: 0.28}          # shield leaning on the barrel
      - sphere: {c: [-0.78, 0.18, 0.62], r: 0.16}                                  # helmet on the ground
    cut:
      - box: {c: [-0.78, -0.4, 0.62], half: [0.5, 0.42, 0.5]}
  shield_boss:
    material: copper
    space: body
    prims:
      - sphere: {c: [0.86, 0.76, 0.04], r: 0.08}

  # ---------------- seat dressing ----------------
  pelt:              # mangy fur pelt over the seat, draped down the front
    material: fur
    space: body
    line: true
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 1.50, -0.34], r: [0.48, 0.05, 0.38]}
      - box: {c: [0, 1.28, 0.08], half: [0.36, 0.22, 0.03], rot: [0.15, 0, 0], round: 0.02}
      - cone: {a: [-0.30, 1.12, 0.10], b: [-0.36, 0.90, 0.14], r: [0.07, 0.03]}   # paws hanging
      - cone: {a: [0.30, 1.12, 0.10], b: [0.36, 0.90, 0.14], r: [0.07, 0.03]}
  armrests:          # bones lashed as armrests
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.52, 1.62, -0.70], b: [-0.56, 1.60, 0.00], r: 0.05}
      - cylinder: {a: [0.52, 1.62, -0.70], b: [0.56, 1.60, 0.00], r: 0.05}
      - sphere: {c: [-0.56, 1.62, 0.02], r: 0.075}
      - sphere: {c: [0.56, 1.62, 0.02], r: 0.075}
      - cylinder: {a: [-0.52, 1.25, -0.02], b: [-0.56, 1.58, 0.00], r: 0.04}
      - cylinder: {a: [0.52, 1.25, -0.02], b: [0.56, 1.58, 0.00], r: 0.04}
  crown_skull:       # boar skull crowning the backrest wheel
    material: bone
    space: body
    line: true
    blend: 0.05
    prims:
      - ellipsoid: {c: [0, 2.88, -0.74], r: [0.24, 0.13, 0.18]}
      - cone: {a: [0, 2.82, -0.64], b: [0, 2.62, -0.42], r: [0.15, 0.10]}
  crown_tusks:
    material: bone
    space: body
    line: true
    prims:
      - chain: {pts: [[-0.10, 2.66, -0.44], [-0.27, 2.66, -0.36], [-0.34, 2.82, -0.36]], r: [0.045, 0.035, 0.015]}
      - chain: {pts: [[0.10, 2.66, -0.44], [0.27, 2.66, -0.36], [0.34, 2.82, -0.36]], r: [0.045, 0.035, 0.015]}
  crown:             # crude gold crown on the boar skull: the king's mark
    material: gold
    space: body
    line: true
    prims:
      - torus: {c: [0, 2.98, -0.78], R: 0.17, r: 0.04}
      - cone: {a: [-0.14, 2.98, -0.70], b: [-0.18, 3.18, -0.70], r: [0.04, 0.012]}
      - cone: {a: [0, 2.98, -0.62], b: [0, 3.22, -0.62], r: [0.045, 0.012]}
      - cone: {a: [0.14, 2.98, -0.70], b: [0.18, 3.18, -0.70], r: [0.04, 0.012]}
  crown_eyes:
    material: hole
    space: body
    prims:
      - sphere: {c: [-0.10, 2.92, -0.60], r: 0.06}
      - sphere: {c: [0.10, 2.92, -0.60], r: 0.06}
  spears:            # two spears with skulls flanking the backrest
    material: old
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.05, 0.60, -1.05], b: [-1.20, 3.00, -1.10], r: 0.04}
      - cylinder: {a: [1.05, 0.60, -1.05], b: [1.20, 2.90, -1.10], r: 0.04}
  spear_skulls:
    material: bone
    space: body
    line: true
    blend: 0.03
    prims:
      - sphere: {c: [-1.19, 2.86, -1.08], r: 0.15}
      - box: {c: [-1.19, 2.74, -1.00], half: [0.09, 0.05, 0.07], round: 0.02}
      - sphere: {c: [1.19, 2.76, -1.08], r: 0.15}
      - box: {c: [1.19, 2.64, -1.00], half: [0.09, 0.05, 0.07], round: 0.02}
  spear_eyes:
    material: hole
    space: body
    prims:
      - sphere: {c: [-1.25, 2.88, -0.96], r: 0.04}
      - sphere: {c: [-1.13, 2.88, -0.96], r: 0.04}
      - sphere: {c: [1.13, 2.78, -0.96], r: 0.04}
      - sphere: {c: [1.25, 2.78, -0.96], r: 0.04}
  spear_tips:
    material: iron
    space: body
    line: true
    prims:
      - cone: {a: [-1.20, 2.98, -1.10], b: [-1.22, 3.30, -1.12], r: [0.06, 0.012]}
      - cone: {a: [1.20, 2.88, -1.10], b: [1.22, 3.20, -1.12], r: [0.06, 0.012]}
  banner:            # ragged red banner on the left spear
    material: rag
    space: body
    line: true
    prims:
      - tri: {a: [-1.18, 2.60, -1.09], b: [-1.70, 2.50, -1.02], c: [-1.16, 2.10, -1.08], th: 0.03}
      - tri: {a: [-1.50, 2.52, -1.04], b: [-1.62, 2.10, -1.00], c: [-1.30, 2.30, -1.06], th: 0.03}

  # ---------------- carcass and bones ----------------
  ribcage:           # boar carcass ribcage at the front left
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.55, 0.10, 0.95], b: [-0.85, 0.12, 0.80], r: 0.045}
      - torus: {c: [-1.40, 0.14, 0.92], R: 0.20, r: 0.03, rot: [0, 1.36, 1.57]}
      - torus: {c: [-1.22, 0.15, 0.88], R: 0.22, r: 0.03, rot: [0, 1.36, 1.57]}
      - torus: {c: [-1.04, 0.14, 0.84], R: 0.19, r: 0.03, rot: [0, 1.36, 1.57]}
    cut:
      - box: {c: [-1.2, -0.5, 0.9], half: [1, 0.5, 1]}
  bones:
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [0.70, 0.05, 1.10], b: [1.10, 0.05, 1.00], r: 0.035}
      - sphere: {c: [0.69, 0.06, 1.10], r: 0.055}
      - sphere: {c: [1.11, 0.06, 1.00], r: 0.055}
      - sphere: {c: [-0.55, 0.10, 1.05], r: 0.11}                                 # loose skull
  bone_eyes:
    material: hole
    space: body
    prims:
      - sphere: {c: [-0.59, 0.12, 1.14], r: 0.03}
      - sphere: {c: [-0.51, 0.12, 1.14], r: 0.03}

  # ---------------- stolen gold ----------------
  gold:
    material: gold
    space: body
    line: true
    prims:
      - ellipsoid: {c: [-0.35, 0.88, 0.30], r: [0.16, 0.05, 0.12]}               # coin heap on the step
      - sphere: {c: [-0.30, 0.95, 0.30], r: 0.07}
      - cylinder: {a: [0.28, 0.84, 0.30], b: [0.28, 1.02, 0.30], r: 0.05}          # goblet
      - cylinder: {a: [0.28, 1.00, 0.30], b: [0.28, 1.12, 0.30], r: 0.09}
      - cylinder: {a: [0.45, 0.0, 1.18], b: [0.45, 0.03, 1.18], r: 0.06}          # dropped coins
      - cylinder: {a: [0.62, 0.0, 1.06], b: [0.62, 0.03, 1.06], r: 0.05}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
