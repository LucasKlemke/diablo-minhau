# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_column
kind: prop
view: topdown
size: 64
directions: 1            # round column: one view serves every angle
mirror: false
palette: "farm"
# centre y 2.0939 = 30 px above the pivot -> pivot (32, 62)
camera: {pitch: 38, scale: 0.055, center: [0, 2.0939, 0]}
shadow: null             # the plinth sits flat on the floor; its dark contact row is painted

# Prologue: the white marble columns lining the castle hall.
brief:
  summary: tall white marble column (~60 px, as tall as the hall wall) - a square abacus, a capital with gold
    corner volutes and a gold egg-and-dart band, a gold neck ring, a fluted round shaft shaded as a cylinder
    lit from the left, a gold foot ring, a rounded torus and a square two-face plinth (its top seen from
    above), with a dark outline
  must_keep: [white marble, flutes, gold volutes and rings, square plinth and abacus, cylinder shading]
  simplify: [shading painted per pixel column (light left, dark right)]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, camera.center [0, 2.0939, 0] (integer pivot).
    A pixel painting on the plane z = 0 (pixel-exact one-colour boxes generated once from a 64x64 layout),
    without a ground-shadow ellipse (it would clip the frame bottom). camera.scale/pitch/light untouched. Ramp index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: pivot (32, 62) is the ground point at the bottom-centre of the plinth's front face, i.e.
    the front edge of the footprint; sort actors by it. Plinth 22 px wide -> footprint 1x1 tile (the tile
    whose bottom edge is the pivot row), blocking. Height 60 px, the same as castle_wall_back, so a column in
    front of the wall reaches the cornice. Static: 1-frame idle.

