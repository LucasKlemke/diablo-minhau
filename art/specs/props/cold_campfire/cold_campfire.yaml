# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: cold_campfire
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 0.6980 = 10 px above the pivot -> pivot (24, 34), integer (room above for the smoke thread)
camera: {pitch: 38, scale: 0.055, center: [0, 0.6980, 0]}
shadow: {rx: 13, ry: 5, alpha: 60}

# Act I, Minhau: a dead refugee campfire.
brief:
  summary: dead campfire - a ring of seven cold grey stones round a bed of grey ash, three half-burned logs
    with black charred ends collapsed into the middle, one tiny dull ember, and a thin wisp of grey smoke
    curling up and drifting
  must_keep: [stone ring (same layout as campfire), black charred log ends, grey ash bed, thin smoke wisp]
  simplify: [stones as rounded boxes, smoke as a column of 3-4 small puffs]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, camera.center [0, 0.698, 0] (integer pivot).
    The ember is emissive (the only warm pixel) and the smoke has no outline.
    camera.scale/pitch/light untouched. Ramps from palettes/ruin.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,34) is the ground point at the centre of
    the fire. Ring ~1.4 units across (~26 px) -> footprint 2x1 tiles (or the single tile under the pivot),
    blocking optional. Clip idle: 8-frame loop at 150 ms - the smoke wisp rises, sways and fades (puffs
    are spaced along the rise by phase), the ember pulses faintly.

materials:
  stone:  {ramp: rstone, bands: [2, 4]}
  ash:    {ramp: rash, bands: [1, 2], outline: false, line: false}
  wood:   {ramp: rwood, bands: [2, 4]}
  char:   {ramp: rchar, bands: [1, 3]}
  ember:  {ramp: rfire, emissive: true, band: 3, outline: false, line: false, glow: {color: "#e0361a", mix: 0.3, radius: 1}}
  smoke:  {ramp: rsmoke, bands: [2, 4], outline: false, line: false}

channels:
  root: [0, 0, 0]
  glow: 1

bones:
  body: {parent: root}

parts:
  stones:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0.23, 0.10, 0.62], half: [0.15, 0.10, 0.11], rot: [0.05, 0.35, 0.08], round: 0.06}
      - box: {c: [0.63, 0.09, 0.21], half: [0.12, 0.09, 0.14], rot: [0, 1.25, -0.06], round: 0.06}
      - box: {c: [0.56, 0.11, -0.36], half: [0.14, 0.11, 0.12], rot: [0.06, 2.1, 0], round: 0.06}
      - box: {c: [0.07, 0.10, -0.66], half: [0.16, 0.10, 0.11], rot: [0, 3.0, 0.05], round: 0.06}
      - box: {c: [-0.47, 0.12, -0.46], half: [0.13, 0.12, 0.12], rot: [-0.05, 3.9, 0], round: 0.06}
      - box: {c: [-0.66, 0.09, 0.08], half: [0.11, 0.09, 0.14], rot: [0, 4.8, 0.07], round: 0.06}
      - box: {c: [-0.35, 0.10, 0.56], half: [0.14, 0.10, 0.11], rot: [0.04, 5.7, -0.05], round: 0.06}
  ash:
    material: ash
    space: body
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.03, 0], r: [0.5, 0.05, 0.46]}
      - ellipsoid: {c: [0.15, 0.06, 0.1], r: [0.22, 0.05, 0.2]}
  logs:
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [0.6, 0.1, 0.38], b: [0.22, 0.12, 0.1], r: 0.09, round: 0.02}
      - cylinder: {a: [-0.62, 0.1, 0.2], b: [-0.24, 0.1, 0.02], r: 0.085, round: 0.02}
      - cylinder: {a: [0.1, 0.1, -0.64], b: [0.0, 0.12, -0.24], r: 0.09, round: 0.02}
  log_char:      # charred inner ends collapsed into the ash
    material: char
    space: body
    line: true
    prims:
      - cylinder: {a: [0.24, 0.12, 0.11], b: [-0.02, 0.08, -0.05], r: 0.085, round: 0.02}
      - cylinder: {a: [-0.26, 0.1, 0.03], b: [-0.02, 0.1, -0.08], r: 0.08, round: 0.02}
      - cylinder: {a: [0.0, 0.12, -0.26], b: [0.06, 0.08, 0.04], r: 0.085, round: 0.02}
  ember:
    material: ember
    space: body
    prims:
      - sphere: {c: [0.06, 0.16, 0.02], r: "0.035 + 0.012*glow"}
  smoke:         # thin wisp: 4 puffs, each at its own phase of the rise
    material: smoke
    space: body
    prims:
      - sphere: {c: "[0.05 + 0.2*sin(tau*(t - floor(t)) + 0.5) * (t - floor(t)), 0.3 + 1.6*(t - floor(t)), 0]", r: "0.04 + 0.08*sin(pi*(t - floor(t)))"}
      - sphere: {c: "[0.05 + 0.2*sin(tau*(t + 0.25 - floor(t + 0.25)) + 0.5) * (t + 0.25 - floor(t + 0.25)), 0.3 + 1.6*(t + 0.25 - floor(t + 0.25)), 0]", r: "0.04 + 0.08*sin(pi*(t + 0.25 - floor(t + 0.25)))"}
      - sphere: {c: "[0.05 + 0.2*sin(tau*(t + 0.5 - floor(t + 0.5)) + 0.5) * (t + 0.5 - floor(t + 0.5)), 0.3 + 1.6*(t + 0.5 - floor(t + 0.5)), 0]", r: "0.04 + 0.08*sin(pi*(t + 0.5 - floor(t + 0.5)))"}
      - sphere: {c: "[0.05 + 0.2*sin(tau*(t + 0.75 - floor(t + 0.75)) + 0.5) * (t + 0.75 - floor(t + 0.75)), 0.3 + 1.6*(t + 0.75 - floor(t + 0.75)), 0]", r: "0.04 + 0.08*sin(pi*(t + 0.75 - floor(t + 0.75)))"}

animations:
  idle:
    frames: 8
    ms: 150
    channels: {glow: "0.5 + 0.5*sin(p)"}
