spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: cave_puddle
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}   # pivot = frame centre (24, 24) = the ground point
shadow: null             # a decal on the ground

# Caverna dos Morcegos: dark water pooled on the cave floor, a drip falling from the ceiling.
brief:
  summary: irregular puddle of near-black blue water with a slightly lighter wet rim, a dull cold sheen
    streak, and a drop that falls from above and spreads a ripple ring across the surface
  must_keep: [flat irregular puddle, dark cold water, sheen, falling drop + expanding ring]
  simplify: [flat 1-tone ramps like blood_splat, ring as a thin flat torus]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 0, 0]. No dark outline
    (a decal outlined in near-black looks like a hole). camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (24, 24) = frame centre = the ground point under the puddle's centre. FLOOR DECAL:
    draw it on the floor layer; walkable (about 2x1.5 tiles). `idle` (8 frames, 140 ms) = the drop falls
    (frames 0-1), hits, and two rings spread and fade (frames 2-7).

ramps:
  cp_rim:   ["#1c0f1a", "#262a30"]
  cp_water: ["#1c0f1a", "#141c26"]
  cp_deep:  ["#1c0f1a", "#0e121a"]
  cp_sheen: ["#1c0f1a", "#2e4252"]
  cp_ring:  ["#1c0f1a", "#5e7e92"]
  cp_ring2: ["#1c0f1a", "#3a5264"]
  cp_drop:  ["#1c0f1a", "#9ec0d0"]

materials:
  rim:   {ramp: cp_rim, bands: [1, 1], outline: false, line: false}
  water: {ramp: cp_water, emissive: true, band: 1, outline: false, line: false}
  deep:  {ramp: cp_deep, emissive: true, band: 1, outline: false, line: false}
  sheen: {ramp: cp_sheen, emissive: true, band: 1, outline: false, line: false}
  ring:  {ramp: cp_ring, emissive: true, band: 1, outline: false, line: false}
  ring2: {ramp: cp_ring2, emissive: true, band: 1, outline: false, line: false}
  drop:  {ramp: cp_drop, emissive: true, band: 1, outline: false, line: false}

channels:
  root: [0, 0, 0]
  drop: 0            # 1 = drop visible
  drop_y: 0.6        # drop height
  ring: 0            # ring phase (0 = none, 1..6 growing)

bones:
  body: {parent: root}

parts:
  rim:
    material: rim
    space: body
    prims:
      - ellipsoid: {c: [0, 0.002, 0], r: [0.74, 0.003, 0.46], rot: [0, 0.15, 0]}
      - ellipsoid: {c: [0.48, 0.002, 0.22], r: [0.36, 0.003, 0.26]}
      - ellipsoid: {c: [-0.55, 0.002, -0.12], r: [0.32, 0.003, 0.24]}
      - ellipsoid: {c: [0.95, 0.002, 0.38], r: [0.06, 0.003, 0.05]}
      - ellipsoid: {c: [-0.98, 0.002, 0.10], r: [0.05, 0.003, 0.04]}
  water:
    material: water
    space: body
    prims:
      - ellipsoid: {c: [0, 0.006, 0], r: [0.68, 0.003, 0.41], rot: [0, 0.15, 0]}
      - ellipsoid: {c: [0.48, 0.006, 0.22], r: [0.31, 0.003, 0.21]}
      - ellipsoid: {c: [-0.55, 0.006, -0.12], r: [0.27, 0.003, 0.19]}
  deep:
    material: deep
    space: body
    prims:
      - ellipsoid: {c: [-0.05, 0.009, -0.05], r: [0.40, 0.003, 0.22], rot: [0, 0.15, 0]}
  sheen:
    material: sheen
    space: body
    prims:
      - ellipsoid: {c: [-0.30, 0.012, -0.18], r: [0.22, 0.003, 0.04], rot: [0, 0.25, 0]}
      - ellipsoid: {c: [0.38, 0.012, 0.28], r: [0.10, 0.003, 0.03], rot: [0, 0.15, 0]}
  ring_a:
    material: ring
    space: body
    when: "ring > 0.5 and ring < 4.5"
    prims:
      - torus: {c: [0.0, 0.015, 0.0], R: "0.05 + 0.075*ring", r: 0.028}
  ring_a_fade:
    material: ring2
    space: body
    when: "ring > 4.5"
    prims:
      - torus: {c: [0.0, 0.015, 0.0], R: "0.05 + 0.075*ring", r: 0.028}
  ring_b:
    material: ring2
    space: body
    when: "ring > 2.5 and ring < 6.5"
    prims:
      - torus: {c: [0.0, 0.015, 0.0], R: "0.05 + 0.075*(ring - 2)", r: 0.025}
  splash:
    material: drop
    space: body
    when: "abs(ring - 1) < 0.5"
    prims:
      - cone: {a: [0.0, 0.01, 0.0], b: [0.0, 0.16, 0.0], r: [0.035, 0.02]}
  drop:
    material: drop
    space: body
    when: "drop > 0.5"
    prims:
      - ellipsoid: {c: [0.0, "drop_y", 0.0], r: [0.05, 0.09, 0.05]}

animations:
  idle:
    frames: 8
    ms: 140
    channels:
      drop: "1.0*(f < 2)"
      drop_y: "0.75 - 0.4*f"
      ring: "(f >= 2)*(f - 1)"
