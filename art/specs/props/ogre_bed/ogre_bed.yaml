spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: ogre_bed
kind: prop
view: topdown
size: 64
directions: 1
mirror: false
palette: ["farm", "ruin"]
camera: {pitch: 38, scale: 0.055, center: [0, 0.5584, 0]}   # 8 px above the pivot -> pivot (32, 40)
shadow: null             # low nest; its straw rim darkens the floor itself

# Caverna dos Morcegos: the ogre boss's lair - where it sleeps and eats.
brief:
  summary: a big oval nest on the cave floor - a rim of trampled dirty straw and sticks, heaped animal
    pelts inside (brown hide, dark wolf fur with a tail), a huge gnawed cow femur with a red meat scrap
    lying across it, a ribcage, a horned skull and smaller bones scattered at the edge
  must_keep: [oval straw rim, layered furs (two colours), the huge gnawed bone (the read), skulls and
    ribs, a red meat scrap]
  simplify: [straw as a lumpy ring with a few stick cones, fur as flattened ellipsoids, no hair texture]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null; camera.center [0, 0.5584, 0] (integer
    pivot). Ramps from palettes/ruin.yaml (rhide, rfur, rstraw, rbone, rmud). camera.scale/pitch/light
    untouched.
  decisions: |
    PIVOT CONTRACT: pivot (32, 40) = ground point at the centre of the nest. About 3x2 tiles; low (it does
    not block sight); the game may treat it as walkable decoration or block the centre 2x1. The boss
    can spawn/sleep on it (centre ~ (0, 0.25, -0.05)). Static: 1-frame idle.

ramps:
  ob_meat: ["#1c0f1a", "#4e0f16", "#82202a", "#b04040"]
  ob_dark: ["#1c0f1a", "#140c10"]

materials:
  straw: {ramp: rstraw, bands: [1, 3]}
  stick: {ramp: rwood, bands: [1, 3]}
  hide:  {ramp: rhide, bands: [1, 4], line: false}
  fur:   {ramp: rfur, bands: [1, 4], line: false}
  bone:  {ramp: rbone, bands: [1, 4]}
  meat:  {ramp: ob_meat, bands: [1, 3], line: false}
  dirt:  {ramp: rmud, bands: [1, 2], outline: false, line: false}
  dark:  {ramp: ob_dark, emissive: true, band: 1, outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  dirt:              # trampled ground under the nest
    material: dirt
    space: body
    prims:
      - ellipsoid: {c: [0, 0.0, 0.05], r: [1.55, 0.02, 1.10]}
  rim:               # lumpy straw ring
    material: straw
    space: body
    blend: 0.10
    prims:
      - torus: {c: [0, 0.08, 0], R: 1.05, r: 0.15, rot: [0, 0, 0]}
      - ellipsoid: {c: [-1.10, 0.18, -0.20], r: [0.26, 0.20, 0.32]}
      - ellipsoid: {c: [0.95, 0.16, -0.35], r: [0.28, 0.18, 0.28]}
      - ellipsoid: {c: [0.30, 0.20, -0.75], r: [0.42, 0.22, 0.20]}
      - ellipsoid: {c: [-0.50, 0.16, -0.85], r: [0.30, 0.16, 0.18]}
      - ellipsoid: {c: [0.85, 0.12, 0.55], r: [0.30, 0.12, 0.20]}
      - ellipsoid: {c: [-0.90, 0.10, 0.55], r: [0.26, 0.10, 0.20]}
      - ellipsoid: {c: [0.15, 0.08, 1.02], r: [0.34, 0.09, 0.14]}
    cut:
      - box: {c: [0, -0.5, 0], half: [2, 0.5, 2]}
  sticks:
    material: stick
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.45, 0.30, -0.20], b: [-0.70, 0.42, -0.90], r: 0.045}
      - cylinder: {a: [0.95, 0.36, -0.70], b: [1.50, 0.30, 0.10], r: 0.045}
      - cylinder: {a: [-0.30, 0.44, -0.98], b: [0.45, 0.40, -1.02], r: 0.04}
      - cylinder: {a: [1.40, 0.20, 0.45], b: [0.90, 0.22, 0.85], r: 0.04}
      - cylinder: {a: [-1.30, 0.22, 0.35], b: [-0.95, 0.20, 0.75], r: 0.04}
  hide:              # big brown hide spread inside
    material: hide
    space: body
    blend: 0.06
    prims:
      - ellipsoid: {c: [0.15, 0.18, -0.05], r: [0.78, 0.10, 0.55], rot: [0, 0.25, 0]}
      - ellipsoid: {c: [0.80, 0.16, 0.25], r: [0.22, 0.06, 0.14], rot: [0, -0.5, 0]}    # leg flaps
      - ellipsoid: {c: [-0.45, 0.16, 0.42], r: [0.22, 0.06, 0.13], rot: [0, 0.6, 0]}
  fur:               # dark wolf pelt heaped on the left, its tail hanging over the rim
    material: fur
    space: body
    blend: 0.06
    prims:
      - ellipsoid: {c: [-0.45, 0.26, -0.15], r: [0.55, 0.14, 0.42], rot: [0, -0.3, 0]}
      - ellipsoid: {c: [-0.20, 0.34, -0.30], r: [0.30, 0.10, 0.25]}
      - cone: {a: [-0.85, 0.24, 0.20], b: [-1.30, 0.10, 0.55], r: [0.12, 0.05]}       # tail
  bigbone:           # huge gnawed femur across the nest
    material: bone
    space: body
    line: true
    blend: 0.04
    prims:
      - cylinder: {a: [-0.25, 0.42, 0.30], b: [0.75, 0.40, -0.10], r: 0.075}
      - sphere: {c: [-0.30, 0.44, 0.34], r: 0.13}
      - sphere: {c: [-0.22, 0.44, 0.44], r: 0.10}
      - sphere: {c: [0.80, 0.42, -0.14], r: 0.12}
      - sphere: {c: [0.84, 0.41, -0.02], r: 0.09}
    cut:
      - sphere: {c: [0.30, 0.52, 0.10], r: 0.06}       # tooth marks
      - sphere: {c: [0.05, 0.52, 0.20], r: 0.05}
  meat:
    material: meat
    space: body
    prims:
      - ellipsoid: {c: [0.48, 0.45, 0.02], r: [0.12, 0.07, 0.09], rot: [0, 0.4, 0]}
  ribs:              # ribcage at the right edge
    material: bone
    space: body
    prims:
      - cylinder: {a: [0.70, 0.22, 0.42], b: [1.15, 0.20, 0.30], r: 0.03}
      - torus: {c: [0.80, 0.26, 0.48], R: 0.14, r: 0.025, rot: [0, 1.3, 1.57]}
      - torus: {c: [0.94, 0.26, 0.44], R: 0.15, r: 0.025, rot: [0, 1.3, 1.57]}
      - torus: {c: [1.08, 0.25, 0.40], R: 0.13, r: 0.025, rot: [0, 1.3, 1.57]}
    cut:
      - box: {c: [0.9, -0.3, 0.4], half: [1, 0.5, 1]}
  skull:             # horned skull at the front, and a small one at the back left
    material: bone
    space: body
    line: true
    blend: 0.02
    prims:
      - ellipsoid: {c: [-0.45, 0.14, 1.22], r: [0.15, 0.12, 0.16]}
      - cone: {a: [-0.45, 0.10, 1.34], b: [-0.45, 0.06, 1.46], r: [0.08, 0.05]}
      - cone: {a: [-0.55, 0.20, 1.18], b: [-0.80, 0.36, 1.14], r: [0.045, 0.015]}
      - cone: {a: [-0.35, 0.20, 1.18], b: [-0.10, 0.36, 1.14], r: [0.045, 0.015]}
      - sphere: {c: [-1.20, 0.30, -0.55], r: 0.10}
      - cylinder: {a: [0.45, 0.06, 1.20], b: [0.85, 0.05, 1.10], r: 0.035}
      - sphere: {c: [0.44, 0.07, 1.20], r: 0.05}
      - sphere: {c: [0.86, 0.06, 1.10], r: 0.05}
  sockets:
    material: dark
    space: body
    prims:
      - sphere: {c: [-0.50, 0.17, 1.35], r: 0.035}
      - sphere: {c: [-0.40, 0.17, 1.35], r: 0.035}
      - sphere: {c: [-1.20, 0.30, -0.45], r: 0.03}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
