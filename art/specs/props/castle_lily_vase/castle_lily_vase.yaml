# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_lily_vase
kind: prop
view: topdown
size: 48
directions: 1            # round vase: one view serves every angle
mirror: false
palette: "farm"
# centre y 1.3959 = 20 px above the pivot -> pivot (24, 44)
camera: {pitch: 38, scale: 0.055, center: [0, 1.3959, 0]}
shadow: {rx: 7, ry: 2, alpha: 80}

# Prologue: vase of white lilies in the castle hall.
brief:
  summary: royal-blue porcelain vase (gold lip, belly band and foot, a white glaze glint) holding a bouquet of
    three open white lilies with yellow hearts and a pale green bud on green stems, with four long arching
    two-tone leaves; dark outline
  must_keep: [blue vase with gold bands, three open white lilies with yellow hearts, bud, arching leaves]
  simplify: [lily heads as a 7x6 px stamp (6 petals, heart), leaves 2-3 px wide]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, camera.center [0, 1.3959, 0] (integer pivot).
    A pixel painting on the plane z = 0 (pixel-exact one-colour boxes generated once from a layout:
    vase profile shading, leaf strokes, stamped lily heads): the 3D lilies merged into one white blob at
    this size. camera.scale/pitch/light untouched. Ramp index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: pivot (24, 44) is the ground point at the bottom-centre of the vase foot (front edge of
    the footprint). Vase 14 px wide -> footprint 1x1 tile, blocking. ~40 px tall with the flowers.
    The vase is blue, not white: a white vase would vanish on the white marble floor; blue and gold tie it
    to the throne. Static: 1-frame idle.

