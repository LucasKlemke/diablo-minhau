# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: butcher_block
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 0.5584 = 8 px above the pivot -> pivot (24, 32), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.5584, 0]}
shadow: {rx: 12, ry: 4, alpha: 100}

# Act I dungeon "Porao do Acougueiro": the Butcher's chopping block (also marks his lair).
brief:
  summary: a squat thick tree-trunk chopping block with pale hacked end grain on top soaked dark red, a big
    square cleaver buried in it at an angle (grey steel blade with a bright edge, dark wooden handle), blood
    running down its sides into a pool, a scrap of meat and a small bone beside it
  must_keep: [round thick block with chopped top, cleaver stuck in it, blood running down, pool]
  simplify: [rings as one darker ring, hack marks as two dark lines, bark as the side colour]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, camera.center [0, 0.5584, 0] (integer pivot).
    camera.scale/pitch/light untouched. Ramps from palettes ruin/hut plus spec-local steel and blood.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,32) is the ground point under the block's
    centre. Block radius 0.42, 0.75 tall (~knee-hip height), cleaver up to ~1.2. Footprint 1x1 tile,
    blocking. Static: idle 1 frame.

ramps:
  bb_steel: ["#1c0f1a", "#3e4250", "#646a7a", "#9aa0ae", "#d0d4dc"]
  bb_blood: ["#1c0f1a", "#3a0610", "#5e0c16", "#86141e", "#a82a2a"]
  bb_meat:  ["#1c0f1a", "#4a0f18", "#7a1e24", "#a83a36"]

materials:
  bark:   {ramp: rwood, bands: [1, 3]}
  top:    {ramp: hcut, bands: [2, 3]}
  ring:   {ramp: hcut, bands: [1, 1], outline: false, line: false}
  steel:  {ramp: bb_steel, bands: [2, 4]}
  handle: {ramp: hwood, bands: [1, 3]}
  blood:  {ramp: bb_blood, bands: [2, 3], outline: false, line: false}
  gore:   {ramp: bb_blood, bands: [1, 2], outline: false, line: false}
  meat:   {ramp: bb_meat, bands: [1, 3]}
  bone:   {ramp: rbone, bands: [2, 4]}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}
  cleaver: {parent: body, pos: [0.12, 0.7, -0.1], rot: [0.0, 0.35, -0.25]}

parts:
  pool:
    material: blood
    space: body
    prims:
      - ellipsoid: {c: [0.1, 0.005, 0.28], r: [0.55, 0.005, 0.32]}
      - ellipsoid: {c: [-0.45, 0.005, 0.42], r: [0.12, 0.005, 0.07]}
  block:
    material: bark
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 0, 0], b: [0, 0.6, 0], r: 0.44, round: 0.02}
      - cylinder: {a: [0, 0, 0], b: [0, 0.12, 0], r: 0.48, round: 0.04}
    cut:
      - box: {c: [-0.36, 0.64, 0.25], half: [0.13, 0.06, 0.1], rot: [0, -0.7, -0.3]}    # hacked chip
  top:
    material: top
    space: body
    prims:
      - cylinder: {a: [0, 0.58, 0], b: [0, 0.625, 0], r: 0.42}
  ring:
    material: ring
    space: body
    prims:
      - torus: {c: [0, 0.627, 0], R: 0.25, r: 0.015}
  gore_top:           # the blood soaked into the top
    material: gore
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.629, 0.08], r: [0.26, 0.004, 0.2], rot: [0, 0.4, 0]}
      - ellipsoid: {c: [-0.2, 0.629, -0.12], r: [0.1, 0.004, 0.08]}
  runs:               # blood running down the side
    material: blood
    space: body
    prims:
      - box: {c: [0.05, 0.42, 0.435], half: [0.04, 0.16, 0.015]}
      - box: {c: [-0.24, 0.48, 0.37], half: [0.035, 0.1, 0.015], rot: [0, -0.6, 0]}
  blade:
    material: steel
    space: cleaver
    line: true
    prims:
      - box: {c: [0, 0.1, 0], half: [0.18, 0.15, 0.02]}
    cut:
      - sphere: {c: [0.18, 0.23, 0], r: 0.05}
  handle:
    material: handle
    space: cleaver
    line: true
    prims:
      - cylinder: {a: [-0.16, 0.17, 0], b: [-0.48, 0.24, 0], r: 0.045}
  meat:
    material: meat
    space: body
    line: true
    prims:
      - ellipsoid: {c: [-0.48, 0.07, 0.3], r: [0.14, 0.07, 0.1], rot: [0, 0.5, 0]}
  bone:
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [0.38, 0.04, 0.48], b: [0.6, 0.04, 0.38], r: 0.03}
      - sphere: {c: [0.38, 0.05, 0.48], r: 0.05}
      - sphere: {c: [0.6, 0.05, 0.38], r: 0.05}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
