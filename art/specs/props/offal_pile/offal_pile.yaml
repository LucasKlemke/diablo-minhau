spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: offal_pile
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: ["farm", "ruin"]
# centre y 0.4188 = 6 px above the pivot -> pivot (24, 30), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.4188, 0]}
shadow: null             # the rot stain under the heap replaces the shadow

# Mata dos Lobos, arena "Cruzamento das Pedras Altas": rotten scraps the bandits dumped for the plague dogs.
brief:
  summary: heap of rotten meat scraps and gnawed bones spilling from a broken bandit crate, sickly green-yellow
    rot on the meat, a dark seeping stain under it, a torn green sash with a yellow stripe (Polvo's colours)
    caught in the heap; flies buzz over it
  must_keep: [dull purple-red rotten meat with green-yellow rot patches, ivory bones, splintered crate
    planks, torn green-and-yellow rag, dark rot stain, a few 1 px flies looping above]
  simplify: [meat as blended lumps, crate as a hollow box with a smashed side, flies as single dark pixels]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null; camera.center [0, 0.4188, 0] (integer
    pivot). camera.scale/pitch/light untouched. Ramps from palettes ruin + spec-local (index 0 = #1c0f1a);
    green/yellow rag uses customs_gate's cg_green / cg_yellow.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,30) is the ground point at the centre of the
    heap. v0 big heap with the smashed crate behind (~1.5 x 1.0 units, 2x1 tiles), v1 small scatter
    (~1.1 x 0.8, 1x1, low: walkable), v2 cracked upright crate with meat and a ribcage in front (~1.3 x 0.9,
    2x1). Solid part (crate + heap) of v0/v2 is about 1x1 tile around the pivot; treat as low obstacle or
    passable decoration as the arena needs. CLIPS: `variants` (3 static frames, frame i = variant i, no
    flies); `idle` = variant 0 with flies (6 frames x 90 ms loop); `idle1`, `idle2` = the same loop on
    variants 1 and 2.

ramps:
  op_meat:  ["#1c0f1a", "#38141e", "#562028", "#743630", "#8e503c"]
  op_rot:   ["#1c0f1a", "#4e5a1a", "#7a8a24", "#a4ae38", "#c8c85a"]
  op_stain: ["#1c0f1a", "#262414"]
  op_ooze:  ["#1c0f1a", "#3a3a18"]
  op_crate: ["#1c0f1a", "#4a3220", "#6e5030", "#927044", "#b08a56"]
  op_green: ["#1c0f1a", "#163a1e", "#225426", "#367030"]
  op_yellow: ["#1c0f1a", "#8a6a18", "#b8901e", "#d4b03a"]
  op_void:  ["#1c0f1a", "#140c10"]
  op_fly:   ["#1c0f1a", "#120c12"]

materials:
  meat:   {ramp: op_meat, bands: [1, 4]}
  rot:    {ramp: op_rot, bands: [2, 4], line: false}
  bone:   {ramp: rbone, bands: [2, 4]}
  crate:  {ramp: rwood, bands: [1, 4]}
  void:   {ramp: op_void, emissive: true, band: 1, outline: false, line: false}
  green:  {ramp: op_green, bands: [1, 3], two_sided: true}
  yellow: {ramp: op_yellow, bands: [1, 3], line: false, two_sided: true}
  stain:  {ramp: op_stain, emissive: true, band: 1, outline: false, line: false}
  ooze:   {ramp: op_ooze, emissive: true, band: 1, outline: false, line: false}
  fly:    {ramp: op_fly, emissive: true, band: 1, outline: false, line: false}

channels:
  root: [0, 0, 0]
  v: 0               # variant 0..2
  flies: 0           # 1 = flies visible
  fp: 0              # flies phase (radians)

bones:
  body: {parent: root}
  crate0: {parent: body, pos: [-0.36, 0, -0.22], rot: [0, 1.15, 0]}
  crate2: {parent: body, pos: [-0.10, 0, -0.30], rot: [0, -0.25, 0]}

parts:
  # ================= variant 0: big heap, crate on its side smashed open =================
  stain0:
    when: "abs(v - 0) < 0.5"
    material: stain
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.003, 0.10], r: [0.80, 0.003, 0.52]}
      - ellipsoid: {c: [0.62, 0.003, 0.42], r: [0.22, 0.003, 0.14]}
  ooze0:
    when: "abs(v - 0) < 0.5"
    material: ooze
    space: body
    prims:
      - ellipsoid: {c: [0.20, 0.006, 0.30], r: [0.48, 0.003, 0.28]}
  crate_0:           # crate tipped on its side, open toward the camera, built from boards
    when: "abs(v - 0) < 0.5"
    material: crate
    space: crate0
    line: true
    prims:
      - box: {c: [-0.25, 0.46, 0], half: [0.10, 0.03, 0.27], round: 0.01}           # top boards
      - box: {c: [0.0, 0.46, 0], half: [0.10, 0.03, 0.27], round: 0.01}
      - box: {c: [0.25, 0.46, -0.06], half: [0.10, 0.03, 0.18], round: 0.01}           # snapped short
      - box: {c: [-0.33, 0.12, 0], half: [0.03, 0.10, 0.27], round: 0.01}            # left side boards
      - box: {c: [-0.33, 0.34, 0], half: [0.03, 0.09, 0.27], round: 0.01}
      - box: {c: [0.33, 0.10, 0], half: [0.03, 0.10, 0.27], round: 0.01}             # right side, upper board gone
      - box: {c: [0, 0.02, 0], half: [0.36, 0.02, 0.27]}                              # floor
  void_0:            # dark inside of the crate
    when: "abs(v - 0) < 0.5"
    material: void
    space: crate0
    prims:
      - box: {c: [0, 0.24, -0.10], half: [0.31, 0.21, 0.16]}
  planks_0:          # splintered boards on the ground
    when: "abs(v - 0) < 0.5"
    material: crate
    space: body
    line: true
    prims:
      - box: {c: [-0.55, 0.03, 0.30], half: [0.30, 0.03, 0.06], rot: [0, 0.5, 0], round: 0.01}
      - box: {c: [0.60, 0.04, -0.20], half: [0.24, 0.03, 0.06], rot: [0.0, -0.8, 0.06], round: 0.01}
      - cone: {a: [-0.30, 0.03, 0.42], b: [-0.12, 0.05, 0.52], r: [0.04, 0.01]}
  meat_0:
    when: "abs(v - 0) < 0.5"
    material: meat
    space: body
    line: true
    blend: 0.05
    prims:
      - ellipsoid: {c: [0.05, 0.12, 0.12], r: [0.32, 0.17, 0.25]}
      - ellipsoid: {c: [0.34, 0.10, 0.04], r: [0.20, 0.13, 0.18]}
      - ellipsoid: {c: [-0.18, 0.18, -0.08], r: [0.18, 0.14, 0.16]}     # spilling from the crate
      - ellipsoid: {c: [-0.16, 0.07, 0.36], r: [0.17, 0.08, 0.13]}
      - ellipsoid: {c: [0.42, 0.06, 0.38], r: [0.14, 0.07, 0.11]}
  rot_0:
    when: "abs(v - 0) < 0.5"
    material: rot
    space: body
    prims:
      - ellipsoid: {c: [-0.02, 0.27, 0.14], r: [0.12, 0.04, 0.09]}
      - ellipsoid: {c: [0.36, 0.21, 0.04], r: [0.09, 0.04, 0.07]}
      - ellipsoid: {c: [-0.18, 0.14, 0.40], r: [0.07, 0.03, 0.05]}
      - ellipsoid: {c: [-0.20, 0.30, -0.08], r: [0.07, 0.03, 0.06]}
  bones_0:
    when: "abs(v - 0) < 0.5"
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [0.48, 0.06, -0.12], b: [0.72, 0.10, 0.22], r: 0.035}
      - sphere: {c: [0.48, 0.06, -0.12], r: 0.055}
      - sphere: {c: [0.72, 0.10, 0.22], r: 0.055}
      - cylinder: {a: [-0.62, 0.04, 0.12], b: [-0.34, 0.05, 0.46], r: 0.03}
      - sphere: {c: [-0.62, 0.04, 0.12], r: 0.05}
      - sphere: {c: [-0.34, 0.05, 0.46], r: 0.05}
      - chain: {pts: [[0.12, 0.18, 0.02], [0.18, 0.36, 0.06], [0.28, 0.42, 0.10]], r: [0.03, 0.025, 0.018]}   # ribs out of the meat
      - chain: {pts: [[0.22, 0.16, 0.00], [0.30, 0.32, 0.03], [0.40, 0.36, 0.08]], r: [0.03, 0.025, 0.018]}
  rag_0:             # torn green sash draped over the heap and down the front
    when: "abs(v - 0) < 0.5"
    material: green
    space: body
    line: true
    prims:
      - box: {c: [0.06, 0.27, 0.20], half: [0.26, 0.015, 0.07], rot: [0.30, 0.45, 0.15]}
      - box: {c: [-0.22, 0.12, 0.36], half: [0.07, 0.10, 0.015], rot: [0.5, 0.45, 0.2]}
    cut:
      - box: {c: [0.30, 0.30, 0.10], half: [0.05, 0.05, 0.05], rot: [0, 0.7, 0]}   # torn notch
  rag_stripe_0:
    when: "abs(v - 0) < 0.5"
    material: yellow
    space: body
    prims:
      - box: {c: [0.06, 0.29, 0.20], half: [0.24, 0.012, 0.022], rot: [0.30, 0.45, 0.15]}

  # ================= variant 1: small scatter =================
  stain1:
    when: "abs(v - 1) < 0.5"
    material: stain
    space: body
    prims:
      - ellipsoid: {c: [0.0, 0.003, 0.05], r: [0.60, 0.003, 0.38]}
  ooze1:
    when: "abs(v - 1) < 0.5"
    material: ooze
    space: body
    prims:
      - ellipsoid: {c: [0.10, 0.006, 0.10], r: [0.30, 0.003, 0.18]}
  planks_1:
    when: "abs(v - 1) < 0.5"
    material: crate
    space: body
    line: true
    prims:
      - box: {c: [-0.30, 0.04, -0.18], half: [0.34, 0.035, 0.07], rot: [0, 0.3, 0.05], round: 0.01}
      - cone: {a: [0.02, 0.05, -0.08], b: [0.20, 0.06, -0.02], r: [0.05, 0.01]}
  meat_1:
    when: "abs(v - 1) < 0.5"
    material: meat
    space: body
    line: true
    blend: 0.04
    prims:
      - ellipsoid: {c: [0.10, 0.09, 0.08], r: [0.22, 0.11, 0.16]}
      - ellipsoid: {c: [0.30, 0.06, 0.22], r: [0.12, 0.07, 0.10]}
      - ellipsoid: {c: [-0.32, 0.06, 0.24], r: [0.13, 0.07, 0.10]}
  rot_1:
    when: "abs(v - 1) < 0.5"
    material: rot
    space: body
    prims:
      - ellipsoid: {c: [0.06, 0.18, 0.10], r: [0.09, 0.03, 0.07]}
      - ellipsoid: {c: [-0.32, 0.12, 0.26], r: [0.06, 0.03, 0.05]}
  bones_1:
    when: "abs(v - 1) < 0.5"
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [0.30, 0.04, -0.20], b: [0.58, 0.05, 0.06], r: 0.035}
      - sphere: {c: [0.30, 0.04, -0.20], r: 0.055}
      - sphere: {c: [0.58, 0.05, 0.06], r: 0.055}
      - cylinder: {a: [-0.10, 0.04, 0.36], b: [0.14, 0.04, 0.42], r: 0.03}
      - sphere: {c: [-0.10, 0.04, 0.36], r: 0.045}
      - sphere: {c: [0.14, 0.04, 0.42], r: 0.045}
  rag_1:             # torn sash lying flat, half under the meat
    when: "abs(v - 1) < 0.5"
    material: green
    space: body
    line: true
    prims:
      - box: {c: [-0.12, 0.02, 0.06], half: [0.30, 0.012, 0.07], rot: [0, -0.35, 0]}
    cut:
      - box: {c: [-0.40, 0.02, 0.0], half: [0.05, 0.05, 0.05], rot: [0, 0.7, 0]}
  rag_stripe_1:
    when: "abs(v - 1) < 0.5"
    material: yellow
    space: body
    prims:
      - box: {c: [-0.12, 0.034, 0.06], half: [0.28, 0.01, 0.022], rot: [0, -0.35, 0]}

  # ================= variant 2: cracked upright crate, meat and a ribcage in front =================
  stain2:
    when: "abs(v - 2) < 0.5"
    material: stain
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.003, 0.12], r: [0.72, 0.003, 0.48]}
  ooze2:
    when: "abs(v - 2) < 0.5"
    material: ooze
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.006, 0.28], r: [0.42, 0.003, 0.22]}
  crate_2:           # upright crate, a front board kicked in, built from boards
    when: "abs(v - 2) < 0.5"
    material: crate
    space: crate2
    line: true
    prims:
      - box: {c: [0, 0.08, 0.24], half: [0.31, 0.07, 0.03], round: 0.01}            # front boards
      - box: {c: [-0.17, 0.27, 0.24], half: [0.14, 0.07, 0.03], round: 0.01}         # (right half kicked in)
      - box: {c: [0, 0.46, 0.24], half: [0.31, 0.07, 0.03], round: 0.01}
      - box: {c: [0.22, 0.24, 0.30], half: [0.10, 0.07, 0.02], rot: [0.6, 0.3, 0.3], round: 0.01}  # the broken board
      - box: {c: [0.30, 0.27, 0], half: [0.03, 0.26, 0.25], round: 0.01}              # sides and back
      - box: {c: [-0.30, 0.27, 0], half: [0.03, 0.26, 0.25], round: 0.01}
      - box: {c: [0, 0.27, -0.24], half: [0.31, 0.26, 0.03], round: 0.01}
  void_2:
    when: "abs(v - 2) < 0.5"
    material: void
    space: crate2
    prims:
      - box: {c: [0, 0.22, 0], half: [0.28, 0.22, 0.22]}
  planks_2:
    when: "abs(v - 2) < 0.5"
    material: crate
    space: body
    line: true
    prims:
      - box: {c: [-0.55, 0.03, 0.22], half: [0.26, 0.03, 0.06], rot: [0, -0.4, 0], round: 0.01}
  meat_2:
    when: "abs(v - 2) < 0.5"
    material: meat
    space: body
    line: true
    blend: 0.05
    prims:
      - ellipsoid: {c: [-0.14, 0.46, -0.32], r: [0.14, 0.09, 0.12]}      # heaped in the crate
      - ellipsoid: {c: [0.08, 0.44, -0.24], r: [0.12, 0.07, 0.10]}
      - ellipsoid: {c: [0.30, 0.40, -0.20], r: [0.10, 0.10, 0.08]}       # flopping over the edge
      - ellipsoid: {c: [0.12, 0.10, 0.18], r: [0.24, 0.12, 0.18]}
      - ellipsoid: {c: [0.42, 0.07, 0.30], r: [0.15, 0.08, 0.11]}
  rot_2:
    when: "abs(v - 2) < 0.5"
    material: rot
    space: body
    prims:
      - ellipsoid: {c: [-0.18, 0.54, -0.30], r: [0.07, 0.03, 0.06]}
      - ellipsoid: {c: [0.16, 0.21, 0.18], r: [0.09, 0.03, 0.07]}
  ribs_2:            # a ribcage on the meat in front
    when: "abs(v - 2) < 0.5"
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.10, 0.10, 0.40], b: [0.36, 0.10, 0.40], r: 0.035}
      - torus: {c: [-0.02, 0.14, 0.34], R: 0.12, r: 0.022, rot: [0, 0, 1.5708]}
      - torus: {c: [0.10, 0.14, 0.34], R: 0.11, r: 0.022, rot: [0, 0, 1.5708]}
      - torus: {c: [0.22, 0.14, 0.34], R: 0.10, r: 0.022, rot: [0, 0, 1.5708]}
    cut:
      - box: {c: [0.1, 0.0, 0.34], half: [0.5, 0.10, 0.5]}
  bones_2:
    when: "abs(v - 2) < 0.5"
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [0.50, 0.05, -0.10], b: [0.70, 0.06, 0.20], r: 0.035}
      - sphere: {c: [0.50, 0.05, -0.10], r: 0.055}
      - sphere: {c: [0.70, 0.06, 0.20], r: 0.055}
  rag_2:             # sash hanging over the crate's edge
    when: "abs(v - 2) < 0.5"
    material: green
    space: crate2
    line: true
    prims:
      - box: {c: [-0.18, 0.54, 0.05], half: [0.07, 0.015, 0.24], rot: [0.0, 0.2, 0]}
      - box: {c: [-0.20, 0.38, 0.27], half: [0.07, 0.16, 0.015], rot: [0.1, 0.2, 0.1]}
    cut:
      - box: {c: [-0.22, 0.22, 0.27], half: [0.04, 0.05, 0.05], rot: [0, 0, 0.7]}
  rag_stripe_2:
    when: "abs(v - 2) < 0.5"
    material: yellow
    space: crate2
    prims:
      - box: {c: [-0.18, 0.556, 0.05], half: [0.022, 0.01, 0.22], rot: [0.0, 0.2, 0]}
      - box: {c: [-0.20, 0.38, 0.29], half: [0.022, 0.15, 0.01], rot: [0.1, 0.2, 0.1]}

  # ================= flies (idle clips only) =================
  flies:
    when: "flies > 0.5"
    material: fly
    space: body
    prims:
      - sphere: {c: "[0.05 + 0.30*cos(fp), 0.62 + 0.08*sin(2*fp), 0.10 + 0.20*sin(fp)]", r: 0.05}
      - sphere: {c: "[-0.10 + 0.24*cos(-fp + 2.1), 0.80 + 0.07*sin(2*fp + 1), 0.0 + 0.16*sin(-fp + 2.1)]", r: 0.05}
      - sphere: {c: "[0.20 + 0.20*cos(fp + 4.2), 0.48 + 0.06*sin(3*fp), 0.15 + 0.14*sin(fp + 4.2)]", r: 0.05}
      - sphere: {c: "[-0.25 + 0.16*cos(-fp + 1.0), 0.40 + 0.05*sin(2*fp + 2), 0.20 + 0.12*sin(-fp + 1.0)]", r: 0.05}

animations:
  idle:              # variant 0, flies buzzing (seamless loop)
    frames: 6
    ms: 90
    channels: {v: 0, flies: 1, fp: "p"}
  idle1:
    frames: 6
    ms: 90
    channels: {v: 1, flies: 1, fp: "p"}
  idle2:
    frames: 6
    ms: 90
    channels: {v: 2, flies: 1, fp: "p"}
  variants:          # frame i = variant i (static, no flies)
    frames: 3
    ms: 1000
    channels: {v: "f", flies: 0}
