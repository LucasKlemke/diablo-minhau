# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_window
kind: prop
view: topdown
size: 64
directions: 1            # faces the camera (s): set in the hall's north wall
mirror: false
palette: "farm"
# centre y 1.6751 = 24 px above the pivot -> pivot (32, 56): 8 rows below the floor line for fallen glass
camera: {pitch: 38, scale: 0.055, center: [0, 1.6751, 0]}
shadow: null             # part of the wall

# Prologue: tall stained-glass window of the castle hall; the invasion shatters it.
brief:
  summary: tall round-arched stained-glass window in a bevelled white marble frame with a keystone and a sill.
    Dark leading splits it into a rose in the arch (gold heart, red petals, blue / purple quarters), a
    medallion with Minhau's gold star on deep blue between green side lights, and a lower section of red /
    blue / amber diamonds around a central mullion; every pane has a light top-left and dark bottom-right
    pixel bevel so it reads as glass
  must_keep: [white arched frame, colourful lead pattern, gold star, broken state with jagged shards left in
    the frame, a dark hole and glass on the floor]
  simplify: [no figurative scenes; panes are 3-tone]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null, camera.center [0, 1.6751, 0] (integer
    pivot). A pixel painting on the wall plane: every part is a run of pixel-exact boxes on z = 0 (fallen
    glass on the ground in front, flying glass at z +0.02), one exact colour per material, generated once
    from a pixel layout. Glass colours are emissive (daylight behind them) so they also land in the emissive
    map; the frame is not. camera.scale/pitch/light untouched. Ramp index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: pivot (32, 56) is the floor line at the foot of the wall, the same line as
    castle_wall_back's pivot: draw the window at x = any column of the wall, y = the wall's pivot y, over the
    wall. Its rows then match the wall exactly: frame from wall row 18 to the sill at wall row 55 (it sits
    between the frieze and the plinth). Window 28 px wide incl. the sill (under 2 tiles). Footprint 0 (the
    wall blocks). Channel st: 0 intact, 1 cracked, 2 shattering, 3 broken.
    Clips: idle (intact), break (one-shot: crack -> shatter with glass flying into the hall -> broken;
    events crack, shatter, broken), broken (static).

