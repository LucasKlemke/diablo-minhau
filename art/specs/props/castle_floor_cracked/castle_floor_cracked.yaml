# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_floor_cracked
kind: prop
view: topdown
size: 32                 # one 32x32 px tile = 2x2 world tiles; the whole frame is floor (tileable)
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}
shadow: null             # it is the ground itself

# Prologue (the castle destroyed): the castle_floor tile cracked, chipped, sooty and blood-flecked.
brief:
  summary: the same polished white / cream marble checker as castle_floor (slabs, bevels, grout, gold inlay
    and veins identical) after the massacre - dark cracks with a pale shadow lip running across the slabs and
    forking, a chipped slab corner at the middle crossing, grey-brown dust and soot smudges, dried blood specks
  must_keep: [castle_floor's checker, bevels, grout and gold inlay unchanged (it mixes with castle_floor), seamless every 32 px]
  simplify: [cracks and grime as 1 px pixel paths and clusters, no relief]
  exceptions: |
    Same as castle_floor: kind prop, size 32, directions 1, mirror false, shadow null, camera.center [0, 0, 0];
    the floor fills the whole frame on purpose ("clipped at the edge" is expected for a tile). Every material is
    one exact colour; parts are pixel-exact boxes generated once from a pixel layout. camera.scale/pitch/light untouched.
  decisions: |
    TILING CONTRACT: identical to castle_floor (32x32 px tile = 2x2 world tiles, pivot = frame centre 16,16,
    same checker parity, so cracked and clean tiles mix freely). Cracks, grime and chips stay 1 px inside the
    frame so the tile edges are untouched and it stays seamless next to any castle_floor variant. VARIANTS:
    animation `variants` has 4 frames (frame i = variant i: castle_floor's veins of variant i + its own damage;
    1 and 3 have blood specks, 0 and 2 a chipped corner); `idle` = variant 0. Mix it into the hall floor (e.g.
    1 cell in 3) for the destroyed castle.

