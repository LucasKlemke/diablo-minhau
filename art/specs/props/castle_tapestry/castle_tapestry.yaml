# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_tapestry
kind: prop
view: topdown
size: 64
directions: 1            # faces the camera (s): hangs on the hall's north wall
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.6751, 0]}   # 24 px above the pivot -> pivot (32, 56)
shadow: null             # hangs on the wall

# Prologue: the royal tapestry of Minhau.
brief:
  summary: long royal-blue wall tapestry hanging from a gold rod with ball finials, gold trim down both sides,
    a pointed (V) bottom ending in a gold tassel; Minhau's coat of arms in gold - a cat's head with pointed
    ears and blue eyes, a five-pointed star above it
  must_keep: [royal blue cloth, gold rod, gold cat head with ears, gold star, pointed bottom with tassel]
  simplify: [three pleats (dark fold + light edge), an embroidered gold ring around the arms]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null, camera.center [0, 1.6751, 0] (integer
    pivot). camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,56) is the ground point under the tapestry,
    on the wall line (z 0; the cloth hangs at z +0.06). Cloth 1.2 units wide (22 px), from y 3.3 down to the
    V tip at y 0.95: it is a wall decoration, footprint 0 (the wall blocks). Static: 1-frame idle.

ramps:
  tp_blue:  ["#1c0f1a", "#1e2978", "#2c60d5", "#5f93ea", "#a8cff3"]
  tp_gold:  ["#1c0f1a", "#804a19", "#e1a227", "#eddc83", "#f8f4dd"]

materials:
  cloth: {ramp: tp_blue, bands: [1, 3]}
  fold:  {ramp: tp_blue, bands: [1, 1], outline: false, line: false}
  fold_hi: {ramp: tp_blue, bands: [3, 3], outline: false, line: false}
  ring:  {ramp: tp_gold, bands: [3, 3], outline: false, line: false}
  gold:  {ramp: tp_gold, bands: [2, 4]}
  arms:  {ramp: tp_gold, bands: [2, 3], outline: false, line: false}
  eye:   {ramp: tp_blue, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  cloth:
    material: cloth
    space: body
    line: true
    prims:
      - box: {c: [0, 2.1, 0.06], half: [0.6, 1.2, 0.03]}
    cut:
      - box: {c: [0.599, 0.774, 0.06], half: [1.0, 0.5, 0.2], rot: [0, 0, 0.64]}
      - box: {c: [-0.599, 0.774, 0.06], half: [1.0, 0.5, 0.2], rot: [0, 0, -0.64]}
  folds:
    material: fold
    space: body
    prims:
      - box: {c: [-0.3, 2.35, 0.095], half: [0.02, 0.85, 0.01]}
      - box: {c: [0.3, 2.35, 0.095], half: [0.02, 0.85, 0.01]}
  pleats_hi:          # light edge of each pleat, next to the dark fold
    material: fold_hi
    space: body
    prims:
      - box: {c: [-0.255, 2.35, 0.095], half: [0.025, 0.85, 0.01]}
      - box: {c: [0.345, 2.35, 0.095], half: [0.025, 0.85, 0.01]}
      - box: {c: [-0.48, 2.4, 0.095], half: [0.02, 0.8, 0.01]}
  crest_ring:         # embroidered gold ring around the cat
    material: ring
    space: body
    prims:
      - torus: {c: [0, 2.06, 0.1], R: 0.46, r: 0.022, rot: [1.5708, 0, 0]}
  trim:
    material: gold
    space: body
    line: true
    prims:
      - box: {c: [0.57, 2.37, 0.08], half: [0.04, 0.93, 0.02]}
      - box: {c: [-0.57, 2.37, 0.08], half: [0.04, 0.93, 0.02]}
  rod:
    material: gold
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.78, 3.32, 0.08], b: [0.78, 3.32, 0.08], r: 0.05}
      - sphere: {c: [0.82, 3.32, 0.08], r: 0.08}
      - sphere: {c: [-0.82, 3.32, 0.08], r: 0.08}
  tassel:
    material: gold
    space: body
    line: true
    prims:
      - sphere: {c: [0, 0.97, 0.08], r: 0.07}
      - cone: {a: [0, 0.93, 0.08], b: [0, 0.7, 0.08], r: [0.05, 0.08]}
  cat_head:
    material: arms
    space: body
    prims:
      - cylinder: {a: [0, 1.98, 0.09], b: [0, 1.98, 0.11], r: 0.27}
      - tri: {a: [0.06, 2.18, 0.1], b: [0.27, 2.12, 0.1], c: [0.24, 2.42, 0.1], th: 0.01}
      - tri: {a: [-0.06, 2.18, 0.1], b: [-0.27, 2.12, 0.1], c: [-0.24, 2.42, 0.1], th: 0.01}
  cat_eyes:
    material: eye
    space: body
    prims:
      - box: {c: [0.11, 2.02, 0.115], half: [0.045, 0.05, 0.01]}
      - box: {c: [-0.11, 2.02, 0.115], half: [0.045, 0.05, 0.01]}
      - box: {c: [0, 1.88, 0.115], half: [0.03, 0.025, 0.01]}
  star:
    material: arms
    space: body
    prims:
      - cone: {a: [0, 2.78, 0.1], b: [0.0, 3.03, 0.1], r: [0.09, 0.025]}
      - cone: {a: [0, 2.78, 0.1], b: [0.238, 2.857, 0.1], r: [0.09, 0.025]}
      - cone: {a: [0, 2.78, 0.1], b: [0.147, 2.578, 0.1], r: [0.09, 0.025]}
      - cone: {a: [0, 2.78, 0.1], b: [-0.147, 2.578, 0.1], r: [0.09, 0.025]}
      - cone: {a: [0, 2.78, 0.1], b: [-0.238, 2.857, 0.1], r: [0.09, 0.025]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
