# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_wall_back
kind: prop
view: topdown
size: 64                 # one 64x64 px stretch = 4 tiles wide x 4 tiles tall; fills the frame (tileable in x)
directions: 1            # faces the camera (s): the hall's north wall
mirror: false
palette: "farm"
# centre y 2.2335 = 32 px above the pivot -> the pivot is the bottom-centre of the frame (32, 64)
camera: {pitch: 38, scale: 0.055, center: [0, 2.2335, 0]}
shadow: null

# Prologue: the back (north) wall of Minhau's castle hall, a horizontally tileable stretch.
brief:
  summary: white / cream ashlar wall of the castle hall - from the top, the wall's cream top cap, a white
    cornice moulding with a deep shadow under its lip, a royal-blue frieze between gold fillets with gold
    diamonds (blue hearts) every 16 px and gold studs between them, staggered bevelled ashlar blocks in two
    creams with faint veins, a fluted white pilaster with a gold capital in the middle of each stretch, and a
    plinth with a gold line and a dark contact line on the floor
  must_keep: [white/cream stone, cornice with shadow, blue and gold frieze, bevelled ashlar, pilaster
    rhythm every 64 px, plinth, seamless repeat in x]
  simplify: [shading painted as 1 px bevels (light top/left, dark bottom/right), no 3D relief]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null, camera.center [0, 2.2335, 0].
    The wall fills the WHOLE frame on purpose (tile: QA reports "clipped at the edge", expected). It is a
    pixel painting on the wall plane: every part is a run of pixel-exact boxes on z = 0 with a one-colour
    material (no outline, no lighting variation), generated once from a 64x64 pixel layout.
    camera.scale/pitch/light untouched. Ramp index 0 = #1c0f1a.
  decisions: |
    TILING CONTRACT: pivot = bottom-centre of the frame (32, 64) = the floor line at the foot of the wall.
    Draw a stretch every 64 px along x, pivot on the top edge of the first floor row; the wall covers the 4
    tile rows above it (it blocks). The top 4 px (outline + cap) are the top of the wall seen from above,
    the same cap colour as castle_wall_side so corners join. Columns, tapestries, windows and the gate are
    separate props drawn in front of it (their pivots on the same floor line).
    Static: 1-frame idle.

