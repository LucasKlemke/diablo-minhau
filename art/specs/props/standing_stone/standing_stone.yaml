spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: standing_stone
kind: prop
view: topdown
size: 96                 # ~80 px tall on screen (2.5x the 32 px hero), 2+ px margins
directions: 1            # static scenery, faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 2.6524, 0]}   # 38 px above the pivot -> pivot (48, 86)
shadow: null             # each variant draws its own ground shadow (the leaning one is offset)

# Mata dos Lobos, arena "Cruzamento das Pedras Altas": a ring of ancient menhirs around the dogs' lair.
brief:
  summary: tall ancient menhir of weathered cold-grey stone, a thick tapered slab with a rounded top, chipped
    edges, dark moss creeping up from the base and over the top, pale lichen blotches, a faint paw rune
    carved on the front face; three looks - straight, leaning, broken-top with the fallen tip at its foot
  must_keep: [~2.5x hero height (about 80 px), tapered slab silhouette, cold slate grey like mossy_rock,
    moss at the base and top, lichen spots, faint carved paw rune on the face toward the camera]
  simplify: [slab as blended rounded boxes, chips as small cuts, rune as 5 dark dots (pad + 4 toes)]
  exceptions: |
    kind prop, size 96, directions 1, mirror false; camera.center [0, 2.6524, 0] (integer pivot);
    shadow null (each variant has a flat dark ellipse part). camera.scale/pitch/light untouched.
    Spec-local ramps keep index 0 = #1c0f1a; stone and moss ramps are mossy_rock's.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 48,86) is the ground point at the centre of the
    stone's base. The solid base is about 1.3 x 0.8 units (~24 x 9 px on screen): block 2x1 tiles centred on
    the pivot (1x1 is enough if the ring needs gaps). The leaning stone tips toward +x (screen right) and its
    top hangs ~1.1 units (~20 px) right of the base, overhead only (the base footprint does not change); the
    broken stone's fallen tip lies right of the base (x 0.5..1.6, low, ~0.5 tall): block 3x1 tiles from the
    pivot tile rightward if it must stop the hero, otherwise 2x1. VARIANTS: animation `variants` has 3 frames (frame i = variant i): 0 straight,
    1 leaning, 2 broken top. `idle` = variant 0. Rune: paw (pad + 4 toes), the Wolf Wood's mark.

ramps:
  ss_stone:  ["#1c0f1a", "#2c2a34", "#45424e", "#625e6a", "#87828c"]
  ss_moss:   ["#1c0f1a", "#22301e", "#344a27", "#4b6232", "#66783e"]
  ss_lichen: ["#1c0f1a", "#5e5e3a", "#7e7a4c", "#9c9662"]
  ss_rune:   ["#1c0f1a", "#34313c"]
  ss_shadow: ["#1c0f1a", "#262418"]
  ss_dirt:   ["#1c0f1a", "#2e241c", "#3e3024", "#4e3e2e"]
  ss_grass:  ["#1c0f1a", "#4a4228", "#6a5e38", "#86784a"]

materials:
  stone:  {ramp: ss_stone, bands: [1, 4]}
  moss:   {ramp: ss_moss, bands: [1, 4], line: false}
  lichen: {ramp: ss_lichen, bands: [1, 3], line: false, outline: false}
  rune:   {ramp: ss_rune, emissive: true, band: 1, outline: false, line: false}
  shadow: {ramp: ss_shadow, emissive: true, band: 1, outline: false, line: false}
  dirt:   {ramp: ss_dirt, bands: [1, 3], line: false}
  grass:  {ramp: ss_grass, bands: [1, 3], line: false}

channels:
  root: [0, 0, 0]
  var: 0             # variant 0..2

bones:
  body: {parent: root}
  # the slab: straight (0), leaning toward +x (1), straight but broken (2)
  slab: {parent: body, rot: [0, 0, "-0.22*(abs(var - 1) < 0.5)"]}
  shape: {parent: slab, scale: [1, 1, 0.62]}     # flattened slab (wider than deep)

parts:
  # ---------------- ground ----------------
  shadow:
    material: shadow
    space: body
    prims:
      - ellipsoid: {c: ["0.10 + 0.45*(abs(var - 1) < 0.5)", 0.0, 0.05], r: [1.05, 0.01, 0.62]}
  heave:             # earth heaved up on the side the leaning stone pulls out of
    when: "abs(var - 1) < 0.5"
    material: dirt
    space: body
    blend: 0.08
    prims:
      - ellipsoid: {c: [-0.78, 0.06, 0.05], r: [0.26, 0.20, 0.34]}
      - ellipsoid: {c: [-0.55, 0.04, 0.38], r: [0.20, 0.13, 0.16]}
      - ellipsoid: {c: [-0.98, 0.03, 0.30], r: [0.10, 0.07, 0.09]}
  grass:             # dead grass tufts around the foot
    material: grass
    space: body
    prims:
      - cone: {a: [-0.62, 0, 0.30], b: [-0.78, 0.30, 0.38], r: [0.05, 0.01]}
      - cone: {a: [-0.58, 0, 0.32], b: [-0.56, 0.36, 0.42], r: [0.05, 0.01]}
      - cone: {a: [0.66, 0, 0.28], b: [0.84, 0.26, 0.34], r: [0.05, 0.01]}
      - cone: {a: [0.62, 0, 0.34], b: [0.60, 0.32, 0.46], r: [0.05, 0.01]}

  # ---------------- the slab ----------------
  slab_whole:
    when: "var < 1.5"
    material: stone
    space: shape
    line: true
    blend: 0.18
    cut_blend: 0.06
    prims: &slab
      - cone: {a: [0, 0, 0], b: [0.05, 5.15, 0], r: [0.80, 0.50]}
      - ellipsoid: {c: [-0.12, 1.70, 0.10], r: [0.62, 1.20, 0.66]}     # bulge, irregular outline
    cut:
      - box: {c: [0, -1.0, 0], half: [3, 1.0, 3]}                         # nothing below the ground
      - box: {c: [0, 6.25, 0], half: [2, 1.0, 2], rot: [0.10, 0, 0.30]}  # blunt slanted top
      - box: {c: [0, 2.4, 1.46], half: [2, 3.2, 1.0], rot: [-0.05, 0, 0]}     # flat hewn front face
      - box: {c: [0, 2.4, -1.52], half: [2, 3.2, 1.0], rot: [0.04, 0, 0]}     # flat back face
      - box: {c: [0.80, 2.60, 0.30], half: [0.16, 0.26, 0.30], rot: [0.3, 0.6, 0.5]}   # chips
      - box: {c: [-0.82, 1.30, 0.30], half: [0.14, 0.22, 0.30], rot: [0.5, 0.4, 0.3]}
      - box: {c: [-0.58, 4.40, 0.30], half: [0.14, 0.20, 0.30], rot: [0.2, 0.7, 0.4]}
  slab_broken:
    when: "var > 1.5"
    material: stone
    space: shape
    line: true
    blend: 0.18
    prims: *slab
    cut:
      - box: {c: [0, -1.0, 0], half: [3, 1.0, 3]}
      - box: {c: [0, 2.4, 1.46], half: [2, 3.2, 1.0], rot: [-0.05, 0, 0]}
      - box: {c: [0, 2.4, -1.52], half: [2, 3.2, 1.0], rot: [0.04, 0, 0]}
      - box: {c: [0.80, 2.60, 0.30], half: [0.16, 0.26, 0.30], rot: [0.3, 0.6, 0.5]}
      - box: {c: [-0.82, 1.30, 0.30], half: [0.14, 0.22, 0.30], rot: [0.5, 0.4, 0.3]}
      - box: {c: [0, 4.35, 0], half: [1.5, 1.2, 1.5], rot: [0.12, 0, 0.32]}     # broken off, slanted
      - box: {c: [-0.40, 3.30, 0], half: [0.20, 0.30, 1.0], rot: [0, 0, 0.8]}   # jagged notch
      - box: {c: [0.30, 3.45, 0], half: [0.12, 0.20, 1.0], rot: [0, 0, -0.6]}
  fallen_tip:        # the broken top lies at the foot
    when: "var > 1.5"
    material: stone
    space: body
    line: true
    blend: 0.12
    prims:
      - box: {c: [0.98, 0.26, 0.24], half: [0.48, 0.24, 0.28], rot: [0.1, -0.5, 0.2], round: 0.10}
      - ellipsoid: {c: [1.32, 0.28, 0.02], r: [0.30, 0.22, 0.24], rot: [0, -0.5, 0]}

  # ---------------- moss and lichen ----------------
  moss_base:
    material: moss
    space: slab
    blend: 0.05
    prims:
      - ellipsoid: {c: [-0.10, 0.10, 0.36], r: [0.62, 0.14, 0.12]}
      - ellipsoid: {c: [-0.50, 0.30, 0.28], r: [0.18, 0.32, 0.14]}
      - ellipsoid: {c: [0.48, 0.14, 0.30], r: [0.22, 0.16, 0.12]}
      - ellipsoid: {c: [-0.62, 0.80, 0.10], r: [0.08, 0.40, 0.20]}
  moss_top:
    when: "var < 1.5"
    material: moss
    space: slab
    blend: 0.05
    prims:
      - ellipsoid: {c: [-0.20, 5.10, -0.02], r: [0.36, 0.12, 0.24], rot: [0, 0, 0.30]}
      - ellipsoid: {c: [-0.42, 4.70, 0.12], r: [0.14, 0.30, 0.14]}
  moss_top_broken:
    when: "var > 1.5"
    material: moss
    space: slab
    prims:
      - ellipsoid: {c: [-0.40, 3.10, 0.05], r: [0.22, 0.08, 0.20], rot: [0, 0, 0.30]}
  lichen:            # pale blotches on the front face
    material: lichen
    space: slab
    prims:
      - ellipsoid: {c: [0.30, 1.55, 0.33], r: [0.15, 0.11, 0.04]}
      - ellipsoid: {c: [0.40, 1.70, 0.32], r: [0.08, 0.07, 0.04]}
      - ellipsoid: {c: [-0.34, 2.05, 0.31], r: [0.11, 0.09, 0.04]}
      - ellipsoid: {c: [0.20, 0.75, 0.36], r: [0.10, 0.08, 0.04]}
  lichen_top:
    when: "var < 1.5"
    material: lichen
    space: slab
    prims:
      - ellipsoid: {c: [0.24, 4.05, 0.31], r: [0.12, 0.10, 0.04]}

  # ---------------- the paw rune (front face, toward the camera) ----------------
  rune:
    material: rune
    space: slab
    prims:
      - ellipsoid: {c: [0.0, 2.45, 0.27], r: [0.20, 0.15, 0.03]}       # pad
      - sphere: {c: [-0.28, 2.70, 0.26], r: 0.065}
      - sphere: {c: [-0.10, 2.84, 0.26], r: 0.065}
      - sphere: {c: [0.10, 2.84, 0.26], r: 0.065}
      - sphere: {c: [0.28, 2.70, 0.26], r: 0.065}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {var: 0}
  variants:
    frames: 3
    ms: 1000
    channels: {var: "f"}
