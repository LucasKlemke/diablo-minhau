# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: hanging_herbs
kind: prop
view: topdown
size: 48
directions: 1            # hangs on the back wall, faces the camera
mirror: false
palette: ["farm", "hut"]
# centre y 1.6051 = 23 px above the pivot -> pivot (24, 47), integer
camera: {pitch: 38, scale: 0.055, center: [0, 1.6051, 0]}
shadow: null             # wall piece

# Aldo's hut: herbs drying on a pole.
brief:
  summary: a crooked hazel pole on two wooden pegs under the wall plate, with drying bundles hanging upside
    down on twine - a green herb bunch, a purple lavender bunch, a garlic braid with white bulbs and a
    string of red chilies, slowly swaying
  must_keep: [pole on pegs, 4 distinct bundles (green, purple, white garlic, red chilies), twine ties]
  simplify: [leaves as blended cones, garlic as 4 bulbs, chilies as 3 small cones]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 1.6051, 0] (integer
    pivot). camera.scale/pitch/light untouched. Ramps from palettes/hut.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,47) is the FLOOR point on the back wall's
    face (z 0) below the pole's centre, like the other wall pieces: put the pivot on the wall's floor line.
    The pole is 1.3 wide (~24 px) at height 2.25, just under the wall plate; bundles hang to ~1.6.
    Not blocking. idle loops 8 frames x 160 ms: each bundle sways a little, out of phase (a draught).

materials:
  pole:    {ramp: hbeam, bands: [2, 4]}
  peg:     {ramp: hcut, bands: [1, 2]}
  twine:   {ramp: hlinen, bands: [2, 3], outline: false, line: false}
  herb:    {ramp: hherb, bands: [2, 4]}
  stem:    {ramp: hherb, bands: [1, 2], line: false}
  lav:     {ramp: hlav, bands: [2, 4]}
  garlic:  {ramp: hgarlic, bands: [1, 3]}
  braid:   {ramp: hstraw, bands: [2, 3]}
  chili:   {ramp: hchili, bands: [1, 3]}

channels:
  root: [0, 0, 0]
  s1: 0              # sway of each bundle (radians, z rotation)
  s2: 0
  s3: 0
  s4: 0

bones:
  body: {parent: root}
  b1: {parent: body, pos: [-0.48, 2.22, 0.14], rot: "[0, 0, s1]"}   # green herbs
  b2: {parent: body, pos: [-0.16, 2.23, 0.14], rot: "[0, 0, s2]"}   # lavender
  b3: {parent: body, pos: [0.16, 2.22, 0.14], rot: "[0, 0, s3]"}    # garlic braid
  b4: {parent: body, pos: [0.47, 2.21, 0.14], rot: "[0, 0, s4]"}    # chilies

parts:
  pole:
    material: pole
    space: body
    line: true
    prims:
      - chain: {pts: [[-0.66, 2.27, 0.14], [-0.1, 2.25, 0.14], [0.66, 2.28, 0.14]], r: [0.04, 0.04, 0.035]}
  pegs:
    material: peg
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.58, 2.27, 0.0], b: [-0.58, 2.27, 0.2], r: 0.04}
      - cylinder: {a: [0.58, 2.28, 0.0], b: [0.58, 2.28, 0.2], r: 0.04}

  # ---------- green herbs (b1) ----------
  b1_twine:
    material: twine
    space: b1
    prims:
      - cylinder: {a: [0, 0, 0], b: [0, -0.1, 0], r: 0.015}
      - cylinder: {a: [0, -0.12, 0], b: [0, -0.15, 0], r: 0.045}
  b1_stems:
    material: stem
    space: b1
    prims:
      - cone: {a: [0, -0.1, 0], b: [0, -0.2, 0], r: [0.035, 0.05]}
  b1_leaves:          # sprigs fanning out downward
    material: herb
    space: b1
    line: true
    blend: 0.02
    prims:
      - cone: {a: [0, -0.16, 0.03], b: [-0.17, -0.46, 0.05], r: [0.04, 0.06]}
      - cone: {a: [0, -0.16, 0.03], b: [-0.06, -0.54, 0.06], r: [0.04, 0.06]}
      - cone: {a: [0, -0.16, 0.03], b: [0.07, -0.52, 0.06], r: [0.04, 0.06]}
      - cone: {a: [0, -0.16, 0.03], b: [0.17, -0.44, 0.05], r: [0.04, 0.06]}
  b1_tips:            # darker leaf tips between the sprigs
    material: stem
    space: b1
    prims:
      - sphere: {c: [-0.11, -0.44, 0.1], r: 0.03}
      - sphere: {c: [0.01, -0.5, 0.1], r: 0.03}
      - sphere: {c: [0.12, -0.42, 0.1], r: 0.03}

  # ---------- lavender (b2) ----------
  b2_twine:
    material: twine
    space: b2
    prims:
      - cylinder: {a: [0, 0, 0], b: [0, -0.08, 0], r: 0.015}
      - cylinder: {a: [0, -0.1, 0], b: [0, -0.13, 0], r: 0.04}
  b2_stems:
    material: stem
    space: b2
    prims:
      - cone: {a: [0, -0.08, 0], b: [0, -0.24, 0.01], r: [0.03, 0.05]}
  b2_flowers:         # thin lavender spikes
    material: lav
    space: b2
    line: true
    prims:
      - cone: {a: [0, -0.22, 0.03], b: [-0.13, -0.5, 0.04], r: [0.03, 0.035]}
      - cone: {a: [0, -0.22, 0.04], b: [-0.04, -0.57, 0.05], r: [0.03, 0.035]}
      - cone: {a: [0, -0.22, 0.04], b: [0.05, -0.56, 0.05], r: [0.03, 0.035]}
      - cone: {a: [0, -0.22, 0.03], b: [0.13, -0.49, 0.04], r: [0.03, 0.035]}

  # ---------- garlic braid (b3) ----------
  b3_braid:
    material: braid
    space: b3
    line: true
    prims:
      - chain: {pts: [[0, 0, 0], [0.01, -0.2, 0.01], [-0.01, -0.42, 0.01], [0, -0.58, 0.01]], r: [0.03, 0.04, 0.04, 0.03]}
  b3_bulbs:
    material: garlic
    space: b3
    line: true
    prims:
      - ellipsoid: {c: [-0.07, -0.18, 0.05], r: [0.065, 0.06, 0.06]}
      - ellipsoid: {c: [0.07, -0.29, 0.05], r: [0.065, 0.06, 0.06]}
      - ellipsoid: {c: [-0.06, -0.41, 0.05], r: [0.065, 0.06, 0.06]}
      - ellipsoid: {c: [0.05, -0.53, 0.05], r: [0.06, 0.055, 0.055]}

  # ---------- chilies (b4) ----------
  b4_twine:
    material: twine
    space: b4
    prims:
      - cylinder: {a: [0, 0, 0], b: [0, -0.46, 0.01], r: 0.014}
  b4_chilies:
    material: chili
    space: b4
    line: true
    prims:
      - cone: {a: [0.0, -0.1, 0.02], b: [0.1, -0.24, 0.03], r: [0.04, 0.012]}
      - cone: {a: [0.0, -0.22, 0.03], b: [-0.1, -0.36, 0.04], r: [0.04, 0.012]}
      - cone: {a: [0.0, -0.34, 0.02], b: [0.09, -0.48, 0.03], r: [0.04, 0.012]}
      - cone: {a: [0.0, -0.44, 0.03], b: [-0.03, -0.6, 0.04], r: [0.04, 0.012]}

animations:
  idle:
    frames: 8
    ms: 160
    channels:
      s1: "0.05*sin(p)"
      s2: "0.05*sin(p + 1.6)"
      s3: "0.035*sin(p + 3.1)"
      s4: "0.06*sin(p + 4.4)"
