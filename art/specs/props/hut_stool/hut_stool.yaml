# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: hut_stool
kind: prop
view: topdown
size: 32
directions: 1            # nearly round: one view serves every angle
mirror: false
palette: ["farm", "hut"]
# centre y 0.2094 = 3 px above the pivot -> pivot (16, 19), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.2094, 0]}
shadow: {rx: 7, ry: 3, alpha: 80}

# Aldo's hut: a three-legged milking stool.
brief:
  summary: three-legged stool - a thick round seat cut from a log (scrubbed top, a crack and the growth
    rings faintly showing) on three splayed dark legs whose round ends poke through the seat
  must_keep: [round scrubbed seat, three splayed legs, peg ends through the seat]
  simplify: [rings as one darker circle, crack as a short dark slit]
  exceptions: |
    kind prop, size 32, directions 1, mirror false, camera.center [0, 0.2094, 0] (integer pivot).
    camera.scale/pitch/light untouched. Ramps from palettes/hut.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 16,19) is the floor point under the seat's
    centre. Seat radius 0.26 at height 0.46 (~11 px wide) -> footprint 1x1 tile, blocking (or let a
    sitting character overlap it). Same seat/leg ramps as hut_table and the wash basin stool. Static.

materials:
  seat:    {ramp: hcut, bands: [1, 3]}
  ring:    {ramp: hcut, bands: [1, 1], outline: false, line: false}
  crack:   {ramp: hwood, bands: [1, 1], outline: false, line: false}
  leg:     {ramp: hbeam, bands: [2, 4]}
  peg:     {ramp: hbeam, bands: [3, 3], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  legs:
    material: leg
    space: body
    line: true
    prims:
      - cone: {a: [0.12, 0.42, 0.08], b: [0.22, 0.0, 0.17], r: [0.045, 0.04]}
      - cone: {a: [-0.12, 0.42, 0.08], b: [-0.22, 0.0, 0.17], r: [0.045, 0.04]}
      - cone: {a: [0.0, 0.42, -0.13], b: [0.0, 0.0, -0.26], r: [0.045, 0.04]}
  seat:
    material: seat
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 0.38, 0], b: [0, 0.47, 0], r: 0.26, round: 0.02}
  rings:
    material: ring
    space: body
    prims:
      - torus: {c: [0, 0.472, 0], R: 0.12, r: 0.012}
  crack:
    material: crack
    space: body
    prims:
      - box: {c: [0.14, 0.474, -0.06], half: [0.08, 0.003, 0.012], rot: [0, 0.4, 0]}
  pegs:               # leg ends through the seat
    material: peg
    space: body
    prims:
      - cylinder: {a: [0.12, 0.47, 0.08], b: [0.12, 0.476, 0.08], r: 0.035}
      - cylinder: {a: [-0.12, 0.47, 0.08], b: [-0.12, 0.476, 0.08], r: 0.035}
      - cylinder: {a: [0.0, 0.47, -0.13], b: [0.0, 0.476, -0.13], r: 0.035}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
