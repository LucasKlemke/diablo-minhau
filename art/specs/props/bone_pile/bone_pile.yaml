# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: bone_pile
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 0.4188 = 6 px above the pivot -> pivot (24, 30), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.4188, 0]}
shadow: {rx: 15, ry: 5, alpha: 80}

# Act I dungeon "Porao do Acougueiro" (also usable in any lair): heaps of gnawed bones and skulls.
brief:
  summary: heaps of old yellowed bones and skulls on a dark dried-blood stain; three looks - a big heap with
    three skulls, a small scatter with one skull, and a heap with a ribcage and a skull
  must_keep: [knobbed long bones, round skulls with dark eye sockets, dark stain under them, low silhouette]
  simplify: [bones as rods with two knobs, skull as a sphere plus a jaw box, ribs as half rings]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, camera.center [0, 0.4188, 0] (integer pivot).
    camera.scale/pitch/light untouched. Ramps from palettes ruin/hut plus spec-local bone and stain.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,30) is the ground point at the centre of the
    heap. v0 ~1.4 wide (2x1 tiles), v1 ~1.1 wide (1x1, low: could be walkable), v2 ~1.3 wide (2x1), blocking.
    Clips: idle (= variant 0) and `variants` (3 frames, frame i = variant i). Layout generated once from a
    seeded script.

ramps:
  bp_bone:  ["#1c0f1a", "#7a6a50", "#b0a080", "#d8ccaa", "#f0e8cc"]
  bp_stain: ["#1c0f1a", "#2e0a10"]

materials:
  bone:   {ramp: bp_bone, bands: [1, 3]}
  skull:  {ramp: bp_bone, bands: [2, 4]}
  socket: {ramp: riron, bands: [1, 1], outline: false, line: false}
  stain:  {ramp: bp_stain, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]
  v: 0

bones:
  body: {parent: root}

