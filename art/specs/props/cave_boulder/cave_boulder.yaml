spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: cave_boulder
kind: prop
view: topdown
size: 64
directions: 1            # static scenery, faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.8376, 0]}   # 12 px above the pivot -> pivot (32, 44)
shadow: null             # each variant draws its own ground shadow

# Caverna dos Morcegos: big fallen cave rocks that block passages.
brief:
  summary: heavy rounded cave boulders of damp brown-grey rock with flat fracture faces, a few pale mineral
    streaks and dark cracks; three variants - one huge boulder, a boulder split in two, a rockfall heap
  must_keep: [massive rounded silhouette, flat broken facets, dark cracks, same rock as stalagmite]
  simplify: [facets as rounded boxes, cracks as dark flat strips]
  exceptions: |
    kind prop, size 64, directions 1, mirror false; camera.center [0, 0.8376, 0] (integer pivot);
    shadow null (each variant has a flat dark ellipse part). camera.scale/pitch/light untouched.
    Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,44) is the ground point at the centre of
    the base. VARIANTS: animation `variants` has 3 frames (frame i = variant i); `idle` = variant 0.
    0 huge boulder (blocks 2x2), 1 split boulder (blocks 2x1), 2 rockfall heap (blocks 3x2).
    Same rock ramps as stalagmite so the cave set reads as one material.

ramps:
  cb_rock:   ["#1c0f1a", "#2c2426", "#433834", "#5e5048", "#7c6c5e"]
  cb_vein:   ["#1c0f1a", "#5e5650", "#8a8072", "#b0a490"]
  cb_crack:  ["#1c0f1a", "#18100f"]
  cb_shadow: ["#1c0f1a", "#141012"]

materials:
  rock:   {ramp: cb_rock, bands: [1, 4]}
  vein:   {ramp: cb_vein, bands: [1, 2], line: false, outline: false}
  crack:  {ramp: cb_crack, emissive: true, band: 1, outline: false, line: false}
  shadow: {ramp: cb_shadow, emissive: true, band: 1, outline: false, line: false}

channels:
  root: [0, 0, 0]
  var: 0             # variant 0..2

bones:
  body: {parent: root}

parts:
  # ---------------- 0: one huge boulder ----------------
  shadow0:
    when: "var < 0.5"
    material: shadow
    space: body
    prims:
      - ellipsoid: {c: [0.08, 0.0, 0.08], r: [1.05, 0.01, 0.80]}
  boulder0:
    when: "var < 0.5"
    material: rock
    space: body
    line: true
    blend: 0.10
    prims:
      - box: {c: [0, 0.62, 0], half: [0.78, 0.62, 0.62], rot: [0.1, 0.35, 0.08], round: 0.34}
      - box: {c: [-0.30, 1.05, -0.10], half: [0.45, 0.30, 0.42], rot: [0.2, 0.9, -0.15], round: 0.18}
      - box: {c: [0.62, 0.28, 0.30], half: [0.32, 0.28, 0.30], rot: [0, -0.5, 0.1], round: 0.12}
  vein0:
    when: "var < 0.5"
    material: vein
    space: body
    prims:
      - box: {c: [-0.20, 0.80, 0.60], half: [0.30, 0.025, 0.04], rot: [0, 0.35, 0.35]}
      - box: {c: [0.30, 1.10, 0.25], half: [0.20, 0.02, 0.04], rot: [0.3, 0.35, -0.2]}
  crack0:
    when: "var < 0.5"
    material: crack
    space: body
    prims:
      - box: {c: [0.22, 0.55, 0.66], half: [0.025, 0.28, 0.03], rot: [0, 0.35, 0.3]}
      - box: {c: [0.36, 0.30, 0.66], half: [0.025, 0.14, 0.03], rot: [0, 0.35, -0.5]}
  pebbles0:
    when: "var < 0.5"
    material: rock
    space: body
    line: true
    prims:
      - box: {c: [-0.85, 0.07, 0.55], half: [0.10, 0.07, 0.09], rot: [0, 0.5, 0], round: 0.03}
      - box: {c: [0.95, 0.06, 0.70], half: [0.08, 0.06, 0.07], rot: [0, -0.3, 0], round: 0.03}

  # ---------------- 1: split boulder ----------------
  shadow1:
    when: "abs(var - 1) < 0.5"
    material: shadow
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.0, 0.05], r: [1.20, 0.01, 0.60]}
  half_a1:
    when: "abs(var - 1) < 0.5"
    material: rock
    space: body
    line: true
    blend: 0.08
    prims:
      - box: {c: [-0.50, 0.50, 0], half: [0.48, 0.50, 0.50], rot: [0.05, 0.3, 0.18], round: 0.28}
    cut:
      - box: {c: [0.35, 0.5, 0], half: [0.40, 1.0, 1.0], rot: [0, 0, 0.18]}
  half_b1:
    when: "abs(var - 1) < 0.5"
    material: rock
    space: body
    line: true
    blend: 0.08
    prims:
      - box: {c: [0.48, 0.42, 0.05], half: [0.48, 0.42, 0.48], rot: [0.05, -0.3, -0.22], round: 0.26}
    cut:
      - box: {c: [-0.35, 0.5, 0], half: [0.40, 1.0, 1.0], rot: [0, 0, -0.22]}
  split_dark1:       # the dark gap between the halves
    when: "abs(var - 1) < 0.5"
    material: crack
    space: body
    prims:
      - box: {c: [0.0, 0.40, 0.10], half: [0.08, 0.40, 0.42], rot: [0, 0, 0]}
  vein1:
    when: "abs(var - 1) < 0.5"
    material: vein
    space: body
    prims:
      - box: {c: [-0.55, 0.62, 0.48], half: [0.22, 0.025, 0.03], rot: [0, 0.3, 0.3]}
      - box: {c: [0.55, 0.40, 0.50], half: [0.18, 0.025, 0.03], rot: [0, -0.3, -0.2]}
  chips1:
    when: "abs(var - 1) < 0.5"
    material: rock
    space: body
    line: true
    prims:
      - box: {c: [0.05, 0.07, 0.62], half: [0.10, 0.07, 0.08], rot: [0, 0.6, 0], round: 0.03}
      - box: {c: [-0.18, 0.05, 0.78], half: [0.07, 0.05, 0.06], rot: [0, -0.3, 0], round: 0.02}

  # ---------------- 2: rockfall heap ----------------
  shadow2:
    when: "var > 1.5"
    material: shadow
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.0, 0.05], r: [1.55, 0.01, 0.85]}
  heap2:
    when: "var > 1.5"
    material: rock
    space: body
    line: true
    blend: 0.03
    prims:
      - box: {c: [-0.05, 0.55, -0.20], half: [0.55, 0.50, 0.48], rot: [0.15, 0.45, 0.1], round: 0.24}     # big back rock
      - box: {c: [-0.85, 0.36, 0.0], half: [0.42, 0.36, 0.38], rot: [0.1, -0.5, 0.2], round: 0.18}
      - box: {c: [0.82, 0.32, -0.05], half: [0.40, 0.32, 0.36], rot: [0, 0.7, -0.15], round: 0.16}
      - box: {c: [0.20, 0.25, 0.45], half: [0.32, 0.25, 0.26], rot: [0.1, -0.3, 0.1], round: 0.12}
      - box: {c: [-0.45, 0.16, 0.55], half: [0.20, 0.16, 0.18], rot: [0, 0.8, 0], round: 0.08}
      - box: {c: [0.30, 1.02, -0.30], half: [0.28, 0.22, 0.26], rot: [0.3, 0.2, 0.4], round: 0.10}      # rock on top
      - box: {c: [1.25, 0.10, 0.45], half: [0.12, 0.10, 0.10], rot: [0, 0.4, 0], round: 0.03}
      - box: {c: [-1.30, 0.08, 0.50], half: [0.10, 0.08, 0.09], rot: [0, -0.2, 0], round: 0.03}
  vein2:
    when: "var > 1.5"
    material: vein
    space: body
    prims:
      - box: {c: [-0.10, 0.75, 0.25], half: [0.28, 0.025, 0.03], rot: [0, 0.45, 0.25]}
      - box: {c: [0.85, 0.48, 0.30], half: [0.16, 0.025, 0.03], rot: [0, 0.7, -0.2]}
  crack2:
    when: "var > 1.5"
    material: crack
    space: body
    prims:
      - box: {c: [-0.82, 0.38, 0.38], half: [0.025, 0.22, 0.03], rot: [0, -0.5, 0.35]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {var: 0}
  variants:
    frames: 3
    ms: 1000
    channels: {var: "f"}
