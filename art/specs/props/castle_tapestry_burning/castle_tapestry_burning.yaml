# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_tapestry_burning
kind: prop
view: topdown
size: 64
directions: 1            # faces the camera (s): hangs on the hall's north wall
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.6751, 0]}   # 24 px above the pivot -> pivot (32, 56), as castle_tapestry
shadow: null             # hangs on the wall

# Prologue (the burning castle): the royal tapestry of Minhau on fire, then its charred remains.
brief:
  summary: castle_tapestry burning from the bottom up - the V tip and tassel are gone, the royal-blue cloth ends
    in a jagged charred edge just under the gold cat crest, and a row of flames licks up from that edge with
    embers rising; `burnt` keeps only the gold rod with a ragged strip of scorched cloth and a few glowing
    sparks along its edge
  must_keep: [same rod, trim, colours and crest as castle_tapestry, jagged black burn edge, flames along it]
  simplify: [burn line as a jagged cut with a charred band under it, flames as swaying tapered chains]
  exceptions: |
    Same frame, camera and pivot as castle_tapestry (size 64, camera.center [0, 1.6751, 0], pivot (32, 56)),
    so it swaps in place. Flames are emissive (farm `fire` ramp), no outline. camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: identical to castle_tapestry (pivot = ground point under it on the wall line; footprint 0).
    Channel `burn` moves the burn line (1.55 + 1.3*burn) from 1.55 (burning, `idle`: 8-frame loop at 90 ms) to 2.85 (`burnt`:
    1 frame, flames off). Swap castle_tapestry -> castle_tapestry_burning (idle) when the fire reaches it, then
    play `burnt` when it burns out. Every flame motion is periodic in p (seamless loop).

ramps:
  tp_blue:  ["#1c0f1a", "#1e2978", "#2c60d5", "#5f93ea", "#a8cff3"]
  tp_gold:  ["#1c0f1a", "#804a19", "#e1a227", "#eddc83", "#f8f4dd"]
  bc_char:  ["#1c0f1a", "#1f1416", "#3a2420", "#5a3626"]

materials:
  cloth: {ramp: tp_blue, bands: [1, 3]}
  fold:  {ramp: tp_blue, bands: [1, 1], outline: false, line: false}
  fold_hi: {ramp: tp_blue, bands: [3, 3], outline: false, line: false}
  ring:  {ramp: tp_gold, bands: [3, 3], outline: false, line: false}
  gold:  {ramp: tp_gold, bands: [2, 4]}
  arms:  {ramp: tp_gold, bands: [2, 3], outline: false, line: false}
  eye:   {ramp: tp_blue, bands: [1, 1], outline: false, line: false}
  outer: {ramp: fire, emissive: true, band: 0, outline: false, glow: {color: "#fe6607", mix: 0.3, radius: 1}}
  mid:   {ramp: fire, emissive: true, band: 1, outline: false}
  inner: {ramp: fire, emissive: true, band: 2, outline: false}
  core:  {ramp: fire, emissive: true, band: 3, outline: false}
  ember: {ramp: fire, emissive: true, band: 2, outline: false}
  glowing: {ramp: fire, emissive: true, band: 1, outline: false}
  char:  {ramp: bc_char, bands: [1, 2]}

channels:
  root: [0, 0, 0]
  burn: 0            # 0 burning, 1 burnt

bones:
  body: {parent: root}
  edge: {parent: body, pos: "[0, (1.55 + 1.3*burn) - 0.06, 0.12]"}     # flames rise from the burn line

