spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: glow_mushrooms
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.4188, 0]}   # 6 px above the pivot -> pivot (24, 30)
shadow: null             # the light pool under them replaces the shadow

# Caverna dos Morcegos: bioluminescent mushrooms, the only light in the cave.
brief:
  summary: a clump of six cave mushrooms on slender pale stems, domed caps glowing teal-cyan with brighter
    spots, a soft teal light pool on the floor around them; the glow breathes slowly
  must_keep: [emissive teal caps (the accent), pale stems, one tall + several small, light pool on the floor,
    slow pulse]
  simplify: [spots as 1 px dots, no gills]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null; camera.center [0, 0.4188, 0] (integer
    pivot). Emissive caps without outline (magic/light accent per the style notes). camera.scale/pitch/light
    untouched.
  decisions: |
    PIVOT CONTRACT: pivot (24, 30) = ground point at the centre of the clump. Walkable decoration (about
    1x1 tile); the game may put a teal point light on it (the sprite's emissive map has the caps).
    `idle` is an 8-frame slow pulse (1.6 s loop): the light pool grows and shrinks and the caps switch
    between a dim and a bright tone at the peak.

ramps:
  gm_stem:  ["#1c0f1a", "#3e4a5a", "#6a7a88", "#9aaab4"]
  gm_cap:   ["#0c2a34", "#11545e", "#1f8c8c", "#3ccfc0", "#9cf5e4"]
  gm_pool:  ["#0c1a20", "#143236", "#1c4a4a"]
  gm_spot:  ["#1c0f1a", "#dffff6"]

materials:
  stem:     {ramp: gm_stem, bands: [1, 3]}
  cap:      {ramp: gm_cap, emissive: true, band: 2, outline: false, line: false, glow: {color: "#3ccfc0", mix: 0.35, radius: 1}}
  cap_hi:   {ramp: gm_cap, emissive: true, band: 3, outline: false, line: false, glow: {color: "#6ae8d8", mix: 0.45, radius: 1}}
  rim:      {ramp: gm_cap, emissive: true, band: 1, outline: false, line: false}
  spot:     {ramp: gm_spot, emissive: true, band: 1, outline: false, line: false}
  pool:     {ramp: gm_pool, emissive: true, band: 1, outline: false, line: false}
  pool_hi:  {ramp: gm_pool, emissive: true, band: 2, outline: false, line: false}

channels:
  root: [0, 0, 0]
  glow: 0.5          # 0 dim .. 1 bright

bones:
  body: {parent: root}

# Mushrooms (stem base x,z ; cap centre height ; cap radius):
#   A tall  ( 0.05,-0.10) 0.72 0.24   B mid (-0.30, 0.05) 0.48 0.18   C mid (0.34, 0.02) 0.42 0.16
#   D small (-0.10, 0.30) 0.26 0.12   E small (0.22, 0.30) 0.20 0.10  F tiny (-0.48, 0.28) 0.16 0.08
parts:
  pool:
    material: pool
    space: body
    prims:
      - ellipsoid: {c: [0, 0.002, 0.08], r: ["0.52 + 0.10*glow", 0.003, "0.34 + 0.07*glow"]}
  pool_hi:
    material: pool_hi
    space: body
    prims:
      - ellipsoid: {c: [0, 0.004, 0.10], r: ["0.34 + 0.12*glow", 0.003, "0.24 + 0.08*glow"]}
  stems:
    material: stem
    space: body
    blend: 0.03
    prims:
      - cone: {a: [0.05, 0, -0.10], b: [0.02, 0.66, -0.12], r: [0.07, 0.045]}
      - cone: {a: [-0.30, 0, 0.05], b: [-0.36, 0.43, 0.04], r: [0.055, 0.035]}
      - cone: {a: [0.34, 0, 0.02], b: [0.40, 0.37, 0.02], r: [0.05, 0.035]}
      - cone: {a: [-0.10, 0, 0.30], b: [-0.12, 0.22, 0.30], r: [0.04, 0.03]}
      - cone: {a: [0.22, 0, 0.30], b: [0.24, 0.17, 0.30], r: [0.035, 0.025]}
      - cone: {a: [-0.48, 0, 0.28], b: [-0.50, 0.13, 0.28], r: [0.03, 0.022]}
  rims:              # darker undersides (read the dome shape)
    material: rim
    space: body
    prims:
      - ellipsoid: {c: [0.02, 0.68, -0.12], r: [0.24, 0.05, 0.22]}
      - ellipsoid: {c: [-0.36, 0.45, 0.04], r: [0.18, 0.04, 0.16]}
      - ellipsoid: {c: [0.40, 0.39, 0.02], r: [0.16, 0.04, 0.14]}
      - ellipsoid: {c: [-0.12, 0.24, 0.30], r: [0.12, 0.03, 0.11]}
      - ellipsoid: {c: [0.24, 0.18, 0.30], r: [0.10, 0.03, 0.09]}
      - ellipsoid: {c: [-0.50, 0.14, 0.28], r: [0.08, 0.025, 0.07]}
  caps:
    material: cap
    space: body
    when: "glow < 0.7"
    prims: &caps
      - ellipsoid: {c: [0.02, 0.74, -0.12], r: [0.24, 0.16, 0.22]}
      - ellipsoid: {c: [-0.36, 0.50, 0.04], r: [0.18, 0.12, 0.16]}
      - ellipsoid: {c: [0.40, 0.43, 0.02], r: [0.16, 0.11, 0.14]}
      - ellipsoid: {c: [-0.12, 0.27, 0.30], r: [0.12, 0.08, 0.11]}
      - ellipsoid: {c: [0.24, 0.21, 0.30], r: [0.10, 0.07, 0.09]}
      - ellipsoid: {c: [-0.50, 0.16, 0.28], r: [0.08, 0.06, 0.07]}
    cut:
      - box: {c: [0, 0.20, 0], half: [1, 0.005, 1]}
  caps_hi:
    material: cap_hi
    space: body
    when: "glow >= 0.7"
    prims: *caps
  spots:
    material: spot
    space: body
    prims:
      - sphere: {c: [-0.10, 0.84, 0.02], r: 0.04}
      - sphere: {c: [0.14, 0.76, 0.06], r: 0.025}
      - sphere: {c: [-0.30, 0.58, 0.08], r: 0.03}

animations:
  idle:
    frames: 8
    ms: 200
    channels: {glow: "0.5 + 0.5*sin(p)"}
