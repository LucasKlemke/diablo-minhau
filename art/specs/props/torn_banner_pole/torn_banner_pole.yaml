spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: torn_banner_pole
kind: prop
view: topdown
size: 64
directions: 1            # faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.3959, 0]}   # 20 px above the pivot -> pivot (32, 52)
shadow: {rx: 5, ry: 2, alpha: 120}

# Estrada dos Bandidos: a pole along the old royal road with a torn election banner.
brief:
  summary: tall crooked wooden pole along the old royal road, leaning a little, with a crossbar at the top
    from which hangs a torn green-and-yellow election banner (a yellow lozenge on green), ripped diagonally
    so a long tatter flaps loose and the lower corner is gone; a few nails and a second shred tied lower
    on the pole
  must_keep: [tall leaning pole with crossbar, green banner with the yellow lozenge, diagonal rip and ragged
    edge, loose tatter that flutters]
  simplify: [no lettering; the lozenge and a yellow stripe read as election colours]
  exceptions: |
    kind prop, size 64, directions 1, mirror false; camera.center [0, 1.3959, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,52) is the ground point at the foot of the
    pole. Footprint 1 tile, blocking only at the foot. Same banner ramps as podium_carts.
    idle: 4 frames at 160 ms (snappy), the banner and the tatter swing a few degrees about the crossbar.

ramps:
  tb_wood:   ["#1c0f1a", "#33261f", "#4e3c2e", "#6a543e", "#86704e"]
  tb_green:  ["#1c0f1a", "#163a1e", "#225426", "#367030"]
  tb_yellow: ["#1c0f1a", "#8a6a18", "#b8901e", "#d4b03a"]
  tb_rope:   ["#1c0f1a", "#5e4a30", "#8a7048"]

materials:
  wood:   {ramp: tb_wood, bands: [1, 4]}
  green:  {ramp: tb_green, bands: [1, 3], two_sided: true}
  yellow: {ramp: tb_yellow, bands: [1, 3], line: false, outline: false}
  rope:   {ramp: tb_rope, bands: [1, 2], line: false}

channels:
  root: [0, 0, 0]
  sw: 0             # banner swing (rad, about the crossbar)
  tat: 0            # tatter swing (rad)

bones:
  body:   {parent: root}
  top:    {parent: body, pos: [0.10, 2.22, 0], rot: [0, 0, -0.04]}
  banner: {parent: top, pos: [0.02, -0.02, 0.06], rot: "[sw, 0, 0]"}
  tatter: {parent: banner, pos: [0.30, -0.70, 0.0], rot: "[tat, 0, 0.35 + tat]"}

parts:
  pole:
    material: wood
    space: body
    line: true
    blend: 0.03
    prims:
      - chain: {pts: [[0, 0, 0], [0.04, 0.8, 0], [0.06, 1.6, 0], [0.10, 2.36, 0]], r: [0.075, 0.065, 0.06, 0.05]}
      - cone: {a: [0, 0.06, 0], b: [0.18, 0.0, 0.08], r: [0.06, 0.02]}
      - cone: {a: [0, 0.06, 0], b: [-0.16, 0.0, 0.06], r: [0.06, 0.02]}
  crossbar:
    material: wood
    space: top
    line: true
    prims:
      - cylinder: {a: [-0.52, 0, 0.02], b: [0.52, 0.02, 0.02], r: 0.04}
  lashing:
    material: rope
    space: top
    prims:
      - cylinder: {a: [0, -0.06, 0.0], b: [0, 0.06, 0.0], r: 0.075}
      - cylinder: {a: [-0.10, -1.30, -0.06], b: [-0.08, -1.18, -0.06], r: 0.07}
  banner:            # torn diagonally: the right lower part is gone
    material: green
    space: banner
    line: true
    prims:
      - tri: {a: [-0.48, 0, 0], b: [0.48, 0, 0], c: [-0.48, -1.28, 0], th: 0.02}
      - tri: {a: [0.48, 0, 0], b: [0.48, -0.55, 0], c: [-0.10, -0.80, 0], th: 0.02}
      - tri: {a: [-0.48, -1.20, 0], b: [-0.28, -1.10, 0], c: [-0.40, -1.42, 0], th: 0.02}   # ragged tongue
      - tri: {a: [-0.22, -0.98, 0], b: [0.0, -0.84, 0], c: [-0.16, -1.16, 0], th: 0.02}
  lozenge:
    material: yellow
    space: banner
    prims:
      - box: {c: [-0.14, -0.46, 0.03], half: [0.15, 0.15, 0.01], rot: [0, 0, 0.785]}
      - box: {c: [0, -0.10, 0.03], half: [0.46, 0.028, 0.01]}
  tatter:            # a loose strip of banner flapping from the rip
    material: green
    space: tatter
    line: true
    prims:
      - tri: {a: [-0.06, 0.12, 0], b: [0.06, 0.12, 0], c: [0.02, -0.62, 0.0], th: 0.02}
  shred:             # second shred tied lower on the pole
    material: yellow
    space: top
    prims:
      - tri: {a: [-0.06, -1.24, -0.02], b: [0.30, "-1.30 - 0.6*tat", 0.06], c: [-0.02, -1.36, -0.02], th: 0.02}

animations:
  idle:
    frames: 4
    ms: 160
    channels:
      sw: "0.10*sin(p)"
      tat: "0.22*sin(p + 1.2)"
