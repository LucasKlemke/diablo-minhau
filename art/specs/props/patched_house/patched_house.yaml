# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: patched_house
kind: prop
view: topdown
size: 128
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 2.5127 = 36 px above the pivot -> pivot (64, 100), integer
camera: {pitch: 38, scale: 0.055, center: [0, 2.5127, 0]}
shadow: {rx: 44, ry: 10, alpha: 80}

# Act I, Minhau: a house that survived the raid, patched up and lived in (replaces generic houses).
brief:
  summary: the same cottage plan as `house`, ten years after the war - weathered grey plank walls in a dark
    timber frame, the gable roof of old dark wooden shingles with missing ones, a big dirty canvas tarp
    tied over the left slope with ropes and stone weights; mismatched brown boards nailed across the
    walls, a canvas patch on the gable, the left window half boarded with warm firelight inside, a
    mended door with a newer plank, a stone chimney with a thin plume of smoke; a woodpile by the door
  must_keep: [same footprint and silhouette family as house, grey weathered planks, dark shingle roof,
    canvas tarp with ropes and stones, nailed patch boards, lit window (inhabited), smoking chimney]
  simplify: [shingles as courses plus a few cross grooves (house's layout), planks as lines,
    smoke as 4 round puffs]
  exceptions: |
    kind prop, size 128, directions 1, mirror false, camera.center [0, 2.5127, 0] (integer pivot).
    The window light is emissive (hearth fire inside: the warm accent); smoke has no outline.
    camera.scale/pitch/light untouched. Ramps from palettes/ruin.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT (same as house): world origin (= exported pivot, frame px 64,100) is the ground point
    at the centre of the FRONT wall's base. Walls x -1.75..1.75, z -2.64..0, eaves to x +-2.2: footprint
    5x3 tiles, blocking all 15, placed exactly like house. Door at x +0.70 (+13 px), like house.
    Clip idle: 8 frames x 140 ms, only the chimney smoke moves (puffs rise, grow, drift right, fade).

materials:
  wall:    {ramp: rplank, bands: [2, 4]}
  plank_ln: {ramp: rplank, bands: [1, 1], outline: false, line: false}
  timber:  {ramp: rwood, bands: [1, 3]}
  patch:   {ramp: rwood, bands: [3, 5]}
  roof:    {ramp: rwood, bands: [1, 3]}
  roof_ln: {ramp: rchar, bands: [2, 2], outline: false, line: false}
  gap:     {ramp: rchar, bands: [1, 1], outline: false, line: false}
  tarp:    {ramp: rcanvas, bands: [2, 4], two_sided: true}
  rope:    {ramp: rrope, bands: [2, 3], outline: false}
  stone:   {ramp: rstone, bands: [2, 4]}
  mortar:  {ramp: rstone, bands: [1, 1], outline: false, line: false}
  soot:    {ramp: rchar, bands: [1, 2]}
  door:    {ramp: rwood, bands: [2, 4]}
  iron:    {ramp: riron, bands: [1, 3]}
  lamp:    {ramp: rlamp, emissive: true, band: 3, outline: false, line: false, glow: {color: "#f0a040", mix: 0.4, radius: 1}}
  lamp_hi: {ramp: rlamp, emissive: true, band: 4, outline: false, line: false}
  smoke:   {ramp: rsmoke, bands: [2, 4], outline: false, line: false}
  logend:  {ramp: hcut, bands: [1, 2]}
  log:     {ramp: rwood, bands: [2, 4]}
  mud:     {ramp: rmud, bands: [2, 3], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

