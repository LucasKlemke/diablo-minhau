      - box: {c: [0.283, 3.733, -2.40], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.813, 3.202, -0.30], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.813, 3.202, -0.90], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [0.813, 3.202, -1.50], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
