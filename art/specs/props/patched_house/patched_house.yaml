      - box: {c: [0.813, 3.202, -2.70], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
      - box: {c: [1.344, 2.672, 0.00], half: [0.37, 0.02, 0.03], rot: [0, 0, -0.7854]}
