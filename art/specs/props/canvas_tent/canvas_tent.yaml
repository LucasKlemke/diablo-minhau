# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: canvas_tent
kind: prop
view: topdown
size: 64
directions: 1            # entrance faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.4886, 0]}   # 7 px above the pivot -> pivot (32, 39)
shadow: {rx: 22, ry: 8, alpha: 80}

# Ruined village: a torn canvas tent of the refugees.
brief:
  summary: ridge tent of dirty beige canvas on two wooden poles, entrance facing the camera with the left
    flap tied back and the right one hanging, dark inside; a long rip on the right slope with a torn flap,
    two darker patches sewn on, guy ropes to wooden stakes, the ridge pole tips sticking out
  must_keep: [A-frame canvas, dark open entrance, rip with a dangling flap, patches, poles and ropes]
  simplify: [canvas as flat planes, ropes as 1 px lines, no seams]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, camera.center [0, 0.4886, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,39) is the ground point at the tent's centre.
    Tent 2.0 wide, 2.2 long (ridge along z), 1.4 tall; with ropes ~2.6 x 2.8 -> footprint 2x2 tiles,
    blocking (stakes are decoration). Static: 1-frame idle.

ramps:
  ct_canvas: ["#1c0f1a", "#7a6a50", "#a8946e", "#cbb890", "#e2d4ae"]
  ct_patch:  ["#1c0f1a", "#5a5040", "#7a6a50", "#968466"]
  ct_dark:   ["#1c0f1a", "#1f1612", "#2e221c", "#3a2c24"]
  ct_wood:   ["#1c0f1a", "#4a2c1c", "#6e4a2c", "#8f6a42"]
  ct_rope:   ["#1c0f1a", "#8a7454", "#b4a07a"]

materials:
  canvas: {ramp: ct_canvas, bands: [1, 4], two_sided: true}
  patch:  {ramp: ct_patch, bands: [1, 3], outline: false}
  dark:   {ramp: ct_dark, bands: [1, 2], line: false}
  wood:   {ramp: ct_wood, bands: [1, 3]}
  rope:   {ramp: ct_rope, bands: [1, 2], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  inside:             # dark interior behind the entrance
    material: dark
    space: body
    prims:
      - tri: {a: [-0.95, 0.0, 0.9], b: [0.95, 0.0, 0.9], c: [0, 1.38, 0.9], th: 0.02}
  slope_L:            # roof slopes (x > 0 is screen right)
    material: canvas
    space: body
    line: true
    prims:
      - box: {c: [0.5, 0.69, 0], half: [0.86, 0.025, 1.1], rot: [0, 0, -0.95]}
    cut:
      - box: {c: [0.62, 0.62, 0.15], half: [0.07, 0.06, 0.55], rot: [0, 0.2, -0.95]}   # the rip
  slope_R:
    material: canvas
    space: body
    line: true
    prims:
      - box: {c: [-0.5, 0.69, 0], half: [0.86, 0.025, 1.1], rot: [0, 0, 0.95]}
  back_wall:
    material: canvas
    space: body
    line: true
    prims:
      - tri: {a: [-1.0, 0.0, -1.08], b: [1.0, 0.0, -1.08], c: [0, 1.4, -1.08], th: 0.02}
  flap_tied:          # left entrance flap, tied back against the slope
    material: canvas
    space: body
    line: true
    prims:
      - tri: {a: [-1.0, 0.0, 1.1], b: [-0.45, 0.62, 1.12], c: [-0.75, 0.0, 1.15], th: 0.025}
  flap_hanging:       # right flap hangs half across the entrance
    material: canvas
    space: body
    line: true
    prims:
      - tri: {a: [0.0, 1.38, 1.1], b: [0.95, 0.0, 1.1], c: [0.3, 0.05, 1.14], th: 0.025}
  torn_flap:          # strip of canvas dangling from the rip
    material: canvas
    space: body
    line: true
    prims:
      - box: {c: [0.88, 0.42, 0.42], half: [0.07, 0.02, 0.2], rot: [0.2, 0.3, -1.3]}
  rip_dark:
    material: dark
    space: body
    prims:
      - box: {c: [0.6, 0.6, 0.15], half: [0.06, 0.03, 0.5], rot: [0, 0.2, -0.95]}
  patches:
    material: patch
    space: body
    prims:
      - box: {c: [-0.45, 0.78, -0.45], half: [0.2, 0.02, 0.18], rot: [0, 0, 0.95]}
      - box: {c: [0.35, 0.92, -0.6], half: [0.14, 0.02, 0.14], rot: [0, 0, -0.95]}
  poles:
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 0, 1.12], b: [0, 1.62, 1.12], r: 0.04}
      - cylinder: {a: [0, 0, -1.12], b: [0, 1.62, -1.12], r: 0.04}
      - cylinder: {a: [0, 1.42, -1.2], b: [0, 1.42, 1.2], r: 0.035}
  stakes:
    material: wood
    space: body
    line: true
    prims:
      - cone: {a: [0, 0, 1.7], b: [0, 0.18, 1.7], r: [0.04, 0.03]}
      - cone: {a: [0, 0, -1.6], b: [0, 0.18, -1.6], r: [0.04, 0.03]}
      - cone: {a: [1.25, 0, 0.6], b: [1.25, 0.15, 0.6], r: [0.035, 0.03]}
      - cone: {a: [-1.25, 0, -0.6], b: [-1.25, 0.15, -0.6], r: [0.035, 0.03]}
  ropes:
    material: rope
    space: body
    prims:
      - cylinder: {a: [0, 1.6, 1.12], b: [0, 0.16, 1.7], r: 0.022}
      - cylinder: {a: [0, 1.6, -1.12], b: [0, 0.16, -1.6], r: 0.022}
      - cylinder: {a: [0.75, 0.35, 0.6], b: [1.25, 0.13, 0.6], r: 0.022}
      - cylinder: {a: [-0.75, 0.35, -0.6], b: [-1.25, 0.13, -0.6], r: 0.022}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
