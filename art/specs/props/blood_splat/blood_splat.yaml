# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: blood_splat
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}   # pivot = frame centre (24, 24) = the ground point
shadow: null             # a decal on the ground

# Prologue (castle massacre): blood pools and splashes on the white marble floor.
brief:
  summary: dark, glossy blood on the floor - pools with a darker rim, a brighter wet core and a white-pink
    glint, splashes with streaks radiating out and ending in drops, a dragged trail, loose droplets around
  must_keep: [dark crimson that reads on white marble, darker rim, wet glint, 8 different silhouettes]
  simplify: [flat decals (no relief), 4 exact colours]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 0, 0]. No dark outline: a
    decal outlined in near-black looked like a hole in the floor; the rim is a dark blood red instead.
    Flat colours (1-tone ramps). camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (24, 24) = frame centre = the ground point under the pool. Draw it on the floor layer
    (below actors and props, above the floor tiles). VARIANTS: animation `variants` has 8 frames (frame i =
    variant i): 0/4 big pools, 1/5 splashes with streaks, 2/6 small pool with a dragged trail, 3/7 spatter
    bursts; `idle` = variant 0. Geometry generated once from a seeded random layout (flat ellipsoids).

ramps:
  bl_edge:  ["#1c0f1a", "#4e0710"]
  bl_pool:  ["#1c0f1a", "#86101a"]
  bl_mid:   ["#1c0f1a", "#b41a20"]
  bl_shine: ["#1c0f1a", "#f07a6a"]

materials:
  edge:  {ramp: bl_edge, bands: [1, 1], outline: false, line: false}
  pool:  {ramp: bl_pool, bands: [1, 1], outline: false, line: false}
  mid:   {ramp: bl_mid, bands: [1, 1], outline: false, line: false}
  shine: {ramp: bl_shine, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]
  var: 0             # variant 0..7

bones:
  body: {parent: root}

