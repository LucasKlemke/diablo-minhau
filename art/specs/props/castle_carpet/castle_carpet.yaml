# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_carpet
kind: prop
view: topdown
size: 128                # 48 x ~118 px on screen (rug 112 px + fringe), 2+ px margins
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}
shadow: null             # lies flat on the floor

# Prologue: the long embroidered rug running from the hall towards the throne.
brief:
  summary: long Persian runner, deep red field with a wide gold border, a dark-red inner line, a big gold
    diamond medallion with a royal-blue heart in the centre, two smaller medallions towards the ends, small
    gold corner diamonds and gold fringe tassels on both short ends; 3 x 7 world tiles (48 x 112 px)
  must_keep: [red field, gold border, central medallion with blue heart, fringe on the short ends]
  simplify: [embroidery as nested diamonds and lines, no fine arabesques (they vanish at this size)]
  exceptions: |
    kind prop, size 128, directions 1, mirror false, shadow null, camera.center [0, 0, 0].
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame centre 64,64) is the CENTRE of the rug on the floor.
    The rug runs along the screen's vertical axis (towards the throne, which goes above its top end):
    48 px wide (3 tiles) x 112 px long (7 tiles), fringe 3 px more at each end -> footprint 3x7 tiles,
    walkable (floor layer, drawn under everything). The pattern lives in the bone `rug`, scaled 1.6243 in z
    (= 1 / sin 38) so positions are screen-proportional; diamonds are pairs of `tri` (their vertices scale
    with the bone, a rotated box would not) so they stay square on screen.
    A rug 3 x 7 is the base piece; place two end to end for a longer aisle (fringe overlaps).
    Static: 1-frame idle.

ramps:
  cc_red:   ["#1c0f1a", "#6e1d24", "#a82a28", "#c13a2b", "#e0664a"]
  cc_dark:  ["#1c0f1a", "#4a1018", "#6e1d24", "#7f2228"]
  cc_gold:  ["#1c0f1a", "#804a19", "#e1a227", "#eddc83", "#f8f4dd"]
  cc_blue:  ["#1c0f1a", "#1e2978", "#2c60d5", "#5f93ea"]
  cc_fringe: ["#1c0f1a", "#c49a5c", "#eddc83", "#f8f4dd"]

materials:
  red:    {ramp: cc_red, bands: [3, 3], line: false}
  dark:   {ramp: cc_dark, bands: [2, 2], outline: false, line: false}
  gold:   {ramp: cc_gold, bands: [2, 2], outline: false, line: false}
  gold_hi: {ramp: cc_gold, bands: [3, 3], outline: false, line: false}
  blue:   {ramp: cc_blue, bands: [2, 2], outline: false, line: false}
  fringe: {ramp: cc_fringe, bands: [2, 2], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}
  rug: {parent: body, scale: [1, 1, 1.6243]}   # screen-proportional pattern space

parts:
  base:
    material: red
    space: rug
    prims:
      - box: {c: [0, 0.004, 0], half: [1.32, 0.004, 3.06]}
  border:            # wide gold band
    material: gold
    space: rug
    prims:
      - box: {c: [0, 0.01, -2.86], half: [1.16, 0.002, 0.1]}
      - box: {c: [0, 0.01, 2.86], half: [1.16, 0.002, 0.1]}
      - box: {c: [-1.06, 0.01, 0], half: [0.1, 0.002, 2.96]}
      - box: {c: [1.06, 0.01, 0], half: [0.1, 0.002, 2.96]}
  inner_line:        # dark-red line inside the border
    material: dark
    space: rug
    prims:
      - box: {c: [0, 0.014, -2.66], half: [0.9, 0.002, 0.04]}
      - box: {c: [0, 0.014, 2.66], half: [0.9, 0.002, 0.04]}
      - box: {c: [-0.86, 0.014, 0], half: [0.04, 0.002, 2.7]}
      - box: {c: [0.86, 0.014, 0], half: [0.04, 0.002, 2.7]}
  border_dots:       # blue studs along the gold border
