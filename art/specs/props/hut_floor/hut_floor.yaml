# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: hut_floor
kind: prop
view: topdown
size: 64                 # exactly 4x4 world tiles of 16 px: the whole frame is floor, no margin (tileable)
directions: 1
mirror: false
palette: ["farm", "hut"]
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}
shadow: null             # it is the ground itself

# Aldo's hut (prologue): worn plank floor, tileable.
brief:
  summary: old, worn plank floor of a poor hut - horizontal boards 8 px apart (2 boards per 16 px tile),
    dark gaps between boards, staggered butt joints with a pair of iron nail heads, a darker bottom bevel
    on every board, short grain streaks, a few knots and lighter foot-polished streaks
  must_keep: [warm worn wood matching every hut prop (hut palette hwood), seamless every 64 px,
    readable board rhythm without noise]
  simplify: [grain as 1 px streaks, no cracks or holes (props sit on it), no straw (the rug and bed bring it)]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null, camera.center [0, 0, 0]. Fills the WHOLE
    frame on purpose (QA margin warnings expected). No outlines (boards join without seams).
    camera.scale/pitch/light untouched. Ramps from palettes/hut.yaml (index 0 = #1c0f1a).
  decisions: |
    TILING CONTRACT: the frame is a 64x64 px tile = 4x4 game tiles; draw it every 64 px in x and y (pivot =
    frame centre 32,32), e.g. a Phaser tileSprite. Boards run along x and wrap across the frame edge; joints
    are placed so they never line up between neighbouring boards. 1 px = 0.055 units in x and
    0.0893 units in z (ground). Every board segment has a fixed tone (bands [n, n]) so lighting cannot
    add noise. Tones sit one step darker than the furniture wood so every prop
    stands off the floor (review: floor L* ~38, props ~45). Static: 1-frame idle.

materials:
  pa:    {ramp: hwood, bands: [2, 2], outline: false, line: false}     # mid board
  pb:    {ramp: hwood, bands: [3, 3], outline: false, line: false}     # lighter board
  pc:    {ramp: hbeam, bands: [4, 4], outline: false, line: false}      # greyer, older board
  gap:   {ramp: hbeam, bands: [1, 1], outline: false, line: false}     # gaps and butt joints
  bev:   {ramp: hbeam, bands: [3, 3], outline: false, line: false}     # bottom bevel of each board
  grain: {ramp: hbeam, bands: [3, 3], outline: false, line: false}
  knot:  {ramp: hbeam, bands: [2, 2], outline: false, line: false}
  nail:  {ramp: hiron, bands: [2, 2], outline: false, line: false}
  hi:    {ramp: hwood, bands: [4, 4], outline: false, line: false}     # foot-polished streak

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

