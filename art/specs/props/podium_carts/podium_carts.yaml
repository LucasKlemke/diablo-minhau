spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: podium_carts
kind: prop
view: topdown
size: 96                 # ~76 x 48 px on screen, 2+ px margins
directions: 1            # faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.8376, 0]}   # 12 px above the pivot -> pivot (48, 60)
shadow: {rx: 38, ry: 9, alpha: 120}

# Estrada dos Bandidos: "o palanque do Polvo" - the Octopus's campaign stage made of overturned carts.
brief:
  summary: a makeshift campaign stage ("o palanque do Polvo"); three farm carts flipped upside down side by
    side, their wheels sticking up in the air, with apple crates heaped on top as a speaking platform (a
    few red apples spilling, some rotten), and a long torn green-and-yellow election banner nailed across
    the front, ripped through the middle with one end hanging loose; a little bunting pole with a
    green-yellow pennant at one corner
  must_keep: [three overturned carts with upturned wheels, apple crates with red apples on top, torn green and
    yellow banner across the front (ripped, one end hanging), bunting pole]
  simplify: [no lettering on the banner - a yellow lozenge on green and a yellow stripe read as election
    colours; apples as 2 px red dots]
  exceptions: |
    kind prop, size 96, directions 1, mirror false; camera.center [0, 0.8376, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 48,60) is the ground point at the centre of the
    stage. Footprint 4x2 tiles (x -1.8..1.8, z -0.6..0.6), blocking. The speaking spot (where the Octopus
    stands in a cutscene) is socket `stage`, on the crates at (0, 1.0, -0.1).
    The banner greens are yellowish and the yellows warm, so a grass recolour (if ever applied) would not
    turn them into foliage: green tones keep green <= red+6 is NOT possible for a real green, so this prop
    must stay out of the biome recolour list (it is not in it).

ramps:
  pc_wood:   ["#1c0f1a", "#3a1e18", "#5a3024", "#78432e", "#94583a"]
  pc_old:    ["#1c0f1a", "#2e2622", "#463a32", "#5f5246", "#7a6c5a"]
  pc_crate:  ["#1c0f1a", "#4a3220", "#6e5030", "#927044", "#b08a56"]
  pc_apple:  ["#1c0f1a", "#5a1014", "#8a1c1c", "#b83026", "#d85a3a"]
  pc_rot:    ["#1c0f1a", "#3a3018", "#5a4a24"]
  pc_green:  ["#1c0f1a", "#163a1e", "#225426", "#367030"]
  pc_yellow: ["#1c0f1a", "#8a6a18", "#b8901e", "#d4b03a"]
  pc_iron:   ["#1c0f1a", "#22202a", "#363442", "#504e5e"]

materials:
  wood:   {ramp: pc_wood, bands: [1, 4]}
  old:    {ramp: pc_old, bands: [1, 4]}
  crate:  {ramp: pc_crate, bands: [1, 4]}
  apple:  {ramp: pc_apple, bands: [2, 4], line: false}
  rotten: {ramp: pc_rot, bands: [1, 2], line: false}
  green:  {ramp: pc_green, bands: [1, 3]}
  yellow: {ramp: pc_yellow, bands: [1, 3], line: false}
  iron:   {ramp: pc_iron, bands: [1, 3]}

channels:
  root: [0, 0, 0]

bones:
  body:   {parent: root}
  cart_l: {parent: body, pos: [-1.20, 0, 0.02], rot: [0, 0.10, 0]}
  cart_m: {parent: body, pos: [0, 0, -0.04], rot: [0, -0.04, 0]}
  cart_r: {parent: body, pos: [1.20, 0, 0.04], rot: [0, -0.12, 0]}

sockets:
  stage: {bone: body, offset: [0, 1.0, -0.1]}

parts:
  # ---- three upside-down carts (bed + upturned wheels) ----
  beds:
    material: wood
    space: body
    line: true
    prims:
      - box: {c: {at: cart_l, off: [0, 0.34, 0]}, half: [0.56, 0.34, 0.52], rot: [0, 0.10, 0], round: 0.03}
      - box: {c: {at: cart_m, off: [0, 0.36, 0]}, half: [0.58, 0.36, 0.54], rot: [0, -0.04, 0], round: 0.03}
      - box: {c: {at: cart_r, off: [0, 0.34, 0]}, half: [0.56, 0.34, 0.52], rot: [0, -0.12, 0], round: 0.03}
  boards:            # board seams on the front faces (raised strips)
    material: wood
    space: body
    line: true
    prims:
      - box: {c: {at: cart_l, off: [0, 0.34, 0.53]}, half: [0.54, 0.035, 0.015], rot: [0, 0.10, 0]}
      - box: {c: {at: cart_r, off: [0, 0.34, 0.53]}, half: [0.54, 0.035, 0.015], rot: [0, -0.12, 0]}
  axles:
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: {at: cart_l, off: [0.05, 0.78, -0.58]}, b: {at: cart_l, off: [0.05, 0.78, 0.58]}, r: 0.05}
      - cylinder: {a: {at: cart_m, off: [-0.05, 0.82, -0.60]}, b: {at: cart_m, off: [-0.05, 0.82, 0.60]}, r: 0.05}
      - cylinder: {a: {at: cart_r, off: [0.0, 0.78, -0.58]}, b: {at: cart_r, off: [0.0, 0.78, 0.58]}, r: 0.05}
  wheels:            # wheels sticking up (back ones; the front ones were taken)
    material: wood
    space: body
    line: true
    prims:
      - torus: {c: {at: cart_l, off: [0.05, 0.98, -0.60]}, R: 0.32, r: 0.05, rot: [1.5708, 0, 0]}
      - torus: {c: {at: cart_m, off: [-0.05, 1.04, -0.62]}, R: 0.34, r: 0.05, rot: [1.5708, 0, 0]}
      - torus: {c: {at: cart_r, off: [0.0, 0.98, -0.60]}, R: 0.32, r: 0.05, rot: [1.5708, 0, 0]}
  spokes:
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: {at: cart_l, off: [-0.27, 0.98, -0.60]}, b: {at: cart_l, off: [0.37, 0.98, -0.60]}, r: 0.022}
      - cylinder: {a: {at: cart_l, off: [0.05, 0.66, -0.60]}, b: {at: cart_l, off: [0.05, 1.30, -0.60]}, r: 0.022}
      - cylinder: {a: {at: cart_m, off: [-0.39, 1.04, -0.62]}, b: {at: cart_m, off: [0.29, 1.04, -0.62]}, r: 0.022}
      - cylinder: {a: {at: cart_m, off: [-0.05, 0.70, -0.62]}, b: {at: cart_m, off: [-0.05, 1.38, -0.62]}, r: 0.022}
      - cylinder: {a: {at: cart_r, off: [-0.32, 0.98, -0.60]}, b: {at: cart_r, off: [0.32, 0.98, -0.60]}, r: 0.022}
      - cylinder: {a: {at: cart_r, off: [0.0, 0.66, -0.60]}, b: {at: cart_r, off: [0.0, 1.30, -0.60]}, r: 0.022}
  shafts:            # cart shafts poking out at the sides
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.70, 0.30, -0.20], b: [-2.05, 0.05, -0.10], r: 0.04}
      - cylinder: {a: [1.70, 0.30, 0.25], b: [2.02, 0.04, 0.40], r: 0.04}

  # ---- apple crates on top ----
  crates:
    material: crate
    space: body
    line: true
    prims:
      - box: {c: [-0.30, 0.90, -0.05], half: [0.26, 0.18, 0.20], rot: [0, 0.2, 0], round: 0.02}
      - box: {c: [0.28, 0.90, 0.02], half: [0.26, 0.18, 0.20], rot: [0, -0.15, 0], round: 0.02}
      - box: {c: [0.0, 1.26, -0.10], half: [0.26, 0.18, 0.20], rot: [0, 0.05, 0.03], round: 0.02}   # top crate (the speaking box)
      - box: {c: [-1.25, 0.86, 0.05], half: [0.24, 0.18, 0.19], rot: [0, -0.3, 0], round: 0.02}
      - box: {c: [1.15, 0.86, -0.08], half: [0.24, 0.18, 0.19], rot: [0, 0.35, 0.0], round: 0.02}
      - box: {c: [1.55, 0.18, 0.62], half: [0.22, 0.18, 0.18], rot: [0, 0.6, 0.0], round: 0.02}   # one on the ground
    cut:             # open tops (apples inside) and slat gaps
      - box: {c: [0, 0.90, 0.30], half: [2.0, 0.012, 0.12]}
      - box: {c: [0, 1.26, 0.20], half: [0.4, 0.012, 0.12]}
      - box: {c: [0.28, 1.06, 0.02], half: [0.21, 0.06, 0.15], rot: [0, -0.15, 0]}
      - box: {c: [-1.25, 1.02, 0.05], half: [0.20, 0.06, 0.15], rot: [0, -0.3, 0]}
      - box: {c: [1.15, 1.02, -0.08], half: [0.20, 0.06, 0.15], rot: [0, 0.35, 0.0]}
      - box: {c: [1.55, 0.34, 0.62], half: [0.18, 0.06, 0.14], rot: [0, 0.6, 0.0]}
  apples:
    material: apple
    space: body
    prims:
      - sphere: {c: [-1.32, 1.03, 0.08], r: 0.091}
      - sphere: {c: [-1.18, 1.04, 0.00], r: 0.091}
      - sphere: {c: [-1.24, 1.03, 0.14], r: 0.085}
      - sphere: {c: [1.10, 1.03, -0.10], r: 0.091}
      - sphere: {c: [1.22, 1.04, -0.02], r: 0.091}
      - sphere: {c: [1.50, 0.30, 0.62], r: 0.091}
      - sphere: {c: [1.62, 0.30, 0.58], r: 0.085}
      - sphere: {c: [0.22, 1.03, 0.06], r: 0.091}
      - sphere: {c: [0.36, 1.04, -0.02], r: 0.091}
      - sphere: {c: [0.30, 1.03, 0.12], r: 0.085}
      - sphere: {c: [1.20, 0.06, 0.90], r: 0.085}      # spilled
      - sphere: {c: [-0.70, 0.06, 0.86], r: 0.085}
  rotten:
    material: rotten
    space: body
    prims:
      - sphere: {c: [1.58, 0.31, 0.70], r: 0.06}
      - sphere: {c: [0.85, 0.05, 0.95], r: 0.06}

  # ---- torn election banner across the front ----
  banner_l:          # left piece, nailed at both ends
    material: green
    space: body
    line: true
    prims:
      - box: {c: [-1.02, 0.46, 0.62], half: [0.72, 0.18, 0.015], rot: [0, 0.04, 0.02]}
    cut:
      - box: {c: [-0.55, 0.22, 0.62], half: [0.10, 0.10, 0.1], rot: [0, 0, 0.6]}     # ragged bottom
      - box: {c: [-1.40, 0.24, 0.62], half: [0.08, 0.08, 0.1], rot: [0, 0, 0.8]}
  banner_r:          # right piece, torn loose and hanging from one nail
    material: green
    space: body
    line: true
    prims:
      - box: {c: [0.86, 0.36, 0.64], half: [0.62, 0.16, 0.015], rot: [0, -0.06, -0.38]}
    cut:
      - box: {c: [0.30, 0.10, 0.64], half: [0.10, 0.10, 0.1], rot: [0, 0, 0.7]}
  banner_yellow:     # yellow lozenges and stripe
    material: yellow
    space: body
    prims:
      - box: {c: [-1.02, 0.46, 0.64], half: [0.13, 0.13, 0.01], rot: [0, 0.04, 0.785]}
      - box: {c: [-1.02, 0.60, 0.64], half: [0.70, 0.025, 0.01], rot: [0, 0.04, 0.02]}
      - box: {c: [0.92, 0.34, 0.66], half: [0.12, 0.12, 0.01], rot: [0, -0.06, 0.40]}
      - box: {c: [0.86, 0.48, 0.66], half: [0.58, 0.025, 0.01], rot: [0, -0.06, -0.38]}
  nails:
    material: iron
    space: body
    prims:
      - sphere: {c: [-1.70, 0.60, 0.64], r: 0.035}
      - sphere: {c: [-0.32, 0.62, 0.64], r: 0.035}
      - sphere: {c: [1.40, 0.58, 0.66], r: 0.035}

  # ---- bunting pole with a pennant ----
  pole:
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.62, 0.66, -0.30], b: [-1.66, 1.80, -0.32], r: 0.035}
  pennant:
    material: green
    space: body
    line: true
    prims:
      - tri: {a: [-1.65, 1.78, -0.32], b: [-1.18, 1.66, -0.30], c: [-1.65, 1.52, -0.32], th: 0.02}
  pennant_y:
    material: yellow
    space: body
    prims:
      - tri: {a: [-1.62, 1.72, -0.30], b: [-1.38, 1.66, -0.29], c: [-1.62, 1.60, -0.30], th: 0.02}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
