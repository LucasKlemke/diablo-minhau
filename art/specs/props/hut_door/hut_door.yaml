# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: hut_door
kind: prop
view: topdown
size: 48
directions: 1            # set in the back wall, faces the camera
mirror: false
palette: ["farm", "hut"]
# centre y 1.2562 = 18 px above the pivot -> pivot (24, 42), integer
camera: {pitch: 38, scale: 0.055, center: [0, 1.2562, 0]}
shadow: null             # wall piece

# Aldo's hut: the plank door, daylight leaking through its cracks.
brief:
  summary: low plank door of four warped boards held by a Z brace, black iron strap hinges, a wooden latch
    with a leather pull cord, set in a dark post-and-lintel frame with a worn threshold log; bright warm
    daylight leaks through the gap under the door, the crack between two boards and the top gap, and a
    little light spills on the floor in front
  must_keep: [4 boards with a Z brace, iron strap hinges, latch, dark frame, glowing cracks of daylight,
    light spill on the floor]
  simplify: [nails omitted, cord as 2 px]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 1.2562, 0] (integer
    pivot). The daylight (cracks and spill) is emissive. camera.scale/pitch/light untouched. Ramps from
    palettes/hut.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,42) is the floor point on the back wall's
    face (z 0) at the door's centre, like the other wall pieces: put the pivot on the wall's floor line,
    over a wall section (the frame covers the wall behind it). Door 1.08 wide x 2.23 tall (~20 x 32 px,
    as tall as a hero); frame ~27 px wide -> takes 2 wall tiles, not blocking (it is the exit trigger). idle loops 4 frames x
    200 ms: the daylight under the door breathes a little (leaves moving outside).

materials:
  board:   {ramp: hwood, bands: [2, 4]}
  board2:  {ramp: hwood, bands: [2, 3]}
  brace:   {ramp: hwood, bands: [3, 4]}
  frame:   {ramp: hbeam, bands: [2, 4]}
  sill:    {ramp: hbeam, bands: [3, 4]}
  iron:    {ramp: hiron, bands: [1, 3]}
  latch:   {ramp: hcut, bands: [1, 3]}
  cord:    {ramp: hwool, bands: [1, 2], outline: false, line: false}
  dark:    {ramp: hsoot, bands: [1, 1], outline: false, line: false}
  sun:     {ramp: hsun, emissive: true, band: 3, outline: false, line: false, glow: {color: "#ffe6a0", mix: 0.45, radius: 1}}
  sun_core: {ramp: hsun, emissive: true, band: 4, outline: false, line: false}
  spill:   {ramp: hsun, emissive: true, band: 2, outline: false, line: false}

channels:
  root: [0, 0, 0]
  light: 1           # daylight strength (spill size)

bones:
  body: {parent: root, scale: [1.12, 1.2, 1]}   # door sized for the 32 px chibi heroes (~2.2 units tall)

parts:
  opening:            # dark behind the door (shows in the gaps)
    material: dark
    space: body
    prims:
      - box: {c: [0, 0.96, 0.0], half: [0.5, 0.96, 0.02]}
  gap_light:          # daylight in the gaps under, over and between the boards
    material: sun
    space: body
    prims:
      - box: {c: [0, 0.07, 0.03], half: [0.46, 0.05, 0.01]}
      - box: {c: [0, 1.86, 0.03], half: [0.44, 0.03, 0.01]}
      - box: {c: [0.235, 1.15, 0.03], half: [0.02, 0.5, 0.01]}
  gap_core:
    material: sun_core
    space: body
    prims:
      - box: {c: [0.1, 0.07, 0.035], half: [0.24, 0.025, 0.01]}
  boards:             # four warped boards (the gap between the 3rd and 4th lets light through)
    material: board
    space: body
    line: true
    prims:
      - box: {c: [-0.355, 0.97, 0.06], half: [0.115, 0.85, 0.03], rot: [0, 0, 0.004]}
      - box: {c: [0.115, 0.98, 0.06], half: [0.11, 0.84, 0.03], rot: [0, 0, 0.003]}
      - box: {c: [0.365, 0.96, 0.06], half: [0.105, 0.84, 0.03], rot: [0, 0, 0.012]}
  boards_dark:        # one board darker (replaced long ago)
    material: board2
    space: body
    line: true
    prims:
      - box: {c: [-0.12, 0.97, 0.06], half: [0.11, 0.85, 0.03]}
  brace:              # Z brace: two rails and a diagonal
    material: brace
    space: body
    line: true
    prims:
      - box: {c: [0, 1.48, 0.1], half: [0.44, 0.065, 0.025]}
      - box: {c: [0, 0.45, 0.1], half: [0.44, 0.065, 0.025]}
      - box: {c: [0, 0.965, 0.1], half: [0.06, 0.54, 0.025], rot: [0, 0, 0.72]}
  hinges:             # iron straps on the left (hinge side)
    material: iron
    space: body
    line: true
    prims:
      - box: {c: [-0.26, 1.48, 0.13], half: [0.22, 0.03, 0.01]}
      - box: {c: [-0.26, 0.45, 0.13], half: [0.22, 0.03, 0.01]}
      - sphere: {c: [-0.47, 1.48, 0.13], r: 0.045}
      - sphere: {c: [-0.47, 0.45, 0.13], r: 0.045}
  latch:
    material: latch
    space: body
    line: true
    prims:
      - box: {c: [0.3, 1.0, 0.11], half: [0.12, 0.035, 0.03], round: 0.01}
      - box: {c: [0.42, 1.0, 0.1], half: [0.03, 0.07, 0.04]}
  cord:
    material: cord
    space: body
    prims:
      - cone: {a: [0.22, 1.0, 0.14], b: [0.2, 0.82, 0.15], r: [0.015, 0.015]}
  frame:              # posts and lintel
    material: frame
    space: body
    line: true
    prims:
      - box: {c: [-0.6, 1.0, 0.06], half: [0.1, 1.0, 0.09]}
      - box: {c: [0.6, 1.0, 0.06], half: [0.1, 1.0, 0.09]}
      - box: {c: [0, 2.0, 0.07], half: [0.74, 0.1, 0.1], rot: [0, 0, 0.015]}
  threshold:
    material: sill
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.58, 0.05, 0.16], b: [0.58, 0.05, 0.16], r: 0.06}
  spill:              # light spilling on the floor boards
    material: spill
    space: body
    prims:
      - box: {c: [0.04, 0.003, "0.27 + 0.03*light"], half: ["0.38 + 0.03*light", 0.003, "0.07*light"]}
  spill_core:
    material: sun
    space: body
    prims:
      - box: {c: [0.04, 0.004, 0.24], half: [0.3, 0.003, 0.04]}

animations:
  idle:
    frames: 4
    ms: 200
    channels: {light: "1 + 0.2*sin(p)"}
