      - ellipsoid: {c: [-0.55, 0.05, 0.80], r: [0.09, 0.05, 0.08]}
      - ellipsoid: {c: [0.70, 0.05, -1.05], r: [0.08, 0.05, 0.07]}
      - ellipsoid: {c: [-1.25, 0.04, 0.25], r: [0.06, 0.04, 0.06]}
      - ellipsoid: {c: [0.30, 0.04, 0.95], r: [0.06, 0.04, 0.05]}
  # ---------- variant 1 ----------
  edge_1:
    when: "var == 1"
