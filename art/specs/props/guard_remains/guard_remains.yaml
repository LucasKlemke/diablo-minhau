      - ellipsoid: {c: [-1.05, 0.004, 0.65], r: [0.20, 0.004, 0.26]}
      - ellipsoid: {c: [1.35, 0.004, -0.6], r: [0.09, 0.004, 0.11]}
      - ellipsoid: {c: [-0.4, 0.004, 1.2], r: [0.10, 0.004, 0.11]}
  pool_1:
