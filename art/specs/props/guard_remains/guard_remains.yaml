    space: torso0
    prims:
      - cylinder: {a: [0.0, 0.145, 0.16], b: [0.0, 0.16, 0.16], r: 0.1}
  meat_0:          # torn flesh spilling out of the tabard
    when: "var == 0"
    material: meat
    space: torso0
    blend: 0.05
    prims:
      - ellipsoid: {c: [-0.18, 0.12, -0.18], r: [0.24, 0.14, 0.2]}
      - ellipsoid: {c: [0.05, 0.10, -0.30], r: [0.16, 0.10, 0.14]}
      - ellipsoid: {c: [-0.40, 0.07, 0.05], r: [0.12, 0.08, 0.12]}
  ribs_0:          # ribs sticking up out of the flesh
    when: "var == 0"
    material: bone
    space: torso0
    prims:
      - chain: {pts: [[-0.32, 0.16, -0.30], [-0.24, 0.34, -0.24], [-0.06, 0.40, -0.20]], r: [0.04, 0.035, 0.025]}
      - chain: {pts: [[-0.30, 0.16, -0.16], [-0.22, 0.36, -0.10], [-0.04, 0.42, -0.06]], r: [0.04, 0.035, 0.025]}
      - chain: {pts: [[-0.28, 0.16, -0.02], [-0.20, 0.32, 0.03], [-0.05, 0.36, 0.06]], r: [0.04, 0.035, 0.025]}
      - cylinder: {a: [-0.36, 0.14, -0.36], b: [-0.32, 0.14, 0.06], r: 0.05, round: 0.02}
  helm_0:
    when: "var == 0"
    material: helm
    space: helm0
    blend: 0.025
    prims:
      - ellipsoid: {c: [0, 0.0, 0], r: [0.155, 0.12, 0.15]}
      - cylinder: {a: [0, -0.015, 0], b: [0, 0.005, 0], r: 0.16, round: 0.008}
      - ellipsoid: {c: [0.135, -0.10, 0], r: [0.03, 0.075, 0.07]}
