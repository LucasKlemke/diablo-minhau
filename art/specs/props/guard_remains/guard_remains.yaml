    space: body
    prims:
      - ellipsoid: {c: [0.2, 0.012, 0.1], r: [0.32, 0.004, 0.25], rot: [0, -0.3, 0]}
  tabard_1:        # flat torn tabard with the gold star skirt
    when: "var == 1"
    material: tabard
    space: torso1
    blend: 0.02
    prims:
      - box: {c: [0, 0.04, 0], half: [0.34, 0.03, 0.42], round: 0.02}
    cut:
      - box: {c: [0.36, 0.04, -0.40], half: [0.14, 0.1, 0.2], rot: [0, 0.6, 0]}
      - box: {c: [-0.36, 0.04, 0.40], half: [0.12, 0.1, 0.18], rot: [0, 0.7, 0]}
      - box: {c: [0.12, 0.04, 0.46], half: [0.06, 0.1, 0.10], rot: [0, 0.8, 0]}
  hem_1:
    when: "var == 1"
