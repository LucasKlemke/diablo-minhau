      - box: {c: [0.30, 0.06, 0.38], half: [0.05, 0.025, 0.035]}
      - cone: {a: [0, 0.075, 0.05], b: [0.0, 0.075, 0.20], r: [0.07, 0.02]}
      - cone: {a: [0, 0.075, 0.05], b: [0.14, 0.075, 0.0], r: [0.07, 0.02]}
      - cone: {a: [0, 0.075, 0.05], b: [-0.14, 0.075, 0.0], r: [0.07, 0.02]}
  meat_1:
    when: "var == 1"
    material: meat
    space: torso1
    blend: 0.05
    prims:
      - ellipsoid: {c: [0.05, 0.10, -0.40], r: [0.26, 0.13, 0.20]}
      - ellipsoid: {c: [-0.25, 0.08, -0.22], r: [0.12, 0.08, 0.11]}
  ribs_1:
    when: "var == 1"
    material: bone
    space: torso1
    prims:
      - chain: {pts: [[-0.12, 0.16, -0.50], [0.02, 0.32, -0.48], [0.20, 0.33, -0.44]], r: [0.04, 0.035, 0.025]}
      - chain: {pts: [[-0.12, 0.16, -0.38], [0.02, 0.30, -0.34], [0.20, 0.28, -0.30]], r: [0.04, 0.035, 0.025]}
      - cylinder: {a: [-0.14, 0.14, -0.58], b: [-0.14, 0.14, -0.28], r: 0.05, round: 0.02}
  helm_1:
