    space: body
    blend: 0.03
    prims:
      - cone: {a: [0.95, 0.07, 0.55], b: [1.30, 0.07, 0.30], r: [0.068, 0.064]}
      - ellipsoid: {c: [1.36, 0.06, 0.32], r: [0.07, 0.05, 0.11], rot: [0, 0.9, 0]}
  stump_0:
