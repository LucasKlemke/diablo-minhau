      - ellipsoid: {c: [0.7, 0.008, 0.55], r: [0.33, 0.004, 0.42], rot: [0, 0.5, 0]}
      - ellipsoid: {c: [-1.05, 0.008, 0.65], r: [0.14, 0.004, 0.19]}
