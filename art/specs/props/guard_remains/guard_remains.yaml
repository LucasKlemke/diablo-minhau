# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: guard_remains
kind: prop
view: topdown
size: 64
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.2792, 0]}   # 4 px above the pivot -> pivot (32, 36)
shadow: null             # everything lies on the floor; contact is the blood pool

# Prologue (castle massacre): what is left of a royal guard after Jimmynelson.
brief:
  summary: a royal guard torn apart on the marble - a wide dark blood pool, the silver helmet with its
    royal-blue plume lying on its side, the halberd dropped across the pool (or snapped in two), the
    royal-blue tabard ripped and heaped with its gold hem and gold cat crest, bloody ribs sticking out of
    a mass of raw flesh, a silver greave and a gauntlet torn off, scattered gibs
  must_keep: [plumed silver helmet, halberd with gold point, torn blue tabard with gold, blood pool, ribs]
  simplify: [no body silhouette (only pieces), 2-3 tones per material, gibs as 3-5 px lumps]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null, camera.center [0, 0.2792, 0] (integer
    pivot). camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: pivot (32, 36) = the ground point at the centre of the pool (where the guard stood);
    footprint 0 (walkable). Sort it on the floor-decal layer, or by the pivot if the halberd should cover
    actors' feet. VARIANTS: animation `variants` has 2 frames: 0 helmet left, halberd whole across the pool,
    tabard heap with ribs; 1 helmet rolled to the right, halberd snapped in two, flat torn tabard, a
    gauntlet and the greave. `idle` = variant 0. Materials and sizes copied from royal_guard (helmet x1.8,
    plume, halberd 2 units long) and blood colours from blood_splat, so the pieces match the living guard.

ramps:
  gr_meat:  ["#1c0f1a", "#5a0a14", "#9c1a24", "#d0464a", "#f08a80"]
  gr_plume: ["#1c0f1a", "#1e2978", "#2c60d5", "#5f93ea", "#a8cff3"]
  bl_edge:  ["#1c0f1a", "#4e0710"]
  bl_pool:  ["#1c0f1a", "#86101a"]
  bl_mid:   ["#1c0f1a", "#b41a20"]

materials:
  edge:   {ramp: bl_edge, bands: [1, 1], outline: false, line: false}
  pool:   {ramp: bl_pool, bands: [1, 1], outline: false, line: false}
  wet:    {ramp: bl_mid, bands: [1, 1], outline: false, line: false}
  helm:   {ramp: steel, bands: [2, 4]}
  plate:  {ramp: steel, bands: [2, 3]}
  plume:  {ramp: gr_plume, bands: [2, 4]}
  tabard: {ramp: cloth_blue, bands: [1, 3]}
  gold:   {ramp: gold, bands: [2, 3]}
  crest:  {ramp: gold, bands: [2, 3], outline: false, line: false}
  haft:   {ramp: wood, bands: [1, 2]}
  meat:   {ramp: gr_meat, bands: [2, 4]}
  bone:   {ramp: bone, bands: [2, 4]}

channels:
  root: [0, 0, 0]
  var: 0             # variant 0..1

bones:
  body:   {parent: root}
  # variant 0
  helm0:  {parent: body, pos: [-0.95, 0.20, -0.35], rot: [0.3, 0.7, 1.35], scale: 1.8}
  hb0y:   {parent: body, pos: [0.25, 0.05, 0.05], rot: [1.5708, 2.2, 0], scale: 1.15}   # lies flat (x pi/2), turned across the pool
  torso0: {parent: body, pos: [0.15, 0.0, -0.45], rot: [0, -0.4, 0]}
  # variant 1
  helm1:  {parent: body, pos: [1.0, 0.24, 0.05], rot: [-0.5, -0.9, -0.3], scale: 1.8}
  hbA1:   {parent: body, pos: [-0.45, 0.05, 0.45], rot: [1.5708, -2.0, 0], scale: 1.15}
  hbB1:   {parent: body, pos: [0.55, 0.05, -0.75], rot: [1.5708, 1.2, 0], scale: 1.15}
  torso1: {parent: body, pos: [-0.10, 0.0, -0.20], rot: [0, 0.6, 0]}

parts:
  # ---------- variant 0 ----------
  edge_0:
    when: "var == 0"
    material: edge
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.004, -0.15], r: [1.05, 0.004, 0.95], rot: [0, 0.3, 0]}
      - ellipsoid: {c: [-0.75, 0.004, 0.45], r: [0.45, 0.004, 0.55], rot: [0, -0.5, 0]}
      - ellipsoid: {c: [0.95, 0.004, 0.5], r: [0.25, 0.004, 0.32]}
      - ellipsoid: {c: [-1.25, 0.004, -0.75], r: [0.10, 0.004, 0.12]}
      - ellipsoid: {c: [1.30, 0.004, -0.9], r: [0.09, 0.004, 0.11]}
      - ellipsoid: {c: [0.6, 0.004, 1.15], r: [0.08, 0.004, 0.10]}
  pool_0:
    when: "var == 0"
    material: pool
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.008, -0.15], r: [0.97, 0.004, 0.86], rot: [0, 0.3, 0]}
      - ellipsoid: {c: [-0.75, 0.008, 0.45], r: [0.38, 0.004, 0.47], rot: [0, -0.5, 0]}
      - ellipsoid: {c: [0.95, 0.008, 0.5], r: [0.19, 0.004, 0.25]}
  wet_0:
    when: "var == 0"
    material: wet
    space: body
    prims:
      - ellipsoid: {c: [-0.3, 0.012, 0.1], r: [0.35, 0.004, 0.3], rot: [0, 0.3, 0]}
  tabard_0:        # ripped blue tabard heaped over the torso
    when: "var == 0"
    material: tabard
    space: torso0
    blend: 0.04
    prims:
      - box: {c: [0, 0.08, 0.15], half: [0.36, 0.06, 0.30], rot: [0.15, 0, 0.1], round: 0.04}
      - box: {c: [0.30, 0.05, -0.10], half: [0.25, 0.05, 0.22], rot: [-0.1, 0.4, -0.15], round: 0.04}
    cut:
      - box: {c: [-0.32, 0.08, 0.44], half: [0.10, 0.2, 0.14], rot: [0, 0.7, 0]}
  hem_0:
    when: "var == 0"
    material: gold
    space: torso0
    prims:
      - box: {c: [0.08, 0.13, 0.44], half: [0.25, 0.03, 0.035], rot: [0.15, 0, 0.1]}
  crest_0:
