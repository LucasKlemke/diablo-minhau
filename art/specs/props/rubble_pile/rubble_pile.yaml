# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: rubble_pile
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 0.4188 = 6 px above the pivot -> pivot (24, 30), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.4188, 0]}
shadow: {rx: 17, ry: 6, alpha: 80}

# Act I, Minhau: a heap of debris from the destroyed houses.
brief:
  summary: low heap of grey fieldstones, charred beam ends and broken grey planks, dusted with ash; three
    looks - a stone heap with a charred beam across it, a timber heap of planks and a blackened post, and
    a low spread of stones with a broken cart wheel rim
  must_keep: [grey stones, black charred timber, ash at the foot, low silhouette (below knee height)]
  simplify: [stones as rounded boxes, planks as flat boxes, ash as flat blobs]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, camera.center [0, 0.4188, 0] (integer pivot).
    camera.scale/pitch/light untouched. Ramps from palettes/ruin.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,30) is the ground point at the centre of
    the heap. Heap ~1.7 x 1.4 units (~31 px wide, ~10-14 px tall) -> footprint 2x1 tiles, blocking.
    Clips: idle (= variant 0) and `variants` (3 frames, frame i = variant i; the game picks a frame and
    holds it).

materials:
  stone:  {ramp: rstone, bands: [1, 3]}
  char:   {ramp: rchar, bands: [1, 3]}
  plank:  {ramp: rplank, bands: [2, 4]}
  ash:    {ramp: rash, bands: [1, 2], outline: false, line: false}
  iron:   {ramp: riron, bands: [2, 4]}
  wood:   {ramp: rwood, bands: [1, 3]}

channels:
  root: [0, 0, 0]
  v: 0

bones:
  body: {parent: root}

parts:
  ash:
    material: ash
    space: body
    blend: 0.12
    prims:
      - ellipsoid: {c: [0, 0.01, 0.1], r: [0.75, 0.02, 0.5]}
      - ellipsoid: {c: [0.45, 0.01, 0.35], r: [0.3, 0.02, 0.25]}
  # ---- variant 0: stone heap with a charred beam ----
  stones0:
    material: stone
    space: body
    line: true
    when: "v < 0.5"
    prims:
      - box: {c: [-0.32, 0.2, -0.1], half: [0.3, 0.2, 0.26], rot: [0, 0.3, 0.1], round: 0.08}
      - box: {c: [0.25, 0.18, -0.2], half: [0.28, 0.18, 0.24], rot: [0, -0.4, 0], round: 0.08}
      - box: {c: [-0.02, 0.48, -0.16], half: [0.24, 0.15, 0.2], rot: [0.1, 0.7, 0.15], round: 0.08}
      - box: {c: [0.3, 0.42, -0.3], half: [0.16, 0.12, 0.14], rot: [0.2, 0.3, -0.3], round: 0.06}
      - box: {c: [0.48, 0.09, 0.22], half: [0.16, 0.09, 0.13], rot: [0, 0.9, 0], round: 0.05}
      - box: {c: [-0.6, 0.08, 0.3], half: [0.13, 0.08, 0.11], rot: [0, 0.2, 0], round: 0.05}
      - box: {c: [-0.05, 0.08, 0.32], half: [0.12, 0.08, 0.1], rot: [0, 1.2, 0], round: 0.05}
      - box: {c: [0.66, 0.06, -0.3], half: [0.1, 0.06, 0.09], rot: [0, 0.5, 0], round: 0.04}
  beam0:
    material: char
    space: body
    line: true
    when: "v < 0.5"
    prims:
      - box: {c: [-0.05, 0.5, 0.08], half: [0.72, 0.1, 0.1], rot: [0, -0.35, 0.42], round: 0.02}
  # ---- variant 1: timber heap ----
  planks1:
    material: plank
    space: body
    line: true
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [-0.15, 0.08, 0.05], half: [0.7, 0.04, 0.13], rot: [0, 0.25, 0.05]}
      - box: {c: [0.1, 0.18, -0.15], half: [0.65, 0.04, 0.12], rot: [0.0, -0.4, 0.12]}
      - box: {c: [0.25, 0.12, 0.3], half: [0.45, 0.04, 0.11], rot: [0, 0.9, 0.08]}
  char1:
    material: char
    space: body
    line: true
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [-0.2, 0.3, -0.1], half: [0.6, 0.1, 0.1], rot: [0, 0.6, -0.25], round: 0.02}
      - box: {c: [0.35, 0.22, 0.05], half: [0.08, 0.3, 0.08], rot: [0.3, 0, -0.9], round: 0.02}
  stones1:
    material: stone
    space: body
    line: true
    when: "abs(v - 1) < 0.5"
    prims:
      - box: {c: [-0.6, 0.09, 0.3], half: [0.15, 0.09, 0.12], rot: [0, 0.4, 0], round: 0.05}
      - box: {c: [0.62, 0.08, -0.28], half: [0.13, 0.08, 0.11], rot: [0, 0.9, 0], round: 0.05}
  # ---- variant 2: low stone spread with a broken wheel rim ----
  stones2:
    material: stone
    space: body
    line: true
    when: "v > 1.5"
    prims:
      - box: {c: [-0.45, 0.12, -0.2], half: [0.2, 0.12, 0.17], rot: [0, 0.5, 0.05], round: 0.06}
      - box: {c: [-0.15, 0.1, 0.2], half: [0.17, 0.1, 0.14], rot: [0, -0.3, 0], round: 0.06}
      - box: {c: [0.35, 0.11, 0.1], half: [0.19, 0.11, 0.15], rot: [0, 0.2, 0], round: 0.06}
      - box: {c: [0.6, 0.07, -0.3], half: [0.12, 0.07, 0.1], rot: [0, 0.8, 0], round: 0.04}
      - box: {c: [-0.7, 0.06, 0.25], half: [0.1, 0.06, 0.09], rot: [0, 0.3, 0], round: 0.04}
      - box: {c: [0.05, 0.27, -0.05], half: [0.15, 0.09, 0.13], rot: [0.1, 1.0, 0.1], round: 0.05}
  wheel2:          # half a cart wheel leaning on the stones
    material: wood
    space: body
    line: true
    when: "v > 1.5"
    prims:
      - torus: {c: [0.25, 0.42, -0.28], R: 0.4, r: 0.055, rot: [0.5, 0.3, 0]}
      - cylinder: {a: [0.25, 0.42, -0.28], b: [-0.1, 0.62, -0.42], r: 0.04}
      - cylinder: {a: [0.25, 0.42, -0.28], b: [0.58, 0.6, -0.4], r: 0.04}
      - cylinder: {a: [0.25, 0.42, -0.28], b: [0.3, 0.8, -0.5], r: 0.04}
      - sphere: {c: [0.25, 0.42, -0.26], r: 0.1}
    cut:
      - box: {c: [0.25, -0.1, 0.0], half: [0.8, 0.42, 0.5], rot: [0.5, 0.3, 0]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {v: 0}
  variants:
    frames: 3
    ms: 1000
    channels: {v: "f"}
