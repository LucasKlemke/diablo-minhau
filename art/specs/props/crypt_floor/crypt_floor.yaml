# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: crypt_floor
kind: prop
view: topdown
size: 128                # ~112 x 50 px flat decal, 2+ px margins
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}
shadow: null             # it is the ground itself

# Ground decal drawn UNDER the crypt so it does not sit bare on the grass.
brief:
  summary: ragged courtyard of old cracked flagstones on dark graveyard earth, ~7x5 tiles (6.2 x 4.4 units,
    ~112 x 50 px), with moss in the joints, a few missing stones showing dirt, and a worn path towards the
    front (camera side) where the crypt doorway faces
  must_keep: [grey-violet flagstones matching the crypt stone, dark earth border fading into the grass,
    moss, ragged irregular outline]
  simplify: [stones as low rounded boxes, cracks as dark slits, no grass blades]
  exceptions: |
    kind prop, directions 1, mirror false, shadow null (flat ground decal); camera.center [0, 0, 0].
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a; the earth and stones have
    no outer outline so the decal blends into the grass instead of reading as an object.
  decisions: |
    PIVOT CONTRACT: the world origin (= the exported pivot) is the CENTRE of the courtyard on the ground. It
    is the same point as the crypt's pivot (the crypt's origin is its footprint centre), so the game draws
    crypt_floor at exactly the crypt's position, at a depth below everything (ground layer). The courtyard
    spans x -3.0..3.0 and z -2.15..2.15, so it reaches ~1 tile beyond the crypt plinth on the sides and front.
    Stone colours come from the crypt's ramps so both read as one place.

ramps:
  cf_earth: ["#1c0f1a", "#2e2230", "#3f3040", "#55434f"]
  cf_stone: ["#1c0f1a", "#5a5470", "#6a6480", "#918aa3", "#a9a2b8"]
  cf_stone_dk: ["#1c0f1a", "#46405a", "#575070", "#6e6787"]
  cf_moss: ["#1c0f1a", "#2b4a22", "#4f7d33", "#74a347"]
  cf_void: ["#1c0f1a", "#1f1622", "#2a1f2c"]

materials:
  earth:    {ramp: cf_earth, bands: [1, 3], outline: false, line: false}
  flag:     {ramp: cf_stone, bands: [2, 4], outline: false, line: true}
  flag_dk:  {ramp: cf_stone_dk, bands: [1, 3], outline: false, line: true}
  moss:     {ramp: cf_moss, bands: [1, 3], outline: false, line: false}
  crack:    {ramp: cf_void, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

