# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: well_broken
kind: prop
view: topdown
size: 64
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 0.8376 = 12 px above the pivot -> pivot (32, 44), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.8376, 0]}
shadow: {rx: 22, ry: 8, alpha: 70}

# Act I, Minhau: the village well, wrecked in the raid.
brief:
  summary: round fieldstone well with a dark hole, its wooden frame half wrecked - the left post standing
    with the crossbar hanging from it at a slant, the right post snapped to a stump, the winch rope cut
    and dangling, the wooden bucket fallen on its side in the mud in front with a frayed rope end
  must_keep: [round grey stone wall with a dark well mouth, one standing post, slanted crossbar, cut rope,
    bucket on its side with iron hoops]
  simplify: [stones as two courses of rounded boxes on a cylinder, water as a dark disc]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, camera.center [0, 0.8376, 0] (integer pivot).
    camera.scale/pitch/light untouched. Ramps from palettes/ruin.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,44) is the ground point at the centre of
    the well. Wall radius 0.62 (~23 px across), bucket in front right -> footprint 2x2 tiles, the wall
    blocking (the 2x1 tiles under the pivot row and the row behind). Static: 1-frame idle.

materials:
  stone:  {ramp: rstone, bands: [2, 4]}
  mortar: {ramp: rstone, bands: [1, 1], outline: false, line: false}
  hole:   {ramp: rburnt, bands: [1, 2], outline: false, line: false}
  wood:   {ramp: rwood, bands: [2, 4]}
  cut:    {ramp: hcut, bands: [1, 2], outline: false}
  rope:   {ramp: rrope, bands: [2, 3], outline: false}
  iron:   {ramp: riron, bands: [2, 4]}
  bucket: {ramp: rwood, bands: [2, 4]}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  wall:
    material: stone
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 0, 0], b: [0, 0.62, 0], r: 0.62, round: 0.04}
    cut:
      - cylinder: {a: [0, 0.3, 0], b: [0, 0.8, 0], r: 0.4}
      - box: {c: [0.3, 0.66, 0.5], half: [0.2, 0.1, 0.2], rot: [0, 0.5, 0]}       # stones knocked off
  courses:        # mortar joints between the stone courses on the front
    material: mortar
    space: body
    prims:
      - torus: {c: [0, 0.22, 0], R: 0.63, r: 0.018}
      - torus: {c: [0, 0.43, 0], R: 0.63, r: 0.018}
      - box: {c: [-0.2, 0.33, 0.6], half: [0.018, 0.09, 0.02], rot: [0, -0.3, 0]}
      - box: {c: [0.25, 0.12, 0.58], half: [0.018, 0.09, 0.02], rot: [0, 0.4, 0]}
      - box: {c: [0.05, 0.54, 0.62], half: [0.018, 0.08, 0.02]}
      - box: {c: [-0.48, 0.12, 0.4], half: [0.018, 0.09, 0.02], rot: [0, -0.9, 0]}
      - box: {c: [0.5, 0.33, 0.36], half: [0.018, 0.09, 0.02], rot: [0, 0.9, 0]}
  hole:
    material: hole
    space: body
    prims:
      - cylinder: {a: [0, 0.3, 0], b: [0, 0.56, 0], r: 0.4}
  fallen_stones:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0.62, 0.07, 0.62], half: [0.12, 0.07, 0.1], rot: [0, 0.6, 0], round: 0.04}
      - box: {c: [0.35, 0.06, 0.82], half: [0.1, 0.06, 0.09], rot: [0, -0.3, 0], round: 0.04}
  post_L:         # standing post (screen left)
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [-0.72, 0.85, 0], half: [0.07, 0.85, 0.07]}
  post_R:         # snapped post (screen right)
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [0.72, 0.38, 0], half: [0.07, 0.38, 0.07]}
      - cone: {a: [0.72, 0.74, 0.0], b: [0.75, 0.9, 0.02], r: [0.06, 0.015]}
  post_R_cut:
    material: cut
    space: body
    prims:
      - cone: {a: [0.68, 0.77, 0.06], b: [0.74, 0.72, 0.07], r: [0.035, 0.03]}
  crossbar:       # winch bar hanging from the left post down onto the wall
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.68, 1.6, 0.0], b: [0.55, 0.72, 0.1], r: 0.06}
  crank:
    material: iron
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.8, 1.6, 0.0], b: [-0.92, 1.6, 0.0], r: 0.025}
      - cylinder: {a: [-0.92, 1.6, 0.0], b: [-0.92, 1.42, 0.05], r: 0.025}
  rope_hang:      # cut rope dangling from the bar into the well
    material: rope
    space: body
    prims:
      - cylinder: {a: [-0.1, 1.17, 0.05], b: [-0.08, 0.72, 0.08], r: 0.025}
      - cylinder: {a: [-0.08, 0.72, 0.08], b: [-0.02, 0.62, 0.12], r: 0.022}
  bucket:         # fallen on its side in front, right
    material: bucket
    space: body
    line: true
    prims:
      - cone: {a: [0.38, 0.16, 1.0], b: [0.82, 0.15, 0.82], r: [0.15, 0.18]}
    cut:
      - cylinder: {a: [0.8, 0.15, 0.83], b: [0.95, 0.15, 0.77], r: 0.14}
  bucket_in:
    material: hole
    space: body
    prims:
      - cylinder: {a: [0.78, 0.15, 0.84], b: [0.8, 0.15, 0.83], r: 0.13}
  hoops:
    material: iron
    space: body
    prims:
      - torus: {c: [0.48, 0.16, 0.96], R: 0.165, r: 0.028, rot: [0, 0.39, 1.5708]}
      - torus: {c: [0.74, 0.15, 0.85], R: 0.18, r: 0.028, rot: [0, 0.39, 1.5708]}
  rope_end:       # frayed rope still tied to the bucket handle
    material: rope
    space: body
    prims:
      - cylinder: {a: [0.6, 0.3, 0.9], b: [0.2, 0.04, 1.1], r: 0.022}
      - cylinder: {a: [0.2, 0.04, 1.1], b: [-0.2, 0.03, 1.0], r: 0.022}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
