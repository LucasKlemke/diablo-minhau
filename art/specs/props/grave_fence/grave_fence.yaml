# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: grave_fence
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.55, 0]}
shadow: {rx: 18, ry: 3, alpha: 80}

# Graveyard dressing around the crypt (with crypt_floor, tombstone, dead_tree).
brief:
  summary: 2-tile (1.76 units, 32 px) section of rusty spiked iron graveyard fence between two short stone
    posts, one bar bent; segments tile side by side along x
  must_keep: [stone posts with caps, spiked iron bars, two rails, one bent bar]
  exceptions: |
    kind prop, size 48, directions 1, mirror false. camera.scale/pitch/light untouched.
    Spec-local ramps keep index 0 = #1c0f1a; stone and iron ramps match the crypt.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot) is the ground point at the centre of the segment; the
    fence runs along x from -0.88 to 0.88 (post centres at +-0.80), so segments placed 32 px apart join
    post to post. Only the horizontal (front-facing) run exists; sides of a yard use the same segment.

ramps:
  gf_stone: ["#1c0f1a", "#46405a", "#6a6480", "#918aa3", "#bcb6c8"]
  gf_iron:  ["#1c0f1a", "#2e3040", "#4b5266", "#7a849a"]

materials:
  stone: {ramp: gf_stone, bands: [1, 4]}
  iron:  {ramp: gf_iron, bands: [1, 3]}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  post_L:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0.78, 0.42, 0], half: [0.10, 0.42, 0.10], round: 0.02}
      - box: {c: [0.78, 0.88, 0], half: [0.13, 0.05, 0.13], round: 0.02}
      - box: {c: [0.78, 0.97, 0], half: [0.07, 0.05, 0.07], round: 0.02}
  rails:
    material: iron
    space: body
    prims:
      - box: {c: [0, 0.22, 0], half: [0.70, 0.03, 0.025]}
      - box: {c: [0, 0.68, 0], half: [0.70, 0.03, 0.025]}
  bars:
    material: iron
    space: body
    blend: 0.01
    prims:
      - cylinder: {a: [-0.52, 0.02, 0], b: [-0.52, 0.86, 0], r: 0.03}
      - cone: {a: [-0.52, 0.86, 0], b: [-0.52, 0.98, 0], r: [0.045, 0.01]}
      - cylinder: {a: [-0.26, 0.02, 0], b: [-0.26, 0.86, 0], r: 0.03}
      - cone: {a: [-0.26, 0.86, 0], b: [-0.26, 0.98, 0], r: [0.045, 0.01]}
      - cylinder: {a: [0, 0.02, 0], b: [0, 0.86, 0], r: 0.03}
      - cone: {a: [0, 0.86, 0], b: [0, 0.98, 0], r: [0.045, 0.01]}
      - cylinder: {a: [0.26, 0.02, 0], b: [0.26, 0.70, 0], r: 0.03}
      - chain: {pts: [[0.26, 0.70, 0], [0.36, 0.80, 0.05], [0.44, 0.86, 0.08]], r: [0.03, 0.03, 0.01]}
      - cylinder: {a: [0.52, 0.02, 0], b: [0.52, 0.86, 0], r: 0.03}
      - cone: {a: [0.52, 0.86, 0], b: [0.52, 0.98, 0], r: [0.045, 0.01]}

animations:
  idle: {frames: 1, ms: 1000, channels: {}}
