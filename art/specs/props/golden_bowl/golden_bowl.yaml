# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: golden_bowl
kind: prop
view: topdown
size: 32
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.0698, 0]}   # 1 px above the pivot -> pivot (16, 17)
shadow: {rx: 6, ry: 2, alpha: 80}

# Prologue: the royal dog's little golden bowl.
brief:
  summary: small shiny golden dog bowl, low and wide with a rolled lip, darker gold inside, a tiny blue gem
    on the front, a sparkle on the rim
  must_keep: [gold, low wide bowl shape, darker inside, sparkle]
  simplify: [no engraving: the bowl is ~11 px wide]
  exceptions: |
    kind prop, size 32, directions 1, mirror false, camera.center [0, 0.0698, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 16,17) is the ground point under the bowl's
    centre. Radius 0.3 (~11 px) -> footprint 1x1 tile, walkable (interactable). Static: 1-frame idle.

ramps:
  gb_gold:   ["#1c0f1a", "#804a19", "#c7861f", "#e1a227", "#eddc83", "#f8f4dd"]
  gb_inside: ["#1c0f1a", "#6a3c14", "#a86c1c", "#c7861f"]
  gb_blue:   ["#1c0f1a", "#1e2978", "#2c60d5", "#5f93ea"]
  gb_spark:  ["#1c0f1a", "#ffffff"]

materials:
  gold:   {ramp: gb_gold, bands: [2, 5]}
  inside: {ramp: gb_inside, bands: [1, 3], line: false}
  gem:    {ramp: gb_blue, bands: [2, 3], outline: false, line: false}
  spark:  {ramp: gb_spark, emissive: true, band: 1, outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  bowl:
    material: gold
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 0.0, 0], b: [0, 0.12, 0], r: 0.3, round: 0.03}
      - torus: {c: [0, 0.13, 0], R: 0.27, r: 0.04}
    cut:
      - cylinder: {a: [0, 0.07, 0], b: [0, 0.3, 0], r: 0.23}
  inside:
    material: inside
    space: body
    prims:
      - cylinder: {a: [0, 0.06, 0], b: [0, 0.075, 0], r: 0.235}
  gem:
    material: gem
    space: body
    prims:
      - sphere: {c: [0, 0.07, 0.305], r: 0.035}
  spark:
    material: spark
    space: body
    prims:
      - box: {c: [-0.17, 0.16, 0.16], half: [0.02, 0.02, 0.02]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
