# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: castle_rubble
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.5584, 0]}   # 8 px above the pivot -> pivot (24, 32)
shadow: null             # the pale dust skirt under the heap is its contact

# Prologue (the castle destroyed): heaps of broken white marble.
brief:
  summary: heaps of broken white marble from the hall's walls and columns - angular chunks piled higher in
    the middle, a fluted column drum, a few gold fragments of capitals, a skirt of pale dust underneath
  must_keep: [white marble of castle_column / castle_throne, gold bits, chunky angular silhouette, 3 sizes]
  simplify: [chunks as rounded boxes, 2-3 tones each, dust as a flat pale shape]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 0.5584, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: pivot (24, 32) = the ground point at the centre of the heap. VARIANTS: animation
    `variants` has 3 frames: 0 big heap (~2 x 1.5 tiles, blocking), 1 medium (1.5 x 1 tiles, blocking),
    2 small scatter (1 tile, walkable); `idle` = variant 0. Geometry generated once from a seeded layout.

ramps:
  rb_marble: ["#1c0f1a", "#6e6480", "#a39bb2", "#d6d0de", "#f6f4f8"]
  rb_gold:   ["#1c0f1a", "#804a19", "#c7861f", "#e1a227", "#eddc83"]
  rb_dust:   ["#1c0f1a", "#cfc6c0"]

materials:
  marble: {ramp: rb_marble, bands: [1, 4]}
  gold:   {ramp: rb_gold, bands: [2, 4]}
  dust:   {ramp: rb_dust, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]
  var: 0             # variant 0..2

bones:
  body: {parent: root}

