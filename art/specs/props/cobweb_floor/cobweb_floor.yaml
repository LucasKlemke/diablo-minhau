# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: cobweb_floor
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}   # pivot = frame centre (24, 24) = the ground point
shadow: null             # a decal on the floor

# Act I dungeon "Casa Abandonada": floor decals of the flea-infested cellar.
brief:
  summary: flat floor decals - thick grey-white sticky cobwebs (spokes and rings), sickly yellow-green
    larva goo puddles with clumps of pale glossy parasite eggs; four looks - a big web, a goo puddle with a
    clutch of eggs, a web over goo with eggs, a torn web corner with a few eggs
  must_keep: [pale web strands that read on a dark floor, sickly goo, outlined pale eggs]
  simplify: [strands as thin flat boxes, goo as flat blobs, eggs as tiny ellipsoids]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 0, 0]. Webs and goo have
    no outline (an outlined decal looks like a hole, as in blood_splat); the eggs keep the dark outline so
    they pop. camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (24, 24) = frame centre = the ground point under the decal. Draw it on the floor
    layer (below actors and props), NOT blocking. Up to ~1.9 units wide (~2x2 tiles). VARIANTS: `variants`
    has 4 frames (frame i = variant i); `idle` = variant 0. Layout generated once from a seeded script.

ramps:
  cw_web:   ["#1c0f1a", "#cdc6be"]
  cw_dust:  ["#1c0f1a", "#3a3438"]
  cw_goo:   ["#1c0f1a", "#5a6a1a"]
  cw_shine: ["#1c0f1a", "#a6b43a"]
  cw_egg:   ["#1c0f1a", "#9a8a5a", "#d6cc98", "#f2ecc8"]

materials:
  web:      {ramp: cw_web, bands: [1, 1], outline: false, line: false}
  dust:     {ramp: cw_dust, bands: [1, 1], outline: false, line: false}
  goo:      {ramp: cw_goo, bands: [1, 1], outline: false, line: false}
  gooshine: {ramp: cw_shine, bands: [1, 1], outline: false, line: false}
  egg:      {ramp: cw_egg, bands: [1, 3]}

channels:
  root: [0, 0, 0]
  v: 0

bones:
  body: {parent: root}

