spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: crypt
kind: prop
view: topdown
size: 96                 # 4.4 units wide = 80 px at camera.scale 0.055, 2+ px margins
directions: 1            # faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.3, 0.1]}
shadow: {rx: 44, ry: 12, alpha: 110}

# Overworld dungeon entrance (replaces a darkened Farm RPG house). Clicking the doorway takes the party down.
brief:
  summary: sinister half-ruined mausoleum entrance, ~4.4 units wide (80 px, 5x3 tiles of 16 px) and ~3 tall;
    mossy dark stone on a low plinth, peaked stone roof broken at one corner, skull carved in the gable above
    a dark arched doorway with stone steps going DOWN into near-black, a faint purple glow deep inside,
    an iron gate pushed open, two iron wall sconces with orange flames, bones and rubble at the base
  must_keep: [dark arched doorway with descending steps and purple glow, skull above the door, two torches,
    open iron gate, peaked roof with a broken corner, moss, bones and rubble]
  simplify: [no tiles drawn on the roof beyond a few ridges, cracks as dark lines, bones as 2-3 prim pieces]
  exceptions: |
    kind prop, size 96, directions 1, mirror false; camera.center [0, 1.3, 0.1]; wide flat shadow.
    camera.scale/pitch/light untouched. Spec-local ramps all keep index 0 = #1c0f1a.
  decisions: |
    The crypt stands on a 0.4-tall plinth so the stairs can descend inside the building (from the threshold
    down to the ground level) without poking below the sprite; seen from 38 degrees they read as going down.
    The stone is a cool grey-violet so it contrasts with grass, swamp and snow; moss is a dark green.
    Ruin: the right roof corner and wall top are broken off, the fallen blocks lie at the right of the base.
    Gate: two iron leaves swung outward against the jambs, the right one sagging.
    Pivot = world origin (footprint centre on the ground).

ramps:
  crypt_stone: ["#1c0f1a", "#46405a", "#6a6480", "#918aa3", "#bcb6c8"]
  crypt_dark:  ["#1c0f1a", "#332d40", "#4a4359", "#655d74"]
  crypt_roof:  ["#1c0f1a", "#262840", "#3a3d5e", "#52587e"]
  crypt_moss:  ["#1c0f1a", "#2b4a22", "#4f7d33", "#74a347"]
  crypt_iron:  ["#1c0f1a", "#2e3040", "#4b5266", "#7a849a"]
  crypt_bone:  ["#1c0f1a", "#7a6a58", "#c4b496", "#ece2c6"]
  crypt_void:  ["#1c0f1a", "#140a14", "#24112a"]
  crypt_glow:  ["#310e8b", "#5c1fa8", "#9a4fd8", "#cb71ff"]
  crypt_fire:  ["#902308", "#fe6607", "#fbbe71", "#fbf1d5"]

materials:
  stone:  {ramp: crypt_stone, bands: [1, 3]}
  stone_dk: {ramp: crypt_dark, bands: [1, 3]}
  deep:   {ramp: crypt_dark, bands: [1, 1], outline: false}
  roof:   {ramp: crypt_roof, bands: [1, 3]}
  moss:   {ramp: crypt_moss, bands: [1, 3]}
  iron:   {ramp: crypt_iron, bands: [1, 3]}
  bone:   {ramp: crypt_bone, bands: [1, 3]}
  void:   {ramp: crypt_void, emissive: true, band: 1, outline: false, line: false}
  crack:  {ramp: crypt_void, emissive: true, band: 0, outline: false, line: false}
  glow:   {ramp: crypt_glow, emissive: true, band: 1, outline: false, line: false, glow: {color: "#9a4fd8", mix: 0.3, radius: 1}}
  glow_core: {ramp: crypt_glow, emissive: true, band: 2, outline: false, line: false}
  flame:  {ramp: crypt_fire, emissive: true, band: 1, outline: false, line: false, glow: {color: "#fe8a2a", mix: 0.4, radius: 1}}
  flame_core: {ramp: crypt_fire, emissive: true, band: 3, outline: false, line: false}

channels:
  root: [0, 0, 0]
  flicker_L: 1        # torch flame height (1 = rest); automatic flicker_R twin
  sway_L: 0           # torch flame tip sideways sway
  glow: 1             # purple glow deep inside the doorway (size)

# Layout (world units, +x = screen right, +z = towards the camera). Plinth top y 0.40; walls y 0.40..2.00,
# z -0.62..0.62 (front face z 0.62); roof ridge y ~3.1; doorway x +-0.50, threshold y 0.40, arch top y 1.82.
bones:
  body:    {parent: root}
  torch_L: {parent: body, pos: [1.12, 1.58, 0.66]}                       # sconce cup on the front wall
  flame_L: {parent: torch_L, pos: [0, 0.10, 0.14], scale: "[1, flicker_L, 1]"}
  gate_a:  {parent: body, pos: [0.54, 0.42, 0.84], rot: [0, 2.55, 0]}    # right leaf (screen right), swung out
  gate_b:  {parent: body, pos: [-0.54, 0.42, 0.84], rot: [0, 0.68, -0.07]}   # left leaf, sagging

parts:
  plinth:          # low stone platform; the stairwell is cut into it inside the building
    material: stone_dk
    space: body
    prims:
      - box: {c: [0, 0.20, 0.10], half: [1.80, 0.20, 1.02], round: 0.04}
    cut:
      - box: {c: [0, 0.25, 0.0], half: [0.50, 0.30, 0.62]}
  walls:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0, 1.20, 0], half: [1.45, 0.80, 0.62], round: 0.03}
    cut:
      - box: {c: [0, 0.85, 0.10], half: [0.50, 0.45, 0.60]}                 # doorway tunnel
      - cylinder: {a: [0, 1.30, 0.90], b: [0, 1.30, -0.48], r: 0.50}          # arch
      - sphere: {c: [1.58, 2.30, 0.45], r: 0.66}                              # broken corner
  pillar_L:        # door jambs (mirrored)
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0.70, 1.08, 0.70], half: [0.15, 0.68, 0.11], round: 0.02}
      - box: {c: [0.70, 0.47, 0.72], half: [0.19, 0.07, 0.14], round: 0.02}   # base
  buttress_b:      # corner buttresses (the right one is broken lower)
    material: stone_dk
    space: body
    line: true
    prims:
      - box: {c: [-1.48, 0.98, 0.58], half: [0.18, 0.60, 0.18], round: 0.03}
      - cone: {a: [-1.48, 1.58, 0.58], b: [-1.48, 1.86, 0.58], r: [0.16, 0.03]}
  buttress_a:
    material: stone_dk
    space: body
    line: true
    prims:
      - box: {c: [1.48, 0.78, 0.58], half: [0.18, 0.40, 0.18], round: 0.03}
  arch:            # stone arch ring around the doorway
    material: stone_dk
    space: body
    line: true
    prims:
      - torus: {c: [0, 1.30, 0.68], R: 0.59, r: 0.09, rot: [1.5708, 0, 0]}
      - box: {c: [0, 1.92, 0.73], half: [0.10, 0.11, 0.08]}                  # keystone
    cut:
      - box: {c: [0, 0.80, 0.68], half: [0.8, 0.50, 0.3]}
  gable:           # front triangle under the roof
    material: stone
    space: body
    prims:
      - tri: {a: [-1.50, 1.98, 0.62], b: [1.50, 1.98, 0.62], c: [0, 3.02, 0.62], th: 0.03}
    cut:
      - sphere: {c: [1.58, 2.30, 0.45], r: 0.66}
  roof_a:          # right roof slab (screen right), broken corner
    material: roof
    space: body
    line: true
    prims:
      - box: {c: [0.82, 2.52, 0], half: [0.98, 0.08, 0.80], rot: [0, 0, -0.62]}
    cut:
      - sphere: {c: [1.58, 2.30, 0.45], r: 0.74}
      - box: {c: [1.05, 2.75, 0.62], half: [0.22, 0.14, 0.30], rot: [0, 0, 0.5]}
  roof_b:          # left roof slab
    material: roof
    space: body
    line: true
    prims:
      - box: {c: [-0.82, 2.52, 0], half: [0.98, 0.08, 0.80], rot: [0, 0, 0.62]}
  ribs_a:          # slate courses on the right slab
    material: roof
    space: body
    prims:
      - box: {c: [0.45, 2.82, -0.05], half: [0.04, 0.05, 0.82], rot: [0, 0, -0.62]}
      - box: {c: [0.92, 2.49, -0.15], half: [0.04, 0.05, 0.72], rot: [0, 0, -0.62]}
    cut:
      - sphere: {c: [1.58, 2.30, 0.45], r: 0.74}
      - box: {c: [1.05, 2.75, 0.62], half: [0.22, 0.14, 0.30], rot: [0, 0, 0.5]}
  ribs_b:
    material: roof
    space: body
    prims:
      - box: {c: [-0.45, 2.82, 0], half: [0.04, 0.05, 0.82], rot: [0, 0, 0.62]}
      - box: {c: [-0.92, 2.49, 0], half: [0.04, 0.05, 0.82], rot: [0, 0, 0.62]}
      - box: {c: [-1.38, 2.17, 0], half: [0.04, 0.05, 0.82], rot: [0, 0, 0.62]}
  coping_a:        # light stone rake along the front edge of the roof (reads the peak), broken on the right
    material: stone
    space: body
    line: true
    prims:
      - cone: {a: [0, 3.16, 0.80], b: [1.66, 2.02, 0.80], r: [0.075, 0.075]}
    cut:
      - sphere: {c: [1.58, 2.30, 0.45], r: 0.74}
      - box: {c: [1.05, 2.75, 0.62], half: [0.22, 0.14, 0.30], rot: [0, 0, 0.5]}
  coping_b:
    material: stone
    space: body
    line: true
    prims:
      - cone: {a: [0, 3.16, 0.80], b: [-1.66, 2.02, 0.80], r: [0.075, 0.075]}
  finial:          # stone finial on the front apex
    material: stone
    space: body
    line: true
    blend: 0.02
    prims:
      - box: {c: [0, 3.22, 0.78], half: [0.11, 0.06, 0.11]}
      - cone: {a: [0, 3.25, 0.78], b: [0, 3.62, 0.78], r: [0.09, 0.03]}
  roof_ridge:
    material: roof
    space: body
    prims:
      - box: {c: [0, 3.08, 0], half: [0.10, 0.08, 0.82], round: 0.02}
  doorway:         # near-black back of the passage
    material: void
    space: body
    prims:
      - box: {c: [0, 0.80, -0.52], half: [0.52, 0.80, 0.06]}
  # Stairs descending away from the threshold. Seen from 38 degrees a descending stair compresses to
  # ~3 px per step and only the treads show, so the steps read as bands that darken into the void.
  step_1:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0, 0.30, 0.44], half: [0.50, 0.04, 0.18]}
  step_2:
    material: stone_dk
    space: body
    line: true
    prims:
      - box: {c: [0, 0.24, 0.08], half: [0.50, 0.04, 0.18]}
  step_3:
    material: deep
    space: body
    line: true
    prims:
      - box: {c: [0, 0.18, -0.28], half: [0.50, 0.04, 0.18]}
  glow_deep:
    material: glow
    space: body
    prims:
      - ellipsoid: {c: [0, 0.26, -0.47], r: "[0.38*glow, 0.13*glow, 0.03]"}
  glow_core:
    material: glow_core
    space: body
    prims:
      - ellipsoid: {c: [0, 0.24, -0.45], r: "[0.17*glow, 0.06*glow, 0.03]"}
  skull:           # carving in the gable
    material: bone
    space: body
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 2.38, 0.68], r: [0.25, 0.22, 0.08]}
      - ellipsoid: {c: [0, 2.19, 0.70], r: [0.15, 0.09, 0.07]}
    cut:
      - box: {c: [0, 2.13, 0.80], half: [0.11, 0.012, 0.06]}
  skull_eyes:
    material: void
    space: body
    prims:
      - sphere: {c: [0.095, 2.36, 0.74], r: 0.07}
      - sphere: {c: [-0.095, 2.36, 0.74], r: 0.07}
      - sphere: {c: [0, 2.24, 0.76], r: 0.03}
  cracks:
    material: crack
    space: body
    prims:
      - box: {c: [-1.05, 1.62, 0.635], half: [0.025, 0.18, 0.01], rot: [0, 0, 0.35]}
      - box: {c: [-1.00, 1.32, 0.635], half: [0.025, 0.15, 0.01], rot: [0, 0, -0.30]}
      - box: {c: [1.08, 0.92, 0.635], half: [0.025, 0.20, 0.01], rot: [0, 0, -0.25]}
      - box: {c: [0.48, 2.40, 0.645], half: [0.025, 0.15, 0.01], rot: [0, 0, 0.6]}
  moss:
    material: moss
    space: body
    blend: 0.05
    prims:
      - ellipsoid: {c: [-0.85, 2.52, 0.15], r: [0.42, 0.10, 0.34], rot: [0, 0, 0.62]}
      - ellipsoid: {c: [-0.42, 2.82, 0.62], r: [0.24, 0.08, 0.18], rot: [0, 0, 0.62]}
      - ellipsoid: {c: [0.50, 2.75, -0.30], r: [0.30, 0.08, 0.30], rot: [0, 0, -0.62]}
      - ellipsoid: {c: [-1.40, 0.50, 0.75], r: [0.30, 0.16, 0.18]}
      - ellipsoid: {c: [-1.10, 0.42, 0.98], r: [0.35, 0.06, 0.18]}
      - ellipsoid: {c: [1.25, 0.42, 0.96], r: [0.30, 0.06, 0.16]}
  sconce_L:        # iron wall torch
    material: iron
    space: torch_L
    blend: 0.02
    prims:
      - cone: {a: [0, -0.22, -0.02], b: [0, -0.02, 0.12], r: [0.045, 0.04]}
      - cylinder: {a: [0, -0.04, 0.14], b: [0, 0.08, 0.14], r: 0.09}
      - box: {c: [0, -0.22, -0.01], half: [0.08, 0.08, 0.02]}
  flame_L:
    material: flame
    space: flame_L
    blend: 0.04
    prims:
      - ellipsoid: {c: [0, 0.07, 0], r: [0.12, 0.13, 0.10]}
      - cone: {a: [0, 0.11, 0], b: ["sway_L", 0.38, 0], r: [0.09, 0.015]}
  flame_core_L:
    material: flame_core
    space: flame_L
    prims:
      - ellipsoid: {c: [0, 0.05, 0.08], r: [0.05, 0.07, 0.04]}
  gate_bars_a:
    material: iron
    space: gate_a
    blend: 0.01
    prims: &gate
      - cylinder: {a: [-0.04, 0.02, 0], b: [-0.04, 1.00, 0], r: 0.035}
      - cylinder: {a: [-0.20, 0.02, 0], b: [-0.20, 1.04, 0], r: 0.035}
      - cylinder: {a: [-0.36, 0.02, 0], b: [-0.36, 1.00, 0], r: 0.035}
      - box: {c: [-0.20, 0.12, 0], half: [0.20, 0.035, 0.03]}
      - box: {c: [-0.20, 0.84, 0], half: [0.20, 0.035, 0.03]}
      - cone: {a: [-0.20, 1.02, 0], b: [-0.20, 1.16, 0], r: [0.05, 0.01]}
      - cone: {a: [-0.04, 0.98, 0], b: [-0.04, 1.10, 0], r: [0.045, 0.01]}
      - cone: {a: [-0.36, 0.98, 0], b: [-0.36, 1.10, 0], r: [0.045, 0.01]}
  gate_bars_b:
    material: iron
    space: gate_b
    blend: 0.01
    prims: *gate
  rubble:          # fallen blocks from the broken corner and loose stones
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [1.75, 0.14, 1.20], half: [0.20, 0.14, 0.16], rot: [0.1, 0.6, 0.15], round: 0.03}
      - box: {c: [1.98, 0.10, 0.62], half: [0.16, 0.10, 0.18], rot: [0, -0.4, 0.1], round: 0.03}
      - box: {c: [1.50, 0.08, 1.45], half: [0.12, 0.08, 0.10], rot: [0, 0.9, 0], round: 0.02}
      - box: {c: [1.62, 0.50, 0.85], half: [0.15, 0.10, 0.14], rot: [0.2, 0.3, -0.3], round: 0.03}
      - box: {c: [-1.92, 0.09, 0.92], half: [0.14, 0.09, 0.12], rot: [0, 0.5, 0], round: 0.03}
      - box: {c: [-0.85, 0.06, 1.36], half: [0.10, 0.06, 0.08], rot: [0, -0.3, 0], round: 0.02}
  bones:           # scattered bones and a skull in front
    material: bone
    space: body
    blend: 0.02
    prims:
      - cone: {a: [-1.45, 0.04, 1.30], b: [-1.05, 0.04, 1.48], r: [0.04, 0.035]}
      - sphere: {c: [-1.47, 0.05, 1.28], r: 0.055}
      - sphere: {c: [-1.03, 0.05, 1.49], r: 0.05}
      - cone: {a: [-1.75, 0.04, 1.18], b: [-1.62, 0.04, 1.50], r: [0.035, 0.035]}
      - sphere: {c: [0.95, 0.10, 1.42], r: 0.11}                              # skull
      - ellipsoid: {c: [0.95, 0.05, 1.51], r: [0.07, 0.05, 0.05]}
      - cone: {a: [0.55, 0.04, 1.50], b: [0.75, 0.04, 1.28], r: [0.035, 0.035]}
      - cone: {a: [1.95, 0.04, 1.25], b: [2.05, 0.04, 0.95], r: [0.035, 0.03]}
  bones_dark:
    material: crack
    space: body
    prims:
      - sphere: {c: [0.91, 0.11, 1.52], r: 0.03}
      - sphere: {c: [0.99, 0.11, 1.52], r: 0.03}

animations:
  idle:
    frames: 6
    ms: 120
    channels:
      flicker_L: "1 + 0.20*sin(p) + 0.10*sin(2*p + 1.2)"
      flicker_R: "1 + 0.20*sin(p + 2.4) + 0.10*sin(2*p + 0.3)"
      sway_L: "0.05*sin(p + 0.8)"
      sway_R: "0.05*sin(p + 3.0)"
      glow: "1 + 0.18*sin(p)"
