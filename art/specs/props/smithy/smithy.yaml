# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: smithy
kind: prop
view: topdown
size: 96
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 2.2335 = 32 px above the pivot -> pivot (48, 80), integer
camera: {pitch: 38, scale: 0.055, center: [0, 2.2335, 0]}
shadow: {rx: 34, ry: 9, alpha: 70}

# Act I, Minhau: Marta's smithy - an open work shed; the brick `forge_chimney` stands beside it.
brief:
  summary: Marta's open-air smithy - a lean-to shed of dark posts and a plank back wall under a roof of old
    dark shingles, a workbench along the back wall with a vise, hammers and tongs hanging above it; in
    front, out in the open, a black iron anvil on a thick stump, a quench barrel of dark water, a
    grindstone on a wooden frame and a few iron bars leaning on a post. Cold (idle) = everything dark and
    still; lit = a glowing iron bar on the anvil, sparks jumping, the lantern under the roof lit
  must_keep: [lean-to shed, anvil on a stump (the striking shape), quench barrel, tools on the back wall,
    room on the right for forge_chimney, hot glowing bar + sparks when lit]
  simplify: [tools as 2-3 primitives each, shingles as course lines, sparks as 1-2 px dots]
  exceptions: |
    kind prop, size 96, directions 1, mirror false, camera.center [0, 2.2335, 0] (integer pivot).
    The hot iron, sparks and lantern flame are emissive, only in `lit`. camera.scale/pitch/light
    untouched. Ramps from palettes/ruin.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 48,80) is the ground point at the centre of
    the FRONT edge of the 4x3 footprint (like house). Shed x -1.6..1.6, z -2.4..0, the yard objects in
    front up to z +0.5 -> footprint 4x3 tiles; block the back 4x2 (shed, bench) and the anvil tile, keep
    the front row around the anvil walkable for Marta. FORGE CHIMNEY: draw `forge_chimney` with its pivot
    at (+40, -16) px from the smithy pivot (+2.5 tiles right, 1 tile up): its 2x1 base then sits against
    the shed's right posts with the forge mouth facing the anvil; play its `lit` together with ours.
    The roof covers only the back of the shed so the anvil stays in view from the 38-degree camera.
    Clips: idle (cold, 1 frame) and lit (6 frames x 100 ms: the hot bar pulses, sparks fly off the
    anvil, the lantern flickers).

materials:
  post:    {ramp: rwood, bands: [1, 3]}
  wall:    {ramp: rplank, bands: [1, 3]}
  wall_ln: {ramp: rplank, bands: [1, 1], outline: false, line: false}
  roof:    {ramp: rwood, bands: [1, 3]}
  roof_ln: {ramp: rchar, bands: [1, 1], outline: false, line: false}
  bench:   {ramp: rwood, bands: [2, 4]}
  stump:   {ramp: hwood, bands: [1, 3]}
  cut:     {ramp: hcut, bands: [1, 2]}
  iron:    {ramp: riron, bands: [3, 5]}
  iron_dk: {ramp: riron, bands: [1, 3]}
  water:   {ramp: rblue, bands: [1, 2], outline: false, line: false}
  stone:   {ramp: rstone, bands: [2, 4]}
  leather: {ramp: rhide, bands: [1, 3]}
  rope:    {ramp: rrope, bands: [2, 3], outline: false}
  soot:    {ramp: rchar, bands: [1, 2], outline: false, line: false}
  hot:     {ramp: rfire, emissive: true, band: 5, outline: false, line: false, glow: {color: "#fe6607", mix: 0.45, radius: 1}}
  hot_hi:  {ramp: rfire, emissive: true, band: 6, outline: false, line: false}
  spark:   {ramp: rfire, emissive: true, band: 6, outline: false, line: false, glow: {color: "#ffa12e", mix: 0.4, radius: 1}}
  flame:   {ramp: rlamp, emissive: true, band: 4, outline: false, line: false, glow: {color: "#f0a040", mix: 0.4, radius: 1}}
  glass:   {ramp: rash, bands: [1, 2], outline: false, line: false}

channels:
  root: [0, 0, 0]
  lit: 0
  glow: 1

bones:
  body: {parent: root}

parts:
  soot_ground:      # trampled, sooty ground of the yard
    material: soot
    space: body
    blend: 0.05
    prims:
      - ellipsoid: {c: [0.55, 0.01, -0.2], r: [0.9, 0.02, 0.5]}
  # ---------- shed ----------
  back_wall:
    material: wall
    space: body
    line: true
    prims:
      - box: {c: [0, 1.4, -2.35], half: [1.6, 1.4, 0.06]}
  wall_lines:
    material: wall_ln
    space: body
    prims:
      - box: {c: [0, 0.5, -2.28], half: [1.55, 0.02, 0.01]}
      - box: {c: [0, 0.95, -2.28], half: [1.55, 0.02, 0.01]}
      - box: {c: [0, 1.4, -2.28], half: [1.55, 0.02, 0.01]}
      - box: {c: [0, 1.85, -2.28], half: [1.55, 0.02, 0.01]}
  side_wall:        # half-height plank wall on the left side
    material: wall
    space: body
    line: true
    prims:
      - box: {c: [-1.55, 0.6, -1.6], half: [0.05, 0.6, 0.75]}
  posts:
    material: post
    space: body
    line: true
    prims:
      - box: {c: [-1.55, 1.4, -2.35], half: [0.1, 1.4, 0.1]}
      - box: {c: [1.55, 1.4, -2.35], half: [0.1, 1.4, 0.1]}
      - box: {c: [-1.55, 1.2, -0.85], half: [0.1, 1.2, 0.1]}
      - box: {c: [1.55, 1.2, -0.85], half: [0.1, 1.2, 0.1]}
  braces:
    material: post
    space: body
    line: true
    prims:
      - box: {c: [-1.2, 2.15, -0.85], half: [0.4, 0.05, 0.05], rot: [0, 0, 0.6]}
      - box: {c: [1.2, 2.15, -0.85], half: [0.4, 0.05, 0.05], rot: [0, 0, -0.6]}
  roof:             # lean-to of dark shingles, high at the back
    material: roof
    space: body
    line: true
    prims:
      - box: {c: [0, 2.65, -1.7], half: [1.8, 0.08, 0.85], rot: [0.32, 0, 0]}
  roof_edge:        # front edge board of the roof
    material: post
    space: body
    line: true
    prims:
      - box: {c: [0, 2.35, -0.88], half: [1.82, 0.09, 0.05], rot: [0.32, 0, 0]}
  shingles:
    material: roof_ln
    space: body
    prims:
      - box: {c: [0, 2.908, -2.194], half: [1.76, 0.015, 0.03], rot: [0.32, 0, 0]}
      - box: {c: [0, 2.782, -1.814], half: [1.76, 0.015, 0.03], rot: [0.32, 0, 0]}
      - box: {c: [0, 2.656, -1.435], half: [1.76, 0.015, 0.03], rot: [0.32, 0, 0]}
      - box: {c: [0, 2.53, -1.055], half: [1.76, 0.015, 0.03], rot: [0.32, 0, 0]}
      - box: {c: [-1.3, 2.845, -2.004], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [-0.4, 2.845, -2.004], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [0.5, 2.845, -2.004], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [1.3, 2.845, -2.004], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [-0.9, 2.719, -1.625], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [0.0, 2.719, -1.625], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [0.9, 2.719, -1.625], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [-1.3, 2.593, -1.245], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [-0.4, 2.593, -1.245], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [0.5, 2.593, -1.245], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
      - box: {c: [1.3, 2.593, -1.245], half: [0.03, 0.015, 0.18], rot: [0.32, 0, 0]}
  # ---------- workbench and tools ----------
  bench:
    material: bench
    space: body
    line: true
    prims:
      - box: {c: [-0.5, 0.82, -2.0], half: [0.9, 0.06, 0.26]}
      - box: {c: [-1.3, 0.4, -2.0], half: [0.06, 0.4, 0.2]}
      - box: {c: [0.3, 0.4, -2.0], half: [0.06, 0.4, 0.2]}
  vise:
    material: iron_dk
    space: body
    line: true
    prims:
      - box: {c: [0.15, 0.98, -1.8], half: [0.1, 0.1, 0.08]}
      - cylinder: {a: [0.15, 1.0, -1.7], b: [0.15, 1.0, -1.5], r: 0.025}
  tools:            # hammers and tongs hanging on the back wall
    material: iron_dk
    space: body
    line: true
    prims:
      - box: {c: [-1.1, 1.62, -2.26], half: [0.1, 0.05, 0.04]}
      - box: {c: [-0.75, 1.6, -2.26], half: [0.08, 0.06, 0.04]}
      - cone: {a: [-0.35, 1.72, -2.26], b: [-0.42, 1.2, -2.26], r: [0.025, 0.02]}
      - cone: {a: [-0.32, 1.72, -2.26], b: [-0.24, 1.2, -2.26], r: [0.025, 0.02]}
      - box: {c: [0.1, 1.5, -2.26], half: [0.14, 0.14, 0.02]}                       # horseshoe plate
  tool_hafts:
    material: bench
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.1, 1.6, -2.24], b: [-1.1, 1.2, -2.24], r: 0.025}
      - cylinder: {a: [-0.75, 1.56, -2.24], b: [-0.75, 1.15, -2.24], r: 0.025}
  shoes:            # horseshoes on the plate
    material: iron
    space: body
    prims:
      - torus: {c: [0.05, 1.55, -2.23], R: 0.06, r: 0.018, rot: [1.5708, 0, 0]}
      - torus: {c: [0.17, 1.45, -2.23], R: 0.06, r: 0.018, rot: [1.5708, 0, 0]}
  bellows:          # leather bellows on the right, toward the chimney
    material: leather
    space: body
    line: true
    prims:
      - ellipsoid: {c: [1.15, 0.55, -1.75], r: [0.3, 0.14, 0.42]}
  bellows_board:
    material: bench
    space: body
    line: true
    prims:
      - box: {c: [1.15, 0.72, -1.75], half: [0.3, 0.03, 0.44]}
      - cylinder: {a: [1.15, 0.6, -1.32], b: [1.5, 0.6, -1.25], r: 0.04}
  lantern:          # hanging under the roof edge
    material: iron_dk
    space: body
    line: true
    prims:
      - box: {c: [-0.6, 1.86, -0.95], half: [0.07, 0.1, 0.07]}
      - cylinder: {a: [-0.6, 1.96, -0.95], b: [-0.6, 2.28, -0.95], r: 0.015}
  lantern_glass:
    material: glass
    space: body
    when: "lit < 0.5"
    prims:
      - box: {c: [-0.6, 1.86, -0.87], half: [0.045, 0.07, 0.01]}
  lantern_flame:
    material: flame
    space: body
    when: "lit > 0.5"
    prims:
      - box: {c: [-0.6, 1.86, -0.87], half: [0.045, "0.06 + 0.012*glow", 0.01]}
  # ---------- yard: anvil, barrel, grindstone ----------
  stump:
    material: stump
    space: body
    line: true
    prims:
      - cylinder: {a: [0.55, 0.0, -0.2], b: [0.55, 0.42, -0.2], r: 0.24, round: 0.03}
  stump_top:
    material: cut
    space: body
    prims:
      - cylinder: {a: [0.55, 0.41, -0.2], b: [0.55, 0.43, -0.2], r: 0.21}
  anvil:
    material: iron
    space: body
    line: true
    prims:
      - box: {c: [0.55, 0.55, -0.2], half: [0.13, 0.12, 0.11]}          # waist
      - box: {c: [0.5, 0.74, -0.2], half: [0.32, 0.08, 0.15]}           # face
      - cone: {a: [0.8, 0.74, -0.2], b: [1.12, 0.78, -0.2], r: [0.12, 0.025]}   # horn
      - box: {c: [0.55, 0.47, -0.2], half: [0.24, 0.05, 0.16]}          # foot
      - box: {c: [0.2, 0.74, -0.2], half: [0.05, 0.06, 0.1]}            # heel
  hammer_cold:      # hammer resting on the anvil (cold)
    material: iron_dk
    space: body
    line: true
    when: "lit < 0.5"
    prims:
      - box: {c: [0.38, 0.87, -0.1], half: [0.09, 0.055, 0.055], rot: [0, 0.5, 0]}
  hammer_cold_haft:
    material: bench
    space: body
    when: "lit < 0.5"
    prims:
      - cylinder: {a: [0.38, 0.86, -0.1], b: [0.12, 0.84, 0.2], r: 0.025}
  bar_cold:
    material: iron_dk
    space: body
    when: "lit < 0.5"
    prims:
      - cylinder: {a: [0.5, 0.84, -0.26], b: [0.9, 0.84, -0.3], r: 0.035}
  bar_hot:          # glowing bar on the anvil face (lit)
    material: hot
    space: body
    when: "lit > 0.5"
    prims:
      - cylinder: {a: [0.36, 0.85, -0.18], b: [0.86, 0.85, -0.24], r: "0.042 + 0.008*glow"}
  bar_hot_tip:
    material: hot_hi
    space: body
    when: "lit > 0.5"
    prims:
      - sphere: {c: [0.62, 0.87, -0.2], r: 0.04}
  sparks:           # 4 sparks flying out of the anvil, each at its own phase
    material: spark
    space: body
    when: "lit > 0.5"
    prims:
      - sphere: {c: "[0.6 + 0.6*(t - floor(t)), 0.9 + 0.6*(t - floor(t)) - 0.9*(t - floor(t))**2, -0.2 + 0.3*(t - floor(t))]", r: 0.042}
      - sphere: {c: "[0.55 - 0.5*(t + 0.33 - floor(t + 0.33)), 0.9 + 0.7*(t + 0.33 - floor(t + 0.33)) - 0.9*(t + 0.33 - floor(t + 0.33))**2, -0.2 + 0.2*(t + 0.33 - floor(t + 0.33))]", r: 0.042}
      - sphere: {c: "[0.6 + 0.3*(t + 0.66 - floor(t + 0.66)), 0.9 + 0.9*(t + 0.66 - floor(t + 0.66)) - 1.1*(t + 0.66 - floor(t + 0.66))**2, -0.2 + 0.4*(t + 0.66 - floor(t + 0.66))]", r: 0.04}
  barrel:           # quench barrel
    material: bench
    space: body
    line: true
    prims:
      - cylinder: {a: [1.25, 0.0, 0.25], b: [1.25, 0.55, 0.25], r: 0.24, round: 0.03}
    cut:
      - cylinder: {a: [1.25, 0.45, 0.25], b: [1.25, 0.7, 0.25], r: 0.19}
  barrel_water:
    material: water
    space: body
    prims:
      - cylinder: {a: [1.25, 0.44, 0.25], b: [1.25, 0.47, 0.25], r: 0.2}
  barrel_hoops:
    material: iron_dk
    space: body
    prims:
      - torus: {c: [1.25, 0.12, 0.25], R: 0.245, r: 0.022}
      - torus: {c: [1.25, 0.43, 0.25], R: 0.245, r: 0.022}
  tongs_in_barrel:
    material: iron_dk
    space: body
    line: true
    prims:
      - cone: {a: [1.2, 0.45, 0.25], b: [1.08, 0.95, 0.15], r: [0.022, 0.02]}
      - cone: {a: [1.28, 0.45, 0.25], b: [1.18, 0.96, 0.12], r: [0.022, 0.02]}
  grindstone:       # grinding wheel on a frame, left
    material: stone
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.95, 0.52, -0.08], b: [-0.95, 0.52, 0.0], r: 0.34}
  grind_hub:
    material: iron_dk
    space: body
    prims:
      - cylinder: {a: [-0.95, 0.5, 0.0], b: [-0.95, 0.5, 0.03], r: 0.07}
  grind_frame:
    material: bench
    space: body
    line: true
    prims:
      - box: {c: [-1.2, 0.3, -0.06], half: [0.04, 0.3, 0.2]}
      - box: {c: [-0.7, 0.3, -0.06], half: [0.04, 0.3, 0.2]}
      - cylinder: {a: [-1.25, 0.5, -0.06], b: [-0.62, 0.5, -0.06], r: 0.03}
      - cylinder: {a: [-0.62, 0.5, -0.06], b: [-0.62, 0.68, 0.0], r: 0.025}
  bars:             # iron bars leaning on the front left post
    material: iron_dk
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.35, 0.0, -0.55], b: [-1.5, 1.1, -0.78], r: 0.025}
      - cylinder: {a: [-1.25, 0.0, -0.55], b: [-1.45, 1.0, -0.8], r: 0.025}

animations:
  idle:             # cold
    frames: 1
    ms: 1000
    channels: {lit: 0}
  lit:
    frames: 6
    ms: 100
    channels: {lit: 1, glow: "1 + 0.5*sin(p)"}
