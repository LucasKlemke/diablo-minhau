# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: dead_crops
kind: prop
view: topdown
size: 32
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 0.2792 = 4 px above the pivot -> pivot (16, 20), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.2792, 0]}
shadow: {rx: 7, ry: 3, alpha: 60}

# Act I, Minhau: one tile of dead crops, scattered over the burned fields.
brief:
  summary: a clump of dead, dry crops on a little mound of dark earth - grey-gold stalks bent and broken,
    drooping empty heads; three looks - bent dry wheat, dead corn stalks with ragged hanging leaves, and
    flattened stalks lying over the stubble
  must_keep: [dry grey-gold stalks, bent or broken, drooping heads, dark soil at the base]
  simplify: [stalks as thin cones/chains, heads as small ellipsoids, leaves as thin flat boxes]
  exceptions: |
    kind prop, size 32, directions 1, mirror false, camera.center [0, 0.2792, 0] (integer pivot).
    camera.scale/pitch/light untouched. Ramps from palettes/ruin.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 16,20) is the ground point at the centre of the
    tile. One clump per 16 px tile, footprint 1x1, NOT blocking (walk through). Draw on top of
    scorched_ground / a burned field. Clips: idle (= variant 0) and `variants` (3 frames, frame i =
    variant i); scatter them with random variants and horizontal flips.

materials:
  soil:   {ramp: rburnt, bands: [2, 4], outline: false, line: false}
  stalk:  {ramp: rcrop, bands: [1, 3]}
  head:   {ramp: rcrop, bands: [2, 4]}
  leaf:   {ramp: rcrop, bands: [1, 2]}

channels:
  root: [0, 0, 0]
  v: 0

bones:
  body: {parent: root}

parts:
  soil:
    material: soil
    space: body
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 0.0, 0], r: [0.38, 0.06, 0.32]}
  # ---- variant 0: bent dry wheat ----
  wheat:
    material: stalk
    space: body
    when: "v < 0.5"
    prims:
      - chain: {pts: [[-0.15, 0, 0.02], [-0.2, 0.42, 0.0], [-0.34, 0.68, 0.02]], r: [0.035, 0.03, 0.025]}
      - chain: {pts: [[0.0, 0, -0.06], [0.02, 0.5, -0.06], [0.16, 0.74, -0.04]], r: [0.035, 0.03, 0.025]}
      - chain: {pts: [[0.14, 0, 0.08], [0.22, 0.36, 0.1], [0.4, 0.5, 0.1]], r: [0.035, 0.03, 0.025]}
      - chain: {pts: [[-0.04, 0, 0.12], [-0.02, 0.3, 0.14], [0.06, 0.4, 0.16]], r: [0.035, 0.03, 0.025]}
  wheat_heads:
    material: head
    space: body
    when: "v < 0.5"
    prims:
      - ellipsoid: {c: [-0.38, 0.6, 0.02], r: [0.05, 0.12, 0.05], rot: [0, 0, -0.5]}
      - ellipsoid: {c: [0.21, 0.66, -0.04], r: [0.05, 0.12, 0.05], rot: [0, 0, 0.7]}
      - ellipsoid: {c: [0.44, 0.42, 0.1], r: [0.05, 0.11, 0.05], rot: [0, 0, 1.2]}
  # ---- variant 1: dead corn ----
  corn:
    material: stalk
    space: body
    when: "abs(v - 1) < 0.5"
    prims:
      - chain: {pts: [[-0.1, 0, 0], [-0.12, 0.6, 0], [-0.08, 0.95, 0.0]], r: [0.06, 0.05, 0.04]}
      - chain: {pts: [[0.16, 0, 0.06], [0.2, 0.45, 0.06], [0.42, 0.62, 0.08]], r: [0.055, 0.045, 0.035]}
  corn_leaves:
    material: leaf
    space: body
    when: "abs(v - 1) < 0.5"
    prims:
      - chain: {pts: [[-0.12, 0.6, 0.02], [-0.3, 0.55, 0.04], [-0.38, 0.32, 0.06]], r: [0.04, 0.03, 0.015]}
      - chain: {pts: [[-0.11, 0.4, 0.02], [0.08, 0.36, 0.04], [0.14, 0.18, 0.08]], r: [0.04, 0.03, 0.015]}
      - chain: {pts: [[-0.08, 0.85, 0.0], [0.05, 0.9, 0.02], [0.12, 0.72, 0.04]], r: [0.035, 0.025, 0.012]}
      - chain: {pts: [[0.24, 0.45, 0.08], [0.3, 0.28, 0.12], [0.24, 0.12, 0.14]], r: [0.035, 0.025, 0.012]}
  corn_cob:
    material: head
    space: body
    when: "abs(v - 1) < 0.5"
    prims:
      - ellipsoid: {c: [-0.03, 0.66, 0.06], r: [0.05, 0.11, 0.05], rot: [0, 0, -0.4]}
  # ---- variant 2: flattened stalks over stubble ----
  stubble:
    material: stalk
    space: body
    when: "v > 1.5"
    prims:
      - cone: {a: [-0.2, 0, -0.1], b: [-0.2, 0.14, -0.1], r: [0.035, 0.03]}
      - cone: {a: [0.0, 0, 0.0], b: [0.01, 0.16, 0.0], r: [0.035, 0.03]}
      - cone: {a: [0.2, 0, -0.12], b: [0.21, 0.12, -0.12], r: [0.035, 0.03]}
      - cone: {a: [0.1, 0, 0.2], b: [0.1, 0.1, 0.2], r: [0.035, 0.03]}
  flat:
    material: stalk
    space: body
    when: "v > 1.5"
    prims:
      - cone: {a: [-0.32, 0.06, 0.1], b: [0.36, 0.08, 0.2], r: [0.035, 0.025]}
      - cone: {a: [-0.28, 0.1, -0.05], b: [0.38, 0.06, -0.15], r: [0.035, 0.025]}
      - cone: {a: [-0.1, 0.12, 0.25], b: [0.3, 0.1, -0.05], r: [0.03, 0.025]}
  flat_heads:
    material: head
    space: body
    when: "v > 1.5"
    prims:
      - ellipsoid: {c: [0.42, 0.08, 0.22], r: [0.11, 0.05, 0.05], rot: [0, -0.2, 0]}
      - ellipsoid: {c: [0.44, 0.07, -0.17], r: [0.11, 0.05, 0.05], rot: [0, 0.2, 0]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {v: 0}
  variants:
    frames: 3
    ms: 1000
    channels: {v: "f"}
