# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: fire_large
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.0470, 0]}   # 15 px above the pivot -> pivot (24, 39)
shadow: null             # fire casts light, not shadow; the game adds an additive glow

# Prologue (the burning castle): a large blaze on a heap of broken, charred furniture.
brief:
  summary: a waist-high blaze (~30 px) of seven swaying tongues over a heap of charred beams on glowing coals, licks breaking off the tips, embers drifting up (smoke is left to the engine particles)
  must_keep: [flickering tongues in four fire tones (dark red rim, orange, amber, white-hot core), rising licks and embers, a seamless loop]
  simplify: [tongues as tapered chains that sway and stretch, licks as shrinking blobs, no transparency]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 1.0470, 0] (integer
    pivot). Flames are emissive (farm `fire` ramp, one band per layer), no outline: the dark-red outer
    layer is their rim. camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: pivot (24, 39) = the ground point at the centre of the heap; footprint about 1.5 x 1 tiles (blocking, it burns).
    `idle` loops 8 frames at 90 ms; every motion is periodic in p, so frame 7 flows into frame 0. The emissive
    map carries the flames; add a warm additive glow sprite in the engine (as the candelabra do).

ramps:
  fl_smoke: ["#1c0f1a", "#3d3442", "#5a5060", "#7a7080"]
  fl_char:  ["#1c0f1a", "#1f1416", "#3a2420", "#5a3626"]
  fl_glow:  ["#902308", "#fe6607", "#fbbe71"]

materials:
  outer: {ramp: fire, emissive: true, band: 0, outline: false, glow: {color: "#fe6607", mix: 0.3, radius: 1}}
  mid:   {ramp: fire, emissive: true, band: 1, outline: false}
  inner: {ramp: fire, emissive: true, band: 2, outline: false}
  core:  {ramp: fire, emissive: true, band: 3, outline: false}
  ember: {ramp: fire, emissive: true, band: 2, outline: false}
  coal:  {ramp: fl_glow, emissive: true, band: 1, outline: false}
  char:  {ramp: fl_char, bands: [1, 3]}
  smoke: {ramp: fl_smoke, bands: [1, 3], line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

