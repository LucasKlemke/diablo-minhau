spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: trash_fire
kind: prop
view: topdown
size: 64
directions: 1            # faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.1167, 0]}   # 16 px above the pivot -> pivot (32, 48)
shadow: null             # the fire lights the ground

# Bosque dos Goblins: goblin trash fire, burning junk that gives off a sickly green-yellow smoke.
brief:
  summary: goblin trash fire, a heap of junk burning on the ground - broken crate planks, dented tin cans,
    an old boot, a snapped wheel spoke and a gnawed bone, charred black at the centre - with ragged orange
    flames and a column of thick sickly green-yellow smoke puffs rolling up from it
  must_keep: [junk heap (planks, cans, boot, bone), animated orange flames (emissive), green-yellow smoke
    puffs rising, charred centre with glowing embers]
  simplify: [3 flame tongues, 3 smoke puffs, cans as small cylinders]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, shadow null, camera.center [0, 1.1167, 0] (integer
    pivot). Flames and embers are emissive without outline; the smoke is a lit material without outline
    (it must not glow). camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,48) is the ground point at the centre of the
    heap. Footprint 2x1 tiles (the heap ~1.4 x 0.9 units), blocking; the smoke does not block.
    idle: 8-frame loop at 100 ms. Flame tongues sway and change height out of phase; 3 smoke puffs rise on a
    loop staggered by a third of the cycle, swelling then thinning as they climb and drift right.
    Smoke is sickly green-yellow (the goblins burn filth), not grey, so it reads as goblin.

ramps:
  tf_wood:  ["#1c0f1a", "#3a2418", "#57351f", "#77502e"]
  tf_char:  ["#1c0f1a", "#1e1416", "#2e1f1e", "#45302a"]
  tf_tin:   ["#1c0f1a", "#4a5262", "#7a8494", "#b4bcc6"]
  tf_rust:  ["#1c0f1a", "#5a2a16", "#8a4220", "#b0602a"]
  tf_boot:  ["#1c0f1a", "#2e1c18", "#4a2c22", "#66402e"]
  tf_bone:  ["#1c0f1a", "#7a6a58", "#b4a488", "#ddd0b0"]
  tf_smoke: ["#1c0f1a", "#4a5226", "#6e7a2e", "#97a03a", "#bcc256"]
  tf_flame: ["#1c0f1a", "#5a0a12", "#a8160f", "#e0361a", "#fe6607", "#ffa12e", "#ffd65c", "#fff4c8"]

materials:
  wood:  {ramp: tf_wood, bands: [1, 3]}
  char:  {ramp: tf_char, bands: [1, 3]}
  tin:   {ramp: tf_tin, bands: [1, 3]}
  rust:  {ramp: tf_rust, bands: [1, 3]}
  boot:  {ramp: tf_boot, bands: [1, 3]}
  bone:  {ramp: tf_bone, bands: [1, 3]}
  smoke: {ramp: tf_smoke, bands: [2, 4], outline: false, line: false}
  smoke_dk: {ramp: tf_smoke, bands: [1, 2], outline: false, line: false}
  ember: {ramp: tf_flame, emissive: true, band: 4, outline: false, line: false, glow: {color: "#fe6607", mix: 0.35, radius: 1}}
  flame: {ramp: tf_flame, emissive: true, band: 3, outline: false, line: false, glow: {color: "#e0361a", mix: 0.35, radius: 1}}
  flame_or:  {ramp: tf_flame, emissive: true, band: 5, outline: false, line: false}
  flame_hot: {ramp: tf_flame, emissive: true, band: 6, outline: false, line: false}

channels:
  root: [0, 0, 0]
  h_a: 1.0          # flame heights
  h_b: 0.8
  h_c: 0.7
  s_a: 0            # flame sway (rad)
  s_b: 0.25
  s_c: -0.25
  ember: 1
  k1: 0.0           # smoke puff progress 0..1 (rise)
  k2: 0.33
  k3: 0.66

bones:
  fire:     {parent: root, pos: [0, 0.26, 0.05]}
  tongue_a: {parent: fire, pos: [0.0, 0, 0.08], rot: "[0, 0, s_a]"}
  tongue_b: {parent: fire, pos: [-0.20, -0.04, 0.04], rot: "[0, 0, s_b]"}
  tongue_c: {parent: fire, pos: [0.22, -0.04, 0.02], rot: "[0, 0, s_c]"}

parts:
  char:              # charred heart of the heap
    material: char
    prims:
      - ellipsoid: {c: [0, 0.12, 0], r: [0.48, 0.16, 0.36]}
  planks:            # broken crate planks leaning into the fire
    material: wood
    line: true
    prims:
      - box: {c: [-0.40, 0.18, 0.12], half: [0.30, 0.05, 0.09], rot: [0.1, 0.35, 0.45], round: 0.02}
      - box: {c: [0.42, 0.16, -0.10], half: [0.30, 0.05, 0.09], rot: [0, -0.5, -0.4], round: 0.02}
      - box: {c: [0.05, 0.22, -0.30], half: [0.26, 0.05, 0.08], rot: [0.5, 0.1, 0.1], round: 0.02}
      - cylinder: {a: [0.30, 0.06, 0.40], b: [0.72, 0.24, 0.30], r: 0.04}                         # wheel spoke
  crate:             # half-burnt crate at the back of the heap
    material: wood
    line: true
    prims:
      - box: {c: [-0.28, 0.24, -0.34], half: [0.24, 0.22, 0.20], rot: [0.1, 0.4, 0.22], round: 0.02}
    cut:
      - box: {c: [0.0, 0.40, -0.14], half: [0.22, 0.22, 0.22], rot: [0.3, 0.4, 0.5]}
  plank_ends:        # charred plank ends inside the fire
    material: char
    prims:
      - box: {c: [-0.18, 0.30, 0.10], half: [0.08, 0.06, 0.10], rot: [0.1, 0.35, 0.45], round: 0.02}
      - box: {c: [0.20, 0.28, -0.06], half: [0.08, 0.06, 0.10], rot: [0, -0.5, -0.4], round: 0.02}
  cans:
    material: tin
    line: true
    prims:
      - cylinder: {a: [-0.66, 0.10, 0.36], b: [-0.40, 0.12, 0.50], r: 0.10}                        # can on its side
      - cylinder: {a: [0.58, 0.0, 0.22], b: [0.58, 0.26, 0.22], r: 0.10}                            # standing can
    cut:
      - cylinder: {a: [0.58, 0.23, 0.22], b: [0.58, 0.40, 0.22], r: 0.07}
  rust:
    material: rust
    prims:
      - box: {c: [0.58, 0.12, 0.32], half: [0.06, 0.05, 0.01]}
      - box: {c: [-0.30, 0.06, -0.42], half: [0.14, 0.06, 0.10], rot: [0.2, 0.6, 0.2], round: 0.02}  # rusted pot shard
  boot:
    material: boot
    line: true
    blend: 0.04
    prims:
      - box: {c: [-0.70, 0.08, 0.02], half: [0.18, 0.08, 0.08], rot: [0, 0.3, 0], round: 0.04}
      - box: {c: [-0.82, 0.22, -0.02], half: [0.08, 0.16, 0.08], rot: [0, 0.3, 0.15], round: 0.03}
  bone:
    material: bone
    line: true
    prims:
      - cylinder: {a: [0.08, 0.06, 0.48], b: [0.36, 0.05, 0.56], r: 0.03}
      - sphere: {c: [0.07, 0.07, 0.48], r: 0.045}
      - sphere: {c: [0.37, 0.06, 0.56], r: 0.045}
  embers:
    material: ember
    prims:
      - sphere: {c: [0, 0.24, 0.28], r: "0.05*ember"}
      - sphere: {c: [-0.22, 0.20, 0.26], r: "0.04*(2 - ember)"}
      - sphere: {c: [0.22, 0.20, 0.24], r: "0.04*ember"}

  # ---- flames ----
  tongue_a:
    material: flame
    space: tongue_a
    prims:
      - chain: {pts: [[0, 0, 0], "[-0.04, 0.30*h_a, 0]", "[0.05, 0.62*h_a, 0]", "[0.02, 0.95*h_a, 0]"], r: [0.22, 0.16, 0.08, 0.02]}
  tongue_a_or:
    material: flame_or
    space: tongue_a
    prims:
      - chain: {pts: [[0, 0, 0.08], "[-0.03, 0.24*h_a, 0.08]", "[0.04, 0.55*h_a, 0.08]"], r: [0.15, 0.10, 0.02]}
  tongue_a_hot:
    material: flame_hot
    space: tongue_a
    prims:
      - chain: {pts: [[0, 0, 0.14], "[0.01, 0.26*h_a, 0.14]"], r: [0.08, 0.02]}
  tongue_b:
    material: flame
    space: tongue_b
    prims:
      - chain: {pts: [[0, 0, 0], "[0.04, 0.30*h_b, 0]", "[-0.03, 0.70*h_b, 0]"], r: [0.15, 0.10, 0.02]}
  tongue_b_or:
    material: flame_or
    space: tongue_b
    prims:
      - chain: {pts: [[0, 0, 0.07], "[0.02, 0.36*h_b, 0.07]"], r: [0.10, 0.02]}
  tongue_c:
    material: flame
    space: tongue_c
    prims:
      - chain: {pts: [[0, 0, 0], "[-0.04, 0.30*h_c, 0]", "[0.03, 0.68*h_c, 0]"], r: [0.14, 0.09, 0.02]}
  tongue_c_or:
    material: flame_or
    space: tongue_c
    prims:
      - chain: {pts: [[0, 0, 0.07], "[-0.02, 0.34*h_c, 0.07]"], r: [0.09, 0.02]}

  # ---- smoke: 3 puffs rising on a loop ----
  smoke:
    material: smoke
    blend: 0.10
    prims:
      - ellipsoid: {c: "[0.05 + 0.35*k1, 1.05 + 1.35*k1, -0.15]", r: "[(0.14 + 0.22*sin(pi*k1)), (0.10 + 0.16*sin(pi*k1)), 0.16]"}
      - ellipsoid: {c: "[0.05 + 0.35*k2, 1.05 + 1.35*k2, -0.15]", r: "[(0.14 + 0.22*sin(pi*k2)), (0.10 + 0.16*sin(pi*k2)), 0.16]"}
      - ellipsoid: {c: "[0.05 + 0.35*k3, 1.05 + 1.35*k3, -0.15]", r: "[(0.14 + 0.22*sin(pi*k3)), (0.10 + 0.16*sin(pi*k3)), 0.16]"}
  smoke_base:        # darker smoke column just above the flames
    material: smoke_dk
    blend: 0.08
    prims:
      - ellipsoid: {c: [0.0, 0.95, -0.25], r: [0.20, 0.16, 0.14]}

animations:
  idle:
    frames: 8
    ms: 100
    channels:
      h_a: "1.0 + 0.15*sin(p) + 0.05*sin(2*p + 1)"
      h_b: "0.78 + 0.14*sin(p + 2.2)"
      h_c: "0.70 + 0.14*sin(p + 4.1)"
      s_a: "0.10*sin(p + 1.2)"
      s_b: "0.28 + 0.10*sin(p + 3.0)"
      s_c: "-0.28 + 0.10*sin(p + 0.4)"
      ember: "1 + 0.25*sin(p + 0.8)"
      k1: "t"
      k2: "t + 1/3 - floor(t + 1/3)"
      k3: "t + 2/3 - floor(t + 2/3)"
