# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: oak_beam
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.4188, 0]}   # 6 px above the pivot -> pivot (24, 30)
shadow: {rx: 19, ry: 5, alpha: 110}

# Ruined village QUEST OBJECT: the player clicks it and pries the oak beam out of the debris (progress bar).
brief:
  summary: thick squared oak beam leaning out of a heap of collapsed-hut debris - its left end rests up on a
    mound of dark earth, broken stones, two snapped planks and tufts of grey-gold rotten thatch, its right end
    lies on the ground; warm red-brown oak with a light sawn end grain, a bright highlight along its top
    edge, two bent iron nails and an iron strap; a white-gold glint slides along it in `highlight`
  must_keep: [thick oak beam with bright top edge, debris heap with thatch and planks, nails, glint clip]
  simplify: [grain as one dark line, stones as rounded boxes, thatch as lumpy blobs]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, camera.center [0, 0.4188, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a. The top-edge highlight is a
    separate light strip (material `edge`) so the beam pops on the Farm RPG grass, as asked for quest props.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,30) is the ground point at the centre of the
    whole object (heap + beam). ~38 px wide -> footprint 2x1 tiles, blocking; interaction radius around the
    pivot. Heap ramps match ruined_hut so it reads as debris from it. Clips: idle (static: what the map
    shows), highlight (loop: glint slides along the top edge, for hover / "work on this").

ramps:
  ob_oak:    ["#1c0f1a", "#4a2118", "#7a3e22", "#a35a2e", "#c47a3e"]
  ob_edge:   ["#1c0f1a", "#d89a5a", "#f0c080", "#ffe0a8"]
  ob_end:    ["#1c0f1a", "#9a6234", "#d2a464", "#f0d49a"]
  ob_iron:   ["#1c0f1a", "#2e3040", "#4b5266", "#8a94a8"]
  ob_earth:  ["#1c0f1a", "#2e1f1a", "#47302a", "#5e4236"]
  ob_stone:  ["#1c0f1a", "#4a4458", "#7a7488", "#a8a2b4", "#cfcad8"]
  ob_thatch: ["#1c0f1a", "#7a6a30", "#b09a48", "#dcc66a", "#f0e08e"]
  ob_plank:  ["#1c0f1a", "#4a2c1c", "#6e4a2c", "#8f6a42"]
  ob_glint:  ["#1c0f1a", "#fff6b0", "#ffffff"]

materials:
  oak:    {ramp: ob_oak, bands: [1, 4]}
  edge:   {ramp: ob_edge, bands: [2, 3], outline: false, line: false}
  grain:  {ramp: ob_oak, bands: [1, 1], outline: false, line: false}
  end:    {ramp: ob_end, bands: [1, 3]}
  iron:   {ramp: ob_iron, bands: [1, 3]}
  earth:  {ramp: ob_earth, bands: [1, 3]}
  stone:  {ramp: ob_stone, bands: [1, 4]}
  thatch: {ramp: ob_thatch, bands: [1, 4]}
  plank:  {ramp: ob_plank, bands: [1, 3]}
  glint:  {ramp: ob_glint, emissive: true, band: 2, outline: false, line: false, glow: {color: "#fff6b0", mix: 0.5, radius: 1}}

channels:
  root: [0, 0, 0]
  glint: -9          # glint position along the beam (units from its centre; off-beam = hidden)

bones:
  body: {parent: root}
  beam: {parent: body, pos: [0.18, 0.28, 0.12], rot: [0, 0.22, 0.26]}   # left end raised on the heap

parts:
  # ---------- debris heap (left) ----------
  heap:
    material: earth
    space: body
    blend: 0.12
    line: true
    prims:
      - ellipsoid: {c: [-0.55, 0.1, -0.35], r: [0.5, 0.2, 0.4]}
      - ellipsoid: {c: [-0.85, 0.05, 0.0], r: [0.28, 0.1, 0.26]}
  stones:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [-0.9, 0.14, 0.05], half: [0.14, 0.1, 0.11], rot: [0.2, 0.5, 0.1], round: 0.04}
      - box: {c: [-0.35, 0.3, -0.42], half: [0.14, 0.1, 0.12], rot: [0, -0.4, 0.2], round: 0.04}
      - box: {c: [-0.65, 0.3, -0.2], half: [0.12, 0.09, 0.1], rot: [0, 0.8, 0], round: 0.03}
  planks:
    material: plank
    space: body
    line: true
    prims:
      - box: {c: [-0.75, 0.36, -0.45], half: [0.38, 0.03, 0.07], rot: [0.1, -0.5, 0.4], round: 0.01}
      - box: {c: [-0.2, 0.26, -0.55], half: [0.3, 0.03, 0.065], rot: [0, 0.3, -0.25], round: 0.01}
  thatch:
    material: thatch
    space: body
    blend: 0.06
    line: true
    prims:
      - ellipsoid: {c: [-0.85, 0.36, -0.45], r: [0.24, 0.1, 0.18]}
      - ellipsoid: {c: [-0.45, 0.42, -0.2], r: [0.2, 0.08, 0.14]}
      - cone: {a: [-0.9, 0.3, -0.4], b: [-1.12, 0.22, -0.35], r: [0.04, 0.015]}
      - cone: {a: [-0.7, 0.4, -0.55], b: [-0.85, 0.46, -0.78], r: [0.035, 0.012]}
  # ---------- the beam ----------
  beam:
    material: oak
    space: beam
    line: true
    prims:
      - box: {c: [0, 0, 0], half: [0.85, 0.16, 0.16], round: 0.02}
    cut:
      - box: {c: [0.93, 0.12, 0.0], half: [0.12, 0.12, 0.3], rot: [0, 0, 0.6]}    # broken end
  top_edge:           # bright highlight along the top front edge
    material: edge
    space: beam
    prims:
      - box: {c: [-0.05, 0.16, 0.13], half: [0.76, 0.012, 0.035]}
  splinters:
    material: oak
    space: beam
    line: true
    prims:
      - cone: {a: [0.83, -0.05, 0.05], b: [1.05, -0.1, 0.08], r: [0.07, 0.015]}
      - cone: {a: [0.81, 0.02, -0.08], b: [1.01, 0.0, -0.12], r: [0.06, 0.015]}
  grain:
    material: grain
    space: beam
    prims:
      - box: {c: [0.0, 0.163, -0.04], half: [0.5, 0.004, 0.012]}
  sawn_end:
    material: end
    space: beam
    line: true
    prims:
      - box: {c: [-0.85, 0, 0], half: [0.02, 0.15, 0.15], round: 0.02}
  iron:
    material: iron
    space: beam
    line: true
    prims:
      - box: {c: [-0.45, 0, 0], half: [0.05, 0.172, 0.172]}                          # strap
      - cylinder: {a: [0.25, 0.14, 0.0], b: [0.27, 0.36, 0.06], r: 0.03}              # bent nails
      - cylinder: {a: [0.27, 0.36, 0.06], b: [0.38, 0.4, 0.08], r: 0.03}
      - cylinder: {a: [0.6, 0.14, -0.05], b: [0.62, 0.32, -0.05], r: 0.03}
  glint:
    material: glint
    space: beam
    when: "abs(glint) < 1.0"
    prims:
      - box: {c: "[glint, 0.17, 0.14]", half: [0.1, 0.025, 0.03]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
  highlight:
    frames: 6
    ms: [80, 80, 80, 80, 80, 400]
    channels: {glint: "-0.85 + 0.38*f*(f < 5) + 9*(f >= 5)"}
