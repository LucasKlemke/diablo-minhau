spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: cellar_entrance
kind: prop
view: topdown
size: 96                 # house ~4 units wide (72 px) at camera.scale 0.055, 2+ px margins
directions: 1            # faces the camera (s)
mirror: false
palette: ["farm", "hut", "ruin"]
camera: {pitch: 38, scale: 0.055, center: [0, 1.3956, 0]}   # 20 px above the pivot -> pivot (48, 68)
shadow: {rx: 40, ry: 11, alpha: 100}

# Overworld entrance of the dungeon "Casa Abandonada" (replaces the generic crypt there).
brief:
  summary: an abandoned farmhouse gone to ruin - grey fieldstone footing, weathered grey plank walls with a
    boarded-up window and a black broken one, a rotten thatch roof whose right half has caved in (bare
    rafters sticking up, the ridge beam snapped and sagging), a stone chimney still standing at the left;
    in FRONT of the house, centred, a stone cellar bulkhead whose two slanted wooden doors are flung open
    to the sides, revealing steps going down into darkness where two small eyes glint
  must_keep: [collapsed roof with bare rafters, chimney, plank walls, the open cellar doors at bottom-centre
    with steps into black, eyes in the dark, rubble and dead weeds]
  simplify: [planks as grooves, thatch as slabs with a few ridges, steps as 3 bands darkening into void]
  exceptions: |
    kind prop, size 96, directions 1, mirror false; camera.center [0, 1.3956, 0] (integer pivot); flat shadow.
    Ramps from palettes/ruin.yaml + spec-local ones (index 0 = #1c0f1a). camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT (like crypt): world origin (= exported pivot, frame px 48,68) is the ground point at the
    centre of the 5x3-tile footprint. The house stands on the back two rows (z -1.35..-0.15); the cellar
    bulkhead sits on the front row, centred, its dark opening at x -0.45..0.45, z 0..0.85 (about 0..9 px
    below the pivot): that is where the hero walks in. The house rows block; the bulkhead tile is the
    trigger. The cellar is in front of the house (not inside) so the entrance is never hidden by the roof.
    Clips: idle (8 frames: the eyes blink once, the faint rot-green glow breathes) and hover (eyes wide,
    glow swells), like crypt's hover.

ramps:
  ce_thatch: ["#1c0f1a", "#2a2218", "#3e3424", "#564a32", "#706040"]
  ce_void:   ["#1c0f1a", "#100a0e", "#1a1216"]
  ce_glow:   ["#14240e", "#1e3a14", "#2e5a1e", "#4e8a2a"]
  ce_eye:    ["#1c0f1a", "#c8301a", "#ff8a3a"]

materials:
  stone:   {ramp: rstone, bands: [1, 3]}
  plank:   {ramp: rplank, bands: [1, 3]}
  groove:  {ramp: rchar, bands: [1, 1], outline: false, line: false}
  beam:    {ramp: rwood, bands: [1, 3]}
  thatch:  {ramp: ce_thatch, bands: [1, 4]}
  door:    {ramp: rwood, bands: [2, 4]}
  thatch_dk: {ramp: ce_thatch, bands: [1, 2], line: false}
  iron:    {ramp: riron, bands: [1, 3]}
  void:    {ramp: ce_void, emissive: true, band: 1, outline: false, line: false}
  deep:    {ramp: rchar, bands: [1, 2], outline: false}
  step:    {ramp: rstone, bands: [1, 2], outline: false}
  glow:    {ramp: ce_glow, emissive: true, band: 1, outline: false, line: false}
  eye:     {ramp: ce_eye, emissive: true, band: 1, outline: false, line: false, glow: {color: "#ff5a1f", mix: 0.4, radius: 1}}
  eye_hi:  {ramp: ce_eye, emissive: true, band: 2, outline: false, line: false, glow: {color: "#ff8a3a", mix: 0.5, radius: 1}}
  weed:    {ramp: rcrop, bands: [1, 3], line: false}
  dirt:    {ramp: rmud, bands: [1, 2], outline: false, line: false}

channels:
  root: [0, 0, 0]
  eyes: 1            # 0 closed, 1 open, 2 wide (hover)
  glow: 1            # size of the faint glow down the steps

# Layout: house x -1.65..1.65, z -1.35..-0.15 (front wall face z -0.15), walls to y 1.55, ridge y 2.55 at
# z -0.75; chimney x -1.30. Bulkhead cheeks at x +-0.58, opening x +-0.48, z -0.10..0.86, sloping from
# y 0.56 at the wall down to y 0.12 at the front.
bones:
  body:   {parent: root}
  door_L: {parent: body, pos: [0.64, 0.36, 0.38], rot: [0.42, 0, 0.55]}     # left leaf (screen right), flung open

parts:
  yard:              # trampled dirt in front
    material: dirt
    space: body
    prims:
      - ellipsoid: {c: [0, 0.0, 0.75], r: [1.30, 0.02, 0.50]}
  footing:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0, 0.18, -0.75], half: [1.68, 0.18, 0.62], round: 0.03}
  walls:
    material: plank
    space: body
    line: true
    prims:
      - box: {c: [0, 0.95, -0.75], half: [1.62, 0.60, 0.58]}
    cut:
      - sphere: {c: [1.55, 1.75, -0.30], r: 0.55}                # broken top corner (right)
      - box: {c: [0.95, 1.62, -0.40], half: [0.40, 0.12, 0.8], rot: [0, 0, 0.3]}
  grooves:           # plank seams on the front wall
    material: groove
    space: body
    prims:
      - box: {c: [0, 0.62, -0.165], half: [1.58, 0.012, 0.01]}
      - box: {c: [0, 0.88, -0.165], half: [1.58, 0.012, 0.01]}
      - box: {c: [0, 1.14, -0.165], half: [1.58, 0.012, 0.01]}
      - box: {c: [-0.30, 1.40, -0.165], half: [1.28, 0.012, 0.01]}
    cut:
      - sphere: {c: [1.55, 1.75, -0.30], r: 0.55}
  posts:             # dark corner posts and a lintel
    material: beam
    space: body
    line: true
    prims:
      - box: {c: [-1.62, 0.95, -0.17], half: [0.08, 0.62, 0.08]}
      - box: {c: [1.62, 0.70, -0.17], half: [0.08, 0.37, 0.08]}
      - box: {c: [-1.62, 0.95, -1.33], half: [0.08, 0.62, 0.08]}
      - box: {c: [0, 1.55, -0.15], half: [1.68, 0.06, 0.06]}
    cut:
      - sphere: {c: [1.55, 1.75, -0.30], r: 0.62}
  window_board:      # boarded-up window (left)
    material: door
    space: body
    line: true
    prims:
      - box: {c: [-0.95, 1.00, -0.14], half: [0.30, 0.24, 0.02]}
  boards:
    material: beam
    space: body
    line: true
    prims:
      - box: {c: [-0.95, 1.00, -0.11], half: [0.36, 0.045, 0.02], rot: [0, 0, 0.5]}
      - box: {c: [-0.95, 1.00, -0.11], half: [0.36, 0.045, 0.02], rot: [0, 0, -0.5]}
  window_hole:       # black broken window (right)
    material: void
    space: body
    prims:
      - box: {c: [0.95, 0.98, -0.155], half: [0.24, 0.20, 0.01]}
  window_frame:
    material: beam
    space: body
    prims:
      - box: {c: [0.95, 0.76, -0.14], half: [0.30, 0.035, 0.03]}
      - box: {c: [0.95, 0.98, -0.14], half: [0.025, 0.20, 0.025], rot: [0, 0, 0.35]}
  chimney:
    material: stone
    space: body
    line: true
    blend: 0.02
    prims:
      - box: {c: [-1.30, 1.55, -0.95], half: [0.24, 1.55, 0.24], round: 0.02}
      - box: {c: [-1.30, 3.02, -0.95], half: [0.28, 0.07, 0.28], round: 0.02}
  chimney_top:
    material: void
    space: body
    prims:
      - box: {c: [-1.30, 3.09, -0.95], half: [0.16, 0.02, 0.16]}
  roof_front:        # front thatch slope, the right half caved in
    material: thatch
    space: body
    line: true
    prims:
      - box: {c: [-0.10, 2.05, -0.36], half: [1.80, 0.10, 0.64], rot: [0.927, 0, 0]}
    cut:
      - box: {c: [1.15, 2.0, -0.4], half: [0.85, 1.2, 1.2], rot: [0, 0, 0.25]}
      - sphere: {c: [0.30, 1.70, 0.10], r: 0.40}
      - box: {c: [-1.30, 2.0, -0.95], half: [0.25, 1.5, 0.25]}
  roof_back:
    material: thatch
    space: body
    line: true
    prims:
      - box: {c: [-0.10, 2.05, -1.14], half: [1.80, 0.10, 0.64], rot: [-0.927, 0, 0]}
    cut:
      - box: {c: [1.55, 2.0, -1.2], half: [0.80, 1.2, 1.0], rot: [0, 0, -0.2]}
      - box: {c: [-1.30, 2.0, -0.95], half: [0.25, 1.5, 0.25]}
  thatch_ridges:     # a few courses on the front slope
    material: thatch_dk
    space: body
    prims:
      - box: {c: [-0.30, 1.62, 0.07], half: [1.55, 0.05, 0.06]}
      - box: {c: [-0.30, 1.92, -0.17], half: [1.55, 0.04, 0.05]}
      - box: {c: [-0.30, 2.22, -0.40], half: [1.55, 0.04, 0.05]}
    cut:
      - box: {c: [1.15, 2.0, -0.4], half: [0.85, 1.2, 1.2], rot: [0, 0, 0.25]}
      - sphere: {c: [0.30, 1.70, 0.10], r: 0.40}
      - box: {c: [-1.30, 2.0, -0.95], half: [0.25, 1.5, 0.25]}
  ridge:             # ridge beam, snapped: the right piece sags into the house
    material: beam
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.75, 2.58, -0.75], b: [0.45, 2.58, -0.75], r: 0.07}
      - cylinder: {a: [0.55, 2.45, -0.75], b: [1.50, 1.45, -0.80], r: 0.07}
  rafters:           # bare rafters over the hole, some broken
    material: beam
    space: body
    line: true
    prims:
      - cylinder: {a: [0.65, 2.50, -0.75], b: [0.65, 1.60, -0.08], r: 0.045}
      - cylinder: {a: [1.10, 2.10, -0.45], b: [1.10, 1.58, -0.08], r: 0.045}
      - cylinder: {a: [1.55, 1.55, -0.12], b: [1.50, 1.95, -0.45], r: 0.045}
      - cylinder: {a: [0.65, 2.50, -0.75], b: [0.65, 1.70, -1.35], r: 0.045}
      - cylinder: {a: [1.10, 1.95, -1.15], b: [1.10, 1.55, -1.40], r: 0.045}
      - cylinder: {a: [0.20, 1.62, -0.10], b: [1.70, 1.60, -0.12], r: 0.04}      # wall plate
  inside:            # fallen thatch heaped inside the shell (seen through the hole)
    material: thatch
    space: body
    blend: 0.06
    prims:
      - ellipsoid: {c: [1.00, 1.20, -0.75], r: [0.55, 0.30, 0.45]}
  # ---------------- the cellar bulkhead (the entrance) ----------------
  cheeks:            # sloping stone side walls
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0.60, 0.28, 0.38], half: [0.11, 0.28, 0.50], round: 0.02}
      - box: {c: [-0.60, 0.28, 0.38], half: [0.11, 0.28, 0.50], round: 0.02}
      - box: {c: [0, 0.07, 0.92], half: [0.70, 0.07, 0.08], round: 0.02}         # front sill
    cut:
      - box: {c: [0, 0.61, 0.50], half: [1.0, 0.30, 0.9], rot: [0.42, 0, 0]}
  void:              # the black hole down
    material: void
    space: body
    prims:
      - box: {c: [0, 0.02, 0.22], half: [0.49, 0.02, 0.34]}
  step_1:
    material: step
    space: body
    line: true
    prims:
      - box: {c: [0, 0.05, 0.76], half: [0.49, 0.04, 0.09]}
  step_2:
    material: deep
    space: body
    line: true
    prims:
      - box: {c: [0, 0.03, 0.56], half: [0.49, 0.03, 0.09]}
  glow:
    material: glow
    space: body
    prims:
      - ellipsoid: {c: [0, 0.045, 0.12], r: ["0.34*glow", 0.004, "0.14*glow"]}
  eyes_open:
    material: eye
    space: body
    when: "eyes > 0.5 and eyes < 1.5"
    prims:
      - ellipsoid: {c: [-0.09, 0.06, 0.12], r: [0.05, 0.004, 0.035]}
      - ellipsoid: {c: [0.09, 0.06, 0.12], r: [0.05, 0.004, 0.035]}
  eyes_wide:
    material: eye_hi
    space: body
    when: "eyes > 1.5"
    prims:
      - ellipsoid: {c: [-0.10, 0.06, 0.12], r: [0.065, 0.004, 0.05]}
      - ellipsoid: {c: [0.10, 0.06, 0.12], r: [0.065, 0.004, 0.05]}
  door_L:            # wooden leaf flung open, resting outward
    material: door
    space: door_L
    line: true
    prims:
      - box: {c: [0.26, 0, 0], half: [0.26, 0.035, 0.50]}
  door_planks_L:
    material: groove
    space: door_L
    prims:
      - box: {c: [0.17, 0.04, 0], half: [0.012, 0.01, 0.48]}
      - box: {c: [0.34, 0.04, 0], half: [0.012, 0.01, 0.48]}
  door_iron_L:       # iron straps and a ring handle
    material: iron
    space: door_L
    prims:
      - box: {c: [0.26, 0.045, 0.30], half: [0.25, 0.012, 0.035]}
      - box: {c: [0.26, 0.045, -0.30], half: [0.25, 0.012, 0.035]}
      - torus: {c: [0.44, 0.05, 0.0], R: 0.06, r: 0.016}
  # ---------------- rubble and weeds ----------------
  rubble:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [1.85, 0.12, -0.25], half: [0.16, 0.12, 0.14], rot: [0.1, 0.6, 0.1], round: 0.03}
      - box: {c: [1.75, 0.08, 0.25], half: [0.12, 0.08, 0.10], rot: [0, -0.4, 0], round: 0.03}
      - box: {c: [-1.85, 0.08, 0.10], half: [0.12, 0.08, 0.10], rot: [0, 0.3, 0], round: 0.03}
  fallen_planks:
    material: plank
    space: body
    line: true
    prims:
      - box: {c: [1.45, 0.06, 0.55], half: [0.45, 0.04, 0.08], rot: [0, 0.5, 0.05]}
      - box: {c: [1.20, 0.10, 0.30], half: [0.40, 0.035, 0.07], rot: [0, -0.3, 0.12]}
      - box: {c: [-1.40, 0.05, 0.62], half: [0.32, 0.035, 0.07], rot: [0, -0.4, 0]}
  weeds:
    material: weed
    space: body
    prims:
      - cone: {a: [-1.10, 0, 0.05], b: [-1.18, 0.34, 0.05], r: [0.04, 0.01]}
      - cone: {a: [-1.10, 0, 0.05], b: [-0.98, 0.30, 0.08], r: [0.04, 0.01]}
      - cone: {a: [-1.10, 0, 0.05], b: [-1.26, 0.24, 0.10], r: [0.04, 0.01]}
      - cone: {a: [1.00, 0, 0.0], b: [0.94, 0.30, 0.02], r: [0.04, 0.01]}
      - cone: {a: [1.00, 0, 0.0], b: [1.10, 0.26, 0.04], r: [0.04, 0.01]}
      - cone: {a: [-1.75, 0, -0.20], b: [-1.80, 0.36, -0.20], r: [0.04, 0.01]}
      - cone: {a: [-1.75, 0, -0.20], b: [-1.66, 0.30, -0.18], r: [0.04, 0.01]}

animations:
  idle:              # the eyes blink once, the glow breathes (seamless)
    frames: 8
    ms: [220, 220, 220, 220, 220, 90, 90, 220]
    channels:
      eyes: "1 - 1.0*(f == 5)"
      glow: "1 + 0.15*sin(p)"
  hover:             # cursor over the cellar: the eyes go wide and bright, the glow swells (seamless)
    frames: 6
    ms: 110
    channels:
      eyes: 2
      glow: "1.35 + 0.15*sin(p)"
