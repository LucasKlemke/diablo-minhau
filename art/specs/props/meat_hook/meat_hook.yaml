# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: meat_hook
kind: prop
view: topdown
size: 64
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 1.5354 = 22 px above the pivot -> pivot (32, 54), integer
camera: {pitch: 38, scale: 0.055, center: [0, 1.5354, 0]}
shadow: {rx: 20, ry: 5, alpha: 90}

# Act I dungeon "Porao do Acougueiro": the Butcher's hanging rail.
brief:
  summary: a dark blood-stained wooden rail on two posts with iron chains ending in big hooks, carcasses
    hanging from them, blood dripping into a pool below; three looks - a gutted pig carcass and a leg of
    meat, a long bundle wrapped in sackcloth and rope (human-shaped, never explicit) beside an empty swinging
    hook, and a pig carcass with a rack of ribs
  must_keep: [wooden rail on posts, iron chains and hooks, raw red meat with pale fat, sackcloth body bundle,
    blood drips and pool]
  simplify: [chains as thin dark rods with a link ring, carcasses as blended ellipsoids, ribs as pale bars]
  exceptions: |
    kind prop, size 64 (tall), directions 1, mirror false, camera.center [0, 1.5354, 0] (integer pivot).
    camera.scale/pitch/light untouched. Ramps from palettes ruin/hut plus spec-local meat, fat and blood.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,54) is the ground point at the centre of the
    rail. Rail 1.9 wide, 2.2 tall -> footprint 2x1 tiles, blocking; best against a back wall. The human
    bundle is wrapped head to foot in sackcloth (no skin shown) - grim, not gory. Clips: idle (= variant 0)
    and `variants` (3 frames, frame i = variant i).

ramps:
  mh_meat:  ["#1c0f1a", "#4a0f18", "#7a1e24", "#a83a36", "#cc6a5a"]
  mh_fat:   ["#1c0f1a", "#8a6a5a", "#c4a48a", "#e6d0b4"]
  mh_blood: ["#1c0f1a", "#3a0610", "#5e0c16", "#86141e"]
  mh_bone:  ["#1c0f1a", "#8a7a62", "#c8b896", "#ece2c6"]

materials:
  wood:   {ramp: rwood, bands: [1, 3]}
  iron:   {ramp: riron, bands: [1, 3]}
  meat:   {ramp: mh_meat, bands: [2, 4]}
  fat:    {ramp: mh_fat, bands: [1, 3], outline: false}
  sack:   {ramp: rcanvas, bands: [1, 3]}
  rope:   {ramp: rrope, bands: [1, 2], outline: false}
  stain:  {ramp: mh_blood, bands: [2, 2], outline: false, line: false}
  blood:  {ramp: mh_blood, bands: [2, 3], outline: false, line: false}
  bone:   {ramp: mh_bone, bands: [1, 3]}

channels:
  root: [0, 0, 0]
  v: 0

bones:
  body: {parent: root}
  # left hook: pig (v0, v2) or sack bundle (v1)
  hL: {parent: body, pos: [-0.45, 1.55, 0.05]}
  # right hook: leg of meat (v0), empty hook (v1), ribs (v2)
  hR: {parent: body, pos: "[0.45, 1.55, 0.05] + [0, 0.25, 0]*(abs(v - 1) < 0.5)", rot: "[0, 0, 0.12]*(abs(v - 1) < 0.5)"}

parts:
  # ---------- the rail ----------
  rail:
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [-0.88, 1.08, -0.1], half: [0.09, 1.08, 0.09], round: 0.01}
      - box: {c: [0.88, 1.08, -0.1], half: [0.09, 1.08, 0.09], round: 0.01}
      - box: {c: [0, 2.16, 0.0], half: [1.02, 0.08, 0.1], round: 0.01}
      - box: {c: [-0.72, 1.98, -0.05], half: [0.04, 0.2, 0.05], rot: [0, 0, -0.75]}
      - box: {c: [0.72, 1.98, -0.05], half: [0.04, 0.2, 0.05], rot: [0, 0, 0.75]}
  rail_stain:
    material: stain
    space: body
    prims:
      - box: {c: [-0.45, 2.1, 0.102], half: [0.15, 0.06, 0.003]}
      - box: {c: [0.88, 0.25, -0.008], half: [0.07, 0.2, 0.003]}
  chains:
    material: iron
    space: body
    prims:
      - cylinder: {a: [-0.45, 2.1, 0.05], b: [-0.45, 1.62, 0.05], r: 0.028}
      - cylinder: {a: [0.45, 2.1, 0.05], b: "[0.45, 1.62, 0.05] + [0.03, 0.25, 0]*(abs(v - 1) < 0.5)", r: 0.028}
      - torus: {c: [-0.45, 1.9, 0.05], R: 0.045, r: 0.018, rot: [0, 0, 1.5708]}
      - torus: {c: [0.45, 1.9, 0.05], R: 0.045, r: 0.018, rot: [0, 0, 1.5708]}
  hooks:
    material: iron
    space: hL
    prims:
      - cylinder: {a: [0, 0.07, 0], b: [0, -0.05, 0], r: 0.025}
  hookR:
    material: iron
    space: hR
    prims:
      - cylinder: {a: [0, 0.07, 0], b: [0, -0.05, 0], r: 0.025}
      - torus: {c: [0.05, -0.08, 0], R: 0.06, r: 0.02, rot: [1.5708, 0, 0]}
  # ---------- left: pig carcass (v0, v2) ----------
  pig:
    material: meat
    space: hL
    line: true
    blend: 0.06
    when: "abs(v - 1) > 0.5"
    prims:
      - ellipsoid: {c: [0, -0.5, 0], r: [0.24, 0.42, 0.2]}
      - cone: {a: [-0.1, -0.15, 0], b: [-0.06, 0.02, 0.02], r: [0.07, 0.04]}
      - cone: {a: [0.1, -0.15, 0], b: [0.06, 0.02, 0.02], r: [0.07, 0.04]}
      - ellipsoid: {c: [0, -0.96, 0.02], r: [0.14, 0.12, 0.14]}
    cut:
      - ellipsoid: {c: [0, -0.5, 0.22], r: [0.09, 0.3, 0.08]}       # opened belly
  pig_fat:
    material: fat
    space: hL
    when: "abs(v - 1) > 0.5"
    prims:
      - ellipsoid: {c: [-0.07, -0.5, 0.15], r: [0.03, 0.28, 0.04]}
      - ellipsoid: {c: [0.07, -0.5, 0.15], r: [0.03, 0.28, 0.04]}
  # ---------- left: sackcloth bundle (v1) ----------
  bundle:
    material: sack
    space: hL
    line: true
    blend: 0.08
    when: "abs(v - 1) < 0.5"
    prims:
      - ellipsoid: {c: [0, -0.62, 0], r: [0.2, 0.55, 0.16]}
      - ellipsoid: {c: [0, -0.18, 0.0], r: [0.13, 0.13, 0.12]}
      - ellipsoid: {c: [0, -0.4, 0], r: [0.25, 0.12, 0.17]}
  bundle_rope:
    material: rope
    space: hL
    when: "abs(v - 1) < 0.5"
    prims:
      - torus: {c: [0, -0.3, 0], R: 0.17, r: 0.025}
      - torus: {c: [0, -0.62, 0], R: 0.21, r: 0.025}
      - torus: {c: [0, -0.92, 0], R: 0.17, r: 0.025}
  bundle_stain:
    material: stain
    space: hL
    when: "abs(v - 1) < 0.5"
    prims:
      - ellipsoid: {c: [0.04, -0.98, 0.1], r: [0.1, 0.12, 0.06]}
      - ellipsoid: {c: [-0.06, -0.72, 0.14], r: [0.06, 0.08, 0.03]}
  # ---------- right: leg of meat (v0) ----------
  leg:
    material: meat
    space: hR
    line: true
    blend: 0.05
    when: "v < 0.5"
    prims:
      - ellipsoid: {c: [0, -0.45, 0], r: [0.17, 0.3, 0.15]}
      - cone: {a: [0, -0.2, 0], b: [0, -0.03, 0], r: [0.08, 0.05]}
  leg_bone:
    material: bone
    space: hR
    when: "v < 0.5"
    prims:
      - sphere: {c: [0, -0.02, 0.01], r: 0.06}
  leg_fat:
    material: fat
    space: hR
    when: "v < 0.5"
    prims:
      - ellipsoid: {c: [0.05, -0.55, 0.12], r: [0.08, 0.14, 0.04]}
  # ---------- right: rack of ribs (v2) ----------
  ribs_meat:
    material: meat
    space: hR
    line: true
    when: "abs(v - 2) < 0.5"
    prims:
      - box: {c: [0, -0.42, 0], half: [0.2, 0.32, 0.05], rot: [0, 0, 0.08], round: 0.04}
  ribs:
    material: bone
    space: hR
    when: "abs(v - 2) < 0.5"
    prims:
      - box: {c: [0.0, -0.2, 0.05], half: [0.22, 0.025, 0.02], rot: [0, 0, 0.08]}
      - box: {c: [0.01, -0.33, 0.05], half: [0.22, 0.025, 0.02], rot: [0, 0, 0.08]}
      - box: {c: [0.02, -0.46, 0.05], half: [0.21, 0.025, 0.02], rot: [0, 0, 0.08]}
      - box: {c: [0.03, -0.59, 0.05], half: [0.2, 0.025, 0.02], rot: [0, 0, 0.08]}
  # ---------- blood ----------
  drips:
    material: blood
    space: body
    prims:
      - cone: {a: [-0.45, 0.48, 0.07], b: [-0.45, 0.36, 0.07], r: [0.03, 0.012]}
      - cone: {a: [0.45, 0.8, 0.07], b: [0.45, 0.68, 0.07], r: [0.025, 0.01]}
  pool:
    material: blood
    space: body
    prims:
      - ellipsoid: {c: [-0.4, 0.005, 0.15], r: [0.38, 0.005, 0.2]}
      - ellipsoid: {c: [0.35, 0.005, 0.25], r: [0.25, 0.005, 0.14]}
      - ellipsoid: {c: [0.05, 0.005, 0.38], r: [0.12, 0.005, 0.06]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {v: 0}
  variants:
    frames: 3
    ms: 1000
    channels: {v: "f"}
