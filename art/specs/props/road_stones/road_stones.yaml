spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: road_stones
kind: prop
view: topdown
size: 16                 # one 16x16 world tile
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}
shadow: null

# Estrada dos Bandidos: paving of the old royal road, tileable 16x16, 4 variants of worn / broken stone.
brief:
  summary: worn cobbled setts of the old royal road; three rows of uneven grey-brown stones per 16 px tile,
    each with a light top edge and a dark bottom edge, packed dark mud in the joints;
    variants add cracks, a missing stone (mud hole with a pebble) and a broken corner with dead grass
  must_keep: [uneven setts that tile seamlessly in x and y, light top / dark bottom edge, mud joints, cracks / hole /
    grass in the variants]
  simplify: [every material is one exact colour; no lighting on the tile]
  exceptions: |
    kind prop, size 16, directions 1, mirror false, shadow null, camera.center [0, 0, 0].
    The tile fills the WHOLE frame on purpose (no margin: QA reports "clipped at the edge", expected for a
    tile). No outlines; every material is one exact colour (ramp of 1 tone + outline slot) so the pixels are
    hand-placed: the parts are pixel-exact flat boxes generated once from a 16x16 pixel layout (same method
    as castle_floor). camera.scale/pitch/light untouched.
  decisions: |
    TILING CONTRACT: the frame is one 16x16 px world tile; draw it every 16 px (pivot = frame centre 8,8).
    Rows y 0-4, 6-9 and 11-14 (joints at y 5, 10, 15); stones of 4-8 px, the middle row wraps over the
    right edge. Joints line up across tile edges, so every variant mixes with every other.
    Low contrast on purpose (stone vs joint ~12 L*): at strong contrast the setts read as a brick wall.
    VARIANTS: animation `variants` has 4 frames (frame i = variant i); `idle` = variant 0. 0 worn,
    1 cracked, 2 missing stone, 3 broken with dead grass. Pick a variant per tile with a hash of the tile
    coordinates (e.g. 60% v0, 20% v1, 10% v2, 10% v3); for a ruined road, draw the bare ground under
    gaps instead of a tile.
    Stone is a warm grey-brown so the road reads against the dead olive grass and the grey ash.

ramps:
  rs_grout:    ["#1c0f1a", "#352c25"]
  rs_stone:    ["#1c0f1a", "#55504a"]
  rs_stone_hi: ["#1c0f1a", "#67615a"]
  rs_stone_sh: ["#1c0f1a", "#46403b"]
  rs_crack:    ["#1c0f1a", "#2e2723"]
  rs_mud:      ["#1c0f1a", "#3b2f25"]
  rs_mud_hi:   ["#1c0f1a", "#4a3b2d"]
  rs_grass:    ["#1c0f1a", "#535034"]
  rs_grass_hi: ["#1c0f1a", "#635e3e"]
  rs_worn:     ["#1c0f1a", "#4c4742"]

materials:
  grout:    {ramp: rs_grout, bands: [1, 1], outline: false, line: false}
  stone:    {ramp: rs_stone, bands: [1, 1], outline: false, line: false}
  stone_hi: {ramp: rs_stone_hi, bands: [1, 1], outline: false, line: false}
  stone_sh: {ramp: rs_stone_sh, bands: [1, 1], outline: false, line: false}
  crack:    {ramp: rs_crack, bands: [1, 1], outline: false, line: false}
  mud:      {ramp: rs_mud, bands: [1, 1], outline: false, line: false}
  mud_hi:   {ramp: rs_mud_hi, bands: [1, 1], outline: false, line: false}
  grass:    {ramp: rs_grass, bands: [1, 1], outline: false, line: false}
  grass_hi: {ramp: rs_grass_hi, bands: [1, 1], outline: false, line: false}
  worn:     {ramp: rs_worn, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]
  var: 0             # variant 0..3

bones:
  body: {parent: root}

