      - ellipsoid: {c: [0.300, 0.003, 0.250], r: [0.120, 0.003, 0.090], rot: [0, 2.16, 0]}
  plate1:
    material: iron
    space: body
    line: true
    when: "abs(v - 1) < 0.5"
    prims:
      - cylinder: {a: [0, 0, 0], b: [0, 0.015, 0], r: 0.26}
  void1:
