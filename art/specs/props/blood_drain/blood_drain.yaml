      - box: {c: [0.0, 0.035, 0.0], half: [0.022, 0.01, 0.19]}
      - box: {c: [0.1, 0.035, 0.0], half: [0.022, 0.01, 0.19]}
  pool1:
    material: blood
    space: body
    when: "abs(v - 1) < 0.5"
    prims:
