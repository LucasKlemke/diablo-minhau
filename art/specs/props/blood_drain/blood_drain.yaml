      - ellipsoid: {c: [0.400, 0.003, 0.300], r: [0.250, 0.003, 0.188], rot: [0, 2.27, 0]}
      - ellipsoid: {c: [-0.450, 0.003, 0.250], r: [0.200, 0.003, 0.150], rot: [0, 1.77, 0]}
