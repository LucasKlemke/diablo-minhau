# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: village_gate
kind: prop
view: topdown
size: 96                 # 80 px wide closed (s); open leaves and the side views fit with 2+ px margins
directions: [s, e, w]    # s = gate in a horizontal fence run (north); e / w = gate in a vertical run (west / east)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.9, 0]}
shadow: null             # thin fence piece: the leaves cast no blob

# Act I village gate: replaces the tinted fence pieces that barred the north, west and east exits.
brief:
  summary: Farm RPG style wooden double gate, 5 tiles wide (4.4 units, 80 px), same red-brown wood and orange
    caps as fence_h / fence_v; two tall gate posts joined by a crossbeam with orange caps, two leaves of vertical boards with rails and a
    diagonal brace, an iron-banded locking bar across both leaves on the village side
  must_keep: [two leaves that swing open, locking bar that lifts off, tall posts with orange caps,
    same wood as the fence]
  simplify: [no hinges drawn beyond small dark straps, no wood grain]
  exceptions: |
    kind prop, size 96, directions [s, e, w], mirror false, shadow null. camera.scale/pitch/light untouched.
    Spec-local ramps keep index 0 = #1c0f1a; wood and cap ramps copied from fence_h.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot) is the ground point at the CENTRE of the gate span, on the
    fence line (z 0). The gate spans x -2.2..2.2 (posts at +-2.12), i.e. the 5 gap tiles; place the pivot at
    the centre of the middle gap tile, on the same ground line as the fence pieces (fence_h is placed 3 px above
    the tile bottom).
    Directions: s for the north gate (in a horizontal fence); e for the WEST gate and w for the EAST gate (in a
    vertical fence). Model +z is the village side (the locking bar is there) and -z the outside, so in every
    case the leaves swing OUTWARD, away from the village, and the bar faces the player inside.
    Clips: closed (static), rattle (loop: the leaves shudder against the bar, for raiders ramming the gate
    before a wave), open (one-shot: bar lifts and vanishes, then the leaves swing out; events unbar, opened),
    opened (static, leaves fully open).

ramps:
  fence_wood: ["#1c0f1a", "#32131e", "#4a2123", "#8a3625", "#ae4924"]
  gate_board: ["#1c0f1a", "#4a2123", "#8a3625", "#ae4924", "#c45a32"]
  fence_cap:  ["#1c0f1a", "#8f3317", "#c46120", "#e08a3a"]
  gate_iron:  ["#1c0f1a", "#2e3040", "#4b5266", "#7a849a"]

materials:
  wood:  {ramp: fence_wood, bands: [2, 3]}
  board: {ramp: gate_board, bands: [2, 3]}
  cap:   {ramp: fence_cap, bands: [2, 3]}
  iron:  {ramp: gate_iron, bands: [1, 3]}

channels:
  root: [0, 0, 0]
  open: 0             # 0 = closed, 1 = leaves swung fully outward
  shake_L: 0          # leaf rattle (radians, + = outward); automatic shake_R twin
  bar: 1              # locking bar: 1 = in place, 0 = lifted off (hidden below 0.15)

# Layout: posts at x +-2.12; each leaf hangs on a hinge at x +-1.98 and spans 1.96 towards the centre.
bones:
  body:   {parent: root}
  leaf_L: {parent: body, pos: [1.98, 0, 0], rot: "[0, -1.55*open - shake_L, 0]"}
  bar:    {parent: body, pos: "[0, 0.62 + 0.55*(1 - bar), 0.12 + 0.25*(1 - bar)]", rot: "[0, 0, 0.25*(1 - bar)]"}

parts:
  post_L:
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [2.12, 0.85, 0], half: [0.17, 0.85, 0.15], round: 0.08}
  post_cap_L:
    material: cap
    space: body
    line: true
    prims:
      - ellipsoid: {c: [2.12, 2.02, 0.02], r: [0.14, 0.11, 0.13]}
  arch:              # crossbeam over the posts: reads as the village entrance, not a fence
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [0, 1.80, 0], half: [2.42, 0.10, 0.13], round: 0.03}
      - box: {c: [0, 1.62, 0], half: [2.0, 0.05, 0.08]}
  arch_caps:
    material: cap
    space: body
    line: true
    prims:
      - box: {c: [2.42, 1.80, 0], half: [0.06, 0.12, 0.15], round: 0.02}
      - box: {c: [-2.42, 1.80, 0], half: [0.06, 0.12, 0.15], round: 0.02}
  boards_L:          # vertical boards, alternating heights for a hand-made top edge
    material: board
    space: leaf_L
    line: true
    prims:
      - box: {c: [-0.15, 0.58, 0], half: [0.125, 0.50, 0.04], round: 0.03}
      - box: {c: [-0.43, 0.61, 0], half: [0.125, 0.53, 0.04], round: 0.03}
      - box: {c: [-0.71, 0.58, 0], half: [0.125, 0.50, 0.04], round: 0.03}
      - box: {c: [-0.99, 0.61, 0], half: [0.125, 0.53, 0.04], round: 0.03}
      - box: {c: [-1.27, 0.58, 0], half: [0.125, 0.50, 0.04], round: 0.03}
      - box: {c: [-1.55, 0.61, 0], half: [0.125, 0.53, 0.04], round: 0.03}
      - box: {c: [-1.83, 0.58, 0], half: [0.125, 0.50, 0.04], round: 0.03}
  rails_L:           # two rails and a diagonal brace on the village side
    material: wood
    space: leaf_L
    line: true
    prims:
      - box: {c: [-0.99, 0.28, 0.06], half: [0.96, 0.05, 0.03]}
      - box: {c: [-0.99, 0.92, 0.06], half: [0.96, 0.05, 0.03]}
      - box: {c: [-0.99, 0.60, 0.07], half: [1.02, 0.045, 0.03], rot: [0, 0, -0.32]}
  straps_L:          # iron hinge straps
    material: iron
    space: leaf_L
    prims:
      - box: {c: [-0.22, 0.28, 0.10], half: [0.24, 0.035, 0.02]}
      - box: {c: [-0.22, 0.92, 0.10], half: [0.24, 0.035, 0.02]}
  bar:               # locking beam across both leaves, village side (lighter wood so it reads)
    material: cap
    space: bar
    line: true
    when: "bar > 0.15"
    prims:
      - box: {c: [0, 0, 0], half: [1.15, 0.075, 0.07], round: 0.02}
  bar_bands:
    material: iron
    space: bar
    when: "bar > 0.15"
    prims:
      - box: {c: [0.75, 0, 0], half: [0.05, 0.09, 0.085]}
      - box: {c: [-0.75, 0, 0], half: [0.05, 0.09, 0.085]}
  brackets_L:        # iron brackets that hold the bar, on each leaf
    material: iron
    space: leaf_L
    prims:
      - box: {c: [-1.55, 0.62, 0.11], half: [0.06, 0.12, 0.05]}

animations:
  closed:
    frames: 1
    ms: 1000
    channels: {}
  rattle:              # raiders ramming the gate
    loop: true
    keys:
      - {ms: 90, set: {shake_L: 0.10, shake_R: 0.04}}
      - {ms: 70, set: {shake_L: -0.02, shake_R: 0.10}}
      - {ms: 90, set: {shake_L: 0.06, shake_R: -0.02}}
      - {ms: 120, set: {shake_L: 0, shake_R: 0}}
  open:
    loop: false
    keys:
      - {ms: 120, set: {bar: 1}}
      - {ms: 90, set: {bar: 0.55}}
      - {ms: 90, event: unbar, set: {bar: 0}}
      - {ms: 80, set: {bar: 0, open: 0.12}}
      - {ms: 80, set: {bar: 0, open: 0.38}}
      - {ms: 80, set: {bar: 0, open: 0.68}}
      - {ms: 90, set: {bar: 0, open: 0.92}}
      - {ms: 110, set: {bar: 0, open: 1.04}}
      - {ms: 300, event: opened, set: {bar: 0, open: 1}}
  opened:
    frames: 1
    ms: 1000
    channels: {open: 1, bar: 0}
