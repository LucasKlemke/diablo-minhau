# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: broken_cart
kind: prop
view: topdown
size: 64
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 0.5584 = 8 px above the pivot -> pivot (32, 40), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.5584, 0]}
shadow: {rx: 26, ry: 8, alpha: 70}

# Act I, Minhau: a refugee cart wrecked in the raid.
brief:
  summary: a farm cart turned upside down - the plank bed overturned on the mud, the axle on top with the
    back wheel (iron rim) standing up in the air and the front wheel torn off (only the hub stub left),
    its snapped spokes and a piece of its rim in the mud, the shafts sloping down to the ground on
    the left, a torn sack spilling grain
  must_keep: [overturned plank bed, wheels sticking up (the other torn off), shafts, iron rim]
  simplify: [planks as grooves on the bed, wheels as tori with 3-4 spokes, sack as a lumpy ellipsoid]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, camera.center [0, 0.5584, 0] (integer pivot).
    camera.scale/pitch/light untouched. Ramps from palettes/ruin.yaml (index 0 = #1c0f1a).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,40) is the ground point at the centre of
    the wreck. Cart bed 1.8 x 1.0 units lying on its long side, shafts to the left, broken wheel in front
    right -> ~52 x 40 px, footprint 3x2 tiles; block the 3x1 tiles under the bed (the shafts and the
    loose debris can stay walkable). Modelled upright in the `cart` bone and flipped 180 degrees about x
    (upside down), so the wheels read face-on above the bed. Static: 1-frame idle.

materials:
  wood:   {ramp: rwood, bands: [2, 4]}
  inner:  {ramp: rwood, bands: [1, 3]}
  groove: {ramp: rwood, bands: [1, 1], outline: false, line: false}
  plank:  {ramp: rplank, bands: [2, 4]}
  iron:   {ramp: riron, bands: [2, 4]}
  sack:   {ramp: rcanvas, bands: [2, 4]}
  grain:  {ramp: rstraw, bands: [2, 4], outline: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}
  cart: {parent: root, pos: [0.05, 0.88, -0.1], rot: [3.1416, 0.0, 0.06]}   # upside down

parts:
  # ---- the cart, modelled upright: bed along x, axle along z ----
  bed_floor:
    material: inner
    space: cart
    line: true
    prims:
      - box: {c: [0, 0.5, 0], half: [0.9, 0.04, 0.5]}
  bed_grooves:     # plank joints seen on the inside of the floor
    material: groove
    space: cart
    prims:
      - box: {c: [0, 0.55, -0.17], half: [0.86, 0.01, 0.015]}
      - box: {c: [0, 0.55, 0.17], half: [0.86, 0.01, 0.015]}
      - box: {c: [0, 0.66, -0.52], half: [0.86, 0.015, 0.01]}
      - box: {c: [-0.3, 0.6, -0.52], half: [0.015, 0.06, 0.01]}
      - box: {c: [0.45, 0.72, -0.52], half: [0.015, 0.06, 0.01]}
  bed_sides:
    material: wood
    space: cart
    line: true
    prims:
      - box: {c: [0, 0.66, -0.48], half: [0.9, 0.16, 0.035]}
      - box: {c: [0, 0.66, 0.48], half: [0.9, 0.16, 0.035]}
      - box: {c: [0.88, 0.66, 0], half: [0.035, 0.16, 0.5]}
      - box: {c: [-0.88, 0.66, -0.15], half: [0.035, 0.16, 0.32], rot: [0.0, 0, 0.1]}      # broken tailboard
  rails:           # top rails of the sides, grey weathered
    material: plank
    space: cart
    line: true
    prims:
      - box: {c: [0, 0.84, -0.48], half: [0.92, 0.04, 0.05]}
      - box: {c: [0.1, 0.84, 0.48], half: [0.8, 0.04, 0.05], rot: [0, 0, 0.04]}
  axle:
    material: wood
    space: cart
    line: true
    prims:
      - box: {c: [0.1, 0.3, 0.0], half: [0.07, 0.07, 0.7]}
  wheel_back:      # intact wheel (behind once flipped)
    material: wood
    space: cart
    line: true
    prims:
      - cylinder: {a: [0.1, 0.3, 0.64], b: [0.52, 0.3, 0.64], r: 0.04}
      - cylinder: {a: [0.1, 0.3, 0.64], b: [-0.32, 0.3, 0.64], r: 0.04}
      - cylinder: {a: [0.1, 0.3, 0.64], b: [0.1, -0.12, 0.64], r: 0.04}
      - cylinder: {a: [0.1, 0.3, 0.64], b: [0.4, 0.0, 0.64], r: 0.04}
      - cylinder: {a: [0.1, 0.3, 0.64], b: [-0.2, 0.0, 0.64], r: 0.04}
      - cylinder: {a: [0.1, 0.3, 0.58], b: [0.1, 0.3, 0.72], r: 0.09}
  wheel_back_rim:
    material: iron
    space: cart
    line: true
    prims:
      - torus: {c: [0.1, 0.3, 0.64], R: 0.45, r: 0.05, rot: [1.5708, 0, 0]}
    cut:
      - box: {c: [0.1, 0.62, 0.64], half: [0.6, 0.18, 0.2]}
  hub_front:       # the front wheel broke off: only the hub stub is left on the axle
    material: wood
    space: cart
    line: true
    prims:
      - cylinder: {a: [0.1, 0.3, -0.7], b: [0.1, 0.3, -0.56], r: 0.09}
      - cylinder: {a: [0.1, 0.3, -0.64], b: [0.26, 0.12, -0.64], r: 0.04}
  shafts:          # two shafts jutting out to the left, ends on the ground
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.8, 0.4, -0.38], b: [-1.55, 0.06, -0.5], r: 0.045}
      - cylinder: {a: [-0.8, 0.4, 0.3], b: [-1.42, 0.06, 0.48], r: 0.045}
  # ---- on the ground ----
  debris:          # snapped spokes and a piece of rim on the ground in front
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [0.5, 0.04, 0.7], b: [0.85, 0.04, 0.6], r: 0.035}
      - cylinder: {a: [0.3, 0.04, 0.85], b: [0.55, 0.04, 0.95], r: 0.035}
  rim_piece:
    material: iron
    space: body
    line: true
    prims:
      - torus: {c: [0.95, 0.04, 0.4], R: 0.4, r: 0.04}
    cut:
      - box: {c: [0.95, 0.04, 0.05], half: [0.6, 0.2, 0.42]}
      - box: {c: [1.3, 0.04, 0.6], half: [0.3, 0.2, 0.4]}
  sack:
    material: sack
    space: body
    line: true
    blend: 0.05
    prims:
      - ellipsoid: {c: [-0.55, 0.14, 0.55], r: [0.28, 0.14, 0.2], rot: [0, 0.4, 0]}
  grain:           # spilled grain from the torn sack
    material: grain
    space: body
    blend: 0.04
    prims:
      - ellipsoid: {c: [-0.2, 0.02, 0.68], r: [0.24, 0.03, 0.14]}
      - ellipsoid: {c: [0.0, 0.02, 0.78], r: [0.12, 0.03, 0.08]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
