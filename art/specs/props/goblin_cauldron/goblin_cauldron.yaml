# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: goblin_cauldron
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.5584, 0]}   # 8 px above the pivot -> pivot (24, 32)
shadow: null             # the fire lights the ground

# Ruined village QUEST OBJECT: the goblins' filthy cauldron; the player fishes the lavender soap bale out.
brief:
  summary: squat black iron cauldron on three stubby legs, crusted with grime and green drips, a bright rim
    highlight, full of murky bubbling green stew in which a bale of lavender soap (tied with twine, soft
    lavender glow) floats, over a small fire of crossed sticks; crude goblin touches - a bone ladle sticking out, a ring of rough stones, a small
    skull on a stake beside it
  must_keep: [black iron pot with thick bright rim, murky stew with popping bubbles, floating lavender soap
    bale with a soft emissive glow, grime drips, small fire under it, bone ladle,
    skull on a stake]
  simplify: [bubbles as 2-3 light dots, fire as 3 small tongues, stones as rounded boxes]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 0.5584, 0] (integer
    pivot). Fire and the stew's glow are emissive; camera.scale/pitch/light untouched.
    Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,32) is the ground point under the cauldron's
    centre. Pot radius 0.5, stone ring 0.7 (~26 px wide) -> footprint 2x2 tiles, blocking. Static (1-frame
    idle 6 frames, loop): bubbles swell and pop out of phase, the fire flickers, the soap bale bobs 1 px.
    The lavender bale is the quest item: its soft emissive accent is what the player looks for.

ramps:
  gc_iron:  ["#1c0f1a", "#1f1c26", "#33303e", "#4b4858", "#6a6778"]
  gc_stew:  ["#1c0f1a", "#2b4a22", "#4f7d33", "#74a347", "#a3c873"]
  gc_rim:   ["#1c0f1a", "#6a6778", "#9a98aa", "#c8c6d4"]
  gc_soap:  ["#1c0f1a", "#6a4a9a", "#9a6ad0", "#c39af0", "#e6d2ff"]
  gc_twine: ["#1c0f1a", "#6e4a2c", "#a8803c"]
  gc_stone: ["#1c0f1a", "#3d3440", "#6b6070", "#a3969c"]
  gc_stick: ["#1c0f1a", "#3a1f16", "#5e3a22", "#80552f"]
  gc_bone:  ["#1c0f1a", "#7a5a40", "#c4a77a", "#e6d6ad", "#f8f1dc"]
  gc_flame: ["#1c0f1a", "#5a0a12", "#a8160f", "#e0361a", "#fe6607", "#ffa12e", "#ffd65c", "#fff4c8"]

materials:
  iron:   {ramp: gc_iron, bands: [1, 4]}
  stew:   {ramp: gc_stew, bands: [2, 3], line: false}
  bubble: {ramp: gc_stew, bands: [4, 4], outline: false, line: false}
  rim:    {ramp: gc_rim, bands: [2, 3], outline: false, line: false}
  grime:  {ramp: gc_stew, bands: [1, 2], outline: false, line: false}
  soap:   {ramp: gc_soap, emissive: true, band: 3, outline: true, line: false, glow: {color: "#d8bcf4", mix: 0.35, radius: 1}}
  twine:  {ramp: gc_twine, bands: [1, 2], outline: false, line: false}
  stone:  {ramp: gc_stone, bands: [1, 3]}
  stick:  {ramp: gc_stick, bands: [1, 3]}
  bone:   {ramp: gc_bone, bands: [1, 4]}
  eye:    {ramp: gc_iron, bands: [1, 1], outline: false, line: false}
  flame:  {ramp: gc_flame, emissive: true, band: 4, outline: false, line: false, glow: {color: "#fe6607", mix: 0.35, radius: 1}}
  flame_hot: {ramp: gc_flame, emissive: true, band: 6, outline: false, line: false}

channels:
  root: [0, 0, 0]
  b1: 0.5           # bubble sizes 0..1
  b2: 0.5
  b3: 0.5
  fl: 1             # fire height
  bob: 0            # soap bale bob (units)

bones:
  body: {parent: root}

parts:
  stones:
    material: stone
    space: body
    line: true
    prims:
      - box: {c: [0.0, 0.07, 0.68], half: [0.14, 0.07, 0.1], round: 0.05}
      - box: {c: [0.55, 0.07, 0.4], half: [0.12, 0.07, 0.1], rot: [0, 0.9, 0], round: 0.05}
      - box: {c: [-0.55, 0.07, 0.4], half: [0.12, 0.07, 0.1], rot: [0, -0.9, 0], round: 0.05}
      - box: {c: [0.66, 0.07, -0.15], half: [0.1, 0.07, 0.12], round: 0.05}
      - box: {c: [-0.66, 0.07, -0.15], half: [0.1, 0.07, 0.12], round: 0.05}
      - box: {c: [0.3, 0.07, -0.62], half: [0.13, 0.07, 0.1], rot: [0, -0.5, 0], round: 0.05}
      - box: {c: [-0.3, 0.07, -0.62], half: [0.13, 0.07, 0.1], rot: [0, 0.5, 0], round: 0.05}
  sticks:
    material: stick
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.45, 0.06, 0.35], b: [0.3, 0.1, -0.2], r: 0.045}
      - cylinder: {a: [0.45, 0.06, 0.35], b: [-0.3, 0.1, -0.2], r: 0.045}
  fire:
    material: flame
    space: body
    prims:
      - cone: {a: [0.0, 0.08, 0.42], b: "[0.02, 0.08 + 0.28*fl, 0.48]", r: [0.1, 0.02]}
      - cone: {a: [-0.2, 0.08, 0.38], b: "[-0.27, 0.08 + 0.2*(2 - fl), 0.44]", r: [0.08, 0.02]}
      - cone: {a: [0.22, 0.08, 0.38], b: [0.28, 0.3, 0.44], r: [0.08, 0.02]}
  fire_hot:
    material: flame_hot
    space: body
    prims:
      - cone: {a: [0.0, 0.08, 0.5], b: [0.01, 0.22, 0.54], r: [0.06, 0.015]}
  legs:
    material: iron
    space: body
    line: true
    prims:
      - cone: {a: [0.32, 0.4, 0.18], b: [0.4, 0.0, 0.24], r: [0.06, 0.04]}
      - cone: {a: [-0.32, 0.4, 0.18], b: [-0.4, 0.0, 0.24], r: [0.06, 0.04]}
      - cone: {a: [0.0, 0.4, -0.36], b: [0.0, 0.0, -0.46], r: [0.06, 0.04]}
  pot:
    material: iron
    space: body
    line: true
    blend: 0.05
    prims:
      - sphere: {c: [0, 0.62, 0], r: 0.5}
      - torus: {c: [0, 0.98, 0], R: 0.42, r: 0.07}
    cut:
      - box: {c: [0, 1.4, 0], half: [1, 0.42, 1]}
      - cylinder: {a: [0, 0.8, 0], b: [0, 1.2, 0], r: 0.38}
  stew:
    material: stew
    space: body
    prims:
      - cylinder: {a: [0, 0.86, 0], b: [0, 0.93, 0], r: 0.4}
  bubbles:
    material: bubble
    space: body
    prims:
      - sphere: {c: [-0.24, 0.93, 0.18], r: "0.02 + 0.07*b1"}
      - sphere: {c: [0.27, 0.93, -0.05], r: "0.02 + 0.06*b2"}
      - sphere: {c: [0.02, 0.93, 0.24], r: "0.015 + 0.045*b3"}
  rim_hi:             # bright top of the rim
    material: rim
    space: body
    prims:
      - torus: {c: [0, 1.02, 0], R: 0.42, r: 0.035}
  grime:              # stew drips and crust on the pot
    material: grime
    space: body
    prims:
      - box: {c: [-0.22, 0.82, 0.43], half: [0.035, 0.12, 0.02], rot: [0.3, 0, 0.1]}
      - box: {c: [0.12, 0.8, 0.45], half: [0.03, 0.14, 0.02], rot: [0.35, 0, -0.05]}
      - box: {c: [0.34, 0.84, 0.32], half: [0.03, 0.09, 0.02], rot: [0.3, 0.6, 0]}
  soap:               # the lavender soap bale floating in the stew
    material: soap
    space: body
    prims:
      - box: {c: "[0.04, 1.02 + bob, 0.04]", half: [0.21, 0.09, 0.15], rot: [0.08, 0.35, 0.12], round: 0.04}
  soap_twine:
    material: twine
    space: body
    prims:
      - box: {c: "[0.04, 1.025 + bob, 0.04]", half: [0.03, 0.1, 0.16], rot: [0.08, 0.35, 0.12]}
      - box: {c: "[0.04, 1.025 + bob, 0.04]", half: [0.22, 0.1, 0.03], rot: [0.08, 0.35, 0.12]}
  ladle:
    material: bone
    space: body
    line: true
    prims:
      - cylinder: {a: [0.15, 0.9, -0.05], b: [0.45, 1.45, -0.2], r: 0.035}
      - sphere: {c: [0.46, 1.47, -0.2], r: 0.05}
  stake:
    material: stick
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.82, 0.0, -0.35], b: [-0.82, 1.15, -0.35], r: 0.035}
  skull:
    material: bone
    space: body
    line: true
    blend: 0.04
    prims:
      - sphere: {c: [-0.82, 1.24, -0.35], r: 0.18}
      - box: {c: [-0.82, 1.08, -0.27], half: [0.11, 0.06, 0.09], round: 0.03}
  skull_eyes:
    material: eye
    space: body
    prims:
      - sphere: {c: [-0.89, 1.24, -0.2], r: 0.05}
      - sphere: {c: [-0.75, 1.24, -0.2], r: 0.05}

animations:
  idle:
    frames: 6
    ms: 130
    channels:
      b1: "pos(sin(p))"
      b2: "pos(sin(p + 2.1))"
      b3: "pos(sin(p + 4.2))"
      fl: "1 + 0.2*sin(2*p)"
      bob: "0.012*sin(p)"
