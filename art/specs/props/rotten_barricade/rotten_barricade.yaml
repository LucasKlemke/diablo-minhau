spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: rotten_barricade
kind: prop
view: topdown
size: 64                 # ~52 x 30 px on screen, 2+ px margins
directions: 1            # faces the camera (s); horizontal (runs along x)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.5584, 0]}   # 8 px above the pivot -> pivot (32, 40)
shadow: {rx: 24, ry: 4, alpha: 110}

# Bosque dos Goblins: goblin barricade of rotten wood with sharpened stakes, laid across paths.
brief:
  summary: crude goblin barricade of rotten grey-brown wood running left-right, ~3 tiles long; crooked posts
    with sharpened tops, two sagging horizontal rails lashed with rope, and a row of sharpened stakes slanting
    out towards the viewer; damp black rot and pale fungus on the planks
  must_keep: [horizontal run, sharpened points on top and slanting forward, sagging rails, rope lashings,
    rot (dark patches), grey decayed wood]
  simplify: [lashings as 2-3 px light bands, fungus as 1-2 px pale dots]
  exceptions: |
    kind prop, size 64, directions 1, mirror false; camera.center [0, 0.5584, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,40) is the ground point at the centre of the
    barricade's base line. Footprint 3x1 tiles (x -1.3..1.3), blocking all 3 (variant 1: blocks only the
    left 2 tiles; the right tile is passable rubble, the gap in the wall).
    VARIANTS: animation `variants` has 2 frames (frame i = variant i); `idle` = variant 0.
    0 intact; 1 broken - the right post snapped, rails collapsed to the ground, two stakes knocked flat.
    For a vertical run, the game can use it rotated in its own layout or a future `_v` spec.

ramps:
  rb_wood:  ["#1c0f1a", "#3a3029", "#56493c", "#73644f", "#928066"]
  rb_rot:   ["#1c0f1a", "#1e1a16", "#2a2420"]
  rb_rope:  ["#1c0f1a", "#5e4a30", "#8a7048"]
  rb_fungus: ["#1c0f1a", "#9a9078", "#c8bea0"]

materials:
  wood:   {ramp: rb_wood, bands: [1, 4]}
  rot:    {ramp: rb_rot, bands: [1, 2], outline: false, line: false}
  rope:   {ramp: rb_rope, bands: [1, 2], line: false}
  fungus: {ramp: rb_fungus, bands: [1, 2], outline: false, line: false}

channels:
  root: [0, 0, 0]
  var: 0             # 0 intact, 1 broken

bones:
  body: {parent: root}

parts:
  # ---------------- shared left part (both variants) ----------------
  posts_left:
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.22, 0, 0], b: [-1.26, 0.82, 0], r: 0.075}
      - cone: {a: [-1.26, 0.80, 0], b: [-1.27, 1.02, 0], r: [0.075, 0.012]}
  stakes_left:       # sharpened stakes slanting out towards the viewer
    material: wood
    space: body
    line: true
    prims:
      - cone: {a: [-1.15, 0.02, 0.14], b: [-0.55, 1.16, 0.32], r: [0.055, 0.012]}
      - cone: {a: [-0.49, 0.02, 0.14], b: [-1.09, 1.16, 0.32], r: [0.055, 0.012]}
      - cone: {a: [-0.35, 0.02, 0.14], b: [0.25, 1.16, 0.32], r: [0.055, 0.012]}
      - cone: {a: [0.31, 0.02, 0.14], b: [-0.29, 1.16, 0.32], r: [0.055, 0.012]}
  # ---------------- variant 0: intact ----------------
  v0_posts:
    when: "var < 0.5"
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [1.22, 0, 0], b: [1.20, 0.78, 0], r: 0.075}
      - cone: {a: [1.20, 0.76, 0], b: [1.19, 0.98, 0], r: [0.075, 0.012]}
  v0_rails:
    when: "var < 0.5"
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [0, 0.62, 0.05], half: [1.36, 0.045, 0.03], rot: [0, 0, 0.03], round: 0.015}
      - box: {c: [0, 0.30, 0.05], half: [1.38, 0.045, 0.03], rot: [0, 0, -0.04], round: 0.015}
  v0_stakes:
    when: "var < 0.5"
    material: wood
    space: body
    line: true
    prims:
      - cone: {a: [0.47, 0.02, 0.14], b: [1.07, 1.16, 0.32], r: [0.055, 0.012]}
      - cone: {a: [1.13, 0.02, 0.14], b: [0.53, 1.16, 0.32], r: [0.055, 0.012]}
  v0_rope:
    when: "var < 0.5"
    material: rope
    space: body
    prims:
      - cylinder: {a: [0.80, 0.56, 0.24], b: [0.80, 0.68, 0.24], r: 0.08}
      - cylinder: {a: [1.20, 0.25, 0.09], b: [1.20, 0.36, 0.09], r: 0.085}
  v0_rot:
    when: "var < 0.5"
    material: rot
    space: body
    prims:
      - ellipsoid: {c: [0.80, 0.62, 0.09], r: [0.16, 0.035, 0.01]}
      - ellipsoid: {c: [-0.05, 0.30, 0.09], r: [0.20, 0.035, 0.01]}
  v0_fungus:
    when: "var < 0.5"
    material: fungus
    space: body
    prims:
      - sphere: {c: [0.88, 0.58, 0.10], r: 0.03}
      - sphere: {c: [-0.12, 0.26, 0.10], r: 0.03}

  # ---------------- variant 1: broken right half ----------------
  v1_rails:
    when: "var > 0.5"
    material: wood
    space: body
    line: true
    prims:
      - box: {c: [-0.62, 0.64, 0.05], half: [0.76, 0.055, 0.035], rot: [0, 0, 0.02], round: 0.015}     # upper rail snapped
      - box: {c: [0.28, 0.32, 0.22], half: [0.60, 0.055, 0.035], rot: [0.0, -0.25, -0.50], round: 0.015} # sagging to the ground
      - box: {c: [-0.55, 0.30, 0.05], half: [0.82, 0.055, 0.035], rot: [0, 0, -0.03], round: 0.015}
      - box: {c: [0.90, 0.04, 0.38], half: [0.48, 0.04, 0.05], rot: [0, 0.4, 0], round: 0.015}         # fallen plank
  v1_posts:
    when: "var > 0.5"
    material: wood
    space: body
    line: true
    prims:
      - cylinder: {a: [0.40, 0, 0], b: [0.43, 0.42, 0], r: 0.08}                                       # snapped stump
      - cone: {a: [0.43, 0.40, 0], b: [0.38, 0.56, 0.02], r: [0.06, 0.012]}
      - cylinder: {a: [0.66, 0.06, 0.20], b: [1.34, 0.08, -0.10], r: 0.075}                             # fallen post
      - cylinder: {a: [1.22, 0, 0], b: [1.30, 0.28, 0], r: 0.075}
  v1_stakes:
    when: "var > 0.5"
    material: wood
    space: body
    line: true
    prims:
      - cone: {a: [0.60, 0.04, 0.52], b: [1.20, 0.05, 0.62], r: [0.06, 0.012]}                       # knocked flat
      - cone: {a: [1.08, 0.04, 0.16], b: [1.46, 0.10, 0.44], r: [0.055, 0.012]}
  v1_rope:
    when: "var > 0.5"
    material: rope
    space: body
    prims:
      - cylinder: {a: [-0.82, 0.58, 0.24], b: [-0.82, 0.70, 0.24], r: 0.08}
  v1_rot:
    when: "var > 0.5"
    material: rot
    space: body
    prims:
      - ellipsoid: {c: [-0.70, 0.64, 0.09], r: [0.18, 0.035, 0.01]}
      - ellipsoid: {c: [0.88, 0.07, 0.43], r: [0.20, 0.02, 0.03], rot: [0, 0.4, 0]}
  v1_fungus:
    when: "var > 0.5"
    material: fungus
    space: body
    prims:
      - sphere: {c: [-0.76, 0.60, 0.10], r: 0.03}
      - sphere: {c: [0.43, 0.44, 0.07], r: 0.03}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {var: 0}
  variants:
    frames: 2
    ms: 1000
    channels: {var: "f"}
