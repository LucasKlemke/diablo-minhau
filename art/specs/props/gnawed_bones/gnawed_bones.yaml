spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: gnawed_bones
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: ["farm", "ruin"]
camera: {pitch: 38, scale: 0.055, center: [0, 0, 0]}   # pivot = frame centre (24, 24) = the ground point
shadow: null             # a flat scatter on the ground

# Mata dos Lobos, arena "Cruzamento das Pedras Altas": what the plague dogs left of their meals.
brief:
  summary: flat scatter of gnawed bones on the ground - long bones with knobbed ends and splintered, chewed
    ends, curved ribs, a run of vertebrae and a jaw with teeth - with tufts of torn grey-brown fur; three
    layouts
  must_keep: [ivory bones with knobs and splintered ends, torn fur tufts, flat (decal-height) scatter]
  simplify: [bones as rods with two knobs or one knob and a cone splinter, fur as a flattened tuft with 3
    spiky cones, vertebrae as small rounded boxes]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, shadow null, camera.center [0, 0, 0] (decal: pivot at the
    frame centre). camera.scale/pitch/light untouched. Ramps from palettes ruin (rbone, rfur); no spec-local
    ramps. Bones keep the dark outline (objects on the floor, like bone_pile). No stain: a dark stain under
    the scatter merged with the outlines into one dark blob, so the bones lie straight on the ground.
  decisions: |
    PIVOT CONTRACT: pivot (24, 24) = frame centre = the ground point at the centre of the scatter. FLOOR
    DECAL: draw on the floor layer; passable. v0 ~1.4 x 0.9 units (2x1 tiles), v1 ~0.9 x 0.6 (1x1), v2
    ~1.3 x 0.8 (2x1). Nothing rises above ~0.12 units (2 px). Clips: idle (= variant 0) and `variants`
    (3 frames, frame i = variant i). Layout written once by a script, then tuned by hand.

materials:
  bone:  {ramp: rbone, bands: [2, 4]}
  tooth: {ramp: rbone, bands: [4, 4], line: false}
  fur:   {ramp: rfur, bands: [3, 4], line: false}

channels:
  root: [0, 0, 0]
  v: 0               # variant 0..2

bones:
  body: {parent: root}

