# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: npc_marker
kind: prop
view: topdown
size: 32
directions: 1
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.78, 0]}
shadow: null             # floats over the NPC's head

# Floating quest marker over NPCs (replaces the small HTML "!" / "?" glyphs, which were hard to see).
brief:
  summary: chunky glowing quest marker, ~20 px tall; "!" in gold (quest available) and "?" in green (quest ready
    to hand in), dark outline, soft glow, bobbing and wobbling so it catches the eye over grass and roofs
  must_keep: [big readable glyph, dark outline, warm glow, gentle bob]
  exceptions: |
    kind prop, size 32, directions 1, mirror false, shadow null. Glyph materials are emissive (full brightness
    at night and in dungeons) but keep the dark outline. camera.scale/pitch/light untouched.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot) is the anchor point at the BOTTOM of the glyph's rest
    position (the bob moves the glyph up to ~3 px above it). Place it a few px above the NPC's head.
    Clips: quest = "!" gold (#ffe14d family), ready = "?" green (#7bea6a family), matching the HUD colours.

ramps:
  mk_gold:  ["#1c0f1a", "#c47a12", "#ffe14d", "#fff6b0"]
  mk_green: ["#1c0f1a", "#2f8a2a", "#7bea6a", "#d4ffc0"]

materials:
  gold:      {ramp: mk_gold, emissive: true, band: 2, outline: true, glow: {color: "#ffd23a", mix: 0.35, radius: 1}}
  gold_hi:   {ramp: mk_gold, emissive: true, band: 3, outline: false, line: false}
  green:     {ramp: mk_green, emissive: true, band: 2, outline: true, glow: {color: "#7bea6a", mix: 0.35, radius: 1}}
  green_hi:  {ramp: mk_green, emissive: true, band: 3, outline: false, line: false}

channels:
  root: [0, 0, 0]
  kind: 0           # 0 = "!", 1 = "?"
  bob: 0
  wobble: 0

bones:
  body:  {parent: root, pos: "[0, bob, 0]", rot: "[0, wobble, 0]", scale: 1.4}

parts:
  bang:              # "!"
    material: gold
    space: body
    when: "kind < 0.5"
    prims:
      - cone: {a: [0, 0.42, 0], b: [0, 0.86, 0], r: [0.075, 0.12]}
      - sphere: {c: [0, 0.12, 0], r: 0.10}
  bang_hi:
    material: gold_hi
    space: body
    when: "kind < 0.5"
    prims:
      - box: {c: [-0.035, 0.68, 0.10], half: [0.025, 0.12, 0.02]}
  hook:              # "?": open ring, stem and dot
    material: green
    space: body
    when: "kind >= 0.5"
    blend: 0.03
    prims:
      - torus: {c: [0, 0.66, 0], R: 0.18, r: 0.075, rot: [1.5708, 0, 0]}
      - box: {c: [0, 0.44, 0], half: [0.075, 0.08, 0.075]}
      - sphere: {c: [0, 0.12, 0], r: 0.10}
    cut:
      - box: {c: [-0.18, 0.48, 0], half: [0.18, 0.18, 0.2]}
  hook_hi:
    material: green_hi
    space: body
    when: "kind >= 0.5"
    prims:
      - box: {c: [-0.06, 0.82, 0.08], half: [0.06, 0.02, 0.02]}

animations:
  quest:
    frames: 6
    ms: 110
    channels: {kind: 0, bob: "0.08 + 0.08*sin(p)", wobble: "0.3*cos(p)"}
  ready:
    frames: 6
    ms: 110
    channels: {kind: 1, bob: "0.08 + 0.08*sin(p)", wobble: "0.3*cos(p)"}
