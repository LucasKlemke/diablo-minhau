# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: flea_nest
kind: prop
view: topdown
size: 48
directions: 1
mirror: false
palette: ["farm", "hut", "ruin"]
# centre y 0.4188 = 6 px above the pivot -> pivot (24, 30), integer
camera: {pitch: 38, scale: 0.055, center: [0, 0.4188, 0]}
shadow: {rx: 17, ry: 5, alpha: 90}

# Act I dungeon "Casa Abandonada": the Demon Flea's brood in the boss room.
brief:
  summary: a low mound of matted dark monster fur clumps glued with sickly yellow-green goo, holding a
    clutch of big pale glossy parasite eggs, each with a faint green glow inside; goo seeping around the
    base, a few loose fur tufts and two small eggs rolled out; slow organic pulse (eggs swell, glow brightens)
  must_keep: [dark fur mound, big pale eggs, faint sickly green inner glow, slow pulse]
  simplify: [fur as lumpy blended ellipsoids with a few tuft cones, goo as flat blobs, glow as small emissive
    spots on the eggs' front]
  exceptions: |
    kind prop, size 48, directions 1, mirror false, camera.center [0, 0.4188, 0] (integer pivot).
    camera.scale/pitch/light untouched. The inner glow is emissive (sickly green accent).
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 24,30) is the ground point at the centre of the
    nest. ~1.5 x 1.1 units (~28 px wide, ~16 px tall) -> footprint 2x1 tiles, blocking. Clip: idle 6 frames,
    loop, slow pulse (eggs scale 1 -> 1.08, the glow brightens on the swell).

ramps:
  fn_fur:   ["#1c0f1a", "#2a1618", "#452626", "#633832", "#824c3e"]
  fn_goo:   ["#1c0f1a", "#3a4612", "#5a6a1a", "#7e8e26", "#a6b43a"]
  fn_egg:   ["#1c0f1a", "#8a8058", "#c4b98a", "#e6dcb0", "#f6f0d4"]
  fn_glow:  ["#1c0f1a", "#2e5a1a", "#5e9a2a", "#9ad646", "#d2f27a"]

materials:
  fur:    {ramp: fn_fur, bands: [1, 4]}
  tuft:   {ramp: fn_fur, bands: [2, 4], outline: false}
  goo:    {ramp: fn_goo, bands: [2, 3], outline: false, line: false}
  egg:    {ramp: fn_egg, bands: [1, 3], line_band: 1}
  glow:   {ramp: fn_glow, emissive: true, band: 2, outline: false, line: false, glow: {color: "#5e9a2a", mix: 0.25, radius: 1}}
  glow_hi: {ramp: fn_glow, emissive: true, band: 3, outline: false, line: false, glow: {color: "#9ad646", mix: 0.35, radius: 1}}

channels:
  root: [0, 0, 0]
  pl: 0             # pulse 0..1

bones:
  body: {parent: root}
  eggs: {parent: body, pos: [0, 0.32, 0.05], scale: "1 + 0.08*pl"}

parts:
  goo:
    material: goo
    space: body
    prims:
      - ellipsoid: {c: [0.0, 0.01, 0.12], r: [0.82, 0.01, 0.55]}
      - ellipsoid: {c: [0.62, 0.01, 0.48], r: [0.25, 0.01, 0.14]}
      - ellipsoid: {c: [-0.6, 0.01, 0.5], r: [0.18, 0.01, 0.1]}
  fur:
    material: fur
    space: body
    blend: 0.1
    line: true
    prims:
      - ellipsoid: {c: [0.0, 0.16, -0.12], r: [0.7, 0.24, 0.45]}
      - ellipsoid: {c: [-0.55, 0.2, -0.05], r: [0.25, 0.22, 0.3]}
      - ellipsoid: {c: [0.55, 0.22, -0.1], r: [0.26, 0.24, 0.3]}
      - ellipsoid: {c: [0.1, 0.3, -0.42], r: [0.4, 0.22, 0.2]}
      - ellipsoid: {c: [-0.35, 0.12, 0.32], r: [0.22, 0.12, 0.16]}
      - ellipsoid: {c: [0.4, 0.12, 0.32], r: [0.24, 0.12, 0.16]}
  tufts:
    material: tuft
    space: body
    prims:
      - cone: {a: [-0.7, 0.3, -0.1], b: [-0.92, 0.42, -0.05], r: [0.07, 0.015]}
      - cone: {a: [0.7, 0.32, -0.15], b: [0.92, 0.48, -0.2], r: [0.07, 0.015]}
      - cone: {a: [0.2, 0.48, -0.5], b: [0.3, 0.7, -0.6], r: [0.07, 0.015]}
      - cone: {a: [-0.2, 0.46, -0.45], b: [-0.35, 0.64, -0.55], r: [0.06, 0.015]}
      - cone: {a: [-0.5, 0.36, -0.2], b: [-0.62, 0.56, -0.28], r: [0.06, 0.015]}
  eggs:
    material: egg
    space: eggs
    line: true
    prims:
      - ellipsoid: {c: [0.0, 0.08, 0.0], r: [0.17, 0.15, 0.2], rot: [0, 0.4, 0]}
      - ellipsoid: {c: [-0.3, 0.02, 0.08], r: [0.15, 0.13, 0.18], rot: [0, -0.6, 0]}
      - ellipsoid: {c: [0.32, 0.02, 0.06], r: [0.16, 0.13, 0.18], rot: [0, 0.8, 0]}
      - ellipsoid: {c: [-0.1, 0.0, 0.3], r: [0.14, 0.12, 0.16], rot: [0, 0.2, 0]}
      - ellipsoid: {c: [0.18, 0.0, 0.3], r: [0.13, 0.11, 0.15], rot: [0, -0.3, 0]}
      - ellipsoid: {c: [0.12, 0.12, -0.22], r: [0.14, 0.13, 0.16], rot: [0, 0.1, 0]}
  glow:               # the larvae showing through the shells (brighter on the swell)
    material: glow
    when: "pl <= 0.6"
    space: eggs
    prims:
      - ellipsoid: {c: [0.02, 0.1, 0.17], r: [0.06, 0.06, 0.04]}
      - ellipsoid: {c: [-0.28, 0.03, 0.24], r: [0.05, 0.05, 0.03]}
      - ellipsoid: {c: [0.34, 0.03, 0.22], r: [0.05, 0.05, 0.03]}
      - ellipsoid: {c: [-0.09, 0.02, 0.44], r: [0.045, 0.04, 0.03]}
      - ellipsoid: {c: [0.19, 0.01, 0.43], r: [0.04, 0.04, 0.03]}
  glow_hi:
    material: glow_hi
    when: "pl > 0.6"
    space: eggs
    prims:
      - ellipsoid: {c: [0.02, 0.1, 0.17], r: [0.06, 0.06, 0.04]}
      - ellipsoid: {c: [-0.28, 0.03, 0.24], r: [0.05, 0.05, 0.03]}
      - ellipsoid: {c: [0.34, 0.03, 0.22], r: [0.05, 0.05, 0.03]}
      - ellipsoid: {c: [-0.09, 0.02, 0.44], r: [0.045, 0.04, 0.03]}
      - ellipsoid: {c: [0.19, 0.01, 0.43], r: [0.04, 0.04, 0.03]}
  loose_eggs:         # two small eggs rolled out into the goo
    material: egg
    space: body
    line: true
    prims:
      - ellipsoid: {c: [0.62, 0.06, 0.5], r: [0.08, 0.06, 0.1], rot: [0, 0.7, 0]}
      - ellipsoid: {c: [-0.58, 0.05, 0.5], r: [0.07, 0.055, 0.09], rot: [0, -0.3, 0]}

animations:
  idle:
    frames: 6
    ms: 200
    channels: {pl: "0.5 + 0.5*sin(p)"}
