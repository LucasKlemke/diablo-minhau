# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
spritekiln: 1
name: dry_fountain
kind: prop
view: topdown
size: 64
directions: 1            # round: one view serves every angle
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 0.5584, 0]}   # 8 px above the pivot -> pivot (32, 40)
shadow: {rx: 22, ry: 7, alpha: 80}

# Ruined village: the dry village fountain, choked with rubble.
brief:
  summary: round village fountain of grey stone, bone dry - a low circular basin wall with a chipped rim and
    a missing chunk at the front, a central column with a small upper bowl broken on one side, the basin
    filled with rubble (stone chunks, dirt, a broken plank) and a few dry leaves; a crack runs down the
    column
  must_keep: [round stone basin with a chipped gap, central column and broken upper bowl, rubble filling the
    basin, no water]
  simplify: [stones as rounded boxes, dirt as a flat mound, leaves as 1-2 px dots]
  exceptions: |
    kind prop, size 64, directions 1, mirror false, camera.center [0, 0.5584, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a; stone ramp is the
    campfire's stone so the village props match.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,40) is the ground point at the fountain's
    centre. Basin radius 1.05 (~38 px wide) -> footprint 3x3 tiles (the corner tiles can stay walkable),
    blocking. Static: 1-frame idle.

ramps:
  df_stone:  ["#1c0f1a", "#3d3440", "#6b6070", "#8a7f8c", "#a3969c"]
  df_stone2: ["#1c0f1a", "#4f4240", "#7a6458", "#a18c74"]
  df_dirt:   ["#1c0f1a", "#3a2a22", "#5a4030", "#7a5a40"]
  df_plank:  ["#1c0f1a", "#4a2c1c", "#6e4a2c", "#8f6a42"]
  df_leaf:   ["#1c0f1a", "#7a3a1a", "#b0602a", "#d08a3a"]
  df_crack:  ["#1c0f1a", "#241a26"]

materials:
  stone:  {ramp: df_stone, bands: [1, 4]}
  rubble: {ramp: df_stone2, bands: [1, 3]}
  dirt:   {ramp: df_dirt, bands: [1, 3], line: false}
  plank:  {ramp: df_plank, bands: [1, 3]}
  leaf:   {ramp: df_leaf, bands: [2, 3], outline: false, line: false}
  crack:  {ramp: df_crack, bands: [1, 1], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  basin:
    material: stone
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 0, 0], b: [0, 0.42, 0], r: 1.05, round: 0.04}
    cut:
      - cylinder: {a: [0, 0.12, 0], b: [0, 1, 0], r: 0.86}
      - box: {c: [0.35, 0.42, 0.95], half: [0.2, 0.14, 0.25], rot: [0, 0.35, 0]}     # missing chunk
      - box: {c: [-0.85, 0.44, -0.55], half: [0.12, 0.06, 0.15], rot: [0, 1.0, 0]}   # chipped rim
  dirt:
    material: dirt
    space: body
    blend: 0.15
    prims:
      - ellipsoid: {c: [0, 0.2, 0], r: [0.85, 0.14, 0.85]}
      - ellipsoid: {c: [0.3, 0.28, 0.35], r: [0.4, 0.12, 0.3]}
  rubble:
    material: rubble
    space: body
    line: true
    prims:
      - box: {c: [0.45, 0.32, 0.4], half: [0.16, 0.1, 0.12], rot: [0.2, 0.5, 0.1], round: 0.04}
      - box: {c: [-0.5, 0.3, 0.35], half: [0.14, 0.09, 0.12], rot: [0, -0.4, 0.2], round: 0.04}
      - box: {c: [-0.4, 0.3, -0.45], half: [0.13, 0.1, 0.1], rot: [0.1, 0.8, 0], round: 0.04}
      - box: {c: [0.55, 0.3, -0.3], half: [0.12, 0.08, 0.14], rot: [0, 0.2, -0.2], round: 0.04}
      - box: {c: [0.05, 0.3, 0.62], half: [0.1, 0.07, 0.08], rot: [0, 1.2, 0], round: 0.03}
      - box: {c: [0.38, 0.06, 1.2], half: [0.13, 0.06, 0.1], rot: [0, 0.6, 0], round: 0.03}       # fallen chunk outside
      - box: {c: [0.65, 0.05, 1.12], half: [0.08, 0.05, 0.07], rot: [0, -0.3, 0], round: 0.03}
  plank:
    material: plank
    space: body
    line: true
    prims:
      - box: {c: [-0.2, 0.36, 0.28], half: [0.45, 0.03, 0.08], rot: [0, -0.5, 0.15], round: 0.01}
  column:
    material: stone
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 0.1, 0], b: [0, 1.1, 0], r: 0.17}
      - cylinder: {a: [0, 0.2, 0], b: [0, 0.35, 0], r: 0.24, round: 0.03}
  upper_bowl:
    material: stone
    space: body
    line: true
    prims:
      - cylinder: {a: [0, 1.05, 0], b: [0, 1.25, 0], r: 0.42, round: 0.04}
    cut:
      - cylinder: {a: [0, 1.15, 0], b: [0, 1.5, 0], r: 0.33}
      - box: {c: [-0.42, 1.25, 0.2], half: [0.25, 0.14, 0.2], rot: [0, 0.5, 0.4]}    # broken side
  bowl_rubble:
    material: rubble
    space: body
    line: true
    prims:
      - box: {c: [0.1, 1.18, -0.05], half: [0.1, 0.06, 0.08], rot: [0, 0.7, 0], round: 0.03}
  crack:
    material: crack
    space: body
    prims:
      - box: {c: [0.04, 0.75, 0.17], half: [0.015, 0.25, 0.01], rot: [0, 0, 0.25]}
      - box: {c: [-0.5, 0.25, 0.87], half: [0.015, 0.1, 0.01], rot: [0, 0, -0.4]}
  leaves:
    material: leaf
    space: body
    prims:
      - sphere: {c: [-0.2, 0.33, -0.2], r: 0.05}
      - sphere: {c: [0.25, 0.33, 0.1], r: 0.045}
      - sphere: {c: [-0.6, 0.06, 1.0], r: 0.05}
      - sphere: {c: [0.9, 0.06, 0.8], r: 0.045}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
