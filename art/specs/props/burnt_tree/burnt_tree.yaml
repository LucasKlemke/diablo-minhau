spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: burnt_tree
kind: prop
view: topdown
size: 64
directions: 1            # static scenery, faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.3959, 0]}   # 20 px above the pivot -> pivot (32, 52)
shadow: {rx: 12, ry: 4, alpha: 130}

# Act I wilds: a tree burnt black by the war, standing in the ash.
brief:
  summary: charred black tree trunk of the burnt Act I wilds; bark split into a crackle of charcoal blocks
    with ashy grey edges catching the light, stumps of burnt-off branches ending in sharp splintered points,
    a scorched root flare and a scatter of ash and coal at the foot
  must_keep: [near-black charcoal body with ash-grey highlights, splintered sharp branch stubs, crackled
    bark (inner lines), ash at the foot]
  simplify: [crackle as a few dark inner lines; no embers (it burnt out long ago)]
  exceptions: |
    kind prop, size 64, directions 1, mirror false; camera.center [0, 1.3959, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot, frame px 32,52) is the ground point at the centre of the
    trunk base. Footprint 1 tile, blocking (the trunk).
    VARIANTS: animation `variants` has 2 frames (frame i = variant i); `idle` = variant 0.
    0 tall charred tree with three burnt arms; 1 trunk snapped at mid height, a jagged split top and the
    broken-off top lying on the ground at its foot.
    The body is near-black but the top band is an ash grey (#5e5654), so the form reads against the outline
    and the dark ground; the ash puddle at the foot is a lighter grey so the base does not sink.

ramps:
  bt_char: ["#1c0f1a", "#161113", "#241d1f", "#3a3133", "#5e5654"]
  bt_ash:  ["#1c0f1a", "#3c3836", "#56514d", "#77706a"]

materials:
  char: {ramp: bt_char, bands: [1, 4], line_band: 0}
  ash:  {ramp: bt_ash, bands: [1, 3], outline: false, line: false}

channels:
  root: [0, 0, 0]
  var: 0             # variant 0..1

bones:
  body: {parent: root}

parts:
  ash:                # ash and coal at the foot (both variants)
    material: ash
    space: body
    prims:
      - ellipsoid: {c: [0.05, 0.0, 0.06], r: [0.62, 0.035, 0.42]}

  # =================== variant 0: tall, three burnt arms ===================
  v0_trunk:
    when: "var < 0.5"
    material: char
    space: body
    blend: 0.06
    prims:
      - chain: {pts: [[0, 0, 0], [-0.05, 0.55, 0], [0.05, 1.10, 0.02], [-0.02, 1.70, 0], [0.04, 2.20, 0]], r: [0.24, 0.18, 0.15, 0.11, 0.07]}
      - cone: {a: [0.04, 2.20, 0], b: [0.10, 2.55, 0], r: [0.06, 0.02]}            # splintered top
      - cone: {a: [0, 0.10, 0], b: [0.44, 0.02, 0.12], r: [0.12, 0.04]}            # roots
      - cone: {a: [0, 0.10, 0], b: [-0.42, 0.02, 0.10], r: [0.12, 0.04]}
      - cone: {a: [0, 0.10, 0], b: [0.06, 0.02, 0.40], r: [0.10, 0.04]}
  v0_crackle:         # raised bark blocks: inner lines between them read as cracks
    when: "var < 0.5"
    material: char
    space: body
    line: true
    prims:
      - box: {c: [0.02, 0.45, 0.13], half: [0.07, 0.12, 0.04], rot: [0, 0, 0.1], round: 0.02}
      - box: {c: [-0.08, 0.80, 0.12], half: [0.06, 0.10, 0.04], rot: [0, 0, -0.1], round: 0.02}
      - box: {c: [0.07, 1.20, 0.10], half: [0.05, 0.10, 0.04], round: 0.02}
  v0_arms:
    when: "var < 0.5"
    material: char
    space: body
    line: true
    blend: 0.03
    prims:
      - chain: {pts: [[0.03, 1.30, 0], [0.42, 1.62, 0.04], [0.62, 2.02, 0], [0.70, 2.22, 0]], r: [0.09, 0.065, 0.04, 0.018]}
      - chain: {pts: [[-0.02, 1.62, 0], [-0.40, 1.90, 0.04], [-0.70, 1.98, 0], [-0.86, 2.18, 0]], r: [0.08, 0.06, 0.04, 0.018]}
      - chain: {pts: [[-0.04, 0.95, 0.02], [-0.42, 1.10, 0.06], [-0.58, 1.30, 0.06]], r: [0.06, 0.04, 0.015]}
      - cone: {a: [0.42, 1.62, 0.04], b: [0.74, 1.60, 0.08], r: [0.035, 0.012]}
      - cone: {a: [0.02, 2.0, 0], b: [0.30, 2.30, 0], r: [0.035, 0.012]}

  # =================== variant 1: snapped at mid height ===================
  v1_trunk:
    when: "var > 0.5"
    material: char
    space: body
    blend: 0.06
    prims:
      - chain: {pts: [[0, 0, 0], [0.06, 0.55, 0], [-0.02, 1.15, 0.02]], r: [0.24, 0.18, 0.15]}
      - cone: {a: [-0.02, 1.10, 0.02], b: [0.08, 1.62, 0.0], r: [0.09, 0.015]}     # jagged split top
      - cone: {a: [-0.02, 1.10, 0.02], b: [-0.14, 1.45, 0.04], r: [0.07, 0.015]}
      - cone: {a: [-0.02, 1.10, 0.02], b: [0.16, 1.32, 0.08], r: [0.06, 0.015]}
      - cone: {a: [0, 0.10, 0], b: [0.48, 0.02, 0.12], r: [0.13, 0.04]}
      - cone: {a: [0, 0.10, 0], b: [-0.46, 0.02, 0.08], r: [0.13, 0.04]}
      - cone: {a: [0, 0.10, 0], b: [-0.08, 0.02, 0.42], r: [0.10, 0.04]}
  v1_crackle:
    when: "var > 0.5"
    material: char
    space: body
    line: true
    prims:
      - box: {c: [0.04, 0.45, 0.16], half: [0.08, 0.12, 0.04], rot: [0, 0, 0.1], round: 0.02}
      - box: {c: [-0.06, 0.82, 0.14], half: [0.07, 0.11, 0.04], rot: [0, 0, -0.1], round: 0.02}
  v1_stub:
    when: "var > 0.5"
    material: char
    space: body
    line: true
    blend: 0.03
    prims:
      - chain: {pts: [[0.02, 0.85, 0.02], [-0.36, 1.05, 0.06], [-0.50, 1.25, 0.06]], r: [0.07, 0.045, 0.015]}
  v1_fallen:          # the broken-off top lying at the foot
    when: "var > 0.5"
    material: char
    space: body
    line: true
    blend: 0.03
    prims:
      - cylinder: {a: [0.30, 0.10, 0.30], b: [1.15, 0.08, 0.10], r: 0.10, round: 0.02}
      - cone: {a: [0.85, 0.12, 0.17], b: [1.05, 0.40, 0.25], r: [0.045, 0.015]}
      - cone: {a: [0.60, 0.12, 0.24], b: [0.62, 0.36, 0.40], r: [0.04, 0.012]}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {var: 0}
  variants:
    frames: 2
    ms: 1000
    channels: {var: "f"}
