spritekiln: 1
# yaml-language-server: $schema=https://raw.githubusercontent.com/LucasJRamos/spritekiln/main/spritekiln/data/spec.schema.json
name: goblin_tent
kind: prop
view: topdown
size: 64                 # ~46 x 46 px on screen, 2+ px margins
directions: 1            # faces the camera (s)
mirror: false
palette: "farm"
camera: {pitch: 38, scale: 0.055, center: [0, 1.0469, 0]}   # 15 px above the pivot -> pivot (32, 47)
shadow: {rx: 20, ry: 6, alpha: 120}

# Bosque dos Goblins: goblin tent of patched leather.
brief:
  summary: squat goblin tent, a lumpy cone of stitched animal hides in clashing browns and a sickly
    yellow-green patch, stretched over crooked poles whose ends cross and jut out above the top, a dark
    doorway with a flap pinned back, ropes to ground pegs, a boar skull tied over the door and a ragged red
    rag fluttering from a pole
  must_keep: [crossed pole tips above the apex, visibly patched hides (3 tones + stitches), dark doorway with
    the flap folded back, boar skull over the door, ropes and pegs]
  simplify: [stitches as short light lines, hides as overlapping flattened ellipsoids on the cone]
  exceptions: |
    kind prop, size 64, directions 1, mirror false; camera.center [0, 1.0469, 0] (integer pivot).
    camera.scale/pitch/light untouched. Spec-local ramps keep index 0 = #1c0f1a.
  decisions: |
    PIVOT CONTRACT: world origin (= exported pivot) is the ground point at the centre of the tent. Base
    radius 1.0 -> footprint 2x2 tiles, blocking; goblins can spawn at the doorway (0, 0, +1.0).
    Patches use three leather ramps (dark brown, tan, olive-yellow) so the hides read as stitched scraps.

ramps:
  gt_hide:  ["#1c0f1a", "#33201a", "#4e3324", "#6a4830", "#835c3a"]
  gt_tan:   ["#1c0f1a", "#6a4e30", "#8e6c44", "#ad8a58"]
  gt_sick:  ["#1c0f1a", "#4a4a22", "#6a682e", "#8a843a"]
  gt_pole:  ["#1c0f1a", "#2f2428", "#4a3c3c", "#665650"]
  gt_void:  ["#1c0f1a", "#120a10", "#1e1216"]
  gt_bone:  ["#1c0f1a", "#7a6a58", "#b4a488", "#ddd0b0"]
  gt_rag:   ["#1c0f1a", "#5a1418", "#8a2420", "#a83a2a"]
  gt_rope:  ["#1c0f1a", "#5e4a30", "#8a7048"]

materials:
  hide:   {ramp: gt_hide, bands: [1, 4]}
  tan:    {ramp: gt_tan, bands: [1, 3]}
  sick:   {ramp: gt_sick, bands: [1, 3]}
  pole:   {ramp: gt_pole, bands: [1, 3]}
  void:   {ramp: gt_void, bands: [1, 2], outline: false}
  bone:   {ramp: gt_bone, bands: [1, 3]}
  rag:    {ramp: gt_rag, bands: [1, 3]}
  rope:   {ramp: gt_rope, bands: [1, 2], line: false}
  stitch: {ramp: gt_bone, bands: [2, 2], outline: false, line: false}

channels:
  root: [0, 0, 0]

bones:
  body: {parent: root}

parts:
  tent:
    material: hide
    space: body
    blend: 0.10
    prims:
      - cone: {a: [0, 0.10, 0], b: [0, 1.70, 0], r: [0.98, 0.10]}
      - ellipsoid: {c: [-0.62, 0.30, 0.10], r: [0.34, 0.24, 0.34]}     # lumps (sagging hide)
      - ellipsoid: {c: [0.64, 0.26, 0.0], r: [0.32, 0.22, 0.34]}
    cut:
      - box: {c: [0, -0.5, 0], half: [2, 0.5, 2]}
      - cone: {a: [0, -0.05, 1.05], b: [0, 1.02, 0.55], r: [0.36, 0.03]}   # doorway
  patches:
    material: tan
    space: body
    line: true
    prims:
      - ellipsoid: {c: [-0.50, 0.80, 0.42], r: [0.26, 0.24, 0.16], rot: [0.45, 0.6, 0.2]}
      - ellipsoid: {c: [0.30, 1.30, 0.22], r: [0.18, 0.16, 0.12], rot: [0.35, -0.5, 0]}
  patch_sick:
    material: sick
    space: body
    line: true
    prims:
      - ellipsoid: {c: [0.58, 0.62, 0.50], r: [0.26, 0.22, 0.14], rot: [0.5, -0.7, -0.2]}
  stitches:
    material: stitch
    space: body
    prims:
      - box: {c: [-0.30, 0.92, 0.60], half: [0.012, 0.05, 0.02], rot: [0.5, 0.4, 0.4]}
      - box: {c: [-0.36, 0.72, 0.68], half: [0.012, 0.05, 0.02], rot: [0.5, 0.4, 0.4]}
      - box: {c: [0.40, 0.75, 0.70], half: [0.012, 0.05, 0.02], rot: [0.5, -0.4, -0.4]}
      - box: {c: [0.44, 0.52, 0.80], half: [0.012, 0.05, 0.02], rot: [0.5, -0.4, -0.4]}
  door:               # dark doorway
    material: void
    space: body
    prims:
      - cone: {a: [0, -0.05, 0.72], b: [0, 1.0, 0.28], r: [0.36, 0.03]}
  flap:               # flap pinned back to the right
    material: hide
    space: body
    line: true
    prims:
      - tri: {a: [0.30, 0.86, 0.66], b: [0.44, 0.02, 1.06], c: [0.86, 0.06, 0.70], th: 0.04}
  poles:              # crooked poles crossing above the apex
    material: pole
    space: body
    line: true
    prims:
      - cylinder: {a: [-0.10, 1.40, 0.04], b: [0.30, 2.20, -0.10], r: 0.045}
      - cylinder: {a: [0.10, 1.40, -0.04], b: [-0.32, 2.14, 0.08], r: 0.045}
      - cylinder: {a: [0.0, 1.40, -0.08], b: [0.06, 2.28, -0.30], r: 0.04}
  skull:              # boar skull tied over the door
    material: bone
    space: body
    line: true
    blend: 0.03
    prims:
      - ellipsoid: {c: [0, 1.22, 0.44], r: [0.17, 0.14, 0.12]}
      - cone: {a: [0, 1.16, 0.50], b: [0, 1.04, 0.66], r: [0.10, 0.07]}
      - cone: {a: [-0.09, 1.08, 0.62], b: [-0.22, 1.20, 0.68], r: [0.032, 0.012]}      # tusks
      - cone: {a: [0.09, 1.08, 0.62], b: [0.22, 1.20, 0.68], r: [0.032, 0.012]}
  skull_eyes:
    material: void
    space: body
    prims:
      - sphere: {c: [-0.07, 1.25, 0.54], r: 0.034}
      - sphere: {c: [0.07, 1.25, 0.54], r: 0.034}
  rag:                # ragged red rag on a pole tip
    material: rag
    space: body
    line: true
    prims:
      - tri: {a: [0.28, 2.16, -0.08], b: [0.62, 2.06, -0.02], c: [0.30, 1.96, -0.06], th: 0.03}
      - tri: {a: [0.40, 2.08, -0.05], b: [0.58, 1.90, 0.0], c: [0.32, 1.98, -0.06], th: 0.03}
  ropes:
    material: rope
    space: body
    prims:
      - cylinder: {a: [-0.62, 0.70, 0.30], b: [-1.18, 0.04, 0.55], r: 0.018}
      - cylinder: {a: [0.66, 0.70, 0.24], b: [1.20, 0.04, 0.50], r: 0.018}
  pegs:
    material: pole
    space: body
    line: true
    prims:
      - cylinder: {a: [-1.18, 0.0, 0.55], b: [-1.20, 0.14, 0.55], r: 0.035}
      - cylinder: {a: [1.20, 0.0, 0.50], b: [1.22, 0.14, 0.50], r: 0.035}

animations:
  idle:
    frames: 1
    ms: 1000
    channels: {}
